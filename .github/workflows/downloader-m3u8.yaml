name: downloader-m3u8

on:
  workflow_dispatch:
    inputs:
      url:
        description: >
          Enter one or more M3U8 / HLS stream URLs.
          You can optionally put a title on the line immediately before a URL.
          Separate multiple URLs by commas, spaces, or newlines.
        required: true
      quality:
        description: 'Select video quality or audio-only'
        required: true
        type: choice
        options:
          - best
          - 2160p
          - 1080p
          - 720p
          - 480p
          - 360p
          - audio
        default: best
      custom_args:
        description: 'Extra yt-dlp arguments (e.g., --referer https://example.com --cookies-from-browser chrome)'
        required: false
        default: ''
      merge_format:
        description: 'Output container format when video+audio are merged'
        required: true
        type: choice
        options:
          - mp4
          - mkv
          - webm
        default: mp4
      bundle_all:
        description: 'Bundle all downloaded files into a single split ZIP archive'
        type: boolean
        default: false
      upload_method:
        description: 'Upload destination'
        required: true
        type: choice
        options:
          - repo
          - release
          - drive
        default: repo
      vpn_enabled:
        description: 'Route downloads through WireGuard VPN (requires secret WG_CONFIG)'
        type: boolean
        default: false
      concurrent_downloads:
        description: 'Number of URLs to download simultaneously'
        type: number
        default: 2
        required: false
      verbose_log:
        description: 'Show full yt-dlp download progress logs (default: minimal logging)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  actions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: '📦 Checkout repository'
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: '🛠️ Install dependencies (yt-dlp + ffmpeg)'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🛠️  INSTALLING DEPENDENCIES"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          echo ""
          echo "→ [1/3] Updating apt package index..."
          sudo apt-get update -qq
          
          echo "→ [2/3] Installing ffmpeg and jq..."
          sudo apt-get install -y -qq ffmpeg jq
          echo "  ✅ ffmpeg version: $(ffmpeg -version 2>&1 | head -n1)"
          echo "  ✅ jq version:     $(jq --version 2>&1)"
          
          echo "→ [3/3] Installing latest yt-dlp binary..."
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          echo "  ✅ yt-dlp version: $(yt-dlp --version)"
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ All dependencies installed successfully"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: '🔗 Parse and validate URLs'
        id: parse
        env:
          RAW_INPUT: ${{ inputs.url }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔗  PARSING INPUT URLs"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # GitHub Actions UI/API often converts newlines in string inputs to literal "\n".
          # Passing via 'env' prevents bash injection issues, and 'sed' converts literal "\n" to real newlines.
          URLS_INPUT_CLEAN=$(printf "%s" "$RAW_INPUT" | sed 's/\\n/\n/g; s/\r//g' | tr ',' '\n')
          
          idx=0
          current_title=""
          
          > tasks.txt
          
          while IFS= read -r line || [ -n "$line" ]; do
            # Trim leading and trailing whitespace
            line=$(printf "%s" "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            
            # Skip empty lines
            [ -z "$line" ] && continue
            
            # Check if line is a URL (starts with http:// or https://)
            if [[ "$line" =~ ^https?:// ]]; then
              idx=$((idx + 1))
              if [ -n "$current_title" ] && ! [[ "$current_title" =~ ^https?:// ]]; then
                # Sanitize title for filename: allow only alphanumeric, dots, underscores, hyphens
                safe_title=$(printf "%s\n" "$current_title" | sed -e 's/[^A-Za-z0-9._-]/_/g' | sed -e 's/__*/_/g' | sed -e 's/^_//;s/_$//')
                if [ -z "$safe_title" ]; then
                  safe_title="video-${idx}"
                fi
              else
                # Fallback if no valid title preceded the URL
                safe_title="video-${idx}"
              fi
              echo "${idx}|${line}|${safe_title}" >> tasks.txt
              current_title="" # Reset after consuming
            else
              # It's a title or some other text
              current_title="$line"
            fi
          done <<< "$URLS_INPUT_CLEAN"
          
          NUM_URLS=$(wc -l < tasks.txt)
          
          if [ "$NUM_URLS" -eq 0 ]; then
            echo ""
            echo "❌ ERROR: No URLs provided. Please supply at least one M3U8/HLS URL."
            echo ""
            exit 1
          fi
          
          echo ""
          echo "📋 Detected $NUM_URLS URL(s) to process:"
          echo "────────────────────────────────────────────────────"
          while IFS='|' read -r t_idx t_url t_title; do
            echo "  [$t_idx] Title: '$t_title'"
            echo "      URL:  $t_url"
          done < tasks.txt
          echo "────────────────────────────────────────────────────"
          echo ""
          echo "NUM_URLS=$NUM_URLS" >> $GITHUB_OUTPUT
          echo "✅ URL parsing complete: $NUM_URLS stream(s) queued"

      - name: '🔒 Set up WireGuard VPN (if enabled)'
        id: vpn
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔒  WIREGUARD VPN SETUP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          VPN_ENABLED="${{ inputs.vpn_enabled }}"
          echo ""
          echo "  VPN requested: $VPN_ENABLED"
          
          if [ "$VPN_ENABLED" = "true" ]; then
            if [ -z "${{ secrets.WG_CONFIG }}" ]; then
              echo ""
              echo "⚠️  WARNING: VPN enabled but WG_CONFIG secret is empty."
              echo "   Proceeding WITHOUT VPN for this run."
              echo "vpn_available=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo ""
            echo "→ [1/4] Installing WireGuard tools..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq wireguard-tools openresolv 2>/dev/null \
              || sudo apt-get install -y -qq wireguard-tools
            echo "  ✅ wireguard-tools installed"

            echo "→ [2/4] Writing WireGuard configuration..."
            cat <<'EOF' > /tmp/wg0.conf
          ${{ secrets.WG_CONFIG }}
          EOF
            sudo cp /tmp/wg0.conf /etc/wireguard/wg0.conf
            sudo chmod 600 /etc/wireguard/wg0.conf
            rm -f /tmp/wg0.conf
            echo "  ✅ Config written to /etc/wireguard/wg0.conf (mode 600)"

            echo "→ [3/4] Bringing up wg0 interface..."
            if sudo wg-quick up wg0; then
              echo ""
              echo "  ✅ WireGuard VPN CONNECTED successfully"
              echo "  📡 Public IP via VPN:"
              curl -s https://ifconfig.me || echo "  (unable to verify IP)"
              echo ""
              echo "vpn_available=true" >> $GITHUB_OUTPUT
            else
              echo ""
              echo "⚠️  WARNING: Failed to bring up WireGuard interface."
              echo "   Proceeding WITHOUT VPN."
              sudo wg-quick down wg0 2>/dev/null || true
              echo "vpn_available=false" >> $GITHUB_OUTPUT
            fi
          else
            echo ""
            echo "ℹ️  VPN not requested – skipping setup."
            echo "vpn_available=false" >> $GITHUB_OUTPUT
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: '⬇️ Download HLS streams concurrently'
        id: download
        env:
          QUALITY: ${{ inputs.quality }}
          CUSTOM_ARGS: ${{ inputs.custom_args }}
          MERGE_FORMAT: ${{ inputs.merge_format }}
          VERBOSE_LOG: ${{ inputs.verbose_log }}
        run: |
          set -e
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⬇️  DOWNLOADING HLS STREAMS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          VPN_AVAILABLE="${{ steps.vpn.outputs.vpn_available }}"
          CONCURRENT="${{ inputs.concurrent_downloads }}"
          OUTPUT_DIR="m3u8_out"
          DOWNLOAD_DIR="downloads_tmp"
          FAILED_FILE="failed_urls.txt"
          SUCCESS_FILE="success_urls.txt"

          NUM_URLS="${{ steps.parse.outputs.NUM_URLS }}"

          RANDOM_STR=$(head /dev/urandom | tr -dc a-z0-9 | head -c5)
          echo ""
          echo "  🎲 Random string for this run: $RANDOM_STR"
          echo "random_str=$RANDOM_STR" >> $GITHUB_OUTPUT

          mkdir -p "$OUTPUT_DIR" "$DOWNLOAD_DIR"
          > "$FAILED_FILE"
          > "$SUCCESS_FILE"

          echo ""
          echo "  📋 Configuration:"
          echo "     Quality requested:    $QUALITY"
          echo "     Merge format:         $MERGE_FORMAT"
          echo "     Concurrent downloads: $CONCURRENT"
          echo "     Total URLs:           $NUM_URLS"
          echo "     VPN active:           $VPN_AVAILABLE"
          echo "     Verbose logging:      $VERBOSE_LOG"
          echo "     Custom args:          ${CUSTOM_ARGS:-'(none)'}"
          echo ""

          download_one() {
            local input="$1"
            local p_idx="${input%%|*}"
            local rest="${input#*|}"
            local p_url="${rest%%|*}"
            local p_title="${rest#*|}"
            
            local url_hash=$(echo "$p_url" | md5sum | cut -c1-8)
            local dl_dir="dl_$$_${url_hash}"
            local start_time=$(date +%s)
            mkdir -p "$DOWNLOAD_DIR/$dl_dir"

            echo ""
            echo "┌──────────────────────────────────────────────────┐"
            echo "│ ⬇️  Starting download [$p_idx/$NUM_URLS]"
            echo "│ Title: ${p_title}"
            echo "│ URL:   ${p_url}"
            echo "└──────────────────────────────────────────────────┘"
            
            local format=""
            case "$QUALITY" in
              "best")   format="bv*+ba/b" ;;
              "2160p")  format="bv*[height<=2160]+ba/b[height<=2160]/bv*+ba/b" ;;
              "1080p")  format="bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b" ;;
              "720p")   format="bv*[height<=720]+ba/b[height<=720]/bv*+ba/b" ;;
              "480p")   format="bv*[height<=480]+ba/b[height<=480]/bv*+ba/b" ;;
              "360p")   format="bv*[height<=360]+ba/b[height<=360]/bv*+ba/b" ;;
              "audio")  format="ba/b" ;;
              *)        format="bv*+ba/b" ;;
            esac
            
            local output_template="$DOWNLOAD_DIR/$dl_dir/${p_title}.%(ext)s"
            local log_file="$DOWNLOAD_DIR/$dl_dir/yt-dlp.log"
            
            local dl_cmd=(
              yt-dlp
              --no-playlist
              -f "$format"
              --merge-output-format "$MERGE_FORMAT"
              --concurrent-fragments 16
              --restrict-filenames
              --no-overwrites
              --retries 5
              --fragment-retries 5
              --retry-sleep 3
              -o "$output_template"
            )
            
            if [ "$VERBOSE_LOG" = "true" ]; then
              dl_cmd+=(--verbose)
            else
              dl_cmd+=(--quiet --no-warnings)
            fi
            
            if [ -n "$CUSTOM_ARGS" ]; then
              eval "local parsed_args=($CUSTOM_ARGS)"
              dl_cmd+=("${parsed_args[@]}")
            fi
            dl_cmd+=("$p_url")
            
            local dl_success=false
            if [ "$VERBOSE_LOG" = "true" ]; then
              echo ""
              echo "  🚀 Executing: ${dl_cmd[*]}"
              echo "────────────────────────────────────────────────────"
              if "${dl_cmd[@]}"; then
                dl_success=true
              fi
              echo "────────────────────────────────────────────────────"
            else
              echo "  ⏳ Download in progress [$p_idx/$NUM_URLS]..."
              if "${dl_cmd[@]}" > "$log_file" 2>&1; then
                dl_success=true
              fi
            fi
            
            local end_time=$(date +%s)
            local duration=$((end_time - start_time))
            
            if [ "$dl_success" = true ]; then
              local dl_file=$(ls -1 "$DOWNLOAD_DIR/$dl_dir" 2>/dev/null | grep -v '\.log$' | head -n1)
              if [ -n "$dl_file" ]; then
                local file_size=$(stat -c%s "$DOWNLOAD_DIR/$dl_dir/$dl_file" 2>/dev/null || echo 0)
                local file_size_mb=$(echo "scale=2; $file_size / 1048576" | bc 2>/dev/null || echo "?")
                
                local ext="${dl_file##*.}"
                local final_name="${p_title}.${ext}"
                
                # Handle potential name collision in DOWNLOAD_DIR
                local counter=1
                while [ -e "$DOWNLOAD_DIR/$final_name" ]; do
                  final_name="${p_title}-${counter}.${ext}"
                  counter=$((counter + 1))
                done
                
                mv "$DOWNLOAD_DIR/$dl_dir/$dl_file" "$DOWNLOAD_DIR/$final_name"
                echo ""
                echo "  ✅ SUCCESS [$p_idx/$NUM_URLS]: $final_name"
                echo "     Size: ${file_size_mb} MB | Time: ${duration}s"
                echo "$p_url|$final_name|${file_size_mb}MB|${duration}s|$p_idx" >> "$SUCCESS_FILE"
              else
                echo ""
                echo "  ❌ FAILED [$p_idx/$NUM_URLS]: No output file produced"
                if [ "$VERBOSE_LOG" = "false" ] && [ -f "$log_file" ]; then
                  echo "     Last 3 lines of log:"
                  tail -3 "$log_file" | sed 's/^/     /'
                fi
                echo "$p_url|no_file_produced|$p_idx" >> "$FAILED_FILE"
              fi
            else
              echo ""
              echo "  ❌ FAILED [$p_idx/$NUM_URLS]: Download error (${duration}s)"
              if [ "$VERBOSE_LOG" = "false" ] && [ -f "$log_file" ]; then
                echo "     Last 5 lines of log:"
                tail -5 "$log_file" | sed 's/^/     /'
              fi
              echo "$p_url|yt-dlp_error|${duration}s|$p_idx" >> "$FAILED_FILE"
            fi
            rm -rf "$DOWNLOAD_DIR/$dl_dir"
          }

          export -f download_one
          export DOWNLOAD_DIR FAILED_FILE SUCCESS_FILE VPN_AVAILABLE QUALITY CUSTOM_ARGS MERGE_FORMAT RANDOM_STR VERBOSE_LOG NUM_URLS

          echo "→ 🚀 Launching parallel downloads..."
          echo ""
          
          # Pass tasks.txt lines safely to the function
          cat tasks.txt | xargs -P "$CONCURRENT" -I '{}' bash -c 'download_one "$1"' _ '{}'

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊  DOWNLOAD SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          SUCCESS_COUNT=$(wc -l < "$SUCCESS_FILE" 2>/dev/null || echo 0)
          FAIL_COUNT=$(wc -l < "$FAILED_FILE" 2>/dev/null || echo 0)
          TOTAL_FILES=$(ls -1 "$DOWNLOAD_DIR" 2>/dev/null | grep -v '\.log$' | wc -l)
          TOTAL_SIZE=$(du -sh "$DOWNLOAD_DIR" 2>/dev/null | cut -f1)
          
          echo ""
          echo "  ✅ Successful: $SUCCESS_COUNT"
          echo "  ❌ Failed:     $FAIL_COUNT"
          echo "  📁 Files:      $TOTAL_FILES"
          echo "  💾 Total size: ${TOTAL_SIZE:-0}"
          echo ""
          
          if [ -s "$SUCCESS_FILE" ]; then
            echo "  📋 Successful downloads:"
            echo "  ────────────────────────────────────────────────"
            while IFS='|' read -r s_url s_file s_size s_time s_idx; do
              echo "    ✅ [$s_idx/$NUM_URLS] $s_file ($s_size, ${s_time})"
            done < "$SUCCESS_FILE"
            echo "  ────────────────────────────────────────────────"
          fi
          
          if [ -s "$FAILED_FILE" ]; then
            echo ""
            echo "  📋 Failed downloads:"
            echo "  ────────────────────────────────────────────────"
            while IFS='|' read -r f_url f_reason f_duration f_idx; do
              echo "    ❌ [$f_idx/$NUM_URLS] $f_url ($f_reason)"
            done < "$FAILED_FILE"
            echo "  ────────────────────────────────────────────────"
          fi
          
          echo ""
          echo "📂 Files in download directory:"
          ls -lh "$DOWNLOAD_DIR/" 2>/dev/null | grep -v '\.log$' || echo "  (empty)"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        shell: bash

      - name: '🗜️ Compress and bundle files'
        run: |
          set -e
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🗜️  COMPRESSION & BUNDLING"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          BUNDLE_ALL="${{ github.event.inputs.bundle_all }}"
          UPLOAD_METHOD_INPUT="${{ inputs.upload_method }}"
          RANDOM_STR="${{ steps.download.outputs.random_str }}"

          echo ""
          echo "  🎲 Random string (from download): $RANDOM_STR"

          if [ "$UPLOAD_METHOD_INPUT" = "repo" ]; then
            SPLIT_SIZE="99m"
            echo "  📏 Split size: 99 MB (GitHub repo file limit)"
          elif [ "$UPLOAD_METHOD_INPUT" = "release" ]; then
            SPLIT_SIZE="1950m"
            echo "  📏 Split size: 1950 MB (GitHub release asset limit)"
          else
            SPLIT_SIZE="none"
            echo "  📏 Split size: none (Google Drive – no splitting needed)"
          fi

          OUTPUT_DIR="m3u8_out"
          DOWNLOAD_DIR="downloads_tmp"
          FAILED_FILE="failed_urls.txt"
          DRIVE_DIRECT=false

          echo "  📦 Bundle all: $BUNDLE_ALL"
          echo "  📤 Upload method: $UPLOAD_METHOD_INPUT"
          echo ""

          if [ -s "$FAILED_FILE" ]; then
            RAND_FAIL=$(mktemp -u XXXXX)
            FAIL_NAME="m3u8-failed-${RAND_FAIL}.txt"
            mv "$FAILED_FILE" "${OUTPUT_DIR}/$FAIL_NAME"
            echo "  📝 Created failure report: ${OUTPUT_DIR}/$FAIL_NAME"
          else
            rm -f "$FAILED_FILE"
          fi

          is_disk_full() {
            local msg="$1"
            [[ "$msg" =~ (No\ space\ left\ on\ device|Disk\ quota\ exceeded) ]]
          }

          if [ "$BUNDLE_ALL" = "true" ]; then
            echo ""
            echo "→ 📦 Mode: BUNDLE ALL into single archive"
            BUNDLE_DIR="bundle_contents"
            mkdir -p "$BUNDLE_DIR"
            cp "$DOWNLOAD_DIR"/* "$BUNDLE_DIR/" 2>/dev/null || true
            
            if [ -n "$(ls -A "$BUNDLE_DIR" 2>/dev/null)" ]; then
              BUNDLE_FILE_COUNT=$(ls -1 "$BUNDLE_DIR" | wc -l)
              BUNDLE_TOTAL_SIZE=$(du -sh "$BUNDLE_DIR" | cut -f1)
              echo "  📁 Files to bundle: $BUNDLE_FILE_COUNT"
              echo "  💾 Total content size: $BUNDLE_TOTAL_SIZE"
              
              BUNDLE_ZIP="m3u8-bundle-${RANDOM_STR}.zip"
              echo "  🗜️  Creating archive: $BUNDLE_ZIP"
              echo ""

              set +e
              zip_output=$( (cd "$BUNDLE_DIR" && zip -0 "../${OUTPUT_DIR}/${BUNDLE_ZIP}" *) 2>&1 )
              zip_exit=$?
              
              if [ $zip_exit -eq 0 ] && [ "$SPLIT_SIZE" != "none" ]; then
                FULLBUNDLE="${OUTPUT_DIR}/${BUNDLE_ZIP}"
                SIZE=$(stat -c%s "$FULLBUNDLE" 2>/dev/null || echo 0)
                SPLIT_LIMIT=$(( $(echo "$SPLIT_SIZE" | sed 's/m//') * 1048576 ))
                if [ "$SIZE" -gt "$SPLIT_LIMIT" ]; then
                  SIZE_MB=$(echo "scale=1; $SIZE / 1048576" | bc)
                  echo "  ⚠️  Archive size (${SIZE_MB} MB) exceeds limit – splitting into ${SPLIT_SIZE} parts"
                  rm "$FULLBUNDLE"
                  zip_output=$( (cd "$BUNDLE_DIR" && zip -0 -s "$SPLIT_SIZE" "../${OUTPUT_DIR}/${BUNDLE_ZIP}" *) 2>&1 )
                  zip_exit=$?
                fi
              fi
              set -e

              if [ $zip_exit -ne 0 ]; then
                echo ""
                echo "  ❌ Zip failed (exit code: $zip_exit)"
                if [ "$UPLOAD_METHOD_INPUT" = "drive" ] && is_disk_full "$zip_output"; then
                  echo "  ⚠️  Disk full detected – switching to RAW upload (Google Drive)."
                  DRIVE_DIRECT=true
                  mkdir -p "$OUTPUT_DIR"
                  mv "$BUNDLE_DIR"/* "$OUTPUT_DIR/" 2>/dev/null || true
                  rm -rf "$BUNDLE_DIR"
                  rm -f "${OUTPUT_DIR}/${BUNDLE_ZIP}" 2>/dev/null || true
                else
                  echo "  ❌ Zipping failed due to insufficient disk space."
                  if [ "$UPLOAD_METHOD_INPUT" != "drive" ]; then
                    echo "  💡 Tip: Use 'drive' upload method for files that exceed runner disk space."
                  fi
                  rm -rf "$BUNDLE_DIR"
                  exit 1
                fi
              else
                echo ""
                echo "  ✅ Bundle archive created successfully"
                ls -lh "${OUTPUT_DIR}/${BUNDLE_ZIP}"* 2>/dev/null || true
                if [ "$DRIVE_DIRECT" = false ]; then
                  rm -rf "$BUNDLE_DIR"
                fi
              fi
            else
              echo "  ⚠️  No files found to bundle."
              rm -rf "$BUNDLE_DIR"
            fi

          else
            echo ""
            echo "→ 🗜️  Mode: INDIVIDUAL zip per file"
            
            FILE_INDEX=0
            for f in "$DOWNLOAD_DIR"/*; do
              [ -f "$f" ] || continue
              FILE_INDEX=$((FILE_INDEX + 1))

              if [ "$DRIVE_DIRECT" = true ]; then
                echo "  ⚠️  DRIVE_DIRECT active – skipping remaining zips."
                break
              fi

              fname=$(basename "$f")
              fsize=$(stat -c%s "$f" 2>/dev/null || echo 0)
              fsize_mb=$(echo "scale=2; $fsize / 1048576" | bc 2>/dev/null || echo "?")
              
              # Create a safe base name for the zip file from the title
              base_name="${fname%.*}"
              safe_zip_base=$(printf "%s" "$base_name" | sed -e 's/[^A-Za-z0-9._-]/_/g' | sed -e 's/__*/_/g' | cut -c1-50)
              if [ -z "$safe_zip_base" ] || [ "$safe_zip_base" = "_" ]; then
                safe_zip_base="file-${FILE_INDEX}"
              fi
              ZIP_NAME="m3u8-${RANDOM_STR}-${safe_zip_base}.zip"
              
              echo ""
              echo "  [$FILE_INDEX] 🗜️  Zipping: $fname (${fsize_mb} MB) → $ZIP_NAME"

              TMPZIP="tmpzip_$$"
              mkdir -p "$TMPZIP"
              cp "$f" "$TMPZIP/"

              set +e
              zip_output=$( (cd "$TMPZIP" && zip -0 "../${OUTPUT_DIR}/${ZIP_NAME}" "$fname") 2>&1 )
              zip_exit=$?
              
              if [ $zip_exit -eq 0 ] && [ "$SPLIT_SIZE" != "none" ]; then
                FULLZIP="${OUTPUT_DIR}/${ZIP_NAME}"
                SIZE=$(stat -c%s "$FULLZIP" 2>/dev/null || echo 0)
                SPLIT_LIMIT=$(( $(echo "$SPLIT_SIZE" | sed 's/m//') * 1048576 ))
                if [ "$SIZE" -gt "$SPLIT_LIMIT" ]; then
                  SIZE_MB=$(echo "scale=1; $SIZE / 1048576" | bc)
                  echo "      ⚠️  ZIP (${SIZE_MB} MB) exceeds limit – splitting into ${SPLIT_SIZE} parts"
                  rm "$FULLZIP"
                  zip_output=$( (cd "$TMPZIP" && zip -0 -s "$SPLIT_SIZE" "../${OUTPUT_DIR}/${ZIP_NAME}" "$fname") 2>&1 )
                  zip_exit=$?
                fi
              fi
              set -e
              rm -rf "$TMPZIP"

              if [ $zip_exit -ne 0 ]; then
                echo "      ❌ Zip failed (exit: $zip_exit)"
                if [ "$UPLOAD_METHOD_INPUT" = "drive" ] && is_disk_full "$zip_output"; then
                  echo "      ⚠️  Disk full – switching to RAW upload (Google Drive)."
                  DRIVE_DIRECT=true
                  rm -f "${OUTPUT_DIR}/${ZIP_NAME}" 2>/dev/null || true
                  break
                else
                  echo "      ❌ Insufficient disk space."
                  if [ "$UPLOAD_METHOD_INPUT" != "drive" ]; then
                    echo "      💡 Tip: Use 'drive' upload method for large files."
                  fi
                  exit 1
                fi
              else
                ZIP_SIZE=$(stat -c%s "${OUTPUT_DIR}/${ZIP_NAME}" 2>/dev/null || echo 0)
                ZIP_SIZE_MB=$(echo "scale=2; $ZIP_SIZE / 1048576" | bc 2>/dev/null || echo "?")
                echo "      ✅ Zipped: $ZIP_NAME (${ZIP_SIZE_MB} MB)"
                if [ "$DRIVE_DIRECT" = false ]; then
                  rm "$f"
                fi
              fi
            done
          fi

          if [ "$DRIVE_DIRECT" = true ]; then
            echo ""
            echo "→ 📂 Moving raw files to output directory (DRIVE_DIRECT mode)..."
            mkdir -p "$OUTPUT_DIR"
            mv "$DOWNLOAD_DIR"/* "$OUTPUT_DIR/" 2>/dev/null || true
          fi

          rm -rf "$DOWNLOAD_DIR"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋  FINAL ASSET LIST"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ls -lh "$OUTPUT_DIR/" 2>/dev/null || echo "  (no files)"
          ls -1 "$OUTPUT_DIR" > "${OUTPUT_DIR}_assets.txt"
          echo ""
          echo "  📊 Total assets: $(wc -l < "${OUTPUT_DIR}_assets.txt")"
          echo "  💾 Total size:   $(du -sh "$OUTPUT_DIR" | cut -f1)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        shell: bash

      - name: '🔌 Disconnect VPN for uploads'
        if: steps.vpn.outputs.vpn_available == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔌  DISCONNECTING VPN FOR UPLOAD"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "→ Bringing down wg0 to use runner's native connection..."
          if sudo wg-quick down wg0; then
            echo "✅ WireGuard VPN disconnected successfully"
          else
            echo "⚠️  Warning: wg-quick down returned non-zero (interface may already be down)"
          fi
          echo ""

      - name: '☁️ Upload to Google Drive'
        if: inputs.upload_method == 'drive'
        env:
          CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "☁️  UPLOADING TO GOOGLE DRIVE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          echo "→ [1/3] Obtaining OAuth2 access token..."
          ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r '.access_token')
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "❌ ERROR: Failed to obtain Google Drive access token."
            echo "   Check your GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, and GOOGLE_REFRESH_TOKEN secrets."
            exit 1
          fi
          echo "  ✅ Access token obtained"

          echo "→ [2/3] Preparing upload folder..."
          FOLDER_NAME="github-actions"
          QUERY="mimeType='application/vnd.google-apps.folder' and name='$FOLDER_NAME' and trashed=false"
          FOLDER_ID=$(curl -s -G \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "q=$QUERY" \
            --data-urlencode "fields=files(id)" \
            "https://www.googleapis.com/drive/v3/files" | jq -r '.files[0].id // ""')
          if [ -z "$FOLDER_ID" ]; then
            echo "  → Folder '$FOLDER_NAME' not found – creating..."
            FOLDER_ID=$(curl -s -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$FOLDER_NAME\", \"mimeType\":\"application/vnd.google-apps.folder\"}" \
              "https://www.googleapis.com/drive/v3/files?fields=id" | jq -r '.id')
            if [ -z "$FOLDER_ID" ] || [ "$FOLDER_ID" = "null" ]; then
              echo "  ❌ ERROR: Failed to create folder"
              exit 1
            fi
            echo "  ✅ Folder created"
          fi
          echo "  📁 Folder: '$FOLDER_NAME' (ID: $FOLDER_ID)"
          echo ""

          echo "→ [3/3] Uploading files..."
          echo ""
          OUTPUT_DIR="m3u8_out"
          UPLOAD_SUCCESS=0
          UPLOAD_FAIL=0
          
          for file in "$OUTPUT_DIR"/*; do
            [ -f "$file" ] || continue
            fname=$(basename "$file")
            size=$(stat -c%s "$file")
            size_mb=$(echo "scale=2; $size / 1048576" | bc 2>/dev/null || echo "?")
            echo "  ⬆️  Uploading: $fname (${size_mb} MB / $size bytes)"

            ext="${fname##*.}"
            case "$ext" in
              zip|z01|z02|z03|z04|z05) MTYPE="application/zip" ;;
              mp4)                      MTYPE="video/mp4" ;;
              mkv)                      MTYPE="video/x-matroska" ;;
              webm)                     MTYPE="video/webm" ;;
              m4a)                      MTYPE="audio/mp4" ;;
              mp3)                      MTYPE="audio/mpeg" ;;
              *)                        MTYPE="application/octet-stream" ;;
            esac
            echo "     MIME: $MTYPE"

            SESSION_URI=$(curl -s -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: $MTYPE" \
              -d "{\"name\":\"$fname\", \"parents\":[\"$FOLDER_ID\"]}" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable" \
              -D - | tr -d '\r' | grep -i '^location:' | sed 's/^location: //i' | tr -d ' ')
            if [ -z "$SESSION_URI" ]; then
              echo "     ❌ Failed to initiate resumable upload session – skipping"
              UPLOAD_FAIL=$((UPLOAD_FAIL + 1))
              continue
            fi

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Range: bytes 0-$((size-1))/$size" \
              --upload-file "$file" \
              "$SESSION_URI")
            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
              echo "     ✅ Upload complete (HTTP $HTTP_CODE)"
              UPLOAD_SUCCESS=$((UPLOAD_SUCCESS + 1))
            else
              echo "     ❌ Upload failed (HTTP $HTTP_CODE)"
              UPLOAD_FAIL=$((UPLOAD_FAIL + 1))
            fi
            echo ""
          done
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "☁️  DRIVE UPLOAD SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ Uploaded: $UPLOAD_SUCCESS"
          echo "  ❌ Failed:   $UPLOAD_FAIL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: '📤 Upload to repository (git push)'
        if: ${{ inputs.upload_method == 'repo' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📤  UPLOADING TO REPOSITORY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config http.postBuffer 524288000

          OUTPUT_DIR="m3u8_out"
          if [ -z "$(ls -A "$OUTPUT_DIR/" 2>/dev/null)" ]; then
            echo "⚠️  No files to upload – output directory is empty."
            exit 0
          fi

          FILE_COUNT=$(ls -1 "$OUTPUT_DIR/" | wc -l)
          TOTAL_SIZE=$(du -sh "$OUTPUT_DIR/" | cut -f1)
          echo "  📁 Files to commit: $FILE_COUNT"
          echo "  💾 Total size: $TOTAL_SIZE"
          echo "  🌿 Target branch: $BRANCH"
          echo ""

          echo "→ Staging files..."
          git add "$OUTPUT_DIR/"
          
          FILE_LIST=$(ls -1 "$OUTPUT_DIR/" | tr '\n' ', ' | sed 's/,$//')
          COMMIT_MSG="🎬 Add M3U8 downloads: $FILE_LIST [skip ci]"
          
          echo "→ Committing: $COMMIT_MSG"
          git commit -m "$COMMIT_MSG" || echo "  ℹ️  Nothing to commit"
          echo ""

          echo "→ Pushing to origin/$BRANCH (with retry)..."
          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "  🔄 Push attempt $i/$RETRIES..."
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then
              echo ""
              echo "  ✅ Push succeeded on attempt $i"
              break
            else
              if [ $i -lt $RETRIES ]; then
                echo "  ⚠️  Push failed – retrying in 3s..."
                sleep 3
              else
                echo ""
                echo "  ❌ Push failed after $RETRIES attempts"
                exit 1
              fi
            fi
          done
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Repository upload complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: '🏷️ Create Release and upload assets'
        if: ${{ inputs.upload_method == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏷️  CREATING GITHUB RELEASE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          OUTPUT_DIR="m3u8_out"
          if [ ! -s "${OUTPUT_DIR}_assets.txt" ]; then
            echo "⚠️  No assets to release."
            exit 0
          fi

          RAND5=$(mktemp -u XXXXX)
          TAG="m3u8-download-${RAND5}"
          echo "  🏷️  Tag: $TAG"
          echo "  🌿 Target: ${{ github.ref_name }}"
          echo ""

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          echo "→ Creating and pushing tag..."
          git tag "$TAG" -m "M3U8 HLS download – automated release"
          git push origin "$TAG"
          echo "  ✅ Tag pushed"
          echo ""

          echo "→ Collecting assets..."
          ASSET_ARGS=""
          ASSET_COUNT=0
          while IFS= read -r file; do
            ASSET_ARGS="$ASSET_ARGS ${OUTPUT_DIR}/$file"
            ASSET_COUNT=$((ASSET_COUNT + 1))
            ASSET_SIZE=$(stat -c%s "${OUTPUT_DIR}/$file" 2>/dev/null || echo 0)
            ASSET_SIZE_MB=$(echo "scale=2; $ASSET_SIZE / 1048576" | bc 2>/dev/null || echo "?")
            echo "    📎 $file (${ASSET_SIZE_MB} MB)"
          done < "${OUTPUT_DIR}_assets.txt"
          echo ""
          echo "  📊 Total assets: $ASSET_COUNT"
          echo ""

          echo "→ Creating release via gh CLI..."
          gh release create "$TAG" $ASSET_ARGS \
            --title "🎬 M3U8 Download – ${RAND5}" \
            --notes "Automated M3U8/HLS stream download via GitHub Actions workflow.

          **Quality:** ${{ inputs.quality }}
          **Format:** ${{ inputs.merge_format }}
          **Assets:** $ASSET_COUNT file(s)

          ---
          *Generated by downloader-m3u8 workflow*" \
            --target "${{ github.ref_name }}"
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Release created: $TAG"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: '🧹 Cleanup temporary files'
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧹  CLEANUP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "→ Removing temporary directories and files..."
          rm -rf m3u8_out downloads_tmp tasks.txt failed_urls.txt success_urls.txt 2>/dev/null || true
          rm -f m3u8_out_assets.txt 2>/dev/null || true
          echo "  ✅ Temporary files removed"
          
          echo "→ Ensuring VPN is disconnected..."
          sudo wg-quick down wg0 2>/dev/null && echo "  ✅ VPN interface down" || echo "  ℹ️  No active VPN interface"
          echo ""
          echo "🏁 Workflow complete."
