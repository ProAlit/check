name: downloader-youtube

on:
  workflow_dispatch:
    inputs:
      url:
        description: >
          Enter one or more YouTube URLs. Each can be followed by optional "v"/"a" and a
          quality value (e.g. "v 480" or "a 192"). Separate entries with newlines, commas,
          or spaces.
        required: true
        type: string

      output_format:
        description: 'Output format (applied when no per-URL "v"/"a" is given)'
        required: true
        type: choice
        options:
          - 'mp4 (video)'
          - 'mp3 (audio only)'
        default: 'mp4 (video)'

      video_quality:
        description: 'Max video resolution (default when no per-URL quality is specified)'
        required: true
        type: choice
        options:
          - '2160 (4K)'
          - '1080 (Full HD)'
          - '720 (HD)'
          - '480'
          - '360'
          - 'best'
        default: '480'

      audio_quality:
        description: 'Audio bitrate for MP3 downloads'
        required: true
        type: choice
        options:
          - '320'
          - '192'
          - '128'
          - '64'
        default: '64'

      upload_method:
        description: "☁️ Upload destination"
        required: true
        type: choice
        options:
          - drive
          - repo
          - release
        default: drive

      bundle_all:
        description: "📦 Bundle all downloaded files into a single ZIP archive?"
        required: true
        type: boolean
        default: true

      vpn_enabled:
        description: "🔒 Route downloads through VPN?"
        required: true
        type: boolean
        default: false

      vpn_type:
        description: "🛡️ VPN Protocol (if VPN enabled)"
        required: true
        type: choice
        options:
          - wireguard
          - openvpn
        default: wireguard

      concurrent_downloads:
        description: "⚡ Concurrent URL download workers"
        required: true
        type: number
        default: 4

      retry_count:
        description: "🔄 Retries per provider strategy"
        required: true
        type: number
        default: 2

      impersonate:
        description: "🎭 Impersonate browser client (curl_cffi)"
        required: true
        type: choice
        options:
          - None
          - Chrome-133:Macos-15
          - Chrome-136:Macos-15
          - Safari-17.2:Ios-17.2
          - Safari-18.0:Ios-18.0
          - Safari-18.4:Ios-18.4
          - Safari-26.0:Ios-26.0
          - Chrome-99:Android-12
          - Chrome-131:Android-14
          - Tor-14.5:Macos-14
          - Edge-99:Windows-10
          - Edge-101:Windows-10
          - Firefox-133:Macos-14
          - Firefox-135:Macos-14
          - Safari-15.3:Macos-14
          - Safari-15.5:Macos-14
          - Safari-17.0:Macos-14
          - Safari-18.0:Macos-15
          - Safari-18.4:Macos-15
          - Safari-26.0:Macos-26
          - Chrome-99:Windows-10
          - Chrome-100:Windows-10
          - Chrome-101:Windows-10
          - Chrome-104:Windows-10
          - Chrome-107:Windows-10
          - Chrome-110:Windows-10
          - Chrome-116:Windows-10
          - Chrome-119:Macos-14
          - Chrome-120:Macos-14
          - Chrome-123:Macos-14
          - Chrome-124:Macos-14
          - Chrome-131:Macos-14
        default: 'Chrome-131:Android-14'

      raw_logs:
        description: "🧪 Show raw verbose logs in console?"
        required: true
        type: boolean
        default: false

      fail_on_partial:
        description: "❌ Fail workflow if any URL fails?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: youtube-downloader-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  POT_SERVER_PORT: "4416"
  DEFAULT_PARALLEL: "3"
  DEFAULT_RETRIES: "2"
  DRIVE_CHUNK_SIZE: "16777216" # 16 MB Chunks
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  youtube-download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      # ============================================================
      # 01. CHECKOUT
      # ============================================================
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      # ============================================================
      # 02. SYSTEM DEPENDENCIES
      # ============================================================
      - name: "🛠️ Install system dependencies"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            curl \
            jq \
            zip \
            unzip \
            wireguard-tools \
            openvpn \
            openvpn-systemd-resolved \
            openssl \
            python3 \
            python3-pip \
            python-is-python3

          echo "✅ System dependencies installed."

      # ============================================================
      # 03. DENO & EJS RUNTIMES
      # ============================================================
      - name: "🦕 Install latest Deno runtime"
        run: |
          set -Eeuo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            https://deno.land/install.sh \
            | sh -s -- -y

          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.deno/bin:$PATH"

          deno --version

      # ============================================================
      # 04. PYTHON & YT-DLP TOOLCHAIN
      # ============================================================
      - name: "📦 Install yt-dlp & extractor plugins"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          set -Eeuo pipefail

          python3 -m pip install --upgrade --break-system-packages pip setuptools wheel
          python3 -m pip install --upgrade --break-system-packages \
            "yt-dlp[default]" \
            curl_cffi \
            yt-dlp-ejs \
            bgutil-ytdlp-pot-provider \
            requests

          echo "✅ Downloader packages installed."

      # ============================================================
      # 05. TOOLCHAIN VERIFICATION
      # ============================================================
      - name: "🔎 Show toolchain versions"
        run: |
          set -Eeuo pipefail

          echo "Python : $(python3 --version 2>&1)"
          echo "yt-dlp : $(yt-dlp --version)"
          echo "Deno   : $(deno --version | sed -n '1p')"
          echo "FFmpeg : $(ffmpeg -version | sed -n '1p')"

      # ============================================================
      # 06. WORKSPACE & IDENTIFIER
      # ============================================================
      - name: "📁 Initialize workspace"
        run: |
          set -Eeuo pipefail

          RUN_SUFFIX="$(openssl rand -hex 4 | cut -c1-5)"
          echo "RUN_SUFFIX=${RUN_SUFFIX}" >> "$GITHUB_ENV"
          echo "🆔 Generated identifier: ${RUN_SUFFIX}"

          rm -rf work output
          mkdir -p \
            work/downloads \
            work/logs \
            work/results \
            work/failed \
            work/archive \
            work/package \
            output

          echo "✅ Workspace initialized."

      # ============================================================
      # 07. PREPARE COOKIES
      # ============================================================
      - name: "🔐 Prepare YouTube cookies"
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -Eeuo pipefail

          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/youtube-cookies.txt
            chmod 600 /tmp/youtube-cookies.txt
            echo "COOKIES_FILE=/tmp/youtube-cookies.txt" >> "$GITHUB_ENV"
            echo "✅ YouTube cookies imported from secrets."
          else
            echo "COOKIES_FILE=" >> "$GITHUB_ENV"
            echo "ℹ️ No YOUTUBE_COOKIES secret supplied."
          fi

      # ============================================================
      # 08. PARSE URLs AND PARAMETERS (OCTAL BUG FIXED)
      # ============================================================
      - name: "📝 Parse URLs and per-URL arguments"
        env:
          RAW_INPUT: ${{ inputs.url }}
          GLOBAL_FORMAT: ${{ inputs.output_format }}
          GLOBAL_VQ: ${{ inputs.video_quality }}
          GLOBAL_AQ: ${{ inputs.audio_quality }}
        run: |
          set -Eeuo pipefail

          : > work/jobs.tsv

          # Compute global defaults
          def_vq=$(echo "$GLOBAL_VQ" | grep -oE '[0-9]+' | head -1 || echo "720")
          [ "$GLOBAL_VQ" = "best" ] && def_vq="max"

          def_aq=$(echo "$GLOBAL_AQ" | grep -oE '[0-9]+' | head -1 || echo "320")
          [ "$GLOBAL_AQ" = "best" ] && def_aq="max"

          if [ "$GLOBAL_FORMAT" = "mp3 (audio only)" ]; then
            def_type="a"
            def_val="$def_aq"
          else
            def_type="v"
            def_val="$def_vq"
          fi

          index=0

          # Process line-by-line / comma separated input tokens
          while IFS= read -r line; do
            line=$(echo "$line" | xargs)
            [ -z "$line" ] && continue

            read -r -a tokens <<< "$line"
            i=0
            while [ $i -lt ${#tokens[@]} ]; do
              token="${tokens[$i]}"
              if [[ "$token" =~ ^https?:// ]]; then
                link="$token"
                type="$def_type"
                val="$def_val"

                # Check if next token is 'v' or 'a'
                if [ $((i + 1)) -lt ${#tokens[@]} ]; then
                  next="${tokens[$((i + 1))]}"
                  if [ "$next" = "v" ] || [ "$next" = "a" ]; then
                    type="$next"
                    i=$((i + 1))

                    # Check for quality number following 'v' or 'a'
                    if [ $((i + 1)) -lt ${#tokens[@]} ]; then
                      qval="${tokens[$((i + 1))]}"
                      if [[ "$qval" =~ ^[0-9]+$ ]] || [ "$qval" = "max" ] || [ "$qval" = "best" ] || [ "$qval" = "min" ]; then
                        val="$qval"
                        i=$((i + 1))
                      fi
                    fi
                  fi
                fi

                index=$((index + 1))
                # Write plain integer ID to guarantee no octal interpretation errors
                printf '%d\t%s\t%s\t%s\n' "$index" "$link" "$type" "$val" >> work/jobs.tsv
              fi
              i=$((i + 1))
            done
          done < <(printf '%s\n' "$RAW_INPUT" | tr ',' '\n')

          if [ ! -s work/jobs.tsv ]; then
            echo "❌ No valid YouTube URLs found."
            exit 1
          fi

          echo "✅ Parsed $(wc -l < work/jobs.tsv) download entries:"
          cat work/jobs.tsv

      # ============================================================
      # 09. VPN CONFIGURATION (WIREGUARD & OPENVPN)
      # ============================================================
      - name: "🔒 Configure VPN (WireGuard / OpenVPN)"
        id: vpn
        env:
          VPN_ENABLED: ${{ inputs.vpn_enabled }}
          VPN_TYPE: ${{ inputs.vpn_type }}
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
          OVPN_CONFIG: ${{ secrets.OVPN_CONFIG }}
          OVPN_AUTH: ${{ secrets.OVPN_AUTH }}
        run: |
          set -Eeuo pipefail

          if [ "$VPN_ENABLED" != "true" ]; then
            echo "🚫 VPN disabled by input."
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🛡️ Configuring VPN protocol: ${VPN_TYPE}"

          if [ "$VPN_TYPE" = "wireguard" ]; then
            if [ -z "$WG_CONFIG" ]; then
              echo "⚠️ WireGuard requested but WG_CONFIG secret is empty."
              echo "vpn_available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            umask 077
            printf '%s\n' "$WG_CONFIG" > /tmp/wg0.conf
            sudo install -m 600 /tmp/wg0.conf /etc/wireguard/wg0.conf

            if sudo wg-quick up wg0; then
              echo "✅ WireGuard connected."
              public_ip="$(curl -4 --silent --show-error --max-time 15 https://api.ipify.org || echo "unavailable")"
              echo "🌐 Public IPv4: $public_ip"
              echo "vpn_available=true" >> "$GITHUB_OUTPUT"
            else
              echo "❌ WireGuard failed."
              sudo wg-quick down wg0 >/dev/null 2>&1 || true
              echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            fi

          elif [ "$VPN_TYPE" = "openvpn" ]; then
            if [ -z "$OVPN_CONFIG" ]; then
              echo "⚠️ OpenVPN requested but OVPN_CONFIG secret is empty."
              echo "vpn_available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ ! -c /dev/net/tun ]; then
              sudo mkdir -p /dev/net
              sudo mknod /dev/net/tun c 10 200
              sudo chmod 600 /dev/net/tun
            fi

            umask 077
            printf '%s\n' "$OVPN_CONFIG" > /tmp/client.ovpn

            if [ -n "$OVPN_AUTH" ]; then
              printf '%s\n' "$OVPN_AUTH" > /tmp/ovpn-auth.txt
              chmod 600 /tmp/ovpn-auth.txt
              echo "auth-user-pass /tmp/ovpn-auth.txt" >> /tmp/client.ovpn
            fi

            echo "🚀 Starting OpenVPN daemon..."
            sudo openvpn --config /tmp/client.ovpn --daemon --log /tmp/openvpn.log

            echo "⏳ Waiting for OpenVPN tunnel interface..."
            ready="false"
            for attempt in $(seq 1 30); do
              if ip link show dev tun0 >/dev/null 2>&1 || ip link show dev tun1 >/dev/null 2>&1; then
                ready="true"
                break
              fi
              sleep 1
            done

            if [ "$ready" = "true" ]; then
              echo "✅ OpenVPN connected."
              sleep 2
              public_ip="$(curl -4 --silent --show-error --max-time 15 https://api.ipify.org || echo "unavailable")"
              echo "🌐 Public IPv4: $public_ip"
              echo "vpn_available=true" >> "$GITHUB_OUTPUT"
            else
              echo "❌ OpenVPN failed to connect."
              cat /tmp/openvpn.log 2>/dev/null || true
              echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # ============================================================
      # 10. BGUTIL PO TOKEN PROVIDER
      # ============================================================
      - name: "🛡️ Start bgutil PO-token provider"
        id: pot
        run: |
          set -Eeuo pipefail

          image="brainicism/bgutil-ytdlp-pot-provider:latest"
          docker rm -f bgutil-provider >/dev/null 2>&1 || true

          echo "🐳 Pulling $image"
          if ! docker pull "$image"; then
            echo "pot_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker run \
            --name bgutil-provider \
            --detach \
            --init \
            --network host \
            "$image"

          ready="false"
          for attempt in $(seq 1 30); do
            if curl -s -f --max-time 2 "http://127.0.0.1:${POT_SERVER_PORT}/ping" >/dev/null 2>&1; then
              ready="true"
              break
            fi
            sleep 2
          done

          if [ "$ready" = "true" ]; then
            echo "✅ bgutil PO-token provider active on port ${POT_SERVER_PORT}."
            echo "pot_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ bgutil failed health check."
            echo "pot_available=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # 11. DOWNLOAD ENGINE (PARALLEL WORKERS & CASCADE)
      # ============================================================
      - name: "⬇️ Download YouTube media"
        env:
          CONCURRENT_WORKERS: ${{ inputs.concurrent_downloads }}
          RETRY_COUNT: ${{ inputs.retry_count }}
          RAW_LOGS: ${{ inputs.raw_logs }}
          IMPERSONATE_TARGET: ${{ inputs.impersonate }}
          COOKIES_FILE: ${{ env.COOKIES_FILE }}
          POT_AVAILABLE: ${{ steps.pot.outputs.pot_available }}
          VPN_AVAILABLE: ${{ steps.vpn.outputs.vpn_available }}
        run: |
          set -Eeuo pipefail

          WORKERS="$CONCURRENT_WORKERS"
          RETRIES="$RETRY_COUNT"

          if ! [[ "$WORKERS" =~ ^[1-9][0-9]*$ ]]; then WORKERS="$DEFAULT_PARALLEL"; fi
          if ! [[ "$RETRIES" =~ ^[1-9][0-9]*$ ]]; then RETRIES="$DEFAULT_RETRIES"; fi

          now() { date '+%H:%M:%S'; }

          format_duration() {
            local secs="$1"
            if [ "$secs" -ge 3600 ]; then
              printf '%dh %dm %ds' $((secs / 3600)) $(( (secs % 3600) / 60 )) $((secs % 60))
            elif [ "$secs" -ge 60 ]; then
              printf '%dm %ds' $((secs / 60)) $((secs % 60))
            else
              printf '%ds' "$secs"
            fi
          }

          format_bytes() {
            local bytes="$1"
            if [ -z "$bytes" ] || [ "$bytes" -le 0 ] 2>/dev/null; then
              echo "0 B"
              return
            fi
            numfmt --to=iec-i --suffix=B "$bytes" 2>/dev/null || awk -v b="$bytes" 'BEGIN {
              split("B KB MB GB TB", units, " ");
              i=1;
              while(b>=1024 && i<5) { b/=1024; i++ }
              printf "%.2f %s", b, units[i]
            }'
          }

          safe_log() {
            (
              flock -x 200
              printf '%b\n' "$1"
            ) 200>/tmp/terminal.lock
          }

          log_timing() {
            local id="$1"
            local message="$2"
            printf '[%s] %s\n' "$(now)" "$message" >> "work/logs/${id}-timing.log"
          }

          has_media() {
            local dir="$1"
            find "$dir" -type f \( \
              -iname '*.mp4' -o -iname '*.mkv' -o -iname '*.webm' \
              -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.opus' \
            \) -print -quit | grep -q .
          }

          extract_video_id() {
            local u="$1"
            if [[ "$u" =~ (v=|v\/|vi\/|youtu\.be\/|\/v\/|\/embed\/|\/shorts\/)([a-zA-Z0-9_-]{11}) ]]; then
              echo "${BASH_REMATCH[2]}"
            else
              echo "$u" | sed -n 's/.*v=\([a-zA-Z0-9_-]\{11\}\).*/\1/p' | head -1
            fi
          }

          # Strategy A: Primary yt-dlp
          run_primary_ytdlp() {
            local id="$1" link="$2" type="$3" val="$4"
            local dir="work/downloads/${id}"
            local logfile="work/logs/${id}-primary.log"

            local -a cmd=(
              yt-dlp
              --ignore-config
              --newline
              --continue
              --no-overwrites
              --retries 3
              --fragment-retries 3
              --socket-timeout 30
              --js-runtimes deno
              --remote-components ejs:npm
            )

            [ -n "$COOKIES_FILE" ] && [ -f "$COOKIES_FILE" ] && cmd+=(--cookies "$COOKIES_FILE")

            if [ "$IMPERSONATE_TARGET" != "None" ]; then
              cmd+=(--impersonate "$IMPERSONATE_TARGET")
            fi

            if [ "$POT_AVAILABLE" = "true" ]; then
              cmd+=(--extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}")
            fi

            cmd+=(--extractor-args "youtube:player_client=default,web_embedded")

            if [ "$type" = "a" ]; then
              cmd+=(
                -x
                --audio-format mp3
                --audio-quality "${val:-320k}"
                -o "${dir}/%(title)s-${val}kbps.%(ext)s"
              )
            else
              local fmt_selector
              case "$val" in
                max|best|2160) fmt_selector="bv*[height<=2160]+ba/b[height<=2160]/best" ;;
                1080) fmt_selector="bv*[height<=1080]+ba/b[height<=1080]/best" ;;
                720) fmt_selector="bv*[height<=720]+ba/b[height<=720]/best" ;;
                480) fmt_selector="bv*[height<=480]+ba/b[height<=480]/best" ;;
                360) fmt_selector="bv*[height<=360]+ba/b[height<=360]/best" ;;
                *) fmt_selector="bv*[height<=${val}]+ba/b[height<=${val}]/best" ;;
              esac
              cmd+=(
                -f "$fmt_selector"
                --merge-output-format mp4
                -o "${dir}/%(title)s-${val}p.%(ext)s"
              )
            fi

            cmd+=("$link")

            local exit_code=0
            if [ "$RAW_LOGS" = "true" ]; then
              set +e
              timeout 600 "${cmd[@]}" >> "work/logs/${id}-raw.log" 2>&1
              exit_code=$?
              set -e
            else
              set +e
              timeout 600 "${cmd[@]}" > "$logfile" 2>&1
              exit_code=$?
              set -e
            fi

            if [ "$exit_code" -eq 0 ] && has_media "$dir"; then
              return 0
            fi
            return 1
          }

          # Strategy B: Piped API Proxy Fallback (Bypasses Datacenter IP Blocks)
          run_piped_fallback() {
            local id="$1" link="$2" type="$3" val="$4"
            local dir="work/downloads/${id}"
            local logfile="work/logs/${id}-piped.log"

            local vid
            vid="$(extract_video_id "$link")"
            if [ -z "$vid" ]; then
              echo "❌ Could not extract video ID from $link" >> "$logfile"
              return 1
            fi

            local instances=(
              "https://pipedapi.adminforge.de"
              "https://pipedapi.syncpundit.com"
              "https://pipedapi.kavin.rocks"
              "https://api.piped.privacydev.net"
            )

            local api_base=""
            local info=""
            for inst in "${instances[@]}"; do
              info=$(curl -s --fail --max-time 15 "${inst}/streams/${vid}" 2>/dev/null || true)
              if echo "$info" | jq -e '.videoStreams | length > 0' >/dev/null 2>&1; then
                api_base="$inst"
                break
              fi
            done

            if [ -z "$api_base" ]; then
              echo "❌ All Piped instances failed for $vid" >> "$logfile"
              return 1
            fi

            local title
            title=$(echo "$info" | jq -r '.title // "video"')
            local safe_title
            safe_title=$(echo "$title" | sed 's/[^a-zA-Z0-9._-]/_/g' | sed 's/__*/_/g' | head -c 120)

            if [ "$type" = "a" ]; then
              local audio_url
              audio_url=$(echo "$info" | jq -r '.audioStreams | sort_by(-.bitrate) | .[0].url // ""')
              [ -z "$audio_url" ] && return 1

              local raw_audio="${dir}/temp_${vid}.m4a"
              local final_mp3="${dir}/${safe_title}-${val}kbps.mp3"

              curl -L --fail --silent --show-error --retry 3 --retry-delay 2 -o "$raw_audio" "$audio_url"
              ffmpeg -hide_banner -loglevel error -y -i "$raw_audio" -vn -c:a libmp3lame -b:a "${val}k" "$final_mp3"
              rm -f "$raw_audio"
              return 0
            else
              local max_h="$val"
              [ "$max_h" = "max" ] || [ "$max_h" = "best" ] && max_h="2160"

              local video_url
              video_url=$(echo "$info" | jq -r --argjson maxh "$max_h" \
                '.videoStreams | map(select(.videoOnly == true and .height <= $maxh)) | sort_by(-.height) | .[0].url // ""')

              if [ -z "$video_url" ]; then
                video_url=$(echo "$info" | jq -r --argjson maxh "$max_h" \
                  '.videoStreams | map(select(.height <= $maxh)) | sort_by(-.height) | .[0].url // ""')
              fi

              local audio_url
              audio_url=$(echo "$info" | jq -r '.audioStreams | sort_by(-.bitrate) | .[0].url // ""')
              [ -z "$video_url" ] || [ -z "$audio_url" ] && return 1

              local tmp_v="${dir}/.tmp_${vid}_video"
              local tmp_a="${dir}/.tmp_${vid}_audio"
              local final_mp4="${dir}/${safe_title}-${val}p.mp4"

              curl -L --fail --silent --show-error --retry 3 --retry-delay 2 -o "$tmp_v" "$video_url"
              curl -L --fail --silent --show-error --retry 3 --retry-delay 2 -o "$tmp_a" "$audio_url"

              ffmpeg -hide_banner -loglevel error -y -i "$tmp_v" -i "$tmp_a" -c copy "$final_mp4" 2>> "$logfile"
              rm -f "$tmp_v" "$tmp_a"
              return 0
            fi
          }

          # Strategy C: Advanced Multi-Client (tv, web_music, android) with forced IPv4
          run_advanced_ytdlp() {
            local id="$1" link="$2" type="$3" val="$4"
            local dir="work/downloads/${id}"
            local logfile="work/logs/${id}-advanced.log"

            local -a cmd=(
              yt-dlp
              --ignore-config
              --force-ipv4
              --newline
              --retries 5
              --fragment-retries 5
              --socket-timeout 30
              --extractor-args "youtube:player_client=tv,web_music,android,web_embedded"
              --js-runtimes deno
              --remote-components ejs:npm
            )

            [ -n "$COOKIES_FILE" ] && [ -f "$COOKIES_FILE" ] && cmd+=(--cookies "$COOKIES_FILE")

            if [ "$type" = "a" ]; then
              cmd+=(
                -x
                --audio-format mp3
                --audio-quality "${val:-320k}"
                -o "${dir}/%(title)s-${val}kbps.%(ext)s"
              )
            else
              local fmt_selector
              case "$val" in
                max|best|2160) fmt_selector="bv*[height<=2160]+ba/b[height<=2160]/best" ;;
                1080) fmt_selector="bv*[height<=1080]+ba/b[height<=1080]/best" ;;
                720) fmt_selector="bv*[height<=720]+ba/b[height<=720]/best" ;;
                *) fmt_selector="bv*[height<=${val}]+ba/b[height<=${val}]/best" ;;
              esac
              cmd+=(
                -f "$fmt_selector"
                --merge-output-format mp4
                -o "${dir}/%(title)s-${val}p.%(ext)s"
              )
            fi

            cmd+=("$link")

            set +e
            timeout 600 "${cmd[@]}" > "$logfile" 2>&1
            local exit_code=$?
            set -e

            if [ "$exit_code" -eq 0 ] && has_media "$dir"; then
              return 0
            fi
            return 1
          }

          process_one() {
            local id_raw="$1"
            local link="$2"
            local type="$3"
            local val="$4"

            # Parse base 10 integer to bypass bash octal evaluation errors
            local id=$((10#$id_raw))
            local id_fmt
            id_fmt="$(printf '%04d' "$id")"

            local dir="work/downloads/${id}"
            mkdir -p "$dir"
            : > "work/logs/${id}-timing.log"

            local start_sec="$(date +%s)"
            local started_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            local status="failed"
            local winner="none"
            local reason="exhausted"
            local resolved_title="N/A"
            local file_size=0

            local type_str="Video (${val}p)"
            [ "$type" = "a" ] && type_str="Audio (${val}kbps)"

            safe_log "[$(now)] 🚀 #${id_fmt} (youtube) STARTING  │ ${link} [${type_str}]"

            # 1. Primary Strategy
            local step1_start="$(date +%s)"
            if run_primary_ytdlp "$id" "$link" "$type" "$val"; then
              local step1_elapsed=$(( $(date +%s) - step1_start ))
              status="success"
              winner="yt-dlp (primary)"
              log_timing "$id" "⚡ primary yt-dlp ── took $(format_duration "$step1_elapsed") ── ✅ SUCCESS"
            else
              local step1_elapsed=$(( $(date +%s) - step1_start ))
              log_timing "$id" "⚡ primary yt-dlp ── took $(format_duration "$step1_elapsed") ── ✖ BLOCKED / FAILED → Piped"

              # 2. Piped Proxy Fallback
              local step2_start="$(date +%s)"
              if run_piped_fallback "$id" "$link" "$type" "$val"; then
                local step2_elapsed=$(( $(date +%s) - step2_start ))
                status="success"
                winner="Piped Proxy API"
                log_timing "$id" "🔌 piped fallback ── took $(format_duration "$step2_elapsed") ── ✅ SUCCESS"
              else
                local step2_elapsed=$(( $(date +%s) - step2_start ))
                log_timing "$id" "🔌 piped fallback ── took $(format_duration "$step2_elapsed") ── ✖ FAILED → Advanced clients"

                # 3. Advanced Multi-Client Fallback
                local step3_start="$(date +%s)"
                if run_advanced_ytdlp "$id" "$link" "$type" "$val"; then
                  local step3_elapsed=$(( $(date +%s) - step3_start ))
                  status="success"
                  winner="yt-dlp (tv/android)"
                  log_timing "$id" "📺 advanced multi-client ── took $(format_duration "$step3_elapsed") ── ✅ SUCCESS"
                else
                  local step3_elapsed=$(( $(date +%s) - step3_start ))
                  log_timing "$id" "📺 advanced multi-client ── took $(format_duration "$step3_elapsed") ── ✖ ALL STRATEGIES FAILED"
                fi
              fi
            fi

            mapfile -t prod_files < <(find "$dir" -maxdepth 1 -type f \( -iname '*.mp4' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.mp3' -o -iname '*.m4a' \) 2>/dev/null)
            if [ "${#prod_files[@]}" -gt 0 ]; then
              resolved_title="$(basename "${prod_files[0]}")"
              file_size="$(stat -c%s "${prod_files[0]}")"
            fi

            local finished_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            local total_elapsed=$(( $(date +%s) - start_sec ))
            local total_duration="$(format_duration "$total_elapsed")"

            if [ "$status" != "success" ]; then
              printf '%s\t%s\t%s\t%s\n' "$id" "$link" "$type" "$val" > "work/failed/${id}.tsv"
              printf '%s\n' "All strategies exhausted" > "work/failed/${id}.reason"
            fi

            jq -n \
              --arg id "$id" \
              --arg url "$link" \
              --arg status "$status" \
              --arg winner "$winner" \
              --arg title "$resolved_title" \
              --arg size "$file_size" \
              --arg type "$type_str" \
              --arg duration "$total_duration" \
              --arg started "$started_at" \
              --arg finished "$finished_at" \
              '{
                index: ($id | tonumber),
                url: $url,
                status: $status,
                provider: $winner,
                filename: $title,
                size_bytes: ($size | tonumber),
                type: $type,
                duration: $duration,
                started_at: $started,
                finished_at: $finished
              }' > "work/results/${id}.json"

            (
              flock -x 200
              echo
              echo "┌──────────────────────────────────────────────────────────────────────────────"
              if [ "$status" = "success" ]; then
                printf '│ 🎬 INPUT #%s — ✅ SUCCESS (Total: %s via %s)\n' "$id_fmt" "$total_duration" "$winner"
                printf '│ File : %s (%s)\n' "$resolved_title" "$(format_bytes "$file_size")"
              else
                printf '│ 🎬 INPUT #%s — ❌ FAILED (Total: %s)\n' "$id_fmt" "$total_duration"
              fi
              printf '│ URL  : %s\n' "$link"
              printf '│ Mode : %s\n' "$type_str"
              echo "│ Steps & Provider Timing:"
              if [ -s "work/logs/${id}-timing.log" ]; then
                sed 's/^/│   /' "work/logs/${id}-timing.log"
              else
                echo "│   (No step timing recorded)"
              fi
              echo "└──────────────────────────────────────────────────────────────────────────────"
              echo

              if [ "$RAW_LOGS" = "true" ] && [ -f "work/logs/${id}-raw.log" ]; then
                echo "--- [RAW LOGS FOR #${id_fmt}] ---"
                cat "work/logs/${id}-raw.log"
                echo "--- [END RAW LOGS FOR #${id_fmt}] ---"
                echo
              fi
            ) 200>/tmp/terminal.lock
          }

          echo "🚀 Concurrency Workers: $WORKERS"
          echo "🔄 Strategy Retries: $RETRIES"
          echo

          running=0
          while IFS=$'\t' read -r id link type val; do
            process_one "$id" "$link" "$type" "$val" &
            running=$((running + 1))

            if [ "$running" -ge "$WORKERS" ]; then
              wait -n 2>/dev/null || true
              running=$((running - 1))
            fi
          done < work/jobs.tsv

          wait || true

          echo
          echo "Download summary:"
          total="$(jq -s 'length' work/results/*.json 2>/dev/null || echo 0)"
          success="$(jq -s '[.[] | select(.status == "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          failed="$(jq -s '[.[] | select(.status != "success")] | length' work/results/*.json 2>/dev/null || echo 0)"

          echo "Requested : $total"
          echo "Successful: $success"
          echo "Failed    : $failed"

      # ============================================================
      # 12. REMUX & STANDARDIZE CONTAINERS
      # ============================================================
      - name: "🔧 Standardize video & audio formats"
        run: |
          set -Eeuo pipefail

          find work/downloads -mindepth 2 -maxdepth 2 -type f \( -name '*.mkv' -o -name '*.webm' \) | while read -r source; do
            output="${source%.*}.mp4"
            echo "🔧 Remuxing to MP4 container: $(basename "$source")"
            if ffmpeg -hide_banner -loglevel error -y -i "$source" -c copy "$output" 2>/dev/null; then
              rm -f "$source"
            fi
          done

      # ============================================================
      # 13. COLLECT FINAL FILES
      # ============================================================
      - name: "📚 Collect final files"
        id: collect
        run: |
          set -Eeuo pipefail

          rm -rf output
          mkdir -p output

          count=0
          total_bytes=0

          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            dest="output/$base"

            if [ -e "$dest" ]; then
              count=$((count + 1))
              ext="${base##*.}"
              name="${base%.*}"
              dest="output/${name}_${count}.${ext}"
            else
              count=$((count + 1))
            fi

            cp --reflink=auto -p "$file" "$dest"
            size="$(stat -c%s "$dest")"
            total_bytes=$((total_bytes + size))
          done < <(
            find work/downloads -mindepth 2 -maxdepth 2 -type f \( \
              -iname '*.mp4' -o -iname '*.mp3' -o -iname '*.m4a' \
            \) -print0 | sort -z
          )

          failed_report="output/FAILED-DOWNLOADS-${RUN_SUFFIX}.txt"
          : > "$failed_report"
          failed_count=0

          for result in work/results/*.json; do
            [ -f "$result" ] || continue
            status="$(jq -r '.status' "$result")"
            [ "$status" = "success" ] && continue

            url="$(jq -r '.url' "$result")"
            failed_count=$((failed_count + 1))
            echo "$url" >> "$failed_report"
          done

          if [ "$failed_count" -eq 0 ]; then
            rm -f "$failed_report"
          fi

          echo "FINAL_FILE_COUNT=$count" >> "$GITHUB_OUTPUT"
          echo "TOTAL_BYTES=$total_bytes" >> "$GITHUB_OUTPUT"
          echo "FAILED_COUNT=$failed_count" >> "$GITHUB_OUTPUT"

          echo
          echo "Final collected files: $count ($total_bytes bytes)"
          echo "Failed URLs          : $failed_count"

      # ============================================================
      # 14. DISCONNECT VPN (BEFORE UPLOADS)
      # ============================================================
      - name: "🔌 Disconnect VPN for uploads"
        run: |
          set +e
          sudo killall openvpn >/dev/null 2>&1 || true
          sudo wg-quick down wg0 >/dev/null 2>&1 || true
          echo "✅ VPN disconnected. Runner gigabit connection active for upload operations."

      # ============================================================
      # 15. PACKAGE ASSETS (ZIP / SPLIT)
      # ============================================================
      - name: "📦 Package output"
        id: archive
        env:
          BUNDLE_ALL: ${{ inputs.bundle_all }}
          UPLOAD_METHOD: ${{ inputs.upload_method }}
        run: |
          set -Eeuo pipefail

          rm -rf work/archive work/package
          mkdir -p work/archive work/package

          files_found=0
          while IFS= read -r -d '' file; do
            files_found=$((files_found + 1))
            cp --reflink=auto -p "$file" work/package/
          done < <(find output -maxdepth 1 -type f ! -name 'FAILED-DOWNLOADS-*' -print0 | sort -z)

          if [ "$files_found" -eq 0 ]; then
            echo "⚠️ No media files to package."
            echo "HAS_ASSETS=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_disk_full() {
            local msg="$1"
            [[ "$msg" =~ (No\ space\ left\ on\ device|Disk\ quota\ exceeded) ]]
          }

          if [ "$BUNDLE_ALL" = "true" ]; then
            zip_name="youtube_bundle_${RUN_SUFFIX}.zip"
            echo "📦 Bundling all files into: $zip_name"

            set +e
            if [ "$UPLOAD_METHOD" = "repo" ]; then
              zip_err="$( (cd work/package && zip -0 -s 90m -r "../archive/${zip_name}" .) 2>&1 )"
              zip_code=$?
            elif [ "$UPLOAD_METHOD" = "release" ]; then
              zip_err="$( (cd work/package && zip -0 -s 1900m -r "../archive/${zip_name}" .) 2>&1 )"
              zip_code=$?
            else
              zip_err="$( (cd work/package && zip -0 -r "../archive/${zip_name}" .) 2>&1 )"
              zip_code=$?
            fi
            set -e

            if [ "$zip_code" -ne 0 ]; then
              if is_disk_full "$zip_err" && [ "$UPLOAD_METHOD" = "drive" ]; then
                echo "⚠️ Disk full during bundling. Uploading raw media directly to Google Drive."
                cp -p work/package/* work/archive/
              else
                echo "❌ Zipping failed: $zip_err"
                exit 1
              fi
            fi

          else
            index=0
            while IFS= read -r -d '' file; do
              index=$((index + 1))
              base="$(basename "$file")"
              safe="$(printf '%s' "$base" | tr ' ' '_' | tr -cd '[:alnum:]_.-')"
              zip_name="single-${index}-${safe}-${RUN_SUFFIX}.zip"

              set +e
              if [ "$UPLOAD_METHOD" = "repo" ]; then
                (cd work/package && zip -0 -s 90m "../../work/archive/${zip_name}" "$base")
              elif [ "$UPLOAD_METHOD" = "release" ]; then
                (cd work/package && zip -0 -s 1900m "../../work/archive/${zip_name}" "$base")
              else
                (cd work/package && zip -0 "../../work/archive/${zip_name}" "$base")
              fi
              set -e
            done < <(find work/package -maxdepth 1 -type f -print0 | sort -z)
          fi

          find work/archive -maxdepth 1 -type f \( -name '*.zip' -o -name '*.z[0-9][0-9]' \) -exec cp -p {} output/ \;

          echo "HAS_ASSETS=true" >> "$GITHUB_OUTPUT"
          echo
          echo "📦 Final package contents in output/:"
          ls -lh output/

      # ============================================================
      # 16. GITHUB STEP SUMMARY
      # ============================================================
      - name: "📊 Write GitHub summary"
        env:
          GLOBAL_FORMAT: ${{ inputs.output_format }}
          GLOBAL_VQ: ${{ inputs.video_quality }}
          GLOBAL_AQ: ${{ inputs.audio_quality }}
          UPLOAD_INPUT: ${{ inputs.upload_method }}
          BUNDLE_INPUT: ${{ inputs.bundle_all }}
          VPN_INPUT: ${{ inputs.vpn_enabled }}
          VPN_TYPE: ${{ inputs.vpn_type }}
          IMPERSONATE_TARGET: ${{ inputs.impersonate }}
        run: |
          set -Eeuo pipefail

          total="$(jq -s 'length' work/results/*.json 2>/dev/null || echo 0)"
          success="$(jq -s '[.[] | select(.status == "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          failed="$(jq -s '[.[] | select(.status != "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          file_count="${{ steps.collect.outputs.FINAL_FILE_COUNT || 0 }}"
          total_bytes="${{ steps.collect.outputs.TOTAL_BYTES || 0 }}"
          formatted_bytes="$(numfmt --to=iec-i --suffix=B "$total_bytes" 2>/dev/null || echo "$total_bytes bytes")"

          {
            echo "# 🎬 YouTube Downloader"
            echo
            echo "## Configuration"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Default Format | \`$GLOBAL_FORMAT\` |"
            echo "| Default Video Quality | \`$GLOBAL_VQ\` |"
            echo "| Default Audio Quality | \`$GLOBAL_AQ\` |"
            echo "| Upload Destination | \`$UPLOAD_INPUT\` |"
            echo "| Bundle into Single ZIP | \`$BUNDLE_INPUT\` |"
            echo "| Browser Impersonation | \`$IMPERSONATE_TARGET\` |"
            echo "| VPN Enabled | \`$VPN_INPUT\` ($VPN_TYPE) |"
            echo
            echo "## Result"
            echo
            echo "| Metric | Count / Size |"
            echo "|---|---:|"
            echo "| Requested URLs | $total |"
            echo "| Successful | $success |"
            echo "| Failed | $failed |"
            echo "| Downloaded Files | $file_count |"
            echo "| Total Payload Size | $formatted_bytes |"
            echo
            echo "## Download Breakdown"
            echo '| # | Status | Title / File | Mode | Provider | Time |'
            echo '|---|---|---|---|---|---|'
            for res in work/results/*.json; do
              [ -f "$res" ] || continue
              idx="$(jq -r '.index' "$res")"
              st="$(jq -r '.status' "$res")"
              fn="$(jq -r '.filename // "N/A"' "$res")"
              tp="$(jq -r '.type' "$res")"
              pr="$(jq -r '.provider' "$res")"
              dur="$(jq -r '.duration' "$res")"
              [ "$st" = "success" ] && icon="✅" || icon="❌"
              echo "| $idx | $icon $st | \`$fn\` | $tp | $pr | $dur |"
            done
            echo
            if [ -f "output/FAILED-DOWNLOADS-${RUN_SUFFIX}.txt" ]; then
              echo "### ⚠️ Failed URLs"
              echo '```text'
              cat "output/FAILED-DOWNLOADS-${RUN_SUFFIX}.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 17. DIAGNOSTICS
      # ============================================================
      - name: "📊 Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloader-diagnostics-${{ github.run_number }}
          path: |
            work/logs/
            work/results/
            work/failed/
            work/jobs.tsv
            output/FAILED-DOWNLOADS-*.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      # ============================================================
      # 18. GOOGLE DRIVE UPLOAD (RESUMABLE CHUNKS)
      # ============================================================
      - name: "☁️ Upload to Google Drive"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'drive'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_NAME: "github-actions"
        run: |
          set -Eeuo pipefail

          if [ -z "$GOOGLE_CLIENT_ID" ] ||
             [ -z "$GOOGLE_CLIENT_SECRET" ] ||
             [ -z "$GOOGLE_REFRESH_TOKEN" ]; then
            echo "❌ Google Drive credentials are missing in secrets."
            exit 1
          fi

          token_json="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --request POST \
              https://oauth2.googleapis.com/token \
              --data-urlencode "client_id=${GOOGLE_CLIENT_ID}" \
              --data-urlencode "client_secret=${GOOGLE_CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${GOOGLE_REFRESH_TOKEN}" \
              --data-urlencode "grant_type=refresh_token"
          )"

          access_token="$(jq -r '.access_token // empty' <<< "$token_json")"

          if [ -z "$access_token" ]; then
            echo "❌ Could not obtain Google Drive access token."
            exit 1
          fi

          query="mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false"

          folder_response="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --get \
              https://www.googleapis.com/drive/v3/files \
              -H "Authorization: Bearer ${access_token}" \
              --data-urlencode "q=${query}" \
              --data-urlencode "fields=files(id,name)"
          )"

          folder_id="$(jq -r '.files[0].id // empty' <<< "$folder_response")"

          if [ -z "$folder_id" ]; then
            body="$(
              jq -n \
                --arg name "$DRIVE_FOLDER_NAME" \
                '{
                  name: $name,
                  mimeType: "application/vnd.google-apps.folder"
                }'
            )"

            folder_id="$(
              curl \
                --silent \
                --show-error \
                --fail \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                --request POST \
                https://www.googleapis.com/drive/v3/files \
                -H "Authorization: Bearer ${access_token}" \
                -H "Content-Type: application/json" \
                --data "$body" |
              jq -r '.id // empty'
            )"
          fi

          if [ -z "$folder_id" ]; then
            echo "❌ Could not locate or create Drive folder."
            exit 1
          fi

          upload_file() {
            local file="$1"
            local name size
            name="$(basename "$file")"
            size="$(stat -c%s "$file")"

            echo "⬆️ Uploading: $name ($size bytes)"

            local headers="$(mktemp)"
            local metadata="$(
              jq -n \
                --arg name "$name" \
                --arg folder "$folder_id" \
                '{
                  name: $name,
                  parents: [$folder]
                }'
            )"

            if ! curl \
              --silent \
              --show-error \
              --request POST \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              -D "$headers" \
              -o /dev/null \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: application/octet-stream" \
              -H "X-Upload-Content-Length: ${size}" \
              --data "$metadata" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable"; then
              rm -f "$headers"
              return 1
            fi

            local session_uri="$(
              awk '
                BEGIN { IGNORECASE=1 }
                /^location:/ {
                  sub(/\r$/, "")
                  sub(/^[^:]*:[[:space:]]*/, "")
                  print
                  exit
                }
              ' "$headers"
            )"
            rm -f "$headers"

            if [ -z "$session_uri" ]; then
              echo "❌ Could not initialize resumable Drive session."
              return 1
            fi

            local offset=0
            while [ "$offset" -lt "$size" ]; do
              local remaining=$((size - offset))
              local length="$DRIVE_CHUNK_SIZE"
              [ "$remaining" -lt "$length" ] && length="$remaining"

              local end=$((offset + length - 1))
              local chunk="$(mktemp)"

              dd if="$file" of="$chunk" iflag=skip_bytes,count_bytes \
                skip="$offset" count="$length" status=none

              local chunk_done="false"
              for attempt in 1 2 3 4 5; do
                local response="$(mktemp)"
                local response_headers="$(mktemp)"

                local code="$(
                  curl \
                    --silent \
                    --show-error \
                    --request PUT \
                    -D "$response_headers" \
                    -o "$response" \
                    --write-out '%{http_code}' \
                    -H "Authorization: Bearer ${access_token}" \
                    -H "Content-Type: application/octet-stream" \
                    -H "Content-Length: ${length}" \
                    -H "Content-Range: bytes ${offset}-${end}/${size}" \
                    --data-binary "@${chunk}" \
                    "$session_uri"
                )"

                case "$code" in
                  200|201)
                    offset="$size"
                    chunk_done="true"
                    ;;
                  308)
                    local range="$(
                      awk '
                        BEGIN { IGNORECASE=1 }
                        /^Range:/ { sub(/\r$/, ""); print }
                      ' "$response_headers"
                    )"

                    if [[ "$range" =~ bytes=0-([0-9]+) ]]; then
                      offset=$((BASH_REMATCH[1] + 1))
                    else
                      offset=$((end + 1))
                    fi
                    chunk_done="true"
                    ;;
                  429|500|502|503|504)
                    local delay=$((2 ** attempt))
                    [ "$delay" -gt 30 ] && delay=30
                    echo "⚠️ Drive HTTP $code; retrying in ${delay}s..."
                    sleep "$delay"
                    ;;
                  *)
                    echo "❌ Drive upload chunk error: HTTP $code"
                    cat "$response" 2>/dev/null || true
                    rm -f "$response" "$response_headers" "$chunk"
                    return 1
                    ;;
                esac

                rm -f "$response" "$response_headers"
                [ "$offset" -ge "$size" ] || [ "$chunk_done" = "true" ] && break
              done

              rm -f "$chunk"
              if [ "$offset" -lt "$size" ] && [ "$chunk_done" != "true" ]; then
                echo "❌ Resumable upload chunk failed."
                return 1
              fi

              local percent=$((offset * 100 / size))
              echo "   Progress: ${percent}% (${offset}/${size} bytes)"
            done

            echo "✅ Uploaded: $name"
          }

          for file in output/*; do
            [ -f "$file" ] || continue
            case "$(basename "$file")" in
              *.zip|*.z[0-9][0-9]|FAILED-DOWNLOADS-*.txt|*.*)
                upload_file "$file"
                ;;
            esac
          done

          echo "✅ Google Drive upload complete."

      # ============================================================
      # 19. REPOSITORY UPLOAD
      # ============================================================
      - name: "📤 Upload to repository"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'repo'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

          git add output/

          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit."
            exit 0
          fi

          git commit -m "Add downloaded YouTube files [skip ci]"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5..."
            if git pull --rebase --autostash origin "$BRANCH_NAME" &&
               git push origin "$BRANCH_NAME"; then
              echo "✅ Repository push succeeded."
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "❌ Repository push failed."
          exit 1

      # ============================================================
      # 20. GITHUB RELEASE
      # ============================================================
      - name: "🏷️ Create GitHub Release"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPN_INPUT: ${{ inputs.vpn_enabled }}
        run: |
          set -Eeuo pipefail

          tag="youtube-${RUN_SUFFIX}"
          total="$(jq -s 'length' work/results/*.json 2>/dev/null || echo 0)"
          success="$(jq -s '[.[] | select(.status == "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          failed="$(jq -s '[.[] | select(.status != "success")] | length' work/results/*.json 2>/dev/null || echo 0)"

          {
            echo "# 🎬 YouTube Downloader Release"
            echo
            echo "Requested URLs: ${total}"
            echo "Successful: ${success}"
            echo "Failed: ${failed}"
            echo "VPN Protected: ${VPN_INPUT}"
          } > work/release-notes.md

          mapfile -t assets < <(
            find output \
              -maxdepth 1 \
              -type f \
              \( \
                -name '*.zip' \
                -o -name '*.z[0-9][0-9]' \
                -o -name 'FAILED-DOWNLOADS-*.txt' \
              \) \
              -print |
            sort
          )

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "❌ No release assets found."
            exit 1
          fi

          gh release create \
            "$tag" \
            "${assets[@]}" \
            --title "YouTube Download ${RUN_SUFFIX}" \
            --notes-file work/release-notes.md \
            --target "$GITHUB_SHA"

          echo "✅ Release created."

      # ============================================================
      # 21. FINAL STATUS
      # ============================================================
      - name: "✅ Final status"
        if: always()
        env:
          FAIL_ON_PARTIAL: ${{ inputs.fail_on_partial }}
        run: |
          set -Eeuo pipefail

          total="$(jq -s 'length' work/results/*.json 2>/dev/null || echo 0)"
          success="$(jq -s '[.[] | select(.status == "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          failed="$(jq -s '[.[] | select(.status != "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          file_count="${{ steps.collect.outputs.FINAL_FILE_COUNT || 0 }}"

          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                     🎬 FINAL RESULT                        ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf '║ Requested URLs : %-43s ║\n' "$total"
          printf '║ Successful     : %-43s ║\n' "$success"
          printf '║ Failed         : %-43s ║\n' "$failed"
          printf '║ Media Saved    : %-43s ║\n' "$file_count"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo

          if [ "$success" -eq 0 ]; then
            echo "❌ No URLs completed successfully."
            exit 1
          fi

          if [ "$failed" -gt 0 ] && [ "$FAIL_ON_PARTIAL" = "true" ]; then
            echo "❌ Partial failures encountered with fail_on_partial=true."
            exit 1
          fi

          if [ "$failed" -gt 0 ]; then
            echo "⚠️ Partial downloads accepted."
          else
            echo "✅ All downloads completed successfully."
          fi

      # ============================================================
      # 22. CLEANUP
      # ============================================================
      - name: "🧹 Cleanup"
        if: always()
        run: |
          set +e

          docker rm -f bgutil-provider >/dev/null 2>&1 || true
          sudo killall openvpn >/dev/null 2>&1 || true
          sudo wg-quick down wg0 >/dev/null 2>&1 || true

          rm -f \
            /tmp/wg0.conf \
            /tmp/client.ovpn \
            /tmp/ovpn-auth.txt \
            /tmp/openvpn.log \
            /tmp/youtube-cookies.txt \
            /tmp/terminal.lock 2>/dev/null || true

          echo "✅ Cleanup complete."
