name: "soundcloud-downloader"

on:
  workflow_dispatch:
    inputs:
      urls:
        description: >
          Enter one or more SoundCloud URLs (track, set, playlist).
          Separate by commas, spaces, or newlines.
        required: true
        type: string
      output_format:
        description: "Output Format"
        required: true
        type: choice
        options:
          - mp3
          - flac
          - ogg
          - opus
          - m4a
          - wav
        default: mp3
      audio_quality:
        description: "Audio Quality"
        required: true
        type: choice
        options:
          - 128k
          - 192k
          - 256k
          - 320k
        default: 320k
      upload_method:
        description: 'Upload destination'
        required: true
        type: choice
        options:
          - repo
          - release
          - drive
        default: repo

permissions:
  contents: write

jobs:
  music-download:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        shell: bash
        run: |
          set -e
          echo "::group::System packages"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl jq zip python3 python3-pip
          echo "::endgroup::"

          echo "::group::Python tools"
          pip3 install --quiet --upgrade pip
          pip3 install --quiet --upgrade yt-dlp
          echo "::endgroup::"

          echo "::group::Versions"
          ffmpeg -version 2>&1 | head -n1
          python3 --version
          yt-dlp --version
          echo "::endgroup::"

      - name: Create Music Folder
        run: mkdir -p music

      - name: Parse and Filter SoundCloud URLs
        id: parse
        shell: bash
        run: |
          RAW="${{ github.event.inputs.urls }}"
          URLS=$(echo "$RAW" | tr ',' ' ' | tr '\n' ' ' | tr -s ' ' | sed 's/^ *//;s/ *$//')

          if [ -z "$URLS" ]; then
            echo "::error::No URLs provided."
            exit 1
          fi

          rm -f soundcloud_urls.txt

          for url in $URLS; do
            if [[ "$url" == *soundcloud.com* ]]; then
              echo "$url" >> soundcloud_urls.txt
            else
              echo "::warning::Skipping non-SoundCloud URL: $url"
            fi
          done

          echo "::group::SoundCloud URLs to download"
          cat soundcloud_urls.txt 2>/dev/null || echo "(none)"
          echo "::endgroup::"

          if [ -s soundcloud_urls.txt ]; then
            echo "HAS_SOUNDCLOUD=true" >> $GITHUB_OUTPUT
          else
            echo "::error::No valid SoundCloud URLs found."
            echo "HAS_SOUNDCLOUD=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Download SoundCloud
        if: steps.parse.outputs.HAS_SOUNDCLOUD == 'true'
        shell: bash
        run: |
          FORMAT="${{ github.event.inputs.output_format }}"
          QUALITY="${{ github.event.inputs.audio_quality }}"
          FAILED="failed_urls.txt"
          rm -f "$FAILED"

          echo "::group::SoundCloud download config"
          echo "Format : $FORMAT"
          echo "Quality: $QUALITY"
          echo "Folder : music/"
          echo "Options: embed thumbnail + ID3 tags"
          echo "::endgroup::"

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "::group::Downloading: $url"
            if yt-dlp \
              -x \
              --audio-format "$FORMAT" \
              --audio-quality "$QUALITY" \
              --embed-thumbnail \
              --embed-metadata \
              -o "music/%(artist)s - %(title)s.%(ext)s" \
              "$url"; then
              echo "✓ Success"
            else
              echo "✗ Failed – recording URL"
              echo "$url" >> "$FAILED"
            fi
            echo "::endgroup::"
          done < soundcloud_urls.txt

          echo "::group::SoundCloud summary"
          ls -lh music/ 2>/dev/null || echo "No files"
          if [ -f "$FAILED" ]; then
            echo "::warning::Some downloads failed (see below)"
            cat "$FAILED"
          else
            echo "All downloads succeeded."
          fi
          echo "::endgroup::"

      - name: Collect Failed URLs
        if: always()
        shell: bash
        run: |
          if [ -f failed_urls.txt ] && [ -s failed_urls.txt ]; then
            echo "::warning::Some downloads failed. Adding failed_downloads.txt to the archive."
            cp failed_urls.txt music/failed_downloads.txt
          else
            echo "No failed downloads – no fail log needed."
          fi

      - name: Validate Download
        shell: bash
        run: |
          SONG_COUNT=$(find music -type f ! -name 'failed_downloads.txt' | wc -l)
          if [ "$SONG_COUNT" -eq 0 ]; then
            echo "::error::No audio files were downloaded. Exiting."
            exit 1
          fi
          echo "Total songs downloaded: $SONG_COUNT"
          ls -lh music/

      - name: Archive Music Folder
        id: archive
        shell: bash
        run: |
          UPLOAD_METHOD="${{ inputs.upload_method }}"

          if [ "$UPLOAD_METHOD" = "repo" ]; then
            METHOD="split_push"
          else
            METHOD="release"
          fi

          RANDOM_STR=$(python3 -c "import random, string; print(''.join(random.choices(string.ascii_lowercase + string.digits, k=5)))")
          BASE_NAME="soundcloud-${RANDOM_STR}"
          ZIP_NAME="${BASE_NAME}.zip"

          echo "Upload method: $METHOD"

          rm -rf music_archive
          mkdir -p music_archive

          cd music || exit 1

          if [ "$METHOD" = "release" ]; then
            echo "Creating unsplit ZIP (will split only if > 1950 MiB)"
            zip -r "../music_archive/${ZIP_NAME}" .
            FULLZIP="../music_archive/${ZIP_NAME}"
            SIZE=$(stat -c%s "$FULLZIP" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 2044723200 ]; then
              echo "ZIP larger than 1950 MiB, splitting into 1950M parts"
              rm "$FULLZIP"
              zip -r -s 1950m "../music_archive/${ZIP_NAME}" .
            fi
          else
            echo "Creating split ZIP (99 MB parts)"
            zip -r -s 99m "../music_archive/${ZIP_NAME}" .
          fi
          cd ..

          rm -rf music/*
          mv music_archive/* music/
          rmdir music_archive 2>/dev/null || true

          ls -lh music/
          ls -1 music > music_assets.txt
          echo "Assets list:"
          cat music_assets.txt

      - name: "Upload to Google Drive"
        if: inputs.upload_method == 'drive'
        env:
          CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          # (same Google Drive upload logic, using the music/ directory)
          ...

      - name: Upload to repository (split_push method)
        if: ${{ inputs.upload_method == 'repo' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # (unchanged)
          ...

      - name: Create Release and upload assets (release method)
        if: ${{ inputs.upload_method == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # (unchanged)
          ...

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf music release_files soundcloud_urls.txt failed_urls.txt music_assets.txt *.zip 2>/dev/null || true