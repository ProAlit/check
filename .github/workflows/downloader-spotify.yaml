name: downloader-spotify

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "🎵 Spotify/Tidal/Apple Music/SoundCloud/YouTube/Pandora URLs"
        required: true
        type: string

      output_format:
        description: "🎧 Output format"
        required: true
        type: choice
        options:
          - mp3
          - flac
          - m4a
          - ogg
          - opus
          - wav
        default: mp3

      audio_quality:
        description: "🎚️ Audio quality / bitrate"
        required: true
        type: choice
        options:
          - 320k
          - 256k
          - 192k
          - 128k
          - LOSSLESS
          - HI_RES_LOSSLESS
          - HIGH
          - LOW
        default: 320k

      upload_method:
        description: "☁️ Upload destination"
        required: true
        type: choice
        options:
          - drive
          - repo
          - release
        default: drive

      bundle_all:
        description: "📦 Bundle all tracks into one ZIP?"
        required: true
        type: boolean
        default: true

      vpn_enabled:
        description: "🔒 Enable WireGuard VPN?"
        required: true
        type: boolean
        default: false

      use_custom_credentials:
        description: "🔑 Use custom Spotify credentials?"
        required: true
        type: boolean
        default: false

      concurrent_downloads:
        description: "⚡ Concurrent URL workers"
        required: true
        type: number
        default: 2

      retry_count:
        description: "🔄 Transient retries per provider"
        required: true
        type: number
        default: 3

      raw_logs:
        description: "🧪 Show raw spotDL/yt-dlp logs?"
        required: true
        type: boolean
        default: false

      fail_on_partial:
        description: "❌ Fail workflow if any URL fails?"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: music-downloader-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  POT_SERVER_PORT: "4416"
  DEFAULT_PARALLEL: "2"
  DEFAULT_RETRIES: "3"
  SPOTDL_THREADS: "3"

  YTDLP_RETRIES: "8"
  YTDLP_FRAGMENT_RETRIES: "8"
  YTDLP_EXTRACTOR_RETRIES: "5"
  YTDLP_FILE_ACCESS_RETRIES: "5"
  YTDLP_SOCKET_TIMEOUT: "30"
  YTDLP_CONCURRENT_FRAGMENTS: "3"

  DRIVE_CHUNK_SIZE: "16777216"

jobs:
  music-download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      # ============================================================
      # 01. CHECKOUT
      # ============================================================

      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      # ============================================================
      # 02. SYSTEM DEPENDENCIES
      # ============================================================

      - name: "🛠️ Install system dependencies"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            ffmpeg \
            curl \
            jq \
            zip \
            unzip \
            aria2 \
            wireguard-tools \
            openssl

          echo "✅ System dependencies installed."

      # ============================================================
      # 03. DENO
      # ============================================================

      - name: "🦕 Install latest Deno"
        run: |
          set -Eeuo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            https://deno.land/install.sh \
            | sh -s -- -y

          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.deno/bin:$PATH"

          deno --version

      # ============================================================
      # 04. PYTHON PACKAGES
      # ============================================================

      - name: "📦 Install latest downloader packages"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -Eeuo pipefail

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            pip \
            setuptools \
            wheel

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            spotdl

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            "yt-dlp[default]"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            yt-dlp-ejs

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            bgutil-ytdlp-pot-provider

      # ============================================================
      # 05. TOOLCHAIN
      # ============================================================

      - name: "🔎 Show installed versions"
        run: |
          set -Eeuo pipefail

          echo "Python : $(python --version 2>&1)"
          echo "spotDL : $(spotdl --version 2>&1 || true)"
          echo "yt-dlp : $(yt-dlp --version)"
          echo "Deno   : $(deno --version | sed -n '1p')"
          echo "FFmpeg : $(ffmpeg -version | sed -n '1p')"
          echo "FFprobe: $(ffprobe -version | sed -n '1p')"

          echo
          python -m pip list |
            grep -Ei \
              'spotdl|yt-dlp|bgutil|ejs|spotipy|mutagen|rapidfuzz' \
            || true

      # ============================================================
      # 06. WORKSPACE
      # ============================================================

      - name: "📁 Initialize workspace"
        run: |
          set -Eeuo pipefail

          rm -rf work music

          mkdir -p \
            work/downloads \
            work/logs \
            work/results \
            work/failed \
            work/archive \
            work/package \
            music

          echo "✅ Workspace initialized."

      # ============================================================
      # 07. PARSE URLs
      # ============================================================

      - name: "🔗 Parse and classify URLs"
        env:
          RAW_URLS: ${{ inputs.urls }}
        run: |
          set -Eeuo pipefail

          : > work/input_urls.txt
          : > work/jobs.tsv

          printf '%s\n' "$RAW_URLS" |
            tr ',' '\n' |
            sed 's/\r//g' |
            awk '{
              for (i = 1; i <= NF; i++) {
                print $i
              }
            }' |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
            awk 'NF' |
            sort -u \
            > work/input_urls.txt

          if [ ! -s work/input_urls.txt ]; then
            echo "❌ No URLs supplied."
            exit 1
          fi

          index=0

          while IFS= read -r url; do
            index=$((index + 1))
            type=""

            if [[ "$url" =~ ^https?://(open\.)?spotify\.com/ ]]; then
              type="spotify"
            elif [[ "$url" =~ ^https?://(www\.)?youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://music\.youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://youtu\.be/ ]]; then
              type="youtube"
            elif [[ "$url" =~ ^https?://(www\.)?soundcloud\.com/ ]]; then
              type="soundcloud"
            elif [[ "$url" =~ ^https?://(www\.)?tidal\.com/ ]] ||
                 [[ "$url" =~ ^https?://listen\.tidal\.com/ ]]; then
              type="tidal"
            elif [[ "$url" =~ ^https?://(www\.)?music\.apple\.com/ ]]; then
              type="apple"
            elif [[ "$url" =~ ^https?://(www\.)?pandora\.com/ ]] ||
                 [[ "$url" =~ ^https?://pandora\.app\.link/ ]]; then
              type="pandora"
            fi

            if [ -z "$type" ]; then
              echo "⚠️ Unsupported URL skipped: $url"
              continue
            fi

            printf '%04d\t%s\t%s\n' \
              "$index" \
              "$type" \
              "$url" \
              >> work/jobs.tsv
          done < work/input_urls.txt

          if [ ! -s work/jobs.tsv ]; then
            echo "❌ No supported URLs found."
            exit 1
          fi

          echo
          echo "Accepted URLs: $(wc -l < work/jobs.tsv)"
          cat work/jobs.tsv

      # ============================================================
      # 08. OPTIONAL WIREGUARD (DOWNLOAD-ONLY ROUTING)
      # ============================================================

      - name: "🔒 Configure WireGuard"
        id: vpn
        env:
          VPN_ENABLED: ${{ inputs.vpn_enabled }}
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          set -Eeuo pipefail

          if [ "$VPN_ENABLED" != "true" ]; then
            echo "🚫 VPN disabled."
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$WG_CONFIG" ]; then
            echo "⚠️ VPN requested but WG_CONFIG is empty."
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          umask 077

          printf '%s\n' "$WG_CONFIG" > /tmp/wg0.conf

          vpn_user="vpn-download"

          sudo useradd \
            --create-home \
            --shell /usr/sbin/nologin \
            "$vpn_user" \
            2>/dev/null \
            || true

          vpn_uid="$(id -u "$vpn_user")"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔒 Configuring WireGuard for download traffic only"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # ============================================================
          # EXTRACT INTERFACE ADDRESSES
          # ============================================================

          ipv4_addresses="$(
            awk '
              BEGIN { IGNORECASE=1 }

              /^[[:space:]]*Address[[:space:]]*=/ {
                value=$0
                sub(/^[^=]*=/, "", value)
                gsub(/[[:space:]]/, "", value)

                n=split(value, a, ",")

                for (i=1; i<=n; i++) {
                  if (a[i] ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+$/) {
                    print a[i]
                  }
                }
              }
            ' /tmp/wg0.conf
          )"

          ipv6_addresses="$(
            awk '
              BEGIN { IGNORECASE=1 }

              /^[[:space:]]*Address[[:space:]]*=/ {
                value=$0
                sub(/^[^=]*=/, "", value)
                gsub(/[[:space:]]/, "", value)

                n=split(value, a, ",")

                for (i=1; i<=n; i++) {
                  if (a[i] ~ /:/) {
                    print a[i]
                  }
                }
              }
            ' /tmp/wg0.conf
          )"

          # ============================================================
          # CREATE PURE `wg` CONFIG
          #
          # Remove wg-quick-only directives.
          # ============================================================

          awk '
            BEGIN {
              IGNORECASE=1
            }

            /^[[:space:]]*Address[[:space:]]*=/       { next }
            /^[[:space:]]*DNS[[:space:]]*=/           { next }
            /^[[:space:]]*Table[[:space:]]*=/         { next }
            /^[[:space:]]*MTU[[:space:]]*=/           { next }
            /^[[:space:]]*PreUp[[:space:]]*=/         { next }
            /^[[:space:]]*PreDown[[:space:]]*=/       { next }
            /^[[:space:]]*PostUp[[:space:]]*=/        { next }
            /^[[:space:]]*PostDown[[:space:]]*=/      { next }
            /^[[:space:]]*SaveConfig[[:space:]]*=/    { next }

            { print }
          ' /tmp/wg0.conf > /tmp/wg0-wg.conf

          echo
          echo "📄 WireGuard configuration passed to wg:"
          sed \
            -E \
            's/(PrivateKey[[:space:]]*=[[:space:]]*).*/\1[REDACTED]/' \
            /tmp/wg0-wg.conf

          # ============================================================
          # DETECT FULL-TUNNEL ROUTES
          # ============================================================

          has_ipv4_default="false"
          has_ipv6_default="false"

          if grep -Eiq \
            '^[[:space:]]*AllowedIPs[[:space:]]*=.*0\.0\.0\.0/0' \
            /tmp/wg0.conf; then

            has_ipv4_default="true"

          fi

          if grep -Eiq \
            '^[[:space:]]*AllowedIPs[[:space:]]*=.*::/0' \
            /tmp/wg0.conf; then

            has_ipv6_default="true"

          fi

          echo
          echo "Detected IPv4 default route: $has_ipv4_default"
          echo "Detected IPv6 default route: $has_ipv6_default"

          # ============================================================
          # REMOVE OLD INTERFACE
          # ============================================================

          sudo ip link delete wg0 \
            2>/dev/null \
            || true

          # ============================================================
          # CREATE WIREGUARD INTERFACE
          # ============================================================

          echo
          echo "🔧 Creating wg0..."

          sudo ip link add \
            wg0 \
            type wireguard

          echo "🔧 Applying WireGuard configuration..."

          sudo wg setconf \
            wg0 \
            /tmp/wg0-wg.conf

          # ============================================================
          # ADD IPv4 ADDRESSES
          # ============================================================

          if [ -n "$ipv4_addresses" ]; then

            while IFS= read -r address; do

              [ -n "$address" ] || continue

              echo "➕ IPv4 address: $address"

              sudo ip -4 address add \
                "$address" \
                dev wg0

            done <<< "$ipv4_addresses"

          fi

          # ============================================================
          # ADD IPv6 ADDRESSES
          # ============================================================

          if [ -n "$ipv6_addresses" ]; then

            while IFS= read -r address; do

              [ -n "$address" ] || continue

              echo "➕ IPv6 address: $address"

              sudo ip -6 address add \
                "$address" \
                dev wg0

            done <<< "$ipv6_addresses"

          fi

          # ============================================================
          # BRING INTERFACE UP
          # ============================================================

          sudo ip link set \
            wg0 \
            up

          # ============================================================
          # IPV4 POLICY ROUTING
          #
          # Only vpn-download uses table 51820.
          # GitHub Actions remains on the normal routing table.
          # ============================================================

          if [ "$has_ipv4_default" = "true" ]; then

            echo
            echo "🌐 Configuring IPv4 VPN routing..."

            sudo ip route flush table 51820 \
              2>/dev/null \
              || true

            sudo ip route add \
              default \
              dev wg0 \
              table 51820

            sudo ip rule del \
              uidrange "${vpn_uid}-${vpn_uid}" \
              lookup 51820 \
              priority 10020 \
              2>/dev/null \
              || true

            sudo ip rule add \
              uidrange "${vpn_uid}-${vpn_uid}" \
              lookup 51820 \
              priority 10020

          fi

          # ============================================================
          # IPV6 POLICY ROUTING
          # ============================================================

          if [ "$has_ipv6_default" = "true" ]; then

            echo
            echo "🌐 Configuring IPv6 VPN routing..."

            sudo ip -6 route flush table 51821 \
              2>/dev/null \
              || true

            sudo ip -6 route add \
              default \
              dev wg0 \
              table 51821

            sudo ip -6 rule del \
              uidrange "${vpn_uid}-${vpn_uid}" \
              lookup 51821 \
              priority 10021 \
              2>/dev/null \
              || true

            sudo ip -6 rule add \
              uidrange "${vpn_uid}-${vpn_uid}" \
              lookup 51821 \
              priority 10021

          fi

          # ============================================================
          # SHOW ROUTING
          # ============================================================

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔗 WireGuard status"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          sudo wg show wg0

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🛣️ VPN routing"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$has_ipv4_default" = "true" ]; then

            echo
            echo "IPv4 table 51820:"
            sudo ip route show table 51820

            echo
            echo "IPv4 policy rules:"
            sudo ip rule show

          fi

          if [ "$has_ipv6_default" = "true" ]; then

            echo
            echo "IPv6 table 51821:"
            sudo ip -6 route show table 51821

            echo
            echo "IPv6 policy rules:"
            sudo ip -6 rule show

          fi

          # ============================================================
          # WORKSPACE OWNERSHIP
          # ============================================================

          sudo chown \
            -R \
            "${vpn_user}:${vpn_user}" \
            work

          # ============================================================
          # ROUTE VERIFICATION
          # ============================================================

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧪 Route verification"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$has_ipv4_default" = "true" ]; then

            echo
            echo "VPN-user IPv4 route to 1.1.1.1:"

            sudo ip route get \
              1.1.1.1 \
              uid "$vpn_uid"

          fi

          # ============================================================
          # NORMAL RUNNER TEST
          #
          # IMPORTANT: use -4, NOT --4.
          # ============================================================

          echo
          echo "🧪 Testing normal runner connection..."

          runner_ip="$(
            curl \
              -4 \
              --silent \
              --show-error \
              --max-time 15 \
              https://api.ipify.org \
            || echo "unavailable"
          )"

          echo "🌐 Runner/public IPv4: $runner_ip"

          if [ "$runner_ip" = "unavailable" ]; then
            echo "⚠️ Normal runner IPv4 test failed."
          fi

          # ============================================================
          # VPN-USER TEST
          #
          # IMPORTANT: use -4, NOT --4.
          # ============================================================

          echo
          echo "🧪 Testing VPN downloader connection..."

          vpn_ip="$(
            sudo \
              -u "$vpn_user" \
              -H \
              curl \
                -4 \
                --silent \
                --show-error \
                --max-time 20 \
                https://api.ipify.org \
            || echo "unavailable"
          )"

          echo "🌐 VPN downloader IPv4: $vpn_ip"

          if [ "$vpn_ip" = "unavailable" ]; then
            echo
            echo "❌ VPN downloader cannot reach the internet."
            echo
            echo "Debugging information:"
            sudo ip route get 1.1.1.1 uid "$vpn_uid" || true
            sudo ip route show table 51820 || true
            sudo wg show wg0 || true
            exit 1
          fi

          echo
          echo "✅ WireGuard connected successfully."
          echo "✅ GitHub runner traffic remains on the normal route."
          echo "✅ vpn-download traffic uses WireGuard."

          echo "vpn_user=$vpn_user" >> "$GITHUB_OUTPUT"
          echo "vpn_uid=$vpn_uid" >> "$GITHUB_OUTPUT"
          echo "vpn_available=true" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 09. BGUTIL PO TOKEN
      # ============================================================

      - name: "🛡️ Start bgutil PO-token provider"
        id: pot
        run: |
          set -Eeuo pipefail

          image="brainicism/bgutil-ytdlp-pot-provider:latest"

          docker rm -f bgutil-provider \
            >/dev/null 2>&1 \
            || true

          echo "🐳 Pulling $image"

          if ! docker pull "$image"; then
            echo "⚠️ Failed to pull bgutil."
            echo "pot_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker run \
            --name bgutil-provider \
            --detach \
            --init \
            --network host \
            "$image"

          ready="false"

          echo "⏳ Waiting for bgutil..."

          for attempt in $(seq 1 40); do
            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 3 \
              "http://127.0.0.1:${POT_SERVER_PORT}/ping" \
              >/tmp/bgutil-ping.json \
              2>/dev/null; then

              ready="true"
              break
            fi

            sleep 2
          done

          if [ "$ready" = "true" ]; then
            echo "✅ bgutil ready."
            echo "pot_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ bgutil failed health check."

            docker logs bgutil-provider \
              > work/logs/bgutil-provider.log \
              2>&1 \
              || true

            echo "pot_available=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # 10. DOWNLOAD ENGINE
      # ============================================================

      - name: "⬇️ Download media"
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_MUSIC_COOKIES: ${{ secrets.YOUTUBE_MUSIC_COOKIES }}

          USE_CUSTOM_CREDENTIALS: ${{ inputs.use_custom_credentials }}

          OUTPUT_FORMAT: ${{ inputs.output_format }}
          AUDIO_QUALITY: ${{ inputs.audio_quality }}

          CONCURRENT_WORKERS: ${{ inputs.concurrent_downloads }}
          RETRY_COUNT: ${{ inputs.retry_count }}

          RAW_LOGS: ${{ inputs.raw_logs }}

          POT_AVAILABLE: ${{ steps.pot.outputs.pot_available }}
          VPN_AVAILABLE: ${{ steps.vpn.outputs.vpn_available }}
          VPN_USER: ${{ steps.vpn.outputs.vpn_user }}

        run: |
          set -Eeuo pipefail

          FORMAT="$OUTPUT_FORMAT"
          QUALITY="$AUDIO_QUALITY"
          WORKERS="$CONCURRENT_WORKERS"
          RETRIES="$RETRY_COUNT"

          if ! [[ "$WORKERS" =~ ^[1-8]$ ]]; then
            WORKERS="$DEFAULT_PARALLEL"
          fi

          if ! [[ "$RETRIES" =~ ^[1-6]$ ]]; then
            RETRIES="$DEFAULT_RETRIES"
          fi

          case "$QUALITY" in
            320k|256k|192k|128k)
              BITRATE="$QUALITY"
              ;;
            HIGH)
              BITRATE="320k"
              ;;
            LOW)
              BITRATE="128k"
              ;;
            LOSSLESS|HI_RES_LOSSLESS)
              if [ "$FORMAT" = "flac" ] || [ "$FORMAT" = "wav" ]; then
                BITRATE="disable"
              else
                BITRATE="320k"
              fi
              ;;
            *)
              BITRATE="320k"
              ;;
          esac

          COOKIE_YT=""
          COOKIE_YTM=""

          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/youtube-cookies.txt
            chmod 600 /tmp/youtube-cookies.txt
            if [ "$VPN_AVAILABLE" = "true" ]; then
              sudo chown "$VPN_USER:$VPN_USER" /tmp/youtube-cookies.txt
            fi
            COOKIE_YT="/tmp/youtube-cookies.txt"
          fi

          if [ -n "$YOUTUBE_MUSIC_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_MUSIC_COOKIES" > /tmp/youtube-music-cookies.txt
            chmod 600 /tmp/youtube-music-cookies.txt
            if [ "$VPN_AVAILABLE" = "true" ]; then
              sudo chown "$VPN_USER:$VPN_USER" /tmp/youtube-music-cookies.txt
            fi
            COOKIE_YTM="/tmp/youtube-music-cookies.txt"
          fi

          now() {
            date '+%H:%M:%S'
          }

          log() {
            local level="$1"
            local id="$2"
            local message="$3"
            local icon="•"

            case "$level" in
              START) icon="▶" ;;
              SEARCH) icon="🔎" ;;
              AUTH) icon="🔐" ;;
              PROVIDER) icon="🔌" ;;
              RETRY) icon="↻" ;;
              FALLBACK) icon="↪" ;;
              DOWNLOAD) icon="⬇" ;;
              VERIFY) icon="✓" ;;
              SUCCESS) icon="✅" ;;
              WARN) icon="⚠" ;;
              ERROR) icon="✖" ;;
              FAILED) icon="❌" ;;
              DONE) icon="◆" ;;
            esac

            printf \
              '[%s] %-9s #%04d │ %s %s\n' \
              "$(now)" \
              "$level" \
              "$id" \
              "$icon" \
              "$message"
          }

          has_audio() {
            local dir="$1"

            find "$dir" \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
                -o -iname '*.webm' \
                -o -iname '*.aac' \
              \) \
              -print -quit |
              grep -q .
          }

          classify_error() {
            local logfile="$1"

            if grep -qiE \
              'invalid choice:|unrecognized arguments|no such option|usage: spotdl|argument .* error' \
              "$logfile"; then
              echo "CONFIGURATION"
              return
            fi

            if grep -qiE \
              'No results found for song:|no usable provider result|no provider result|no results found|returned no usable results|could not find|unable to find|no matches|no match' \
              "$logfile"; then
              echo "NO_RESULT"
              return
            fi

            if grep -qiE \
              '429|Too Many Requests|rate.?limit' \
              "$logfile"; then
              echo "RATE_LIMIT"
              return
            fi

            if grep -qiE \
              'not a bot|confirm you.re not a bot|captcha|bot detection' \
              "$logfile"; then
              echo "BLOCKED"
              return
            fi

            if grep -qiE \
              'HTTP Error 403|HTTP 403|Forbidden' \
              "$logfile"; then
              echo "FORBIDDEN"
              return
            fi

            if grep -qiE \
              'timed out|timeout|Connection reset|Connection aborted|Temporary failure|Could not resolve|network error|Network is unreachable' \
              "$logfile"; then
              echo "NETWORK"
              return
            fi

            if grep -qiE \
              'Requested format is not available|No video formats found|No formats found' \
              "$logfile"; then
              echo "FORMAT"
              return
            fi

            echo "UNKNOWN"
          }

          detect_providers() {
            local probe
            local choices
            local help_text

            probe="$(
              spotdl download \
                --audio __invalid_provider__ \
                https://example.invalid \
                2>&1 ||
                true
            )"

            choices="$(
              printf '%s\n' "$probe" |
              grep -F 'choose from' |
              tail -n 1 ||
              true
            )"

            help_text="$(
              spotdl --help 2>&1 ||
              true
            )"

            SUPPORTED_PROVIDERS=()

            local candidates=(
              youtube-music
              youtube
              soundcloud
              bandcamp
              piped
            )

            local provider

            for provider in "${candidates[@]}"; do
              if [ -n "$choices" ]; then
                if [[ "$choices" == *"'${provider}'"* ]]; then
                  SUPPORTED_PROVIDERS+=("$provider")
                fi
              elif grep -Fq "$provider" <<< "$help_text"; then
                SUPPORTED_PROVIDERS+=("$provider")
              fi
            done

            if [ "${#SUPPORTED_PROVIDERS[@]}" -eq 0 ]; then
              echo "❌ No supported spotDL providers detected."
              echo "$probe"
              return 1
            fi
          }

          provider_supported() {
            local wanted="$1"
            local provider

            for provider in "${SUPPORTED_PROVIDERS[@]}"; do
              if [ "$provider" = "$wanted" ]; then
                return 0
              fi
            done

            return 1
          }

          provider_cookie() {
            local provider="$1"

            case "$provider" in
              youtube-music)
                if [ -n "$COOKIE_YTM" ]; then
                  printf '%s' "$COOKIE_YTM"
                elif [ -n "$COOKIE_YT" ]; then
                  printf '%s' "$COOKIE_YT"
                fi
                ;;
              youtube)
                if [ -n "$COOKIE_YT" ]; then
                  printf '%s' "$COOKIE_YT"
                elif [ -n "$COOKIE_YTM" ]; then
                  printf '%s' "$COOKIE_YTM"
                fi
                ;;
            esac
          }

          run_spotdl_provider() {
            local id="$1"
            local url="$2"
            local provider="$3"
            local attempt="$4"

            local dir="work/downloads/${id}"
            local logfile="work/logs/${id}-${provider}-attempt-${attempt}.log"

            mkdir -p "$dir/cache"

            local -a cmd=(
              spotdl
              download
              "$url"
              --audio
              "$provider"
              --format
              "$FORMAT"
              --bitrate
              "$BITRATE"
              --output
              "${dir}/{title} - {artists}.{output-ext}"
              --threads
              "$SPOTDL_THREADS"
              --max-retries
              3
              --overwrite
              skip
              --restrict
              none
              --max-filename-length
              180
              --print-errors
              --log-level
              INFO
              --cache-path
              "${dir}/cache"
              --archive
              "${dir}/archive.txt"
            )

            if [ "$RAW_LOGS" = "true" ]; then
              cmd+=(--log-level DEBUG)
            fi

            if [ "$USE_CUSTOM_CREDENTIALS" = "true" ] &&
               [ -n "$SPOTIFY_CLIENT_ID" ] &&
               [ -n "$SPOTIFY_CLIENT_SECRET" ]; then

              export SPOTIPY_CLIENT_ID="$SPOTIFY_CLIENT_ID"
              export SPOTIPY_CLIENT_SECRET="$SPOTIFY_CLIENT_SECRET"

              log AUTH "$id" "Custom Spotify credentials enabled."
            else
              unset SPOTIPY_CLIENT_ID || true
              unset SPOTIPY_CLIENT_SECRET || true

              log AUTH "$id" "Using spotDL default Spotify client."
            fi

            local cookie
            cookie="$(provider_cookie "$provider")"

            if [ -n "$cookie" ]; then
              cmd+=(
                --cookie-file
                "$cookie"
              )

              log AUTH "$id" "${provider} cookies enabled."
            fi

            local ytdlp_args

            if [ "$provider" = "youtube-music" ]; then
              ytdlp_args="
              --retries ${YTDLP_RETRIES}
              --fragment-retries ${YTDLP_FRAGMENT_RETRIES}
              --extractor-retries ${YTDLP_EXTRACTOR_RETRIES}
              --file-access-retries ${YTDLP_FILE_ACCESS_RETRIES}
              --socket-timeout ${YTDLP_SOCKET_TIMEOUT}
              --concurrent-fragments ${YTDLP_CONCURRENT_FRAGMENTS}
              --throttled-rate 100K
              --sleep-requests 1
              --extractor-args youtube:player-client=web_music,default
              --extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}
              "
            elif [ "$provider" = "youtube" ]; then
              ytdlp_args="
              --retries ${YTDLP_RETRIES}
              --fragment-retries ${YTDLP_FRAGMENT_RETRIES}
              --extractor-retries ${YTDLP_EXTRACTOR_RETRIES}
              --file-access-retries ${YTDLP_FILE_ACCESS_RETRIES}
              --socket-timeout ${YTDLP_SOCKET_TIMEOUT}
              --concurrent-fragments ${YTDLP_CONCURRENT_FRAGMENTS}
              --throttled-rate 100K
              --sleep-requests 1
              --extractor-args youtube:player-client=default,web_embedded
              --extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}
              "
            else
              ytdlp_args="
              --retries ${YTDLP_RETRIES}
              --fragment-retries ${YTDLP_FRAGMENT_RETRIES}
              --extractor-retries ${YTDLP_EXTRACTOR_RETRIES}
              --file-access-retries ${YTDLP_FILE_ACCESS_RETRIES}
              --socket-timeout ${YTDLP_SOCKET_TIMEOUT}
              --concurrent-fragments ${YTDLP_CONCURRENT_FRAGMENTS}
              --throttled-rate 100K
              --sleep-requests 1
              --extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}
              "
            fi

            if [ "$RAW_LOGS" = "true" ]; then
              ytdlp_args="${ytdlp_args} --verbose"
            fi

            cmd+=(
              --yt-dlp-args
              "$ytdlp_args"
            )

            log PROVIDER \
              "$id" \
              "${provider} | attempt ${attempt}/${RETRIES}"

            local exit_code=0

            if [ "$RAW_LOGS" = "true" ]; then
              set +e

              stdbuf -oL -eL \
                timeout 900 \
                "${cmd[@]}" \
                2>&1 |
              tee "$logfile" |
              while IFS= read -r line; do
                printf \
                  '[%s] RAW       #%04d │ %s\n' \
                  "$(now)" \
                  "$id" \
                  "$line"
              done

              exit_code="${PIPESTATUS[0]}"

              set -e
            else
              timeout 900 \
                "${cmd[@]}" \
                > "$logfile" \
                2>&1 \
                || exit_code=$?
            fi

            if [ "$exit_code" -eq 0 ] && has_audio "$dir"; then
              log VERIFY "$id" "${provider} produced usable audio."
              return 0
            fi

            return 1
          }

          run_direct_ytdlp() {
            local id="$1"
            local type="$2"
            local url="$3"

            local dir="work/downloads/${id}"
            local logfile="work/logs/${id}-direct.log"

            mkdir -p "$dir"

            local -a cmd=(
              yt-dlp
              --ignore-config
              --newline
              --continue
              --no-overwrites
              --retries
              "$YTDLP_RETRIES"
              --fragment-retries
              "$YTDLP_FRAGMENT_RETRIES"
              --extractor-retries
              "$YTDLP_EXTRACTOR_RETRIES"
              --file-access-retries
              "$YTDLP_FILE_ACCESS_RETRIES"
              --socket-timeout
              "$YTDLP_SOCKET_TIMEOUT"
              --concurrent-fragments
              "$YTDLP_CONCURRENT_FRAGMENTS"
              --throttled-rate
              100K
              --sleep-requests
              1
              --format
              "bestaudio/best"
              --output
              "${dir}/%(title)s - %(uploader)s.%(ext)s"
            )

            if [ "$type" = "youtube" ]; then
              cmd+=(
                --extractor-args
                "youtube:player-client=default,web_embedded"
              )
            else
              cmd+=(
                --extractor-args
                "youtube:player-client=default"
              )
            fi

            cmd+=(
              --extractor-args
              "youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}"
            )

            if [ "$RAW_LOGS" = "true" ]; then
              cmd+=(--verbose)
            fi

            if [ "$type" = "youtube" ]; then
              if [ -n "$COOKIE_YT" ]; then
                cmd+=(--cookies "$COOKIE_YT")
              elif [ -n "$COOKIE_YTM" ]; then
                cmd+=(--cookies "$COOKIE_YTM")
              fi

              cmd+=(--no-playlist)
            fi

            log DOWNLOAD "$id" "Direct yt-dlp strategy."

            local exit_code=0

            if [ "$RAW_LOGS" = "true" ]; then
              set +e

              stdbuf -oL -eL \
                timeout 900 \
                "${cmd[@]}" \
                2>&1 |
              tee "$logfile" |
              while IFS= read -r line; do
                printf \
                  '[%s] RAW       #%04d │ %s\n' \
                  "$(now)" \
                  "$id" \
                  "$line"
              done

              exit_code="${PIPESTATUS[0]}"

              set -e
            else
              timeout 900 \
                "${cmd[@]}" \
                > "$logfile" \
                2>&1 \
                || exit_code=$?
            fi

            if [ "$exit_code" -eq 0 ] && has_audio "$dir"; then
              log VERIFY "$id" "Direct yt-dlp produced audio."
              return 0
            fi

            return 1
          }

          write_result() {
            local id="$1"
            local type="$2"
            local url="$3"
            local status="$4"
            local provider="$5"
            local reason="$6"
            local started="$7"
            local finished="$8"

            local dir="work/downloads/${id}"

            mapfile -t output_files < <(
              find "$dir" \
                -type f \
                \( \
                  -iname '*.mp3' \
                  -o -iname '*.flac' \
                  -o -iname '*.m4a' \
                  -o -iname '*.ogg' \
                  -o -iname '*.opus' \
                  -o -iname '*.wav' \
                \) \
                -printf '%f\n' \
                2>/dev/null |
              sort
            )

            printf '%s\n' "${output_files[@]}" |
              jq -R -s \
                'split("\n") | map(select(length > 0))' \
                > "${dir}/files.json"

            jq -n \
              --arg id "$id" \
              --arg type "$type" \
              --arg url "$url" \
              --arg status "$status" \
              --arg provider "$provider" \
              --arg reason "$reason" \
              --arg started "$started" \
              --arg finished "$finished" \
              --slurpfile files "${dir}/files.json" \
              '{
                index: ($id | tonumber),
                input_type: $type,
                url: $url,
                status: $status,
                provider: $provider,
                reason: $reason,
                started_at: $started,
                finished_at: $finished,
                output_files: $files[0]
              }' \
              > "work/results/${id}.json"

            rm -f "${dir}/files.json"
          }

          process_one() {
            local id="$1"
            local type="$2"
            local url="$3"

            local dir="work/downloads/${id}"

            mkdir -p "$dir"

            local started_at
            started_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            local status="failed"
            local winner="none"
            local reason="all strategies failed"

            echo
            echo "╭──────────────────────────────────────────────────────────────╮"
            printf '│ 🎵 INPUT #%04d                                             │\n' "$id"
            echo "├──────────────────────────────────────────────────────────────┤"
            printf '│ Type: %-55s │\n' "$type"
            printf '│ URL : %-55s │\n' "$url"
            echo "╰──────────────────────────────────────────────────────────────╯"

            log START "$id" "Processing ${type} input."
            log SEARCH "$id" "Starting download resolution."

            # --------------------------------------------------------
            # Direct YouTube/SoundCloud
            # --------------------------------------------------------

            if [ "$type" = "youtube" ] ||
               [ "$type" = "soundcloud" ]; then

              log SEARCH "$id" "Trying direct yt-dlp."

              if run_direct_ytdlp \
                "$id" \
                "$type" \
                "$url"; then

                status="success"
                winner="yt-dlp"
                reason="direct yt-dlp succeeded"
              else
                log FALLBACK "$id" "Direct yt-dlp failed → spotDL."
              fi
            fi

            # --------------------------------------------------------
            # Explicit provider chain
            #
            # IMPORTANT:
            # Each provider is a separate spotDL invocation.
            # --------------------------------------------------------

            if [ "$status" != "success" ]; then

              provider_order=(
                youtube-music
                youtube
                soundcloud
                bandcamp
                piped
              )

              for provider in "${provider_order[@]}"; do

                if ! provider_supported "$provider"; then
                  continue
                fi

                log PROVIDER "$id" "Trying ${provider}."

                provider_success="false"

                for attempt in $(seq 1 "$RETRIES"); do

                  current_log="work/logs/${id}-${provider}-attempt-${attempt}.log"

                  if run_spotdl_provider \
                    "$id" \
                    "$url" \
                    "$provider" \
                    "$attempt"; then

                    provider_success="true"
                    status="success"
                    winner="$provider"
                    reason="spotDL ${provider} succeeded"

                    break
                  fi

                  failure_type="$(
                    classify_error "$current_log"
                  )"

                  case "$failure_type" in

                    CONFIGURATION)
                      log ERROR \
                        "$id" \
                        "${provider}: configuration error."

                      break
                      ;;

                    NO_RESULT)
                      log WARN \
                        "$id" \
                        "${provider}: no result → next provider."

                      break
                      ;;

                    FORMAT)
                      log WARN \
                        "$id" \
                        "${provider}: requested format unavailable."

                      break
                      ;;

                    RATE_LIMIT)
                      log WARN \
                        "$id" \
                        "${provider}: rate limited."
                      ;;

                    BLOCKED)
                      log WARN \
                        "$id" \
                        "${provider}: blocked/bot protection."
                      ;;

                    FORBIDDEN)
                      log WARN \
                        "$id" \
                        "${provider}: HTTP 403."
                      ;;

                    NETWORK)
                      log WARN \
                        "$id" \
                        "${provider}: network error."
                      ;;

                    *)
                      log WARN \
                        "$id" \
                        "${provider}: ${failure_type}."
                      ;;
                  esac

                  # No-result/config/format means:
                  # do not waste retries; switch provider.
                  if [ "$failure_type" = "NO_RESULT" ] ||
                     [ "$failure_type" = "CONFIGURATION" ] ||
                     [ "$failure_type" = "FORMAT" ]; then
                    break
                  fi

                  # Transient failures actually retry.
                  if [ "$attempt" -lt "$RETRIES" ]; then

                    case "$failure_type" in
                      RATE_LIMIT)
                        delay=$((attempt * 10))
                        ;;
                      BLOCKED|FORBIDDEN)
                        delay=$((attempt * 6))
                        ;;
                      NETWORK)
                        delay=$((attempt * 4))
                        ;;
                      *)
                        delay=$((attempt * 3))
                        ;;
                    esac

                    [ "$delay" -gt 30 ] && delay=30

                    log RETRY \
                      "$id" \
                      "${provider}: retry ${attempt}/${RETRIES} in ${delay}s."

                    sleep "$delay"
                  fi
                done

                if [ "$provider_success" = "true" ]; then
                  break
                fi

                log FALLBACK \
                  "$id" \
                  "${provider} failed → next provider."
              done
            fi

            finished_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            if [ "$status" = "success" ]; then

              log SUCCESS \
                "$id" \
                "Downloaded successfully via ${winner}."

              log DONE "$id" "SUCCESS"

            else

              log FAILED \
                "$id" \
                "All download strategies failed."

              reason="All providers exhausted."

              printf '%s\t%s\t%s\n' \
                "$id" \
                "$type" \
                "$url" \
                > "work/failed/${id}.tsv"

              printf '%s\n' "$reason" \
                > "work/failed/${id}.reason"

              log DONE "$id" "FAILED"
            fi

            write_result \
              "$id" \
              "$type" \
              "$url" \
              "$status" \
              "$winner" \
              "$reason" \
              "$started_at" \
              "$finished_at"
          }

          detect_providers

          echo
          echo "Detected spotDL providers:"
          printf '  ✓ %s\n' "${SUPPORTED_PROVIDERS[@]}"
          echo

          export -f \
            now \
            log \
            has_audio \
            classify_error \
            provider_supported \
            provider_cookie \
            run_spotdl_provider \
            run_direct_ytdlp \
            write_result \
            process_one

          export \
            FORMAT \
            QUALITY \
            BITRATE \
            WORKERS \
            RETRIES \
            RAW_LOGS \
            SPOTDL_THREADS \
            SPOTIFY_CLIENT_ID \
            SPOTIFY_CLIENT_SECRET \
            YOUTUBE_COOKIES \
            YOUTUBE_MUSIC_COOKIES \
            COOKIE_YT \
            COOKIE_YTM \
            USE_CUSTOM_CREDENTIALS \
            POT_SERVER_PORT \
            POT_AVAILABLE \
            VPN_AVAILABLE \
            YTDLP_RETRIES \
            YTDLP_FRAGMENT_RETRIES \
            YTDLP_EXTRACTOR_RETRIES \
            YTDLP_FILE_ACCESS_RETRIES \
            YTDLP_SOCKET_TIMEOUT \
            YTDLP_CONCURRENT_FRAGMENTS

          declare -p SUPPORTED_PROVIDERS > work/providers.sh

          echo "🚀 Concurrency: $WORKERS"
          echo "🔄 Transient retries/provider: $RETRIES"
          echo

          active=0

          while IFS=$'\t' read -r id type url; do

            run_download_process() {
              local run_id="$1"
              local run_type="$2"
              local run_url="$3"

              if [ "$VPN_AVAILABLE" != "true" ]; then
                source work/providers.sh
                process_one "$run_id" "$run_type" "$run_url"
                return
              fi

              local worker_script="work/run-vpn-${run_id}.sh"

              {
                declare -f \
                  now \
                  log \
                  has_audio \
                  classify_error \
                  provider_supported \
                  provider_cookie \
                  run_spotdl_provider \
                  run_direct_ytdlp \
                  write_result \
                  process_one
                echo 'source work/providers.sh'
                printf 'process_one %q %q %q\n' "$run_id" "$run_type" "$run_url"
              } > "$worker_script"

              chmod 755 "$worker_script"

              sudo -u "$VPN_USER" -H env \
                HOME="/home/${VPN_USER}" \
                PATH="$PATH" \
                FORMAT="$FORMAT" \
                QUALITY="$QUALITY" \
                BITRATE="$BITRATE" \
                WORKERS="$WORKERS" \
                RETRIES="$RETRIES" \
                RAW_LOGS="$RAW_LOGS" \
                SPOTDL_THREADS="$SPOTDL_THREADS" \
                SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" \
                SPOTIFY_CLIENT_SECRET="$SPOTIFY_CLIENT_SECRET" \
                YOUTUBE_COOKIES="$YOUTUBE_COOKIES" \
                YOUTUBE_MUSIC_COOKIES="$YOUTUBE_MUSIC_COOKIES" \
                COOKIE_YT="$COOKIE_YT" \
                COOKIE_YTM="$COOKIE_YTM" \
                USE_CUSTOM_CREDENTIALS="$USE_CUSTOM_CREDENTIALS" \
                POT_SERVER_PORT="$POT_SERVER_PORT" \
                POT_AVAILABLE="$POT_AVAILABLE" \
                VPN_AVAILABLE="$VPN_AVAILABLE" \
                YTDLP_RETRIES="$YTDLP_RETRIES" \
                YTDLP_FRAGMENT_RETRIES="$YTDLP_FRAGMENT_RETRIES" \
                YTDLP_EXTRACTOR_RETRIES="$YTDLP_EXTRACTOR_RETRIES" \
                YTDLP_FILE_ACCESS_RETRIES="$YTDLP_FILE_ACCESS_RETRIES" \
                YTDLP_SOCKET_TIMEOUT="$YTDLP_SOCKET_TIMEOUT" \
                YTDLP_CONCURRENT_FRAGMENTS="$YTDLP_CONCURRENT_FRAGMENTS" \
                bash "$worker_script"

              rm -f "$worker_script"
            }

            export -f run_download_process

            run_download_process "$id" "$type" "$url" &

            active=$((active + 1))

            if [ "$active" -ge "$WORKERS" ]; then
              wait -n || true
              active=$((active - 1))
            fi

          done < work/jobs.tsv

          wait || true

          echo
          echo "Download summary:"

          total="$(
            jq -s \
              'length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"

          success="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"

          failed="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"

          echo "Requested : $total"
          echo "Successful: $success"
          echo "Failed    : $failed"

      # ============================================================
      # 11. CONVERT
      # ============================================================

      - name: "🔄 Convert and validate audio"
        env:
          TARGET_FORMAT: ${{ inputs.output_format }}
          TARGET_QUALITY: ${{ inputs.audio_quality }}
        run: |
          set -Eeuo pipefail

          FORMAT="$TARGET_FORMAT"
          QUALITY="$TARGET_QUALITY"

          case "$QUALITY" in
            320k|256k|192k|128k)
              BITRATE="$QUALITY"
              ;;
            HIGH)
              BITRATE="320k"
              ;;
            LOW)
              BITRATE="128k"
              ;;
            LOSSLESS|HI_RES_LOSSLESS)
              BITRATE="320k"
              ;;
            *)
              BITRATE="320k"
              ;;
          esac

          converted=0
          validated=0
          failed=0

          mapfile -d '' files < <(
            find work/downloads \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
                -o -iname '*.webm' \
                -o -iname '*.aac' \
              \) \
              -print0
          )

          for source in "${files[@]}"; do

            ext="${source##*.}"
            ext="${ext,,}"

            if [ "$ext" = "${FORMAT,,}" ]; then
              output="$source"
            else
              output="${source%.*}.${FORMAT}"

              case "$FORMAT" in

                mp3)
                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a libmp3lame \
                    -b:a "$BITRATE" \
                    -id3v2_version 3 \
                    -y \
                    "$output"
                  ;;

                flac)
                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a flac \
                    -y \
                    "$output"
                  ;;

                m4a)
                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a aac \
                    -b:a "$BITRATE" \
                    -movflags +faststart \
                    -y \
                    "$output"
                  ;;

                ogg)
                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a libvorbis \
                    -b:a "$BITRATE" \
                    -y \
                    "$output"
                  ;;

                opus)
                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a libopus \
                    -b:a "$BITRATE" \
                    -y \
                    "$output"
                  ;;

                wav)
                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a pcm_s16le \
                    -y \
                    "$output"
                  ;;

              esac

              if [ ! -s "$output" ]; then
                echo "❌ Conversion failed: $source"
                failed=$((failed + 1))
                rm -f "$output"
                continue
              fi

              converted=$((converted + 1))
              rm -f "$source"
            fi

            if [ ! -s "$output" ]; then
              failed=$((failed + 1))
              continue
            fi

            if ffprobe \
              -v error \
              -show_entries format=duration,size \
              -show_entries stream=codec_name,sample_rate,channels \
              -of json \
              "$output" \
              > /tmp/audio-validation.json; then

              validated=$((validated + 1))

              codec="$(
                jq -r \
                  '.streams[0].codec_name // "unknown"' \
                  /tmp/audio-validation.json
              )"

              duration="$(
                jq -r \
                  '.format.duration // "unknown"' \
                  /tmp/audio-validation.json
              )"

              echo "✓ $(basename "$output") | $codec | ${duration}s"
            else
              echo "❌ Validation failed: $(basename "$output")"
              failed=$((failed + 1))
            fi
          done

          echo
          echo "Converted : $converted"
          echo "Validated : $validated"
          echo "Failed    : $failed"

      # ============================================================
      # 12. COLLECT FINAL AUDIO + FAILED URLS
      # ============================================================

      - name: "📚 Collect final files"
        id: collect
        run: |
          set -Eeuo pipefail

          rm -rf music
          mkdir -p music

          count=0

          while IFS= read -r -d '' file; do
            count=$((count + 1))
            base="$(basename "$file")"
            cp --reflink=auto -p "$file" "music/$base"
          done < <(
            find work/downloads -type f \
              \
              \( \
                -iname '*.mp3' -o \
                -iname '*.flac' -o \
                -iname '*.m4a' -o \
                -iname '*.ogg' -o \
                -iname '*.opus' -o \
                -iname '*.wav' \
              \) \
              -print0 |
            sort -z
          )

          failed_count=0
          : > work/failed_urls.txt

          for result in work/results/*.json; do
            [ -f "$result" ] || continue
            status="$(jq -r '.status // "failed"' "$result")"
            [ "$status" = "success" ] && continue
            jq -r '.url' "$result" >> work/failed_urls.txt
            failed_count=$((failed_count + 1))
          done

          sort -u work/failed_urls.txt -o work/failed_urls.txt

          echo "FINAL_AUDIO_COUNT=$count" >> "$GITHUB_OUTPUT"
          echo "FAILED_COUNT=$failed_count" >> "$GITHUB_OUTPUT"

          echo
          echo "Final audio files: $count"
          echo "Failed URLs      : $failed_count"

      # ============================================================
      # 13. SUMMARY
      # ============================================================

      - name: "📊 Write GitHub summary"
        env:
          FORMAT_INPUT: ${{ inputs.output_format }}
          QUALITY_INPUT: ${{ inputs.audio_quality }}
          UPLOAD_INPUT: ${{ inputs.upload_method }}
          BUNDLE_INPUT: ${{ inputs.bundle_all }}
          VPN_INPUT: ${{ inputs.vpn_enabled }}
          RAW_INPUT: ${{ inputs.raw_logs }}
        run: |
          set -Eeuo pipefail

          total="$(jq -s 'length' work/results/*.json 2>/dev/null || echo 0)"
          success="$(jq -s '[.[] | select(.status == "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          failed="$(jq -s '[.[] | select(.status != "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          audio_count="$(find music -maxdepth 1 -type f \
            \( -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' -o -iname '*.ogg' -o -iname '*.opus' -o -iname '*.wav' \) | wc -l)"

          {
            echo "# 🎵 Music Downloader"
            echo
            echo "## Configuration"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Format | \`$FORMAT_INPUT\` |"
            echo "| Quality | \`$QUALITY_INPUT\` |"
            echo "| Upload | \`$UPLOAD_INPUT\` |"
            echo "| Bundle | \`$BUNDLE_INPUT\` |"
            echo "| VPN | \`$VPN_INPUT\` |"
            echo "| Raw logs | \`$RAW_INPUT\` |"
            echo "| Provider order | YouTube Music → YouTube → SoundCloud → Bandcamp → Piped |"
            echo
            echo "## Result"
            echo
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| Requested URLs | $total |"
            echo "| Successful | $success |"
            echo "| Failed | $failed |"
            echo "| Final audio files | $audio_count |"
            if [ -s work/failed_urls.txt ]; then
              echo
              echo "## Failed URLs"
              echo
              echo '```text'
              cat work/failed_urls.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 14. PACKAGE OUTPUT
      # ============================================================

      - name: "📦 Package output"
        id: archive
        env:
          BUNDLE_ALL: ${{ inputs.bundle_all }}
          UPLOAD_METHOD: ${{ inputs.upload_method }}
        run: |
          set -Eeuo pipefail

          rm -rf work/archive work/package
          mkdir -p work/archive work/package

          audio_found=0
          while IFS= read -r -d '' file; do
            audio_found=$((audio_found + 1))
            cp --reflink=auto -p "$file" work/package/
          done < <(
            find music -maxdepth 1 -type f \
              \( \
                -iname '*.mp3' -o \
                -iname '*.flac' -o \
                -iname '*.m4a' -o \
                -iname '*.ogg' -o \
                -iname '*.opus' -o \
                -iname '*.wav' \
              \) \
              -print0 |
            sort -z
          )

          if [ "$audio_found" -eq 0 ]; then
            echo "⚠️ No audio files to package."
            echo "HAS_ASSETS=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One 5-character suffix is generated for the entire run.
          # The failed-download report uses the exact same suffix.
          suffix="$(openssl rand -hex 3 | cut -c1-5 | tr '[:lower:]' '[:upper:]')"
          zip_name="music-${suffix}.zip"
          failed_name="FAILED-DOWNLOADS-${suffix}.txt"

          if [ "$BUNDLE_ALL" = "true" ]; then
            if [ "$UPLOAD_METHOD" = "repo" ]; then
              (
                cd work/package
                zip -0 -s 90m -r "../archive/${zip_name}" .
              )
            else
              (
                cd work/package
                zip -0 -r "../archive/${zip_name}" .
              )

              if [ "$UPLOAD_METHOD" = "release" ]; then
                size="$(stat -c%s "work/archive/${zip_name}")"
                if [ "$size" -gt 1900000000 ]; then
                  echo "⚠️ Large release ZIP; creating split archive."
                  rm -f work/archive/*
                  (
                    cd work/package
                    zip -0 -s 1900m -r "../archive/${zip_name}" .
                  )
                fi
              fi
            fi
          else
            index=0
            while IFS= read -r -d '' file; do
              index=$((index + 1))
              base="$(basename "$file")"
              safe="$(printf '%s' "$base" | tr ' ' '_' | tr -cd '[:alnum:]_.-')"
              zip_name_i="single-${index}-${safe}-${suffix}.zip"
              (
                cd work/package
                zip -0 "../archive/${zip_name_i}" "$base"
              )
            done < <(
              find work/package -maxdepth 1 -type f \
                \( \
                  -iname '*.mp3' -o \
                  -iname '*.flac' -o \
                  -iname '*.m4a' -o \
                  -iname '*.ogg' -o \
                  -iname '*.opus' -o \
                  -iname '*.wav' \
                \) \
                -print0 |
              sort -z
            )
          fi

          # ZIP files contain music only. Failed URLs stay beside the ZIP.
          rm -f music/*.zip music/*.z[0-9][0-9] 2>/dev/null || true
          find work/archive -maxdepth 1 -type f \
            \( -name '*.zip' -o -name '*.z[0-9][0-9]' \) \
            -exec cp -p {} music/ \
            \\;

          if [ -s work/failed_urls.txt ]; then
            cp -p work/failed_urls.txt "music/${failed_name}"
            echo "FAILED_FILE=${failed_name}" >> "$GITHUB_OUTPUT"
          fi

          echo "SUFFIX=${suffix}" >> "$GITHUB_OUTPUT"
          echo "HAS_ASSETS=true" >> "$GITHUB_OUTPUT"

          echo
          echo "📦 Final package:"
          ls -lh music/

      # ============================================================
      # 15. DIAGNOSTICS
      # ============================================================

      - name: "📊 Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downloader-diagnostics-${{ github.run_number }}
          path: |
            work/logs/
            work/results/
            work/failed/
            work/jobs.tsv
            work/input_urls.txt
            work/failed_urls.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      # ============================================================
      # 16. DISCONNECT VPN
      # ============================================================

      - name: "🔌 Disconnect VPN"
        if: always()
        run: |
          set +e

          vpn_uid="${{ steps.vpn.outputs.vpn_uid }}"

          echo "🧹 Removing dedicated VPN routing..."

          if [ -n "$vpn_uid" ]; then
            sudo ip rule del \
              uidrange "${vpn_uid}-${vpn_uid}" \
              lookup 51820 \
              priority 10020 \
              2>/dev/null \
              || true

            sudo ip -6 rule del \
              uidrange "${vpn_uid}-${vpn_uid}" \
              lookup 51821 \
              priority 10021 \
              2>/dev/null \
              || true
          fi

          echo "🧹 Flushing VPN routing tables..."

          sudo ip route flush table 51820 \
            2>/dev/null \
            || true

          sudo ip -6 route flush table 51821 \
            2>/dev/null \
            || true

          echo "🔌 Removing WireGuard interface..."

          sudo ip link delete wg0 \
            2>/dev/null \
            || true

          sudo rm -f \
            /etc/wireguard/wg0.conf \
            /tmp/wg0.conf \
            /tmp/wg0-wg.conf \
            /tmp/wg0-download.conf

          echo "✅ VPN disconnected and dedicated routing removed."

      # ============================================================
      # 17. GOOGLE DRIVE
      # ============================================================

      - name: "☁️ Upload to Google Drive"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'drive'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_NAME: "github-actions"
        run: |
          set -Eeuo pipefail

          if [ -z "$GOOGLE_CLIENT_ID" ] ||
             [ -z "$GOOGLE_CLIENT_SECRET" ] ||
             [ -z "$GOOGLE_REFRESH_TOKEN" ]; then

            echo "❌ Google Drive credentials are missing."
            exit 1
          fi

          token_json="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --request POST \
              https://oauth2.googleapis.com/token \
              --data-urlencode "client_id=${GOOGLE_CLIENT_ID}" \
              --data-urlencode "client_secret=${GOOGLE_CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${GOOGLE_REFRESH_TOKEN}" \
              --data-urlencode "grant_type=refresh_token"
          )"

          access_token="$(
            jq -r '.access_token // empty' \
              <<< "$token_json"
          )"

          if [ -z "$access_token" ]; then
            echo "❌ Could not obtain Drive token."
            exit 1
          fi

          query="mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false"

          folder_response="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --get \
              https://www.googleapis.com/drive/v3/files \
              -H "Authorization: Bearer ${access_token}" \
              --data-urlencode "q=${query}" \
              --data-urlencode "fields=files(id,name)"
          )"

          folder_id="$(
            jq -r '.files[0].id // empty' \
              <<< "$folder_response"
          )"

          if [ -z "$folder_id" ]; then

            body="$(
              jq -n \
                --arg name "$DRIVE_FOLDER_NAME" \
                '{
                  name: $name,
                  mimeType: "application/vnd.google-apps.folder"
                }'
            )"

            folder_id="$(
              curl \
                --silent \
                --show-error \
                --fail \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                --request POST \
                https://www.googleapis.com/drive/v3/files \
                -H "Authorization: Bearer ${access_token}" \
                -H "Content-Type: application/json" \
                --data "$body" |
              jq -r '.id // empty'
            )"
          fi

          if [ -z "$folder_id" ]; then
            echo "❌ Could not resolve Drive folder."
            exit 1
          fi

          upload_file() {
            local file="$1"
            local name
            local size

            name="$(basename "$file")"
            size="$(stat -c%s "$file")"

            echo "⬆️ $name ($size bytes)"

            local headers
            headers="$(mktemp)"

            local metadata
            metadata="$(
              jq -n \
                --arg name "$name" \
                --arg folder "$folder_id" \
                '{
                  name: $name,
                  parents: [$folder]
                }'
            )"

            if ! curl \
              --silent \
              --show-error \
              --request POST \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              -D "$headers" \
              -o /dev/null \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: application/octet-stream" \
              -H "X-Upload-Content-Length: ${size}" \
              --data "$metadata" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable"; then

              rm -f "$headers"
              return 1
            fi

            local session_uri

            session_uri="$(
              awk '
                BEGIN { IGNORECASE=1 }
                /^location:/ {
                  sub(/\r$/, "")
                  sub(/^[^:]*:[[:space:]]*/, "")
                  print
                  exit
                }
              ' "$headers"
            )"

            rm -f "$headers"

            if [ -z "$session_uri" ]; then
              echo "❌ Could not initialize Drive upload."
              return 1
            fi

            local offset=0

            while [ "$offset" -lt "$size" ]; do

              local remaining=$((size - offset))
              local length="$DRIVE_CHUNK_SIZE"

              if [ "$remaining" -lt "$length" ]; then
                length="$remaining"
              fi

              local end=$((offset + length - 1))

              local chunk
              chunk="$(mktemp)"

              dd \
                if="$file" \
                of="$chunk" \
                iflag=skip_bytes,count_bytes \
                skip="$offset" \
                count="$length" \
                status=none

              local chunk_done="false"

              for attempt in 1 2 3 4 5; do

                local response
                local response_headers
                local code

                response="$(mktemp)"
                response_headers="$(mktemp)"

                code="$(
                  curl \
                    --silent \
                    --show-error \
                    --request PUT \
                    -D "$response_headers" \
                    -o "$response" \
                    --write-out '%{http_code}' \
                    -H "Authorization: Bearer ${access_token}" \
                    -H "Content-Type: application/octet-stream" \
                    -H "Content-Length: ${length}" \
                    -H "Content-Range: bytes ${offset}-${end}/${size}" \
                    --data-binary "@${chunk}" \
                    "$session_uri"
                )"

                case "$code" in

                  200|201)
                    offset="$size"
                    chunk_done="true"
                    ;;

                  308)

                    range="$(
                      awk '
                        BEGIN { IGNORECASE=1 }
                        /^Range:/ {
                          sub(/\r$/, "")
                          print
                        }
                      ' "$response_headers"
                    )"

                    if [[ "$range" =~ bytes=0-([0-9]+) ]]; then
                      offset=$((BASH_REMATCH[1] + 1))
                    else
                      offset=$((end + 1))
                    fi

                    chunk_done="true"
                    ;;

                  429|500|502|503|504)

                    delay=$((2 ** attempt))

                    [ "$delay" -gt 30 ] && delay=30

                    echo "⚠️ Drive HTTP $code; retry in ${delay}s."

                    sleep "$delay"
                    ;;

                  *)

                    echo "❌ Drive upload failed: HTTP $code"

                    cat "$response" \
                      2>/dev/null \
                      || true

                    rm -f \
                      "$response" \
                      "$response_headers" \
                      "$chunk"

                    return 1
                    ;;
                esac

                rm -f \
                  "$response" \
                  "$response_headers"

                if [ "$offset" -ge "$size" ]; then
                  break
                fi

                if [ "$chunk_done" = "true" ]; then
                  break
                fi
              done

              rm -f "$chunk"

              if [ "$offset" -lt "$size" ] &&
                 [ "$chunk_done" != "true" ]; then

                echo "❌ Drive chunk upload failed."
                return 1
              fi

              percent=$((offset * 100 / size))

              echo "   Progress: ${percent}%"
            done

            echo "✅ Uploaded: $name"
          }

          for file in music/*; do

            [ -f "$file" ] || continue

            case "$(basename "$file")" in
              *.zip|*.z[0-9][0-9]|FAILED-DOWNLOADS-*.txt)
                upload_file "$file"
                ;;
            esac

          done

          echo "✅ Google Drive upload complete."

      # ============================================================
      # 18. REPOSITORY UPLOAD
      # ============================================================

      - name: "📤 Upload to repository"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'repo'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add music/

          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit."
            exit 0
          fi

          git commit \
            -m "Add music downloader output [skip ci]"

          for attempt in 1 2 3 4 5; do

            echo "Push attempt ${attempt}/5"

            if git pull \
              --rebase \
              --autostash \
              origin "$BRANCH_NAME" &&
              git push origin "$BRANCH_NAME"; then

              echo "✅ Repository upload complete."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 3))
            fi

          done

          echo "❌ Repository push failed."
          exit 1

      # ============================================================
      # 19. GITHUB RELEASE
      # ============================================================

      - name: "🏷️ Create GitHub Release"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORMAT_INPUT: ${{ inputs.output_format }}
          QUALITY_INPUT: ${{ inputs.audio_quality }}
          VPN_INPUT: ${{ inputs.vpn_enabled }}
        run: |
          set -Eeuo pipefail

          suffix="${{ steps.archive.outputs.SUFFIX }}"
          tag="music-${suffix}"

          total="$(
            jq -s \
              'length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"

          success="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"

          failed="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"

          {
            echo "# 🎵 Music Downloader"
            echo
            echo "Requested URLs: ${total}"
            echo "Successful: ${success}"
            echo "Failed: ${failed}"
            echo "Format: ${FORMAT_INPUT}"
            echo "Quality: ${QUALITY_INPUT}"
            echo "VPN: ${VPN_INPUT}"
            echo "Provider order: YouTube Music → YouTube → SoundCloud → Bandcamp → Piped"
            echo "PO-token provider: bgutil"
            echo
            echo "The release includes FAILED-DOWNLOADS-${suffix}.txt when any URL fails."
          } > work/release-notes.md

          mapfile -t assets < <(
            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -name '*.zip' \
                -o -name '*.z[0-9][0-9]' \
                    -o -name 'FAILED-DOWNLOADS-*.txt' \
                  \) \
              -print |
            sort
          )

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "❌ No release assets."
            exit 1
          fi

          gh release create \
            "$tag" \
            "${assets[@]}" \
            --title "Music Downloader ${suffix}" \
            --notes-file work/release-notes.md \
            --target "$GITHUB_SHA"

          echo "✅ Release created."

      # ============================================================
      # 20. FINAL STATUS
      # ============================================================

      - name: "✅ Final status"
        if: always()
        env:
          FAIL_ON_PARTIAL: ${{ inputs.fail_on_partial }}
        run: |
          set -Eeuo pipefail

          total="$(
            jq -s \
              'length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"

          success="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"

          failed="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"

          audio_count="$(
            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) |
            wc -l
          )"

          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                     🎵 FINAL RESULT                        ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf '║ Requested   : %-43s ║\n' "$total"
          printf '║ Successful  : %-43s ║\n' "$success"
          printf '║ Failed      : %-43s ║\n' "$failed"
          printf '║ Audio files : %-43s ║\n' "$audio_count"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo

          if [ "$success" -eq 0 ]; then
            echo "❌ No URL completed successfully."
            exit 1
          fi

          if [ "$failed" -gt 0 ] &&
             [ "$FAIL_ON_PARTIAL" = "true" ]; then

            echo "❌ Partial failure detected."
            exit 1
          fi

          if [ "$failed" -gt 0 ]; then
            echo "⚠️ Partial completion accepted."
          else
            echo "✅ All URLs completed successfully."
          fi

      # ============================================================
      # 21. CLEANUP
      # ============================================================

      - name: "🧹 Cleanup"
        if: always()
        run: |
          set +e

          docker rm -f bgutil-provider \
            >/dev/null 2>&1 \
            || true

          sudo wg-quick down wg0 \
            >/dev/null 2>&1 \
            || true

          rm -f \
            /tmp/wg0.conf \
            /tmp/youtube-cookies.txt \
            /tmp/youtube-music-cookies.txt \
            /tmp/bgutil-ping.json \
            /tmp/audio-validation.json

          find /tmp \
            -maxdepth 1 \
            -type f \
            -name '*.drivechunk' \
            -delete \
            2>/dev/null \
            || true

          echo "✅ Cleanup complete."
