name: downloader-spotify

on:
  workflow_dispatch:
    inputs:
      urls:
        description: >
          🎵 Spotify/Tidal/Apple Music/SoundCloud/YouTube/Pandora URLs
          (comma, space, or newline separated)
        required: true
        type: string

      output_format:
        description: "🎧 Output Format"
        required: true
        type: choice
        options: [mp3, flac, m4a, ogg, opus, wav]
        default: mp3

      audio_quality:
        description: "🎚️ Audio Quality / Bitrate"
        required: true
        type: choice
        options: [320k, 256k, 192k, 128k, SOURCE]
        default: 320k

      upload_method:
        description: "☁️ Upload destination"
        required: true
        type: choice
        options: [drive, repo, release]
        default: release

      bundle_all:
        description: "📦 Bundle all tracks into a single ZIP?"
        type: boolean
        default: true

      vpn_enabled:
        description: "🔒 Route downloads through WireGuard VPN?"
        type: boolean
        default: true

      use_custom_credentials:
        description: "🔑 Use custom Spotify App credentials?"
        type: boolean
        default: false

      concurrent_downloads:
        description: "⚡ Concurrent URL workers (2 recommended)"
        type: number
        default: 2
        required: false

      retry_count:
        description: "🔄 Provider retries per URL"
        type: number
        default: 3
        required: false

      per_track_timeout:
        description: "⏱️ Maximum seconds allowed for one downloader attempt"
        type: number
        default: 900
        required: false

      spotdl_version:
        description: "🎵 spotDL version"
        type: string
        default: "4.5.2"
        required: false

      ytdlp_version:
        description: "📺 yt-dlp version (use 'latest' or exact version)"
        type: string
        default: "latest"
        required: false

      bgutil_version:
        description: "🛡️ bgutil PO Token provider version"
        type: string
        default: "1.3.1"
        required: false

      debug_logs:
        description: "🐛 Enable very verbose debug logs?"
        type: boolean
        default: false

      fail_on_partial:
        description: "🚨 Fail workflow when any requested URL fails?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: music-downloader-${{ github.ref }}
  cancel-in-progress: false

jobs:
  music-download:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    env:
      PYTHONUNBUFFERED: "1"
      TZ: UTC

      # Runtime configuration
      SPOTDL_VERSION: ${{ inputs.spotdl_version }}
      YTDLP_VERSION: ${{ inputs.ytdlp_version }}
      BGUTIL_VERSION: ${{ inputs.bgutil_version }}
      WORKDIR: ${{ github.workspace }}/work

      # yt-dlp network/reliability policy
      YTDLP_RETRIES: "8"
      YTDLP_FRAGMENT_RETRIES: "8"
      YTDLP_EXTRACTOR_RETRIES: "4"
      YTDLP_FILE_ACCESS_RETRIES: "5"
      YTDLP_SOCKET_TIMEOUT: "30"
      YTDLP_THROTTLED_RATE: "100K"

    steps:
      # ============================================================
      # 1) CHECKOUT / PYTHON
      # ============================================================
      - name: "📥 Checkout repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "🐍 Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # ============================================================
      # 2) SYSTEM DEPENDENCIES
      # ============================================================
      - name: "🛠️ Install system dependencies"
        run: |
          set -Eeuo pipefail

          echo "::group::📦 APT packages"
          sudo apt-get -o Acquire::ForceIPv4=true update -qq
          sudo apt-get -o Acquire::ForceIPv4=true install -y -qq \
            ffmpeg \
            curl \
            jq \
            zip \
            unzip \
            git \
            aria2 \
            wireguard-tools \
            openresolv \
            ca-certificates \
            coreutils
          echo "::endgroup::"

          echo "::group::🔎 Tool versions"
          ffmpeg -version 2>&1 | head -n 1
          ffprobe -version 2>&1 | head -n 1
          python --version
          curl --version | head -n 1
          jq --version
          zip -v | head -n 2
          aria2c --version | head -n 2
          docker --version
          echo "::endgroup::"

      # ============================================================
      # 3) PYTHON TOOLCHAIN
      # ============================================================
      - name: "🐍 Install spotDL / yt-dlp / PO-token plugin"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip setuptools wheel

          echo "::group::🎵 Install spotDL"
          python -m pip install --retries 5 --timeout 60 \
            "spotdl==${SPOTDL_VERSION}"
          echo "::endgroup::"

          echo "::group::📺 Install yt-dlp"
          if [ "${YTDLP_VERSION}" = "latest" ]; then
            python -m pip install --retries 5 --timeout 60 \
              --upgrade "yt-dlp[default]"
          else
            python -m pip install --retries 5 --timeout 60 \
              "yt-dlp[default]==${YTDLP_VERSION}"
          fi
          echo "::endgroup::"

          echo "::group::🛡️ Install bgutil PO-token plugin"
          python -m pip install --retries 5 --timeout 60 \
            "bgutil-ytdlp-pot-provider==${BGUTIL_VERSION}"
          echo "::endgroup::"

          echo "::group::🏷️ Installed versions"
          echo "spotDL : $(spotdl --version 2>/dev/null || true)"
          echo "yt-dlp : $(yt-dlp --version)"
          python -m pip show bgutil-ytdlp-pot-provider | sed -n '1,8p'
          echo "::endgroup::"

      # ============================================================
      # 4) DENO / EJS
      # ============================================================
      - name: "🦕 Install Deno for yt-dlp EJS"
        run: |
          set -Eeuo pipefail

          if command -v deno >/dev/null 2>&1; then
            echo "✅ Deno already installed."
          else
            echo "📥 Installing Deno from the official installer..."
            curl -fsSL https://deno.land/install.sh | sh -s -- -y
          fi

          if [ -x "$HOME/.deno/bin/deno" ]; then
            echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          fi

          export PATH="$HOME/.deno/bin:$PATH"
          echo "✅ Deno: $(deno --version | head -n 1)"

          # Current yt-dlp guidance requires a supported EJS runtime;
          # Deno is the recommended runtime. The exact minimum can change.
          if ! deno --version | awk 'NR==1 {split($3,a,"."); if (a[1] < 2 || (a[1] == 2 && a[2] < 3)) exit 1}'; then
            echo "❌ Deno is older than the currently supported 2.3+ floor."
            exit 1
          fi

      # ============================================================
      # 5) DIRECTORIES
      # ============================================================
      - name: "📁 Create isolated workspace"
        run: |
          set -Eeuo pipefail

          rm -rf "$WORKDIR"
          mkdir -p \
            "$WORKDIR/input" \
            "$WORKDIR/downloads" \
            "$WORKDIR/final" \
            "$WORKDIR/logs" \
            "$WORKDIR/results" \
            "$WORKDIR/state" \
            "$WORKDIR/archive" \
            "$WORKDIR/metadata"

          chmod 700 "$WORKDIR"
          echo "WORKDIR=$WORKDIR"

      # ============================================================
      # 6) START BGUTIL PO TOKEN PROVIDER
      # ============================================================
      - name: "🛡️ Start bgutil PO-token provider"
        env:
          BGUTIL_VERSION: ${{ inputs.bgutil_version }}
        run: |
          set -Eeuo pipefail

          echo "::group::🚀 Start PO-token provider"
          docker rm -f bgutil-provider >/dev/null 2>&1 || true

          docker pull "brainicism/bgutil-ytdlp-pot-provider:${BGUTIL_VERSION}"

          # Host networking keeps the provider on the same runner network
          # path as yt-dlp and WireGuard.
          docker run -d \
            --name bgutil-provider \
            --network host \
            --init \
            "brainicism/bgutil-ytdlp-pot-provider:${BGUTIL_VERSION}"

          echo "::endgroup::"

          echo "::group::⏳ Wait for PO-token provider"
          READY=false
          for i in $(seq 1 45); do
            if (echo >/dev/tcp/127.0.0.1/4416) >/dev/null 2>&1; then
              READY=true
              echo "✅ bgutil is listening on 127.0.0.1:4416"
              break
            fi

            if [ "$i" -eq 45 ]; then
              echo "❌ bgutil did not start."
              docker logs --tail 200 bgutil-provider || true
              exit 1
            fi

            sleep 2
          done
          echo "::endgroup::"

          echo "::group::🔎 PO-token provider diagnostics"
          docker ps --filter "name=bgutil-provider"
          docker logs --tail 80 bgutil-provider || true
          echo "::endgroup::"

      # ============================================================
      # 7) INPUT NORMALIZATION
      # ============================================================
      - name: "🔗 Parse, validate and deduplicate URLs"
        env:
          RAW_URLS: ${{ inputs.urls }}
        run: |
          set -Eeuo pipefail

          INPUT_FILE="$WORKDIR/input/urls.tsv"
          RAW_FILE="$WORKDIR/input/raw.txt"

          printf '%s\n' "$RAW_URLS" > "$RAW_FILE"

          classify_url() {
            local url="$1"

            if [[ "$url" =~ ^https?://(www\.)?open\.spotify\.com/ ]]; then
              echo "spotify"
            elif [[ "$url" =~ ^https?://(www\.)?youtu\.be/ ]] ||
                 [[ "$url" =~ ^https?://(www\.)?youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://music\.youtube\.com/ ]]; then
              echo "youtube"
            elif [[ "$url" =~ ^https?://(www\.)?soundcloud\.com/ ]]; then
              echo "soundcloud"
            elif [[ "$url" =~ ^https?://(www\.)?music\.apple\.com/ ]]; then
              echo "apple_music"
            elif [[ "$url" =~ ^https?://(www\.)?(listen\.)?tidal\.com/ ]] ||
                 [[ "$url" =~ ^https?://(www\.)?tidal\.com/ ]]; then
              echo "tidal"
            elif [[ "$url" =~ ^https?://(www\.)?pandora\.com/ ]] ||
                 [[ "$url" =~ ^https?://(www\.)?pandora\.app\.link/ ]]; then
              echo "pandora"
            else
              echo "unsupported"
            fi
          }

          {
            printf '%s\n' "$RAW_URLS" |
              tr ',' '\n' |
              sed -E 's/[[:space:]]+/\n/g' |
              sed '/^[[:space:]]*$/d' |
              awk '!seen[$0]++'
          } > "$WORKDIR/input/normalized_urls.txt"

          : > "$INPUT_FILE"

          index=0
          while IFS= read -r url; do
            kind="$(classify_url "$url")"

            if [ "$kind" = "unsupported" ]; then
              echo "⚠️ Skipping unsupported URL: $url"
              continue
            fi

            index=$((index + 1))
            printf '%04d\t%s\t%s\n' "$index" "$kind" "$url" >> "$INPUT_FILE"
          done < "$WORKDIR/input/normalized_urls.txt"

          if [ ! -s "$INPUT_FILE" ]; then
            echo "❌ No supported URLs were found."
            exit 1
          fi

          echo "✅ Valid URL count: $(wc -l < "$INPUT_FILE")"
          echo "::group::📋 Input list"
          column -t -s $'\t' "$INPUT_FILE"
          echo "::endgroup::"

      # ============================================================
      # 8) VPN
      # ============================================================
      - name: "🔒 Configure WireGuard VPN"
        id: vpn
        env:
          VPN_ENABLED: ${{ inputs.vpn_enabled }}
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          set -Eeuo pipefail

          VPN_AVAILABLE=false

          if [ "$VPN_ENABLED" != "true" ]; then
            echo "ℹ️ VPN disabled by workflow input."
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$WG_CONFIG" ]; then
            echo "⚠️ VPN requested, but WG_CONFIG secret is empty."
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::group::🔒 Bring up WireGuard"

          trap 'sudo wg-quick down wg0 >/dev/null 2>&1 || true' EXIT

          umask 077
          printf '%s\n' "$WG_CONFIG" > "$WORKDIR/input/wg0.conf"
          sudo cp "$WORKDIR/input/wg0.conf" /etc/wireguard/wg0.conf
          sudo chmod 600 /etc/wireguard/wg0.conf

          if sudo wg-quick up wg0; then
            VPN_AVAILABLE=true
            echo "✅ WireGuard interface wg0 is up."
          else
            echo "⚠️ WireGuard failed to start; downloads will continue without VPN."
            sudo wg-quick down wg0 >/dev/null 2>&1 || true
          fi

          echo "::endgroup::"

          if [ "$VPN_AVAILABLE" = "true" ]; then
            echo "::group::🌐 VPN network diagnostics"
            PUBLIC_IP="$(curl -4 -fsS --max-time 15 https://api.ipify.org || echo unknown)"
            echo "Public IPv4: $PUBLIC_IP"
            sudo wg show wg0 || true
            echo "::endgroup::"
          fi

          # Keep interface for later download step.
          trap - EXIT

          echo "vpn_available=$VPN_AVAILABLE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9) PRE-FLIGHT HEALTH CHECK
      # ============================================================
      - name: "🩺 Pre-flight health check"
        env:
          VPN_AVAILABLE: ${{ steps.vpn.outputs.vpn_available }}
        run: |
          set -Eeuo pipefail

          echo "::group::🧪 Runtime health"
          command -v spotdl
          command -v yt-dlp
          command -v ffmpeg
          command -v ffprobe
          command -v aria2c
          command -v docker
          command -v jq
          command -v zip
          command -v deno

          echo "spotDL : $(spotdl --version 2>/dev/null || true)"
          echo "yt-dlp : $(yt-dlp --version)"
          echo "Deno   : $(deno --version | head -n 1)"
          echo "FFmpeg : $(ffmpeg -version 2>&1 | head -n 1)"
          echo "VPN    : $VPN_AVAILABLE"
          echo "::endgroup::"

          echo "::group::🌐 External connectivity"
          check_url() {
            local label="$1"
            local url="$2"
            local code

            code="$(curl -4 -sS -o /dev/null -w '%{http_code}' \
              --connect-timeout 10 --max-time 20 "$url" || true)"

            if [[ "$code" =~ ^[1-5][0-9][0-9]$ ]]; then
              echo "✅ $label -> HTTP $code"
            else
              echo "⚠️ $label -> no HTTP response"
            fi
          }

          check_url "YouTube" "https://www.youtube.com/"
          check_url "Spotify" "https://open.spotify.com/"
          check_url "SoundCloud" "https://soundcloud.com/"
          check_url "GitHub" "https://github.com/"
          check_url "Google OAuth" "https://oauth2.googleapis.com/"
          echo "::endgroup::"

      # ============================================================
      # 10) DOWNLOAD ENGINE
      # ============================================================
      - name: "⬇️ Download engine"
        id: download
        env:
          RAW_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          RAW_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_MUSIC_COOKIES: ${{ secrets.YOUTUBE_MUSIC_COOKIES }}

          OUTPUT_FORMAT: ${{ inputs.output_format }}
          AUDIO_QUALITY: ${{ inputs.audio_quality }}
          PARALLEL: ${{ inputs.concurrent_downloads }}
          MAX_RETRIES: ${{ inputs.retry_count }}
          TIMEOUT_SECONDS: ${{ inputs.per_track_timeout }}
          VPN_AVAILABLE: ${{ steps.vpn.outputs.vpn_available }}
          USE_CUSTOM: ${{ inputs.use_custom_credentials }}
          DEBUG_LOGS: ${{ inputs.debug_logs }}
        run: |
          set -Eeuo pipefail

          RESULTS_DIR="$WORKDIR/results"
          LOGS_DIR="$WORKDIR/logs"
          DOWNLOAD_DIR="$WORKDIR/downloads"
          STATE_DIR="$WORKDIR/state"
          INPUT_FILE="$WORKDIR/input/urls.tsv"

          mkdir -p "$RESULTS_DIR" "$LOGS_DIR" "$DOWNLOAD_DIR" "$STATE_DIR"

          # ----------------------------------------------------------
          # Logging
          # ----------------------------------------------------------
          timestamp() {
            date -u '+%H:%M:%S'
          }

          log() {
            local level="$1"
            shift
            local message="$*"

            printf '[%s] %-8s %s\n' "$(timestamp)" "$level" "$message"
          }

          banner() {
            echo
            echo "╭──────────────────────────────────────────────────────────────╮"
            printf '│ %-60s │\n' "$1"
            echo "╰──────────────────────────────────────────────────────────────╯"
          }

          # ----------------------------------------------------------
          # Credentials
          # ----------------------------------------------------------
          if [ "$USE_CUSTOM" = "true" ] &&
             [ -n "$RAW_CLIENT_ID" ] &&
             [ -n "$RAW_CLIENT_SECRET" ]; then
            export SPOTIPY_CLIENT_ID="$RAW_CLIENT_ID"
            export SPOTIPY_CLIENT_SECRET="$RAW_CLIENT_SECRET"
            log INFO "Spotify credentials: custom"
          else
            unset SPOTIPY_CLIENT_ID || true
            unset SPOTIPY_CLIENT_SECRET || true
            log INFO "Spotify credentials: spotDL default path"
          fi

          # ----------------------------------------------------------
          # Cookies
          # ----------------------------------------------------------
          COOKIE_FILE_YT=""
          COOKIE_FILE_YTM=""

          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > "$WORKDIR/input/youtube_cookies.txt"
            chmod 600 "$WORKDIR/input/youtube_cookies.txt"
            COOKIE_FILE_YT="$WORKDIR/input/youtube_cookies.txt"
          fi

          if [ -n "$YOUTUBE_MUSIC_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_MUSIC_COOKIES" > "$WORKDIR/input/youtube_music_cookies.txt"
            chmod 600 "$WORKDIR/input/youtube_music_cookies.txt"
            COOKIE_FILE_YTM="$WORKDIR/input/youtube_music_cookies.txt"
          fi

          # ----------------------------------------------------------
          # Quality mapping
          # ----------------------------------------------------------
          if [ "$AUDIO_QUALITY" = "SOURCE" ]; then
            SPOTDL_BITRATE="disable"
            YTDLP_AUDIO_QUALITY="0"
          else
            SPOTDL_BITRATE="$AUDIO_QUALITY"
            YTDLP_AUDIO_QUALITY="$AUDIO_QUALITY"
          fi

          # ----------------------------------------------------------
          # yt-dlp base args
          #
          # EJS scripts are included by yt-dlp[default].
          # bgutil provides PO Tokens automatically.
          # ----------------------------------------------------------
          YTDLP_BASE_ARGS=(
            --no-warnings
            --retries "$YTDLP_RETRIES"
            --fragment-retries "$YTDLP_FRAGMENT_RETRIES"
            --extractor-retries "$YTDLP_EXTRACTOR_RETRIES"
            --file-access-retries "$YTDLP_FILE_ACCESS_RETRIES"
            --socket-timeout "$YTDLP_SOCKET_TIMEOUT"
            --throttled-rate "$YTDLP_THROTTLED_RATE"
            --js-runtimes deno
            --newline
          )

          if [ "$DEBUG_LOGS" = "true" ]; then
            YTDLP_BASE_ARGS+=(--verbose)
          else
            YTDLP_BASE_ARGS+=(--quiet)
          fi

          # ----------------------------------------------------------
          # Provider circuit breaker
          # ----------------------------------------------------------
          provider_is_cooling_down() {
            local provider="$1"
            local f="$STATE_DIR/cooldown_${provider}.txt"

            [ -f "$f" ] || return 1

            local until
            until="$(cat "$f" 2>/dev/null || echo 0)"
            local now
            now="$(date +%s)"

            if [[ "$until" =~ ^[0-9]+$ ]] && [ "$until" -gt "$now" ]; then
              return 0
            fi

            rm -f "$f"
            return 1
          }

          trip_provider() {
            local provider="$1"
            local seconds="$2"
            printf '%s\n' "$(( $(date +%s) + seconds ))" > "$STATE_DIR/cooldown_${provider}.txt"
          }

          # ----------------------------------------------------------
          # Error classification
          # ----------------------------------------------------------
          classify_error() {
            local log_file="$1"

            if grep -Eiq 'HTTP[[:space:]]*429|Too Many Requests|rate.?limit' "$log_file"; then
              echo "RATE_LIMIT"
            elif grep -Eiq 'Sign in to confirm|not a bot|bot.?check|captcha|cookies' "$log_file"; then
              echo "AUTH_OR_BOT"
            elif grep -Eiq 'No results found|returned no usable results|no usable results' "$log_file"; then
              echo "NO_MATCH"
            elif grep -Eiq 'HTTP[[:space:]]*403|403 Forbidden|Forbidden' "$log_file"; then
              echo "FORBIDDEN"
            elif grep -Eiq 'timed out|timeout|Connection reset|Temporary failure|Could not resolve host|Name or service not known' "$log_file"; then
              echo "NETWORK"
            elif grep -Eiq 'Requested format is not available|format.*not available' "$log_file"; then
              echo "FORMAT"
            elif grep -Eiq 'premature end|corrupt|invalid data|moov atom not found' "$log_file"; then
              echo "MEDIA_ERROR"
            else
              echo "UNKNOWN"
            fi
          }

          # ----------------------------------------------------------
          # Audio validation
          # ----------------------------------------------------------
          validate_audio_file() {
            local file="$1"
            local min_bytes=4096

            [ -f "$file" ] || return 1

            local size
            size="$(stat -c%s "$file" 2>/dev/null || echo 0)"
            [ "$size" -ge "$min_bytes" ] || return 1

            ffprobe -v error \
              -show_entries format=duration \
              -show_entries stream=codec_name,sample_rate,channels \
              -of json "$file" >/dev/null 2>&1
          }

          count_audio() {
            find "$DOWNLOAD_DIR" -type f \
              \( -iname '*.flac' -o -iname '*.m4a' -o -iname '*.mp3' \
                 -o -iname '*.ogg' -o -iname '*.opus' -o -iname '*.wav' \) |
              wc -l
          }

          # ----------------------------------------------------------
          # JSON result writer
          # ----------------------------------------------------------
          write_result() {
            local index="$1"
            local kind="$2"
            local url="$3"
            local status="$4"
            local provider="$5"
            local attempts="$6"
            local reason="$7"
            local before="$8"
            local after="$9"

            local output_file="$RESULTS_DIR/${index}.json"

            jq -n \
              --arg index "$index" \
              --arg input_type "$kind" \
              --arg url "$url" \
              --arg status "$status" \
              --arg provider "$provider" \
              --arg attempts "$attempts" \
              --arg reason "$reason" \
              --arg before "$before" \
              --arg after "$after" \
              --arg format "$OUTPUT_FORMAT" \
              --arg quality "$AUDIO_QUALITY" \
              --arg vpn "$VPN_AVAILABLE" \
              '{
                index: ($index|tonumber),
                input_type: $input_type,
                url: $url,
                status: $status,
                provider: $provider,
                attempts: ($attempts|tonumber),
                reason: $reason,
                audio_files_before: ($before|tonumber),
                audio_files_after: ($after|tonumber),
                output_format: $format,
                audio_quality: $quality,
                vpn: ($vpn == "true")
              }' > "$output_file"
          }

          # ----------------------------------------------------------
          # One provider attempt
          # ----------------------------------------------------------
          try_spotdl_provider() {
            local index="$1"
            local url="$2"
            local provider="$3"
            local attempt="$4"
            local log_file="$5"

            local before
            before="$(count_audio)"

            local cookie_file=""
            case "$provider" in
              youtube) cookie_file="$COOKIE_FILE_YT" ;;
              youtube-music) cookie_file="$COOKIE_FILE_YTM" ;;
              *) cookie_file="" ;;
            esac

            local cache_file="$WORKDIR/state/cache_${index}_${provider}_${attempt}.json"
            touch "$cache_file"

            local cmd=(
              spotdl download "$url"
              --format "$OUTPUT_FORMAT"
              --bitrate "$SPOTDL_BITRATE"
              --audio "$provider"
              --output "$DOWNLOAD_DIR/{title} - {artists}.{output-ext}"
              --cache-path "$cache_file"
              --threads 4
              --max-retries 3
            )

            # Retry settings are handled by yt-dlp underneath spotDL.
            # They are kept in one string to avoid brittle shell quoting.
            local ytdlp_args
            ytdlp_args="--retries $YTDLP_RETRIES --fragment-retries $YTDLP_FRAGMENT_RETRIES --extractor-retries $YTDLP_EXTRACTOR_RETRIES --file-access-retries $YTDLP_FILE_ACCESS_RETRIES --socket-timeout $YTDLP_SOCKET_TIMEOUT --throttled-rate $YTDLP_THROTTLED_RATE --js-runtimes deno"

            cmd+=(--yt-dlp-args "$ytdlp_args")

            if [ -n "$cookie_file" ] && [ -f "$cookie_file" ]; then
              cmd+=(--cookie-file "$cookie_file")
            fi

            log DOWNLOAD "[$index] provider=$provider attempt=$attempt"

            if timeout --signal=TERM --kill-after=20 "$TIMEOUT_SECONDS" \
              "${cmd[@]}" >"$log_file" 2>&1; then
              :
            else
              local rc=$?
              if [ "$rc" -eq 124 ]; then
                echo "TIMEOUT after ${TIMEOUT_SECONDS}s" >> "$log_file"
              fi
              rm -f "$cache_file"
              return 1
            fi

            rm -f "$cache_file"

            local after
            after="$(count_audio)"

            if [ "$after" -gt "$before" ]; then
              return 0
            fi

            if grep -Eiq 'file already exists|already exists|duplicate' "$log_file"; then
              return 0
            fi

            return 1
          }

          # ----------------------------------------------------------
          # Direct yt-dlp downloader for non-Spotify URLs
          # ----------------------------------------------------------
          try_direct_ytdlp() {
            local index="$1"
            local url="$2"
            local attempt="$3"
            local mode="$4"
            local log_file="$5"

            local output_template="$DOWNLOAD_DIR/%(title)s.%(ext)s"

            local cmd=(
              yt-dlp
              "${YTDLP_BASE_ARGS[@]}"
              --no-part
              -x
              --audio-format "$OUTPUT_FORMAT"
              --audio-quality "$YTDLP_AUDIO_QUALITY"
              -o "$output_template"
              "$url"
            )

            # Optional cookies
            if [[ "$url" =~ youtube ]] || [[ "$url" =~ youtu\.be ]]; then
              if [ "$mode" = "youtube-music" ] && [ -f "$COOKIE_FILE_YTM" ]; then
                cmd+=(--cookies "$COOKIE_FILE_YTM")
              elif [ -f "$COOKIE_FILE_YT" ]; then
                cmd+=(--cookies "$COOKIE_FILE_YT")
              fi
            fi

            # Native downloader is first. aria2c is an independent transport
            # fallback and is useful only where the extracted media supports it.
            if [ "$mode" = "aria2c" ]; then
              cmd+=(--downloader aria2c --downloader-args 'aria2c:-x 4 -s 4 -k 1M --file-allocation=none')
            fi

            log DOWNLOAD "[$index] direct yt-dlp mode=$mode attempt=$attempt"

            if timeout --signal=TERM --kill-after=20 "$TIMEOUT_SECONDS" \
              "${cmd[@]}" >"$log_file" 2>&1; then
              return 0
            fi

            return 1
          }

          # ----------------------------------------------------------
          # Per-URL worker
          # ----------------------------------------------------------
          worker() {
            local index="$1"
            local kind="$2"
            local url="$3"

            local log_file="$LOGS_DIR/${index}.log"
            local provider_used="none"
            local attempts_total=0
            local reason="unknown"
            local status="failed"

            : > "$log_file"

            {
              echo "============================================================"
              echo "JOB $index"
              echo "TYPE: $kind"
              echo "URL : $url"
              echo "TIME: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "FORMAT: $OUTPUT_FORMAT"
              echo "QUALITY: $AUDIO_QUALITY"
              echo "VPN: $VPN_AVAILABLE"
              echo "============================================================"
            } >> "$log_file"

            log INFO "[$index] START $kind | $url"

            local before
            before="$(count_audio)"

            # --------------------------------------------------------
            # Direct URLs: yt-dlp first, aria2c fallback
            # --------------------------------------------------------
            if [ "$kind" != "spotify" ]; then
              local direct_modes=("native" "aria2c")

              for mode in "${direct_modes[@]}"; do
                local attempt
                for attempt in $(seq 1 "$MAX_RETRIES"); do
                  attempts_total=$((attempts_total + 1))

                  if try_direct_ytdlp "$index" "$url" "$attempt" "$mode" "$log_file"; then
                    provider_used="yt-dlp/$mode"
                    status="success"
                    reason="downloaded"
                    break 2
                  fi

                  local error_class
                  error_class="$(classify_error "$log_file")"

                  log RETRY "[$index] mode=$mode attempt=$attempt error=$error_class"

                  case "$error_class" in
                    RATE_LIMIT)
                      sleep "$((2 ** (attempt > 4 ? 4 : attempt)))"
                      ;;
                    AUTH_OR_BOT)
                      # Switching transport alone won't solve authentication.
                      # Move to next fallback after one authenticated attempt.
                      break
                      ;;
                    NO_MATCH|FORMAT)
                      break
                      ;;
                    NETWORK|FORBIDDEN|UNKNOWN|MEDIA_ERROR)
                      sleep "$((2 ** (attempt > 4 ? 4 : attempt)))"
                      ;;
                  esac
                done
              done
            fi

            # --------------------------------------------------------
            # Spotify: spotDL provider fallback chain
            # --------------------------------------------------------
            if [ "$status" != "success" ] && [ "$kind" = "spotify" ]; then
              # Keep youtube-music/youtube first. The additional spotDL
              # providers are independent fallbacks where supported.
              local providers=(
                youtube-music
                youtube
                soundcloud
                bandcamp
                piped
                slider-kz
              )

              local provider
              for provider in "${providers[@]}"; do
                if provider_is_cooling_down "$provider"; then
                  log WARN "[$index] SKIP provider=$provider (circuit breaker)"
                  continue
                fi

                local attempt
                for attempt in $(seq 1 "$MAX_RETRIES"); do
                  attempts_total=$((attempts_total + 1))

                  local provider_log="$LOGS_DIR/${index}_${provider}_${attempt}.log"

                  if try_spotdl_provider "$index" "$url" "$provider" "$attempt" "$provider_log"; then
                    provider_used="$provider"
                    status="success"
                    reason="downloaded"
                    cat "$provider_log" >> "$log_file"
                    break 2
                  fi

                  cat "$provider_log" >> "$log_file"

                  local error_class
                  error_class="$(classify_error "$provider_log")"

                  log RETRY "[$index] provider=$provider attempt=$attempt error=$error_class"

                  case "$error_class" in
                    RATE_LIMIT)
                      # Provider-level circuit breaker for subsequent workers.
                      trip_provider "$provider" 300
                      sleep "$((2 ** (attempt > 4 ? 4 : attempt)))"
                      ;;
                    AUTH_OR_BOT)
                      # One authenticated attempt is useful; don't burn all retries.
                      break
                      ;;
                    NO_MATCH|FORMAT)
                      break
                      ;;
                    NETWORK|FORBIDDEN|UNKNOWN|MEDIA_ERROR)
                      sleep "$((2 ** (attempt > 4 ? 4 : attempt)))"
                      ;;
                  esac
                done
              done
            fi

            # --------------------------------------------------------
            # Final direct fallback for Spotify metadata:
            # spotDL's own URL operation can expose candidate URLs.
            # This does NOT blindly search a Spotify URL on YouTube.
            # Instead it is used only when spotDL's provider layer
            # successfully resolves a friendly URL.
            # --------------------------------------------------------
            if [ "$status" != "success" ] && [ "$kind" = "spotify" ]; then
              local resolved_url=""
              local resolve_log="$LOGS_DIR/${index}_resolve.log"

              if timeout 120 spotdl url "$url" >"$resolve_log" 2>&1; then
                resolved_url="$(grep -Eo 'https?://(www\.)?(youtube\.com|youtu\.be|music\.youtube\.com)/[^[:space:]]+' "$resolve_log" | head -n 1 || true)"
              fi

              if [ -n "$resolved_url" ]; then
                attempts_total=$((attempts_total + 1))
                log SEARCH "[$index] Resolved direct candidate via spotDL URL operation"

                local direct_log="$LOGS_DIR/${index}_resolved_ytdlp.log"
                if try_direct_ytdlp "$index" "$resolved_url" 1 "youtube-music" "$direct_log"; then
                  provider_used="spotdl-url→yt-dlp"
                  status="success"
                  reason="resolved-and-downloaded"
                  cat "$resolve_log" >> "$log_file" || true
                  cat "$direct_log" >> "$log_file" || true
                fi
              fi
            fi

            local after
            after="$(count_audio)"

            if [ "$status" = "success" ]; then
              write_result \
                "$index" "$kind" "$url" \
                "success" "$provider_used" \
                "$attempts_total" "$reason" \
                "$before" "$after"

              log SUCCESS "[$index] SUCCESS provider=$provider_used files=$((after-before))"
            else
              reason="$(classify_error "$log_file")"
              write_result \
                "$index" "$kind" "$url" \
                "failed" "$provider_used" \
                "$attempts_total" "$reason" \
                "$before" "$after"

              printf '%s\n' "$url" > "$RESULTS_DIR/${index}.failed.url"
              log ERROR "[$index] FAILED reason=$reason"
            fi
          }

          export -f timestamp log banner
          export -f provider_is_cooling_down trip_provider
          export -f classify_error validate_audio_file count_audio
          export -f write_result try_spotdl_provider try_direct_ytdlp worker

          export OUTPUT_FORMAT AUDIO_QUALITY SPOTDL_BITRATE YTDLP_AUDIO_QUALITY
          export PARALLEL MAX_RETRIES TIMEOUT_SECONDS VPN_AVAILABLE DEBUG_LOGS
          export YTDLP_RETRIES YTDLP_FRAGMENT_RETRIES YTDLP_EXTRACTOR_RETRIES
          export YTDLP_FILE_ACCESS_RETRIES YTDLP_SOCKET_TIMEOUT YTDLP_THROTTLED_RATE
          export WORKDIR RESULTS_DIR LOGS_DIR DOWNLOAD_DIR STATE_DIR
          export COOKIE_FILE_YT COOKIE_FILE_YTM
          export RAW_CLIENT_ID RAW_CLIENT_SECRET USE_CUSTOM
          export SPOTDL_VERSION YTDLP_VERSION BGUTIL_VERSION

          banner "🎵 MUSIC DOWNLOADER"

          echo "Workers     : $PARALLEL"
          echo "Max retries : $MAX_RETRIES"
          echo "Format      : $OUTPUT_FORMAT"
          echo "Quality     : $AUDIO_QUALITY"
          echo "VPN         : $VPN_AVAILABLE"
          echo "PO Provider : http://127.0.0.1:4416"

          # xargs isolates each URL into a process. Every process has its own
          # primary log/result file, preventing line-level log interleaving.
          cut -f1-3 "$INPUT_FILE" |
            xargs -P "$PARALLEL" -n 3 bash -c 'worker "$1" "$2" "$3"' _

          echo "✅ All URL workers have finished."

          if [ "$VPN_AVAILABLE" = "true" ]; then
            echo "🔌 Disconnecting WireGuard after downloads."
            sudo wg-quick down wg0 >/dev/null 2>&1 || true
          fi

      # ============================================================
      # 11) CONVERT + VALIDATE AUDIO
      # ============================================================
      - name: "🎚️ Normalize, convert and validate audio"
        env:
          OUTPUT_FORMAT: ${{ inputs.output_format }}
          AUDIO_QUALITY: ${{ inputs.audio_quality }}
        run: |
          set -Eeuo pipefail

          SRC="$WORKDIR/downloads"
          DST="$WORKDIR/final"

          mkdir -p "$DST"

          ffmpeg_quality="$AUDIO_QUALITY"
          if [ "$ffmpeg_quality" = "SOURCE" ]; then
            ffmpeg_quality="320k"
          fi

          log() {
            printf '[%s] %-8s %s\n' "$(date -u '+%H:%M:%S')" "$1" "${*:2}"
          }

          unique_target() {
            local target="$1"

            if [ ! -e "$target" ]; then
              echo "$target"
              return
            fi

            local base="${target%.*}"
            local ext="${target##*.}"
            local n=1

            while [ -e "${base} (${n}).${ext}" ]; do
              n=$((n + 1))
            done

            echo "${base} (${n}).${ext}"
          }

          validate() {
            local f="$1"

            [ -f "$f" ] || return 1

            local size
            size="$(stat -c%s "$f" 2>/dev/null || echo 0)"
            [ "$size" -ge 4096 ] || return 1

            ffprobe -v error \
              -show_entries format=duration \
              -show_entries stream=codec_name,sample_rate,channels \
              -of json "$f" >/dev/null 2>&1
          }

          mapfile -t files < <(
            find "$SRC" -type f \
              \( -iname '*.flac' -o -iname '*.m4a' -o -iname '*.mp3' \
                 -o -iname '*.ogg' -o -iname '*.opus' -o -iname '*.wav' \) |
            sort
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "⚠️ No source audio files found."
            exit 0
          fi

          converted=0
          failed=0

          for src in "${files[@]}"; do
            ext="${src##*.}"
            ext_lower="${ext,,}"

            # Keep requested extension.
            if [ "$ext_lower" = "${OUTPUT_FORMAT,,}" ]; then
              target="$(unique_target "$DST/$(basename "$src")")"

              if validate "$src"; then
                mv -f "$src" "$target"
                log OK "Validated: $(basename "$target")"
              else
                log ERROR "Invalid source audio: $src"
                failed=$((failed + 1))
              fi

              continue
            fi

            filename="$(basename "$src")"
            stem="${filename%.*}"
            raw_target="$DST/${stem}.${OUTPUT_FORMAT}"
            target="$(unique_target "$raw_target")"

            log CONVERT "$(basename "$src") -> $(basename "$target")"

            case "$OUTPUT_FORMAT" in
              mp3)
                ffmpeg -hide_banner -loglevel error \
                  -i "$src" \
                  -map 0:a:0 \
                  -map_metadata 0 \
                  -vn \
                  -c:a libmp3lame \
                  -b:a "$ffmpeg_quality" \
                  -id3v2_version 3 \
                  -y "$target"
                ;;
              m4a)
                ffmpeg -hide_banner -loglevel error \
                  -i "$src" \
                  -map 0:a:0 \
                  -map_metadata 0 \
                  -vn \
                  -c:a aac \
                  -b:a "$ffmpeg_quality" \
                  -movflags +faststart \
                  -y "$target"
                ;;
              ogg)
                ffmpeg -hide_banner -loglevel error \
                  -i "$src" \
                  -map 0:a:0 \
                  -map_metadata 0 \
                  -vn \
                  -c:a libvorbis \
                  -b:a "$ffmpeg_quality" \
                  -y "$target"
                ;;
              opus)
                ffmpeg -hide_banner -loglevel error \
                  -i "$src" \
                  -map 0:a:0 \
                  -map_metadata 0 \
                  -vn \
                  -c:a libopus \
                  -b:a "$ffmpeg_quality" \
                  -y "$target"
                ;;
              wav)
                ffmpeg -hide_banner -loglevel error \
                  -i "$src" \
                  -map 0:a:0 \
                  -map_metadata 0 \
                  -vn \
                  -c:a pcm_s16le \
                  -y "$target"
                ;;
              flac)
                ffmpeg -hide_banner -loglevel error \
                  -i "$src" \
                  -map 0:a:0 \
                  -map_metadata 0 \
                  -vn \
                  -c:a flac \
                  -compression_level 5 \
                  -y "$target"
                ;;
              *)
                echo "❌ Unsupported output format: $OUTPUT_FORMAT"
                exit 1
                ;;
            esac

            if validate "$target"; then
              rm -f "$src"
              converted=$((converted + 1))
              log OK "Validated: $(basename "$target")"
            else
              rm -f "$target"
              failed=$((failed + 1))
              log ERROR "Validation failed: $(basename "$target")"
            fi
          done

          echo "Converted/validated: $converted"
          echo "Failed conversions: $failed"

      # ============================================================
      # 12) BUILD MANIFEST / CHECKSUMS
      # ============================================================
      - name: "📋 Build manifest and checksums"
        run: |
          set -Eeuo pipefail

          FINAL="$WORKDIR/final"
          META="$WORKDIR/metadata"

          mkdir -p "$META"

          success_count="$(find "$WORKDIR/results" -maxdepth 1 -name '*.json' -type f -print0 | xargs -0 -r jq -r 'select(.status=="success") | .index' | wc -l)"
          failed_count="$(find "$WORKDIR/results" -maxdepth 1 -name '*.json' -type f -print0 | xargs -0 -r jq -r 'select(.status=="failed") | .index' | wc -l)"
          track_count="$(find "$FINAL" -type f | wc -l)"
          total_size="$(du -sb "$FINAL" 2>/dev/null | awk '{print $1}' || echo 0)"

          jq -s \
            --arg generated_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg workflow "${{ github.workflow }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg repo "${{ github.repository }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg spotdl "$(spotdl --version 2>/dev/null || true)" \
            --arg ytdlp "$(yt-dlp --version)" \
            --arg deno "$(deno --version | head -n 1)" \
            --arg ffmpeg "$(ffmpeg -version 2>&1 | head -n 1)" \
            --arg format "${{ inputs.output_format }}" \
            --arg quality "${{ inputs.audio_quality }}" \
            --arg vpn "${{ steps.vpn.outputs.vpn_available }}" \
            --arg success "$success_count" \
            --arg failed "$failed_count" \
            --arg tracks "$track_count" \
            --arg size "$total_size" \
            '{
              generated_at: $generated_at,
              workflow: $workflow,
              run_id: $run_id,
              repository: $repo,
              ref: $ref,
              versions: {
                spotdl: $spotdl,
                ytdlp: $ytdlp,
                deno: $deno,
                ffmpeg: $ffmpeg
              },
              options: {
                output_format: $format,
                audio_quality: $quality,
                vpn: ($vpn == "true")
              },
              statistics: {
                successful_urls: ($success|tonumber),
                failed_urls: ($failed|tonumber),
                final_audio_files: ($tracks|tonumber),
                final_bytes: ($size|tonumber)
              },
              requests: .
            }' "$WORKDIR/results"/*.json > "$META/manifest.json"

          if [ -d "$FINAL" ] && find "$FINAL" -type f -print -quit | grep -q .; then
            find "$FINAL" -type f -print0 |
              sort -z |
              xargs -0 sha256sum > "$META/SHA256SUMS.txt"
          else
            : > "$META/SHA256SUMS.txt"
          fi

          cp "$META/manifest.json" "$FINAL/manifest.json"
          cp "$META/SHA256SUMS.txt" "$FINAL/SHA256SUMS.txt"

          # Human-readable failed list.
          {
            find "$WORKDIR/results" -name '*.failed.url' -type f -print0 |
              xargs -0 -r cat
          } | sort -u > "$META/failed_urls.txt"

          echo "::group::📊 Manifest summary"
          jq '.statistics, .options, .versions' "$META/manifest.json"
          echo "::endgroup::"

      # ============================================================
      # 13) GITHUB STEP SUMMARY
      # ============================================================
      - name: "📊 Publish GitHub Step Summary"
        if: always()
        run: |
          set -Eeuo pipefail

          MANIFEST="$WORKDIR/metadata/manifest.json"
          FAILED="$WORKDIR/metadata/failed_urls.txt"

          {
            echo "# 🎵 Music Downloader"
            echo
            echo "## Run"
            echo
            echo "- **Repository:** $GITHUB_REPOSITORY"
            echo "- **Run:** $GITHUB_RUN_ID"
            echo "- **Ref:** $GITHUB_REF_NAME"
            echo "- **Format:** ${{ inputs.output_format }}"
            echo "- **Quality:** ${{ inputs.audio_quality }}"
            echo "- **VPN:** ${{ steps.vpn.outputs.vpn_available }}"
            echo "- **PO token provider:** bgutil ${{ inputs.bgutil_version }}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$MANIFEST" ]; then
            success="$(jq -r '.statistics.successful_urls' "$MANIFEST")"
            failed="$(jq -r '.statistics.failed_urls' "$MANIFEST")"
            tracks="$(jq -r '.statistics.final_audio_files' "$MANIFEST")"
            bytes="$(jq -r '.statistics.final_bytes' "$MANIFEST")"

            human_size="$(numfmt --to=iec --suffix=B "$bytes" 2>/dev/null || echo "${bytes}B")"

            {
              echo "## 📈 Results"
              echo
              echo "| Metric | Value |"
              echo "|---|---:|"
              echo "| Successful URLs | $success |"
              echo "| Failed URLs | $failed |"
              echo "| Final audio files | $tracks |"
              echo "| Final size | $human_size |"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s "$FAILED" ]; then
            {
              echo "## ⚠️ Failed URLs"
              echo
              echo '```text'
              cat "$FAILED"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ============================================================
      # 14) PACKAGE
      # ============================================================
      - name: "📦 Package final output"
        id: package
        env:
          BUNDLE_ALL: ${{ inputs.bundle_all }}
          UPLOAD_METHOD: ${{ inputs.upload_method }}
        run: |
          set -Eeuo pipefail

          FINAL="$WORKDIR/final"
          ARCHIVE="$WORKDIR/archive"

          rm -rf "$ARCHIVE"
          mkdir -p "$ARCHIVE"

          # The archive itself should never be compressed because the payload
          # is already compressed audio in most cases.
          if [ "$BUNDLE_ALL" = "true" ]; then
            base="music-${GITHUB_RUN_ID}-${RANDOM}"
            zip_name="${base}.zip"

            case "$UPLOAD_METHOD" in
              repo)
                # Keep parts comfortably below GitHub's 100 MiB repository file limit.
                (cd "$FINAL" && zip -0 -r -s 95m "../archive/${zip_name}" .)
                ;;
              release)
                # GitHub Release assets must be under 2 GiB each.
                (cd "$FINAL" && zip -0 -r -s 1900m "../archive/${zip_name}" .)
                ;;
              drive)
                # Drive supports large files; no artificial GitHub split required.
                (cd "$FINAL" && zip -0 -r "../archive/${zip_name}" .)
                ;;
            esac
          else
            shopt -s nullglob
            for file in "$FINAL"/*; do
              [ -f "$file" ] || continue

              base="$(basename "$file")"
              safe="$(printf '%s' "$base" | tr ' ' '_' | tr -cd '[:alnum:]._-')"

              [ -n "$safe" ] || safe="track"

              case "$UPLOAD_METHOD" in
                repo)
                  (cd "$FINAL" && zip -0 -s 95m "../archive/${safe}.zip" "$base")
                  ;;
                release)
                  (cd "$FINAL" && zip -0 -s 1900m "../archive/${safe}.zip" "$base")
                  ;;
                drive)
                  (cd "$FINAL" && zip -0 "../archive/${safe}.zip" "$base")
                  ;;
              esac
            done
          fi

          # Always publish diagnostics separately.
          cp "$WORKDIR/metadata/manifest.json" "$ARCHIVE/manifest.json"
          cp "$WORKDIR/metadata/SHA256SUMS.txt" "$ARCHIVE/SHA256SUMS.txt"
          cp "$WORKDIR/metadata/failed_urls.txt" "$ARCHIVE/failed_urls.txt"

          find "$ARCHIVE" -maxdepth 1 -type f -printf '%f\n' | sort > "$WORKDIR/metadata/assets.txt"

          echo "::group::📦 Archive contents"
          ls -lah "$ARCHIVE"
          echo "::endgroup::"

      # ============================================================
      # 15) UPLOAD DIAGNOSTICS AS ACTION ARTIFACT
      # ============================================================
      - name: "🧰 Upload diagnostics artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloader-diagnostics-${{ github.run_id }}
          path: |
            work/logs/
            work/results/
            work/metadata/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      # ============================================================
      # 16) GOOGLE DRIVE — RESUMABLE CHUNKED UPLOAD
      # ============================================================
      - name: "☁️ Upload to Google Drive"
        if: ${{ inputs.upload_method == 'drive' }}
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail

          ARCHIVE="$WORKDIR/archive"
          CHUNK_SIZE=$((16 * 1024 * 1024))

          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "❌ Google Drive secrets are incomplete."
            exit 1
          fi

          echo "::group::🔑 Get Google access token"

          token_response="$(
            curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
              -X POST \
              https://oauth2.googleapis.com/token \
              -d client_id="$CLIENT_ID" \
              -d client_secret="$CLIENT_SECRET" \
              -d refresh_token="$REFRESH_TOKEN" \
              -d grant_type=refresh_token
          )"

          ACCESS_TOKEN="$(jq -r '.access_token // empty' <<< "$token_response")"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ Could not obtain Google access token."
            echo "$token_response" | jq .
            exit 1
          fi

          echo "✅ Access token obtained."
          echo "::endgroup::"

          FOLDER_NAME="github-actions"

          echo "::group::📁 Locate Google Drive folder"

          # Fixed folder name intentionally avoids unescaped arbitrary input.
          QUERY="mimeType='application/vnd.google-apps.folder' and name='${FOLDER_NAME}' and trashed=false"

          FOLDER_ID="$(
            curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
              -G \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              --data-urlencode "q=$QUERY" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "fields=files(id,name)" \
              "https://www.googleapis.com/drive/v3/files" |
            jq -r '.files[0].id // empty'
          )"

          if [ -z "$FOLDER_ID" ]; then
            BODY="$(jq -n \
              --arg name "$FOLDER_NAME" \
              '{name:$name,mimeType:"application/vnd.google-apps.folder"}')"

            FOLDER_ID="$(
              curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
                -X POST \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$BODY" \
                "https://www.googleapis.com/drive/v3/files?fields=id" |
              jq -r '.id // empty'
            )"
          fi

          if [ -z "$FOLDER_ID" ]; then
            echo "❌ Unable to locate/create Drive folder."
            exit 1
          fi

          echo "✅ Drive folder ready."
          echo "::endgroup::"

          upload_resumable() {
            local file="$1"
            local name
            name="$(basename "$file")"
            local size
            size="$(stat -c%s "$file")"

            echo "⬆️ $name ($(numfmt --to=iec --suffix=B "$size" 2>/dev/null || echo "${size}B"))"

            local metadata
            metadata="$(
              jq -n \
                --arg name "$name" \
                --arg parent "$FOLDER_ID" \
                '{name:$name,parents:[$parent]}'
            )"

            local headers_file
            headers_file="$(mktemp)"

            curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
              -D "$headers_file" \
              -o /dev/null \
              -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: application/octet-stream" \
              -H "X-Upload-Content-Length: $size" \
              -d "$metadata" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable" || {
                rm -f "$headers_file"
                return 1
              }

            local session_uri
            session_uri="$(
              awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' \
                "$headers_file"
            )"

            rm -f "$headers_file"

            if [ -z "$session_uri" ]; then
              echo "❌ Resumable session was not created for $name"
              return 1
            fi

            local offset=0

            while [ "$offset" -lt "$size" ]; do
              local end=$((offset + CHUNK_SIZE - 1))
              if [ "$end" -ge "$size" ]; then
                end=$((size - 1))
              fi

              local chunk_len=$((end - offset + 1))
              local response_file
              response_file="$(mktemp)"

              local http_code=0
              local chunk_uploaded=false
              local chunk_number=$((offset / CHUNK_SIZE))

              for retry in 1 2 3 4 5; do
                http_code="$(
                  dd if="$file" \
                     bs="$CHUNK_SIZE" \
                     skip="$chunk_number" \
                     count=1 \
                     2>/dev/null |
                  curl -sS \
                    -o "$response_file" \
                    -w '%{http_code}' \
                    -X PUT \
                    -H "Authorization: Bearer $ACCESS_TOKEN" \
                    -H "Content-Length: $chunk_len" \
                    -H "Content-Range: bytes $offset-$end/$size" \
                    --data-binary @- \
                    "$session_uri" || echo 000
                )"

                if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
                  offset=$size
                  chunk_uploaded=true
                  rm -f "$response_file"
                  break
                elif [ "$http_code" = "308" ]; then
                  range="$(grep -i '^Range:' "$response_file" | tr -d '\r' | tail -n 1 || true)"

                  if [[ "$range" =~ bytes=0-([0-9]+) ]]; then
                    offset=$((BASH_REMATCH[1] + 1))
                  else
                    offset=$((end + 1))
                  fi

                  chunk_uploaded=true
                  rm -f "$response_file"
                  break
                elif [[ "$http_code" =~ ^5[0-9][0-9]$ ]] || [ "$http_code" = "000" ]; then
                  rm -f "$response_file"
                  sleep "$((2 ** (retry - 1)))"
                else
                  echo "❌ Drive chunk upload failed: HTTP $http_code"
                  cat "$response_file" || true
                  rm -f "$response_file"
                  return 1
                fi
              done

              if [ "$chunk_uploaded" != "true" ]; then
                echo "❌ Drive chunk failed after 5 retries at offset $offset."
                rm -f "$response_file"
                return 1
              fi

              percent=$((offset * 100 / size))
              echo "   progress: ${percent}%"
            done

            echo "✅ Uploaded $name"
          }

          shopt -s nullglob
          for file in "$ARCHIVE"/*.zip "$ARCHIVE"/manifest.json "$ARCHIVE"/SHA256SUMS.txt "$ARCHIVE"/failed_urls.txt; do
            [ -f "$file" ] || continue
            upload_resumable "$file"
          done

      # ============================================================
      # 17) GITHUB REPO UPLOAD (LEGACY OPTION)
      # ============================================================
      - name: "📤 Upload to repository"
        if: ${{ inputs.upload_method == 'repo' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf "music"
          mkdir -p "music"
          cp "$WORKDIR/archive"/* "music/"

          git add music/

          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit."
            exit 0
          fi

          git commit -m "Add music downloader output [skip ci]"

          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$BRANCH" || true

            if git push origin "$BRANCH"; then
              echo "✅ Repository upload complete."
              break
            fi

            if [ "$i" -eq 5 ]; then
              echo "❌ Repository push failed after 5 attempts."
              exit 1
            fi

            sleep "$((i * 3))"
          done

      # ============================================================
      # 18) GITHUB RELEASE
      # ============================================================
      - name: "🏷️ Create GitHub Release"
        if: ${{ inputs.upload_method == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          ARCHIVE="$WORKDIR/archive"

          timestamp="$(date -u '+%Y%m%d-%H%M%S')"
          tag="music-downloader-${timestamp}-${GITHUB_RUN_ID}"

          success="$(jq -r '.statistics.successful_urls' "$WORKDIR/metadata/manifest.json")"
          failed="$(jq -r '.statistics.failed_urls' "$WORKDIR/metadata/manifest.json")"
          tracks="$(jq -r '.statistics.final_audio_files' "$WORKDIR/metadata/manifest.json")"

          notes="$WORKDIR/metadata/release-notes.md"

          {
            echo "# 🎵 Music Downloader"
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Successful URLs | $success |"
            echo "| Failed URLs | $failed |"
            echo "| Final audio files | $tracks |"
            echo "| Format | ${{ inputs.output_format }} |"
            echo "| Quality | ${{ inputs.audio_quality }} |"
            echo "| VPN | ${{ steps.vpn.outputs.vpn_available }} |"
            echo "| spotDL | $(spotdl --version 2>/dev/null || true) |"
            echo "| yt-dlp | $(yt-dlp --version) |"
            echo "| bgutil | ${{ inputs.bgutil_version }} |"
            echo
            echo "Generated by GitHub Actions run ${GITHUB_RUN_ID}."
          } > "$notes"

          for attempt in 1 2 3; do
            if gh release create "$tag" \
              --title "music-downloader-${timestamp}" \
              --notes-file "$notes" \
              --target "${GITHUB_SHA}"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "❌ Failed to create release."
              exit 1
            fi

            sleep "$((attempt * 3))"
          done

          shopt -s nullglob

          for file in "$ARCHIVE"/*; do
            [ -f "$file" ] || continue

            echo "⬆️ Uploading release asset: $(basename "$file")"

            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" "$file" --clobber; then
                uploaded=true
                break
              fi
              sleep "$((attempt * 3))"
            done

            if [ "$uploaded" != "true" ]; then
              echo "❌ Failed to upload: $file"
              exit 1
            fi
          done

          echo "✅ Release published: $tag"

      # ============================================================
      # 19) FINAL STATUS
      # ============================================================
      - name: "✅ Final status"
        if: always()
        env:
          FAIL_ON_PARTIAL: ${{ inputs.fail_on_partial }}
        run: |
          set -Eeuo pipefail

          MANIFEST="$WORKDIR/metadata/manifest.json"

          if [ ! -f "$MANIFEST" ]; then
            echo "⚠️ Manifest is missing."
            exit 0
          fi

          success="$(jq -r '.statistics.successful_urls' "$MANIFEST")"
          failed="$(jq -r '.statistics.failed_urls' "$MANIFEST")"
          tracks="$(jq -r '.statistics.final_audio_files' "$MANIFEST")"

          echo
          echo "╭──────────────────────── SUMMARY ──────────────────────────────╮"
          printf '│ Successful URLs : %-40s │\n' "$success"
          printf '│ Failed URLs     : %-40s │\n' "$failed"
          printf '│ Audio files     : %-40s │\n' "$tracks"
          printf '│ Output format   : %-40s │\n' "${{ inputs.output_format }}"
          printf '│ Quality         : %-40s │\n' "${{ inputs.audio_quality }}"
          printf '│ VPN             : %-40s │\n' "${{ steps.vpn.outputs.vpn_available }}"
          echo "╰───────────────────────────────────────────────────────────────╯"
          echo

          if [ "$failed" -gt 0 ] && [ "$FAIL_ON_PARTIAL" = "true" ]; then
            echo "❌ Partial failure detected and fail_on_partial=true."
            exit 1
          fi

          if [ "$tracks" -eq 0 ]; then
            echo "❌ No validated audio files were produced."
            exit 1
          fi

          echo "✅ Workflow completed."

      # ============================================================
      # 20) FINAL CLEANUP
      # ============================================================
      - name: "🧹 Cleanup"
        if: always()
        run: |
          set +e

          sudo wg-quick down wg0 >/dev/null 2>&1 || true
          docker rm -f bgutil-provider >/dev/null 2>&1 || true

          # Never print secret-bearing files.
          rm -f "$WORKDIR/input/wg0.conf"
          rm -f "$WORKDIR/input/youtube_cookies.txt"
          rm -f "$WORKDIR/input/youtube_music_cookies.txt"

          echo "🧹 Cleanup complete."
