name: downloader-spotify

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "🎵 Spotify/Tidal/Apple Music/SoundCloud/YouTube/Pandora URLs"
        required: true
        type: string

      output_format:
        description: "🎧 Output format"
        required: true
        type: choice
        options:
          - mp3
          - flac
          - m4a
          - ogg
          - opus
          - wav
        default: mp3

      audio_quality:
        description: "🎚️ Audio quality / bitrate"
        required: true
        type: choice
        options:
          - 320k
          - 256k
          - 192k
          - 128k
          - LOSSLESS
          - HI_RES_LOSSLESS
          - HIGH
          - LOW
        default: 320k

      upload_method:
        description: "☁️ Upload destination"
        required: true
        type: choice
        options:
          - drive
          - repo
          - release
        default: drive

      fallback_soundcloud:
        description: "☁️ Fallback: SoundCloud?"
        required: true
        type: boolean
        default: false

      fallback_bandcamp:
        description: "🎸 Fallback: Bandcamp?"
        required: true
        type: boolean
        default: false

      fallback_piped:
        description: "⚡ Fallback: Piped?"
        required: true
        type: boolean
        default: false

      bundle_all:
        description: "📦 Bundle all tracks into one ZIP?"
        required: true
        type: boolean
        default: true

      vpn_enabled:
        description: "🔒 Enable WireGuard VPN?"
        required: true
        type: boolean
        default: false

      use_custom_credentials:
        description: "🔑 Use custom Spotify credentials?"
        required: true
        type: boolean
        default: false

      concurrent_downloads:
        description: "⚡ Concurrent URL workers"
        required: true
        type: number
        default: 2

      retry_count:
        description: "🔄 Transient retries per provider"
        required: true
        type: number
        default: 2

      raw_logs:
        description: "🧪 Show raw spotDL/yt-dlp logs?"
        required: true
        type: boolean
        default: false

      fail_on_partial:
        description: "❌ Fail workflow if any URL fails?"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: music-downloader-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  POT_SERVER_PORT: "4416"
  DEFAULT_PARALLEL: "2"
  DEFAULT_RETRIES: "2"
  SPOTDL_THREADS: "3"

  YTDLP_RETRIES: "8"
  YTDLP_FRAGMENT_RETRIES: "8"
  YTDLP_EXTRACTOR_RETRIES: "5"
  YTDLP_FILE_ACCESS_RETRIES: "5"
  YTDLP_SOCKET_TIMEOUT: "30"
  YTDLP_CONCURRENT_FRAGMENTS: "3"

  DRIVE_CHUNK_SIZE: "16777216"
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  music-download:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    steps:
      # ============================================================
      # 01. CHECKOUT
      # ============================================================

      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      # ============================================================
      # 02. SYSTEM DEPENDENCIES
      # ============================================================

      - name: "🛠️ Install system dependencies"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            ffmpeg \
            curl \
            jq \
            zip \
            unzip \
            aria2 \
            wireguard-tools \
            openssl \
            python3 \
            python3-pip \
            python-is-python3

          echo "✅ System dependencies installed."

      # ============================================================
      # 03. DENO
      # ============================================================

      - name: "🦕 Install latest Deno"
        run: |
          set -Eeuo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            https://deno.land/install.sh \
            | sh -s -- -y

          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.deno/bin:$PATH"

          deno --version

      # ============================================================
      # 04. PYTHON PACKAGES
      # ============================================================

      - name: "📦 Install latest downloader packages"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          set -Eeuo pipefail

          python3 -m pip install \
            --upgrade \
            --break-system-packages \
            --retries 5 \
            --timeout 60 \
            pip \
            setuptools \
            wheel

          python3 -m pip install \
            --upgrade \
            --break-system-packages \
            --retries 5 \
            --timeout 60 \
            spotdl \
            "yt-dlp[default]" \
            yt-dlp-ejs \
            bgutil-ytdlp-pot-provider

      # ============================================================
      # 05. TOOLCHAIN
      # ============================================================

      - name: "🔎 Show installed versions"
        run: |
          set -Eeuo pipefail

          echo "Python : $(python3 --version 2>&1)"
          echo "spotDL : $(spotdl --version 2>&1 || true)"
          echo "yt-dlp : $(yt-dlp --version)"
          echo "Deno   : $(deno --version | sed -n '1p')"
          echo "FFmpeg : $(ffmpeg -version | sed -n '1p')"
          echo "FFprobe: $(ffprobe -version | sed -n '1p')"

          echo
          python3 -m pip list |
            grep -Ei \
              'spotdl|yt-dlp|bgutil|ejs|spotipy|mutagen|rapidfuzz' \
            || true

      # ============================================================
      # 06. WORKSPACE & IDENTIFIER
      # ============================================================

      - name: "📁 Initialize workspace"
        run: |
          set -Eeuo pipefail

          RUN_SUFFIX="$(openssl rand -hex 4 | cut -c1-5)"
          echo "RUN_SUFFIX=${RUN_SUFFIX}" >> "$GITHUB_ENV"
          echo "🆔 Generated identifier: ${RUN_SUFFIX}"

          rm -rf work music

          mkdir -p \
            work/downloads \
            work/logs \
            work/results \
            work/failed \
            work/archive \
            work/package \
            music

          echo "✅ Workspace initialized."

      # ============================================================
      # 07. PARSE URLs
      # ============================================================

      - name: "🔗 Parse and classify URLs"
        env:
          RAW_URLS: ${{ inputs.urls }}
        run: |
          set -Eeuo pipefail

          : > work/input_urls.txt
          : > work/jobs.tsv

          printf '%s\n' "$RAW_URLS" |
            tr ',' '\n' |
            sed 's/\r//g' |
            awk '{
              for (i = 1; i <= NF; i++) {
                print $i
              }
            }' |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
            awk 'NF' |
            sort -u \
            > work/input_urls.txt

          if [ ! -s work/input_urls.txt ]; then
            echo "❌ No URLs supplied."
            exit 1
          fi

          index=0

          while IFS= read -r url; do
            index=$((index + 1))
            type=""

            if [[ "$url" =~ ^https?://(open\.)?spotify\.com/ ]]; then
              type="spotify"
            elif [[ "$url" =~ ^https?://(www\.)?youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://music\.youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://youtu\.be/ ]]; then
              type="youtube"
            elif [[ "$url" =~ ^https?://(www\.)?soundcloud\.com/ ]]; then
              type="soundcloud"
            elif [[ "$url" =~ ^https?://(www\.)?tidal\.com/ ]] ||
                 [[ "$url" =~ ^https?://listen\.tidal\.com/ ]]; then
              type="tidal"
            elif [[ "$url" =~ ^https?://(www\.)?music\.apple\.com/ ]]; then
              type="apple"
            elif [[ "$url" =~ ^https?://(www\.)?pandora\.com/ ]] ||
                 [[ "$url" =~ ^https?://pandora\.app\.link/ ]]; then
              type="pandora"
            fi

            if [ -z "$type" ]; then
              echo "⚠️ Unsupported URL skipped: $url"
              continue
            fi

            printf '%04d\t%s\t%s\n' \
              "$index" \
              "$type" \
              "$url" \
              >> work/jobs.tsv
          done < work/input_urls.txt

          if [ ! -s work/jobs.tsv ]; then
            echo "❌ No supported URLs found."
            exit 1
          fi

          echo
          echo "Accepted URLs: $(wc -l < work/jobs.tsv)"
          cat work/jobs.tsv

      # ============================================================
      # 08. OPTIONAL WIREGUARD
      # ============================================================

      - name: "🔒 Configure WireGuard"
        id: vpn
        env:
          VPN_ENABLED: ${{ inputs.vpn_enabled }}
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          set -Eeuo pipefail

          if [ "$VPN_ENABLED" != "true" ]; then
            echo "🚫 VPN disabled."
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$WG_CONFIG" ]; then
            echo "⚠️ VPN requested but WG_CONFIG is empty."
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          umask 077
          printf '%s\n' "$WG_CONFIG" > /tmp/wg0.conf

          sudo install \
            -m 600 \
            /tmp/wg0.conf \
            /etc/wireguard/wg0.conf

          if sudo wg-quick up wg0; then
            echo "✅ WireGuard connected."

            public_ip="$(
              curl \
                -4 \
                --silent \
                --show-error \
                --max-time 15 \
                https://api.ipify.org \
              || echo "unavailable"
            )"

            echo "🌐 Public IPv4: $public_ip"
            echo "vpn_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ WireGuard failed."
            sudo wg-quick down wg0 >/dev/null 2>&1 || true
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # 09. BGUTIL PO TOKEN
      # ============================================================

      - name: "🛡️ Start bgutil PO-token provider"
        id: pot
        run: |
          set -Eeuo pipefail

          image="brainicism/bgutil-ytdlp-pot-provider:latest"

          docker rm -f bgutil-provider >/dev/null 2>&1 || true

          echo "🐳 Pulling $image"

          if ! docker pull "$image"; then
            echo "⚠️ Failed to pull bgutil."
            echo "pot_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker run \
            --name bgutil-provider \
            --detach \
            --init \
            --network host \
            "$image"

          ready="false"
          echo "⏳ Waiting for bgutil..."

          for attempt in $(seq 1 40); do
            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 3 \
              "http://127.0.0.1:${POT_SERVER_PORT}/ping" \
              >/tmp/bgutil-ping.json \
              2>/dev/null; then

              ready="true"
              break
            fi
            sleep 2
          done

          if [ "$ready" = "true" ]; then
            echo "✅ bgutil ready."
            echo "pot_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ bgutil failed health check."
            docker logs bgutil-provider > work/logs/bgutil-provider.log 2>&1 || true
            echo "pot_available=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # 10. DOWNLOAD ENGINE
      # ============================================================

      - name: "⬇️ Download media"
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_MUSIC_COOKIES: ${{ secrets.YOUTUBE_MUSIC_COOKIES }}
          USE_CUSTOM_CREDENTIALS: ${{ inputs.use_custom_credentials }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
          AUDIO_QUALITY: ${{ inputs.audio_quality }}
          CONCURRENT_WORKERS: ${{ inputs.concurrent_downloads }}
          RETRY_COUNT: ${{ inputs.retry_count }}
          RAW_LOGS: ${{ inputs.raw_logs }}
          POT_AVAILABLE: ${{ steps.pot.outputs.pot_available }}
          VPN_AVAILABLE: ${{ steps.vpn.outputs.vpn_available }}
          FALLBACK_SOUNDCLOUD: ${{ inputs.fallback_soundcloud }}
          FALLBACK_BANDCAMP: ${{ inputs.fallback_bandcamp }}
          FALLBACK_PIPED: ${{ inputs.fallback_piped }}
        run: |
          set -Eeuo pipefail

          FORMAT="$OUTPUT_FORMAT"
          QUALITY="$AUDIO_QUALITY"
          WORKERS="$CONCURRENT_WORKERS"
          RETRIES="$RETRY_COUNT"

          if ! [[ "$WORKERS" =~ ^[1-8]$ ]]; then
            WORKERS="$DEFAULT_PARALLEL"
          fi

          if ! [[ "$RETRIES" =~ ^[1-6]$ ]]; then
            RETRIES="$DEFAULT_RETRIES"
          fi

          case "$QUALITY" in
            320k|256k|192k|128k)
              BITRATE="$QUALITY"
              ;;
            HIGH)
              BITRATE="320k"
              ;;
            LOW)
              BITRATE="128k"
              ;;
            LOSSLESS|HI_RES_LOSSLESS)
              if [ "$FORMAT" = "flac" ] || [ "$FORMAT" = "wav" ]; then
                BITRATE="disable"
              else
                BITRATE="320k"
              fi
              ;;
            *)
              BITRATE="320k"
              ;;
          esac

          COOKIE_YT=""
          COOKIE_YTM=""

          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/youtube-cookies.txt
            chmod 600 /tmp/youtube-cookies.txt
            COOKIE_YT="/tmp/youtube-cookies.txt"
          fi

          if [ -n "$YOUTUBE_MUSIC_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_MUSIC_COOKIES" > /tmp/youtube-music-cookies.txt
            chmod 600 /tmp/youtube-music-cookies.txt
            COOKIE_YTM="/tmp/youtube-music-cookies.txt"
          fi

          now() {
            date '+%H:%M:%S'
          }

          format_duration() {
            local secs="$1"
            if [ "$secs" -ge 60 ]; then
              printf '%dm %ds' $((secs / 60)) $((secs % 60))
            else
              printf '%ds' "$secs"
            fi
          }

          # Mutex print to prevent terminal mangling
          safe_log() {
            (
              flock -x 200
              printf '%b\n' "$1"
            ) 200>/tmp/terminal.lock
          }

          log_timing() {
            local id="$1"
            local message="$2"
            printf '[%s] %s\n' "$(now)" "$message" >> "work/logs/${id}-timing.log"
          }

          has_audio() {
            local dir="$1"
            find "$dir" -type f \( \
              -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' \
              -o -iname '*.ogg' -o -iname '*.opus' -o -iname '*.wav' \
              -o -iname '*.webm' -o -iname '*.aac' \
            \) -print -quit | grep -q .
          }

          classify_error() {
            local logfile="$1"

            if grep -qiE 'invalid choice:|unrecognized arguments|no such option|usage: spotdl|argument .* error' "$logfile"; then
              echo "CONFIGURATION"
              return
            fi

            if grep -qiE 'No results found for song:|no usable provider result|no provider result|no results found|returned no usable results|could not find|unable to find|no matches|no match' "$logfile"; then
              echo "NO_RESULT"
              return
            fi

            if grep -qiE '429|Too Many Requests|rate.?limit' "$logfile"; then
              echo "RATE_LIMIT"
              return
            fi

            if grep -qiE 'not a bot|confirm you.re not a bot|captcha|bot detection' "$logfile"; then
              echo "BLOCKED"
              return
            fi

            if grep -qiE 'HTTP Error 403|HTTP 403|Forbidden' "$logfile"; then
              echo "FORBIDDEN"
              return
            fi

            if grep -qiE 'timed out|timeout|Connection reset|Connection aborted|Temporary failure|Could not resolve|network error|Network is unreachable' "$logfile"; then
              echo "NETWORK"
              return
            fi

            if grep -qiE 'Requested format is not available|No video formats found|No formats found' "$logfile"; then
              echo "FORMAT"
              return
            fi

            echo "UNKNOWN"
          }

          detect_providers() {
            local probe choices help_text
            probe="$(spotdl download --audio __invalid_provider__ https://example.invalid 2>&1 || true)"
            choices="$(printf '%s\n' "$probe" | grep -F 'choose from' | tail -n 1 || true)"
            help_text="$(spotdl --help 2>&1 || true)"

            SUPPORTED_PROVIDERS=()
            local candidates=(youtube-music youtube soundcloud bandcamp piped)
            local provider

            for provider in "${candidates[@]}"; do
              if [ -n "$choices" ]; then
                if [[ "$choices" == *"'${provider}'"* ]]; then
                  SUPPORTED_PROVIDERS+=("$provider")
                fi
              elif grep -Fq "$provider" <<< "$help_text"; then
                SUPPORTED_PROVIDERS+=("$provider")
              fi
            done

            if [ "${#SUPPORTED_PROVIDERS[@]}" -eq 0 ]; then
              echo "❌ No supported spotDL providers detected."
              echo "$probe"
              return 1
            fi
          }

          provider_supported() {
            local wanted="$1"
            local provider
            for provider in "${SUPPORTED_PROVIDERS[@]}"; do
              if [ "$provider" = "$wanted" ]; then
                return 0
              fi
            done
            return 1
          }

          provider_cookie() {
            local provider="$1"
            case "$provider" in
              youtube-music)
                if [ -n "$COOKIE_YTM" ]; then
                  printf '%s' "$COOKIE_YTM"
                elif [ -n "$COOKIE_YT" ]; then
                  printf '%s' "$COOKIE_YT"
                fi
                ;;
              youtube)
                if [ -n "$COOKIE_YT" ]; then
                  printf '%s' "$COOKIE_YT"
                elif [ -n "$COOKIE_YTM" ]; then
                  printf '%s' "$COOKIE_YTM"
                fi
                ;;
            esac
          }

          run_spotdl_provider() {
            local id="$1"
            local url="$2"
            local provider="$3"
            local attempt="$4"

            local dir="work/downloads/${id}"
            local logfile="work/logs/${id}-${provider}-attempt-${attempt}.log"

            mkdir -p "$dir/cache"

            local -a cmd=(
              spotdl
              download
              "$url"
              --audio
              "$provider"
              --format
              "$FORMAT"
              --bitrate
              "$BITRATE"
              --output
              "${dir}/{title} - {artists}.{output-ext}"
              --threads
              "$SPOTDL_THREADS"
              --max-retries
              3
              --overwrite
              skip
              --restrict
              none
              --max-filename-length
              180
              --print-errors
              --log-level
              INFO
              --cache-path
              "${dir}/cache"
              --archive
              "${dir}/archive.txt"
            )

            if [ "$RAW_LOGS" = "true" ]; then
              cmd+=(--log-level DEBUG)
            fi

            if [ "$USE_CUSTOM_CREDENTIALS" = "true" ] &&
               [ -n "$SPOTIFY_CLIENT_ID" ] &&
               [ -n "$SPOTIFY_CLIENT_SECRET" ]; then
              export SPOTIPY_CLIENT_ID="$SPOTIFY_CLIENT_ID"
              export SPOTIPY_CLIENT_SECRET="$SPOTIFY_CLIENT_SECRET"
            else
              unset SPOTIPY_CLIENT_ID 2>/dev/null || true
              unset SPOTIPY_CLIENT_SECRET 2>/dev/null || true
            fi

            local cookie
            cookie="$(provider_cookie "$provider")"

            if [ -n "$cookie" ]; then
              cmd+=(--cookie-file "$cookie")
            fi

            local ytdlp_args
            if [ "$provider" = "youtube-music" ]; then
              ytdlp_args="
              --retries ${YTDLP_RETRIES}
              --fragment-retries ${YTDLP_FRAGMENT_RETRIES}
              --extractor-retries ${YTDLP_EXTRACTOR_RETRIES}
              --file-access-retries ${YTDLP_FILE_ACCESS_RETRIES}
              --socket-timeout ${YTDLP_SOCKET_TIMEOUT}
              --concurrent-fragments ${YTDLP_CONCURRENT_FRAGMENTS}
              --extractor-args youtube:player-client=web_music,default
              --extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}
              "
            elif [ "$provider" = "youtube" ]; then
              ytdlp_args="
              --retries ${YTDLP_RETRIES}
              --fragment-retries ${YTDLP_FRAGMENT_RETRIES}
              --extractor-retries ${YTDLP_EXTRACTOR_RETRIES}
              --file-access-retries ${YTDLP_FILE_ACCESS_RETRIES}
              --socket-timeout ${YTDLP_SOCKET_TIMEOUT}
              --concurrent-fragments ${YTDLP_CONCURRENT_FRAGMENTS}
              --extractor-args youtube:player-client=default,web_embedded
              --extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}
              "
            else
              ytdlp_args="
              --retries ${YTDLP_RETRIES}
              --fragment-retries ${YTDLP_FRAGMENT_RETRIES}
              --extractor-retries ${YTDLP_EXTRACTOR_RETRIES}
              --file-access-retries ${YTDLP_FILE_ACCESS_RETRIES}
              --socket-timeout ${YTDLP_SOCKET_TIMEOUT}
              --concurrent-fragments ${YTDLP_CONCURRENT_FRAGMENTS}
              --extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}
              "
            fi

            if [ "$RAW_LOGS" = "true" ]; then
              ytdlp_args="${ytdlp_args} --verbose"
            fi

            cmd+=(--yt-dlp-args "$ytdlp_args")

            local exit_code=0
            if [ "$RAW_LOGS" = "true" ]; then
              set +e
              timeout 900 "${cmd[@]}" >> "work/logs/${id}-raw.log" 2>&1
              exit_code=$?
              set -e
            else
              timeout 900 "${cmd[@]}" > "$logfile" 2>&1 || exit_code=$?
            fi

            if [ "$exit_code" -eq 0 ] && has_audio "$dir"; then
              return 0
            fi

            return 1
          }

          run_direct_ytdlp() {
            local id="$1"
            local type="$2"
            local url="$3"

            local dir="work/downloads/${id}"
            local logfile="work/logs/${id}-direct.log"

            mkdir -p "$dir"

            local -a cmd=(
              yt-dlp
              --ignore-config
              --newline
              --continue
              --no-overwrites
              --retries "$YTDLP_RETRIES"
              --fragment-retries "$YTDLP_FRAGMENT_RETRIES"
              --extractor-retries "$YTDLP_EXTRACTOR_RETRIES"
              --file-access-retries "$YTDLP_FILE_ACCESS_RETRIES"
              --socket-timeout "$YTDLP_SOCKET_TIMEOUT"
              --concurrent-fragments "$YTDLP_CONCURRENT_FRAGMENTS"
              --format "bestaudio/best"
              --output "${dir}/%(title)s - %(artist,creator,uploader)s.%(ext)s"
            )

            if [ "$type" = "youtube" ]; then
              cmd+=(--extractor-args "youtube:player-client=default,web_embedded")
            else
              cmd+=(--extractor-args "youtube:player-client=default")
            fi

            cmd+=(--extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}")

            if [ "$RAW_LOGS" = "true" ]; then
              cmd+=(--verbose)
            fi

            if [ "$type" = "youtube" ]; then
              if [ -n "$COOKIE_YT" ]; then
                cmd+=(--cookies "$COOKIE_YT")
              elif [ -n "$COOKIE_YTM" ]; then
                cmd+=(--cookies "$COOKIE_YTM")
              fi
              cmd+=(--no-playlist)
            fi

            local exit_code=0
            if [ "$RAW_LOGS" = "true" ]; then
              set +e
              timeout 900 "${cmd[@]}" >> "work/logs/${id}-raw.log" 2>&1
              exit_code=$?
              set -e
            else
              timeout 900 "${cmd[@]}" > "$logfile" 2>&1 || exit_code=$?
            fi

            if [ "$exit_code" -eq 0 ] && has_audio "$dir"; then
              return 0
            fi

            return 1
          }

          write_result() {
            local id="$1"
            local type="$2"
            local url="$3"
            local status="$4"
            local provider="$5"
            local reason="$6"
            local started="$7"
            local finished="$8"

            local dir="work/downloads/${id}"

            mapfile -t output_files < <(
              find "$dir" \
                -type f \
                \( \
                  -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' \
                  -o -iname '*.ogg' -o -iname '*.opus' -o -iname '*.wav' \
                \) \
                -printf '%f\n' 2>/dev/null | sort
            )

            printf '%s\n' "${output_files[@]}" |
              jq -R -s 'split("\n") | map(select(length > 0))' > "${dir}/files.json"

            jq -n \
              --arg id "$id" \
              --arg type "$type" \
              --arg url "$url" \
              --arg status "$status" \
              --arg provider "$provider" \
              --arg reason "$reason" \
              --arg started "$started" \
              --arg finished "$finished" \
              --slurpfile files "${dir}/files.json" \
              '{
                index: ($id | tonumber),
                input_type: $type,
                url: $url,
                status: $status,
                provider: $provider,
                reason: $reason,
                started_at: $started,
                finished_at: $finished,
                output_files: $files[0]
              }' > "work/results/${id}.json"

            rm -f "${dir}/files.json"
          }

          process_one() {
            local id="$1"
            local type="$2"
            local url="$3"

            local dir="work/downloads/${id}"
            mkdir -p "$dir"
            : > "work/logs/${id}-timing.log"

            local start_sec
            start_sec="$(date +%s)"
            local started_at
            started_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            local status="failed"
            local winner="none"
            local reason="all strategies failed"

            # Live single-line status notification
            safe_log "[$(now)] 🚀 #$(printf '%04d' "$id") (${type}) STARTING  │ ${url}"

            # Direct strategy for YouTube / SoundCloud
            if [ "$type" = "youtube" ] || [ "$type" = "soundcloud" ]; then
              local step_start
              step_start="$(date +%s)"

              if run_direct_ytdlp "$id" "$type" "$url"; then
                local step_elapsed=$(( $(date +%s) - step_start ))
                local step_time_str="$(format_duration "$step_elapsed")"

                status="success"
                winner="yt-dlp"
                reason="direct yt-dlp succeeded"
                log_timing "$id" "⚡ direct yt-dlp ── took ${step_time_str} ── ✅ SUCCESS"
              else
                local step_elapsed=$(( $(date +%s) - step_start ))
                local step_time_str="$(format_duration "$step_elapsed")"
                log_timing "$id" "⚡ direct yt-dlp ── took ${step_time_str} ── ✖ FAILED → spotDL"
              fi
            fi

            # spotDL strategy chain
            if [ "$status" != "success" ]; then
              local -a provider_order=("youtube-music" "youtube")

              if [ "$FALLBACK_SOUNDCLOUD" = "true" ]; then
                provider_order+=("soundcloud")
              fi

              if [ "$FALLBACK_BANDCAMP" = "true" ]; then
                provider_order+=("bandcamp")
              fi

              if [ "$FALLBACK_PIPED" = "true" ]; then
                provider_order+=("piped")
              fi

              for provider in "${provider_order[@]}"; do
                if ! provider_supported "$provider"; then
                  continue
                fi

                local provider_success="false"

                for attempt in $(seq 1 "$RETRIES"); do
                  local attempt_start
                  attempt_start="$(date +%s)"
                  local current_log="work/logs/${id}-${provider}-attempt-${attempt}.log"

                  if run_spotdl_provider "$id" "$url" "$provider" "$attempt"; then
                    local attempt_elapsed=$(( $(date +%s) - attempt_start ))
                    local attempt_time_str="$(format_duration "$attempt_elapsed")"

                    provider_success="true"
                    status="success"
                    winner="$provider"
                    reason="spotDL ${provider} succeeded"
                    log_timing "$id" "🔌 ${provider} (attempt ${attempt}/${RETRIES}) ── took ${attempt_time_str} ── ✅ SUCCESS"
                    break
                  fi

                  local attempt_elapsed=$(( $(date +%s) - attempt_start ))
                  local attempt_time_str="$(format_duration "$attempt_elapsed")"
                  local failure_type
                  failure_type="$(classify_error "$current_log")"

                  log_timing "$id" "🔌 ${provider} (attempt ${attempt}/${RETRIES}) ── took ${attempt_time_str} ── ⚠ ${failure_type}"

                  # Immediate break on non-transient failures
                  if [ "$failure_type" = "NO_RESULT" ] ||
                     [ "$failure_type" = "CONFIGURATION" ] ||
                     [ "$failure_type" = "FORMAT" ]; then
                    break
                  fi

                  if [ "$attempt" -lt "$RETRIES" ]; then
                    local delay
                    case "$failure_type" in
                      RATE_LIMIT) delay=$((attempt * 10)) ;;
                      BLOCKED|FORBIDDEN) delay=$((attempt * 6)) ;;
                      NETWORK) delay=$((attempt * 4)) ;;
                      *) delay=$((attempt * 3)) ;;
                    esac

                    [ "$delay" -gt 30 ] && delay=30
                    log_timing "$id" "↻ wait ${delay}s before retry..."
                    sleep "$delay"
                  fi
                done

                if [ "$provider_success" = "true" ]; then
                  break
                fi
              done
            fi

            local finished_at
            finished_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            local total_elapsed=$(( $(date +%s) - start_sec ))
            local total_duration="$(format_duration "$total_elapsed")"

            if [ "$status" != "success" ]; then
              reason="All enabled providers exhausted."
              printf '%s\t%s\t%s\n' "$id" "$type" "$url" > "work/failed/${id}.tsv"
              printf '%s\n' "$reason" > "work/failed/${id}.reason"
            fi

            write_result "$id" "$type" "$url" "$status" "$winner" "$reason" "$started_at" "$finished_at"

            # Print single atomic formatted card with timing details
            (
              flock -x 200
              echo
              echo "┌──────────────────────────────────────────────────────────────────────────────"
              if [ "$status" = "success" ]; then
                printf '│ 🎵 INPUT #%04d — ✅ SUCCESS (Total: %s via %s)\n' "$id" "$total_duration" "$winner"
              else
                printf '│ 🎵 INPUT #%04d — ❌ FAILED (Total: %s — %s)\n' "$id" "$total_duration" "$reason"
              fi
              printf '│ URL  : %s\n' "$url"
              printf '│ Type : %s\n' "$type"
              echo "│ Steps & Provider Timing:"
              if [ -s "work/logs/${id}-timing.log" ]; then
                sed 's/^/│   /' "work/logs/${id}-timing.log"
              else
                echo "│   (No step timing recorded)"
              fi
              echo "└──────────────────────────────────────────────────────────────────────────────"
              echo

              if [ "$RAW_LOGS" = "true" ] && [ -f "work/logs/${id}-raw.log" ]; then
                echo "--- [RAW LOGS FOR #$(printf '%04d' "$id")] ---"
                cat "work/logs/${id}-raw.log"
                echo "--- [END RAW LOGS FOR #$(printf '%04d' "$id")] ---"
                echo
              fi
            ) 200>/tmp/terminal.lock
          }

          detect_providers

          echo
          echo "Detected spotDL providers:"
          printf '  ✓ %s\n' "${SUPPORTED_PROVIDERS[@]}"
          echo
          echo "Enabled Provider Strategy:"
          echo "  ✓ youtube-music"
          echo "  ✓ youtube"
          [ "$FALLBACK_SOUNDCLOUD" = "true" ] && echo "  ✓ soundcloud (enabled)" || echo "  ⨯ soundcloud (disabled)"
          [ "$FALLBACK_BANDCAMP" = "true" ] && echo "  ✓ bandcamp (enabled)" || echo "  ⨯ bandcamp (disabled)"
          [ "$FALLBACK_PIPED" = "true" ] && echo "  ✓ piped (enabled)" || echo "  ⨯ piped (disabled)"
          echo
          echo "🚀 Concurrency: $WORKERS"
          echo "🔄 Transient retries/provider: $RETRIES"
          echo

          # Parallel worker queue loop
          running=0
          while IFS=$'\t' read -r id type url; do
            process_one "$id" "$type" "$url" &
            running=$((running + 1))

            if [ "$running" -ge "$WORKERS" ]; then
              wait -n 2>/dev/null || true
              running=$((running - 1))
            fi
          done < work/jobs.tsv

          wait || true

          echo
          echo "Download summary:"
          total="$(jq -s 'length' work/results/*.json 2>/dev/null || echo 0)"
          success="$(jq -s '[.[] | select(.status == "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          failed="$(jq -s '[.[] | select(.status != "success")] | length' work/results/*.json 2>/dev/null || echo 0)"

          echo "Requested : $total"
          echo "Successful: $success"
          echo "Failed    : $failed"

      # ============================================================
      # 11. CONVERT
      # ============================================================

      - name: "🔄 Convert and validate audio"
        env:
          TARGET_FORMAT: ${{ inputs.output_format }}
          TARGET_QUALITY: ${{ inputs.audio_quality }}
        run: |
          set -Eeuo pipefail

          FORMAT="$TARGET_FORMAT"
          QUALITY="$TARGET_QUALITY"

          case "$QUALITY" in
            320k|256k|192k|128k) BITRATE="$QUALITY" ;;
            HIGH) BITRATE="320k" ;;
            LOW) BITRATE="128k" ;;
            LOSSLESS|HI_RES_LOSSLESS) BITRATE="320k" ;;
            *) BITRATE="320k" ;;
          esac

          converted=0
          validated=0
          failed=0

          mapfile -d '' files < <(
            find work/downloads \
              -type f \
              \( \
                -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' \
                -o -iname '*.ogg' -o -iname '*.opus' -o -iname '*.wav' \
                -o -iname '*.webm' -o -iname '*.aac' \
              \) \
              -print0
          )

          for source in "${files[@]}"; do
            ext="${source##*.}"
            ext="${ext,,}"

            if [ "$ext" = "${FORMAT,,}" ]; then
              output="$source"
            else
              output="${source%.*}.${FORMAT}"

              case "$FORMAT" in
                mp3)
                  ffmpeg -hide_banner -loglevel error -nostdin -i "$source" -vn \
                    -map_metadata 0 -c:a libmp3lame -b:a "$BITRATE" -id3v2_version 3 -y "$output"
                  ;;
                flac)
                  ffmpeg -hide_banner -loglevel error -nostdin -i "$source" -vn \
                    -map_metadata 0 -c:a flac -y "$output"
                  ;;
                m4a)
                  ffmpeg -hide_banner -loglevel error -nostdin -i "$source" -vn \
                    -map_metadata 0 -c:a aac -b:a "$BITRATE" -movflags +faststart -y "$output"
                  ;;
                ogg)
                  ffmpeg -hide_banner -loglevel error -nostdin -i "$source" -vn \
                    -map_metadata 0 -c:a libvorbis -b:a "$BITRATE" -y "$output"
                  ;;
                opus)
                  ffmpeg -hide_banner -loglevel error -nostdin -i "$source" -vn \
                    -map_metadata 0 -c:a libopus -b:a "$BITRATE" -y "$output"
                  ;;
                wav)
                  ffmpeg -hide_banner -loglevel error -nostdin -i "$source" -vn \
                    -map_metadata 0 -c:a pcm_s16le -y "$output"
                  ;;
              esac

              if [ ! -s "$output" ]; then
                echo "❌ Conversion failed: $source"
                failed=$((failed + 1))
                rm -f "$output"
                continue
              fi

              converted=$((converted + 1))
              rm -f "$source"
            fi

            if [ ! -s "$output" ]; then
              failed=$((failed + 1))
              continue
            fi

            if ffprobe \
              -v error \
              -show_entries format=duration,size \
              -show_entries stream=codec_name,sample_rate,channels \
              -of json \
              "$output" > /tmp/audio-validation.json; then

              validated=$((validated + 1))
              codec="$(jq -r '.streams[0].codec_name // "unknown"' /tmp/audio-validation.json)"
              duration="$(jq -r '.format.duration // "unknown"' /tmp/audio-validation.json)"
              echo "✓ $(basename "$output") | $codec | ${duration}s"
            else
              echo "❌ Validation failed: $(basename "$output")"
              failed=$((failed + 1))
            fi
          done

          echo
          echo "Converted : $converted"
          echo "Validated : $validated"
          echo "Failed    : $failed"

      # ============================================================
      # 12. COLLECT FILES & FAILED URLs
      # ============================================================

      - name: "📚 Collect final files"
        id: collect
        run: |
          set -Eeuo pipefail

          rm -rf music
          mkdir -p music

          count=0

          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            dest="music/$base"

            if [ -e "$dest" ]; then
              count=$((count + 1))
              ext="${base##*.}"
              name="${base%.*}"
              dest="music/${name}_${count}.${ext}"
            else
              count=$((count + 1))
            fi

            cp --reflink=auto -p "$file" "$dest"
          done < <(
            find work/downloads \
              -type f \
              \( \
                -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' \
                -o -iname '*.ogg' -o -iname '*.opus' -o -iname '*.wav' \
              \) \
              -print0 |
            sort -z
          )

          failed_report="music/FAILED-DOWNLOADS-${RUN_SUFFIX}.txt"
          : > "$failed_report"
          failed_count=0

          for result in work/results/*.json; do
            [ -f "$result" ] || continue

            status="$(jq -r '.status' "$result")"
            [ "$status" = "success" ] && continue

            url="$(jq -r '.url' "$result")"
            failed_count=$((failed_count + 1))
            echo "$url" >> "$failed_report"
          done

          if [ "$failed_count" -eq 0 ]; then
            rm -f "$failed_report"
          fi

          echo "FINAL_AUDIO_COUNT=$count" >> "$GITHUB_OUTPUT"
          echo "FAILED_COUNT=$failed_count" >> "$GITHUB_OUTPUT"

          echo
          echo "Final audio files: $count"
          echo "Failed URLs      : $failed_count"

      # ============================================================
      # 13. SUMMARY
      # ============================================================

      - name: "📊 Write GitHub summary"
        env:
          FORMAT_INPUT: ${{ inputs.output_format }}
          QUALITY_INPUT: ${{ inputs.audio_quality }}
          UPLOAD_INPUT: ${{ inputs.upload_method }}
          BUNDLE_INPUT: ${{ inputs.bundle_all }}
          VPN_INPUT: ${{ inputs.vpn_enabled }}
          RAW_INPUT: ${{ inputs.raw_logs }}
          FALLBACK_SOUNDCLOUD: ${{ inputs.fallback_soundcloud }}
          FALLBACK_BANDCAMP: ${{ inputs.fallback_bandcamp }}
          FALLBACK_PIPED: ${{ inputs.fallback_piped }}
        run: |
          set -Eeuo pipefail

          total="$(jq -s 'length' work/results/*.json 2>/dev/null || echo 0)"
          success="$(jq -s '[.[] | select(.status == "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          failed="$(jq -s '[.[] | select(.status != "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          audio_count="${{ steps.collect.outputs.FINAL_AUDIO_COUNT || 0 }}"

          strategy="YouTube Music → YouTube"
          [ "$FALLBACK_SOUNDCLOUD" = "true" ] && strategy+=" → SoundCloud"
          [ "$FALLBACK_BANDCAMP" = "true" ] && strategy+=" → Bandcamp"
          [ "$FALLBACK_PIPED" = "true" ] && strategy+=" → Piped"

          {
            echo "# 🎵 Music Downloader"
            echo
            echo "## Configuration"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Format | \`$FORMAT_INPUT\` |"
            echo "| Quality | \`$QUALITY_INPUT\` |"
            echo "| Upload | \`$UPLOAD_INPUT\` |"
            echo "| Bundle | \`$BUNDLE_INPUT\` |"
            echo "| VPN | \`$VPN_INPUT\` |"
            echo "| Strategy | $strategy |"
            echo
            echo "## Result"
            echo
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| Requested URLs | $total |"
            echo "| Successful | $success |"
            echo "| Failed | $failed |"
            echo "| Final audio files | $audio_count |"
            echo
            echo "## Failed downloads"
            if [ -f "music/FAILED-DOWNLOADS-${RUN_SUFFIX}.txt" ]; then
              echo '```text'
              cat "music/FAILED-DOWNLOADS-${RUN_SUFFIX}.txt"
              echo '```'
            else
              echo "No failed downloads."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 14. PACKAGE
      # ============================================================

      - name: "📦 Package output"
        id: archive
        env:
          BUNDLE_ALL: ${{ inputs.bundle_all }}
          UPLOAD_METHOD: ${{ inputs.upload_method }}
        run: |
          set -Eeuo pipefail

          rm -rf work/archive work/package
          mkdir -p work/archive work/package

          audio_found=0

          while IFS= read -r -d '' file; do
            audio_found=$((audio_found + 1))
            cp --reflink=auto -p "$file" work/package/
          done < <(
            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' \
                -o -iname '*.ogg' -o -iname '*.opus' -o -iname '*.wav' \
              \) \
              -print0 |
            sort -z
          )

          if [ "$audio_found" -eq 0 ]; then
            echo "⚠️ No audio files to package."
            echo "HAS_ASSETS=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BUNDLE_ALL" = "true" ]; then
            zip_name="music-${RUN_SUFFIX}.zip"

            if [ "$UPLOAD_METHOD" = "repo" ]; then
              (
                cd work/package
                zip -0 -s 90m -r "../archive/${zip_name}" .
              )
            else
              (
                cd work/package
                zip -0 -r "../archive/${zip_name}" .
              )

              if [ "$UPLOAD_METHOD" = "release" ]; then
                size="$(stat -c%s "work/archive/${zip_name}")"

                if [ "$size" -gt 1900000000 ]; then
                  echo "⚠️ Large release ZIP; creating split archive."
                  rm -f work/archive/"${zip_name}"* 2>/dev/null || true

                  (
                    cd work/package
                    zip -0 -s 1900m -r "../archive/${zip_name}" .
                  )
                fi
              fi
            fi

          else
            index=0

            while IFS= read -r -d '' file; do
              index=$((index + 1))
              base="$(basename "$file")"
              safe="$(printf '%s' "$base" | tr ' ' '_' | tr -cd '[:alnum:]_.-')"
              zip_name="single-${index}-${safe}-${RUN_SUFFIX}.zip"

              (
                cd work/package
                zip -0 "../../work/archive/${zip_name}" "$base"
              )
            done < <(
              find work/package \
                -maxdepth 1 \
                -type f \
                \( \
                  -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' \
                  -o -iname '*.ogg' -o -iname '*.opus' -o -iname '*.wav' \
                \) \
                -print0 |
              sort -z
            )
          fi

          rm -f music/*.zip music/*.z[0-9][0-9] 2>/dev/null || true

          find work/archive \
            -maxdepth 1 \
            -type f \
            \( -name '*.zip' -o -name '*.z[0-9][0-9]' \) \
            -exec cp -p {} music/ \;

          echo "HAS_ASSETS=true" >> "$GITHUB_OUTPUT"

          echo
          echo "📦 Final package contents:"
          ls -lh music/

      # ============================================================
      # 15. DIAGNOSTICS
      # ============================================================

      - name: "📊 Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downloader-diagnostics-${{ github.run_number }}
          path: |
            work/logs/
            work/results/
            work/failed/
            work/jobs.tsv
            work/input_urls.txt
            music/FAILED-DOWNLOADS-*.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      # ============================================================
      # 16. DISCONNECT VPN
      # ============================================================

      - name: "🔌 Disconnect VPN"
        if: steps.vpn.outputs.vpn_available == 'true'
        run: |
          set +e
          sudo wg-quick down wg0 >/dev/null 2>&1 || true
          echo "✅ VPN disconnected."

      # ============================================================
      # 17. GOOGLE DRIVE
      # ============================================================

      - name: "☁️ Upload to Google Drive"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'drive'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_NAME: "github-actions"
        run: |
          set -Eeuo pipefail

          if [ -z "$GOOGLE_CLIENT_ID" ] ||
             [ -z "$GOOGLE_CLIENT_SECRET" ] ||
             [ -z "$GOOGLE_REFRESH_TOKEN" ]; then
            echo "❌ Google Drive credentials are missing."
            exit 1
          fi

          token_json="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --request POST \
              https://oauth2.googleapis.com/token \
              --data-urlencode "client_id=${GOOGLE_CLIENT_ID}" \
              --data-urlencode "client_secret=${GOOGLE_CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${GOOGLE_REFRESH_TOKEN}" \
              --data-urlencode "grant_type=refresh_token"
          )"

          access_token="$(jq -r '.access_token // empty' <<< "$token_json")"

          if [ -z "$access_token" ]; then
            echo "❌ Could not obtain Drive token."
            exit 1
          fi

          query="mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false"

          folder_response="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --get \
              https://www.googleapis.com/drive/v3/files \
              -H "Authorization: Bearer ${access_token}" \
              --data-urlencode "q=${query}" \
              --data-urlencode "fields=files(id,name)"
          )"

          folder_id="$(jq -r '.files[0].id // empty' <<< "$folder_response")"

          if [ -z "$folder_id" ]; then
            body="$(
              jq -n \
                --arg name "$DRIVE_FOLDER_NAME" \
                '{
                  name: $name,
                  mimeType: "application/vnd.google-apps.folder"
                }'
            )"

            folder_id="$(
              curl \
                --silent \
                --show-error \
                --fail \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                --request POST \
                https://www.googleapis.com/drive/v3/files \
                -H "Authorization: Bearer ${access_token}" \
                -H "Content-Type: application/json" \
                --data "$body" |
              jq -r '.id // empty'
            )"
          fi

          if [ -z "$folder_id" ]; then
            echo "❌ Could not resolve Drive folder."
            exit 1
          fi

          upload_file() {
            local file="$1"
            local name size
            name="$(basename "$file")"
            size="$(stat -c%s "$file")"

            echo "⬆️ $name ($size bytes)"

            local headers
            headers="$(mktemp)"

            local metadata
            metadata="$(
              jq -n \
                --arg name "$name" \
                --arg folder "$folder_id" \
                '{
                  name: $name,
                  parents: [$folder]
                }'
            )"

            if ! curl \
              --silent \
              --show-error \
              --request POST \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              -D "$headers" \
              -o /dev/null \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: application/octet-stream" \
              -H "X-Upload-Content-Length: ${size}" \
              --data "$metadata" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable"; then
              rm -f "$headers"
              return 1
            fi

            local session_uri
            session_uri="$(
              awk '
                BEGIN { IGNORECASE=1 }
                /^location:/ {
                  sub(/\r$/, "")
                  sub(/^[^:]*:[[:space:]]*/, "")
                  print
                  exit
                }
              ' "$headers"
            )"
            rm -f "$headers"

            if [ -z "$session_uri" ]; then
              echo "❌ Could not initialize Drive upload."
              return 1
            fi

            local offset=0

            while [ "$offset" -lt "$size" ]; do
              local remaining=$((size - offset))
              local length="$DRIVE_CHUNK_SIZE"

              if [ "$remaining" -lt "$length" ]; then
                length="$remaining"
              fi

              local end=$((offset + length - 1))
              local chunk
              chunk="$(mktemp)"

              dd if="$file" of="$chunk" iflag=skip_bytes,count_bytes \
                skip="$offset" count="$length" status=none

              local chunk_done="false"

              for attempt in 1 2 3 4 5; do
                local response response_headers code
                response="$(mktemp)"
                response_headers="$(mktemp)"

                code="$(
                  curl \
                    --silent \
                    --show-error \
                    --request PUT \
                    -D "$response_headers" \
                    -o "$response" \
                    --write-out '%{http_code}' \
                    -H "Authorization: Bearer ${access_token}" \
                    -H "Content-Type: application/octet-stream" \
                    -H "Content-Length: ${length}" \
                    -H "Content-Range: bytes ${offset}-${end}/${size}" \
                    --data-binary "@${chunk}" \
                    "$session_uri"
                )"

                case "$code" in
                  200|201)
                    offset="$size"
                    chunk_done="true"
                    ;;
                  308)
                    range="$(
                      awk '
                        BEGIN { IGNORECASE=1 }
                        /^Range:/ {
                          sub(/\r$/, "")
                          print
                        }
                      ' "$response_headers"
                    )"

                    if [[ "$range" =~ bytes=0-([0-9]+) ]]; then
                      offset=$((BASH_REMATCH[1] + 1))
                    else
                      offset=$((end + 1))
                    fi
                    chunk_done="true"
                    ;;
                  429|500|502|503|504)
                    delay=$((2 ** attempt))
                    [ "$delay" -gt 30 ] && delay=30
                    echo "⚠️ Drive HTTP $code; retry in ${delay}s."
                    sleep "$delay"
                    ;;
                  *)
                    echo "❌ Drive upload failed: HTTP $code"
                    cat "$response" 2>/dev/null || true
                    rm -f "$response" "$response_headers" "$chunk"
                    return 1
                    ;;
                esac

                rm -f "$response" "$response_headers"

                if [ "$offset" -ge "$size" ] || [ "$chunk_done" = "true" ]; then
                  break
                fi
              done

              rm -f "$chunk"

              if [ "$offset" -lt "$size" ] && [ "$chunk_done" != "true" ]; then
                echo "❌ Drive chunk upload failed."
                return 1
              fi

              percent=$((offset * 100 / size))
              echo "   Progress: ${percent}%"
            done

            echo "✅ Uploaded: $name"
          }

          for file in music/*; do
            [ -f "$file" ] || continue

            case "$(basename "$file")" in
              *.zip|*.z[0-9][0-9]|FAILED-DOWNLOADS-*.txt)
                upload_file "$file"
                ;;
            esac
          done

          echo "✅ Google Drive upload complete."

      # ============================================================
      # 18. REPOSITORY UPLOAD
      # ============================================================

      - name: "📤 Upload to repository"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'repo'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add music/

          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit."
            exit 0
          fi

          git commit -m "Add music downloader output [skip ci]"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"

            if git pull --rebase --autostash origin "$BRANCH_NAME" &&
               git push origin "$BRANCH_NAME"; then
              echo "✅ Repository upload complete."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 3))
            fi
          done

          echo "❌ Repository push failed."
          exit 1

      # ============================================================
      # 19. GITHUB RELEASE
      # ============================================================

      - name: "🏷️ Create GitHub Release"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORMAT_INPUT: ${{ inputs.output_format }}
          QUALITY_INPUT: ${{ inputs.audio_quality }}
          VPN_INPUT: ${{ inputs.vpn_enabled }}
        run: |
          set -Eeuo pipefail

          tag="music-${RUN_SUFFIX}"

          total="$(jq -s 'length' work/results/*.json 2>/dev/null || echo 0)"
          success="$(jq -s '[.[] | select(.status == "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          failed="$(jq -s '[.[] | select(.status != "success")] | length' work/results/*.json 2>/dev/null || echo 0)"

          {
            echo "# 🎵 Music Downloader"
            echo
            echo "Requested URLs: ${total}"
            echo "Successful: ${success}"
            echo "Failed: ${failed}"
            echo "Format: ${FORMAT_INPUT}"
            echo "Quality: ${QUALITY_INPUT}"
            echo "VPN: ${VPN_INPUT}"
            echo "PO-token provider: bgutil"
          } > work/release-notes.md

          mapfile -t assets < <(
            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -name '*.zip' \
                -o -name '*.z[0-9][0-9]' \
                -o -name 'FAILED-DOWNLOADS-*.txt' \
              \) \
              -print |
            sort
          )

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "❌ No release assets."
            exit 1
          fi

          gh release create \
            "$tag" \
            "${assets[@]}" \
            --title "Music Downloader ${RUN_SUFFIX}" \
            --notes-file work/release-notes.md \
            --target "$GITHUB_SHA"

          echo "✅ Release created."

      # ============================================================
      # 20. FINAL STATUS
      # ============================================================

      - name: "✅ Final status"
        if: always()
        env:
          FAIL_ON_PARTIAL: ${{ inputs.fail_on_partial }}
        run: |
          set -Eeuo pipefail

          total="$(jq -s 'length' work/results/*.json 2>/dev/null || echo 0)"
          success="$(jq -s '[.[] | select(.status == "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          failed="$(jq -s '[.[] | select(.status != "success")] | length' work/results/*.json 2>/dev/null || echo 0)"
          audio_count="${{ steps.collect.outputs.FINAL_AUDIO_COUNT || 0 }}"

          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                     🎵 FINAL RESULT                        ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf '║ Requested   : %-43s ║\n' "$total"
          printf '║ Successful  : %-43s ║\n' "$success"
          printf '║ Failed      : %-43s ║\n' "$failed"
          printf '║ Audio files : %-43s ║\n' "$audio_count"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo

          if [ "$success" -eq 0 ]; then
            echo "❌ No URL completed successfully."
            exit 1
          fi

          if [ "$failed" -gt 0 ] && [ "$FAIL_ON_PARTIAL" = "true" ]; then
            echo "❌ Partial failure detected."
            exit 1
          fi

          if [ "$failed" -gt 0 ]; then
            echo "⚠️ Partial completion accepted."
          else
            echo "✅ All URLs completed successfully."
          fi

      # ============================================================
      # 21. CLEANUP
      # ============================================================

      - name: "🧹 Cleanup"
        if: always()
        run: |
          set +e

          docker rm -f bgutil-provider >/dev/null 2>&1 || true
          sudo wg-quick down wg0 >/dev/null 2>&1 || true

          rm -f \
            /tmp/wg0.conf \
            /tmp/youtube-cookies.txt \
            /tmp/youtube-music-cookies.txt \
            /tmp/bgutil-ping.json \
            /tmp/audio-validation.json \
            /tmp/terminal.lock

          find /tmp -maxdepth 1 -type f -name '*.drivechunk' -delete 2>/dev/null || true

          echo "✅ Cleanup complete."
