name: downloader-spotify

on:
  workflow_dispatch:
    inputs:
      urls:
        description: >
          🎵 Enter Spotify/Tidal/Apple/SoundCloud/YouTube URLs
          (comma, space, or newline separated)
        required: true
        type: string

      output_format:
        description: "🎧 Output Format"
        required: true
        type: choice
        options:
          - mp3
          - flac
          - m4a
          - ogg
          - opus
          - wav
        default: mp3

      audio_quality:
        description: "🎚️ Audio Quality / Bitrate"
        required: true
        type: choice
        options:
          - 320k
          - 256k
          - 192k
          - 128k
          - LOSSLESS
          - HI_RES_LOSSLESS
          - HIGH
          - LOW
        default: 320k

      upload_method:
        description: "☁️ Upload destination"
        required: true
        type: choice
        options:
          - drive
          - repo
          - release
        default: drive

      bundle_all:
        description: "📦 Bundle all tracks into a single ZIP?"
        required: true
        type: boolean
        default: true

      vpn_enabled:
        description: "🔒 Route downloads through WireGuard VPN?"
        required: true
        type: boolean
        default: false

      use_custom_credentials:
        description: >
          🔑 Use custom Spotify Developer credentials?
          (SPOTIFY_CLIENT_ID + SPOTIFY_CLIENT_SECRET)
        required: true
        type: boolean
        default: false

      concurrent_downloads:
        description: "⚡ Concurrent URL workers"
        required: true
        type: number
        default: 2

      retry_count:
        description: "🔄 Retry count for each URL"
        required: true
        type: number
        default: 3

      fail_on_partial:
        description: "❌ Fail workflow if any URL fails?"
        required: true
        type: boolean
        default: false


permissions:
  contents: write


concurrency:
  group: music-downloader-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false


env:
  POT_SERVER_PORT: "4416"

  DEFAULT_PARALLEL: "2"
  DEFAULT_RETRIES: "3"

  SPOTDL_THREADS: "3"

  YTDLP_RETRIES: "8"
  YTDLP_FRAGMENT_RETRIES: "8"
  YTDLP_EXTRACTOR_RETRIES: "5"
  YTDLP_FILE_ACCESS_RETRIES: "5"
  YTDLP_SOCKET_TIMEOUT: "30"
  YTDLP_CONCURRENT_FRAGMENTS: "3"

  DRIVE_CHUNK_SIZE: "16777216"


jobs:
  music-download:

    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: bash


    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: "📥 Checkout repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true


      # ============================================================
      # PYTHON
      # ============================================================

      - name: "🐍 Setup latest Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true


      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================

      - name: "🛠️ Install system dependencies"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail

          echo "::group::📦 apt update"

          for attempt in 1 2 3; do
            if sudo apt-get \
              -o Acquire::ForceIPv4=true \
              update \
              -qq; then
              break
            fi

            echo "⚠️ apt update failed: attempt ${attempt}/3"

            if [ "$attempt" -eq 3 ]; then
              echo "❌ apt update failed permanently."
              exit 1
            fi

            sleep $((attempt * 3))
          done

          echo "::endgroup::"


          echo "::group::📦 Install packages"

          sudo apt-get \
            -o Acquire::ForceIPv4=true \
            install \
            -y \
            -qq \
            ffmpeg \
            curl \
            jq \
            zip \
            unzip \
            aria2 \
            wireguard-tools

          echo "::endgroup::"


      # ============================================================
      # RESOLVCONF COMPATIBILITY
      #
      # Ubuntu 24.04 uses systemd-resolved on the GitHub runner.
      # wg-quick still calls "resolvconf" when DNS= is present.
      #
      # Instead of the unavailable openresolv package, install a
      # minimal compatibility wrapper.
      # ============================================================

      - name: "🌐 Configure resolvconf compatibility"
        run: |
          set -Eeuo pipefail

          echo "::group::🌐 DNS / resolvconf compatibility"


          if command -v resolvconf >/dev/null 2>&1; then

            echo "✅ Existing resolvconf found:"
            command -v resolvconf

          elif command -v resolvectl >/dev/null 2>&1; then

            echo "ℹ️ resolvconf not installed."
            echo "✅ systemd-resolved/resolvectl detected."


            sudo tee /usr/local/bin/resolvconf >/dev/null <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          action="${1:-}"

          case "$action" in

            -a)
              interface="${2:-}"
              shift 2 || true

              dns_servers=()

              while IFS= read -r line; do
                case "$line" in
                  nameserver\ *)
                    dns_servers+=("${line#nameserver }")
                    ;;
                esac
              done

              if [ "${#dns_servers[@]}" -gt 0 ] &&
                 [ -n "$interface" ]; then

                resolvectl dns "$interface" "${dns_servers[@]}" >/dev/null 2>&1 || true
                resolvectl domain "$interface" "~." >/dev/null 2>&1 || true

              fi
              ;;

            -d)
              interface="${2:-}"

              if [ -n "$interface" ]; then
                resolvectl revert "$interface" >/dev/null 2>&1 || true
              fi
              ;;

            *)
              exit 0
              ;;

          esac
          EOF

            sudo chmod 755 /usr/local/bin/resolvconf

            echo "✅ Installed resolvconf compatibility wrapper."

          else

            echo "⚠️ Neither resolvconf nor resolvectl is available."
            echo "⚠️ WireGuard configs containing DNS= may not work correctly."

          fi


          echo "::endgroup::"


      # ============================================================
      # DENO
      # ============================================================

      - name: "🦕 Install latest Deno"
        run: |
          set -Eeuo pipefail

          echo "::group::🦕 Deno"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            https://deno.land/install.sh \
            | sh -s -- -y

          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.deno/bin:$PATH"

          echo "Deno version:"
          deno --version

          echo "::endgroup::"


      # ============================================================
      # PYTHON PACKAGES - ALL LATEST
      # ============================================================

      - name: "📦 Install latest Python packages"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -Eeuo pipefail

          echo "::group::🐍 Upgrade pip tooling"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            pip \
            setuptools \
            wheel

          echo "::endgroup::"


          echo "::group::🎵 Install latest spotDL"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            spotdl

          echo "::endgroup::"


          echo "::group::📺 Install latest yt-dlp"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            "yt-dlp[default]"

          echo "::endgroup::"


          echo "::group::🧩 Install latest yt-dlp EJS"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            yt-dlp-ejs

          echo "::endgroup::"


          echo "::group::🛡️ Install latest bgutil PO-token plugin"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            bgutil-ytdlp-pot-provider

          echo "::endgroup::"


      # ============================================================
      # TOOLCHAIN
      # ============================================================

      - name: "🔎 Toolchain diagnostics"
        run: |
          set -Eeuo pipefail

          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    🎵 TOOLCHAIN                             ║"
          echo "╠══════════════════════════════════════════════════════════════╣"

          echo "║ Python:"
          python --version

          echo "║ spotDL:"
          spotdl --version || true

          echo "║ yt-dlp:"
          yt-dlp --version

          echo "║ FFmpeg:"
          ffmpeg -version | head -n1

          echo "║ FFprobe:"
          ffprobe -version | head -n1

          echo "║ Deno:"
          deno --version | head -n1

          echo "║ aria2:"
          aria2c --version | head -n1

          echo "╚══════════════════════════════════════════════════════════════╝"
          echo


          echo "::group::📦 Python package versions"

          python -m pip list |
            grep -Ei \
              'spotdl|yt-dlp|ejs|bgutil|spotipy|mutagen|rapidfuzz' \
            || true

          echo "::endgroup::"


      # ============================================================
      # WORKSPACE
      # ============================================================

      - name: "📁 Initialize workspace"
        run: |
          set -Eeuo pipefail

          rm -rf work music

          mkdir -p \
            work/downloads \
            work/logs \
            work/results \
            work/failed \
            work/archive \
            work/package \
            music

          echo "✅ Workspace initialized."


      # ============================================================
      # INPUT PARSER
      # ============================================================

      - name: "🔗 Parse and validate URLs"
        id: parse
        env:
          RAW_URLS: ${{ inputs.urls }}
        run: |
          set -Eeuo pipefail

          echo "::group::🔗 Input processing"


          : > work/input_urls.txt
          : > work/jobs.tsv


          printf '%s\n' "$RAW_URLS" |
            tr ',' '\n' |
            sed 's/\r//g' |
            awk '
              {
                for (i = 1; i <= NF; i++) {
                  print $i
                }
              }
            ' |
            sed \
              's/^[[:space:]]*//;s/[[:space:]]*$//' |
            awk 'NF' |
            sort -u \
            > work/input_urls.txt


          index=0


          while IFS= read -r url; do

            index=$((index + 1))


            if [[ "$url" =~ ^https?://(open\.)?spotify\.com/ ]]; then

              type="spotify"

            elif [[ "$url" =~ ^https?://(www\.)?youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://music\.youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://youtu\.be/ ]]; then

              type="youtube"

            elif [[ "$url" =~ ^https?://(www\.)?soundcloud\.com/ ]]; then

              type="soundcloud"

            elif [[ "$url" =~ ^https?://(www\.)?tidal\.com/ ]] ||
                 [[ "$url" =~ ^https?://(listen\.)?tidal\.com/ ]]; then

              type="tidal"

            elif [[ "$url" =~ ^https?://(www\.)?music\.apple\.com/ ]]; then

              type="apple"

            elif [[ "$url" =~ ^https?://(www\.)?pandora\.com/ ]] ||
                 [[ "$url" =~ ^https?://pandora\.app\.link/ ]]; then

              type="pandora"

            else

              echo "⚠️ Unsupported URL skipped:"
              echo "   $url"
              continue

            fi


            printf \
              '%04d\t%s\t%s\n' \
              "$index" \
              "$type" \
              "$url" \
              >> work/jobs.tsv

          done < work/input_urls.txt


          if [ ! -s work/jobs.tsv ]; then
            echo "❌ No supported URLs."
            exit 1
          fi


          total="$(wc -l < work/jobs.tsv)"

          echo "INPUT_COUNT=$total" >> "$GITHUB_OUTPUT"


          echo
          echo "✅ Accepted URLs: $total"
          echo


          while IFS=$'\t' read -r id type url; do

            printf \
              '  #%s | %-10s | %s\n' \
              "$id" \
              "$type" \
              "$url"

          done < work/jobs.tsv


          echo "::endgroup::"


      # ============================================================
      # WIREGUARD
      # ============================================================

      - name: "🔒 Configure WireGuard"
        id: vpn
        env:
          VPN_ENABLED: ${{ inputs.vpn_enabled }}
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          set -Eeuo pipefail

          echo "::group::🔒 WireGuard"


          if [ "$VPN_ENABLED" != "true" ]; then

            echo "🚫 VPN disabled."

            echo "vpn_available=false" >> "$GITHUB_OUTPUT"

            echo "::endgroup::"
            exit 0

          fi


          if [ -z "$WG_CONFIG" ]; then

            echo "⚠️ VPN requested but WG_CONFIG is empty."

            echo "vpn_available=false" >> "$GITHUB_OUTPUT"

            echo "::endgroup::"
            exit 0

          fi


          umask 077

          printf '%s\n' "$WG_CONFIG" > /tmp/wg0.conf


          sudo install \
            -m 600 \
            /tmp/wg0.conf \
            /etc/wireguard/wg0.conf


          echo "🚀 Starting wg0..."


          if sudo wg-quick up wg0; then

            echo "✅ WireGuard connected."


            PUBLIC_IP="$(
              curl \
                -4 \
                --silent \
                --show-error \
                --max-time 15 \
                https://api.ipify.org \
              || echo "unavailable"
            )"


            echo "🌐 Public IPv4: $PUBLIC_IP"

            echo "vpn_available=true" >> "$GITHUB_OUTPUT"

          else

            echo "❌ WireGuard failed to start."

            sudo wg-quick down wg0 \
              2>/dev/null \
              || true

            echo "vpn_available=false" >> "$GITHUB_OUTPUT"

          fi


          echo "::endgroup::"


      # ============================================================
      # BGUTIL PO-TOKEN SERVER
      # ============================================================

      - name: "🛡️ Start latest bgutil PO-token provider"
        id: pot
        run: |
          set -Eeuo pipefail

          echo "::group::🛡️ bgutil PO-token provider"


          IMAGE="brainicism/bgutil-ytdlp-pot-provider:latest"


          echo "🐳 Image: $IMAGE"


          for attempt in 1 2 3; do

            if docker pull "$IMAGE"; then
              break
            fi

            echo "⚠️ Docker pull failed: ${attempt}/3"

            if [ "$attempt" -eq 3 ]; then

              echo "⚠️ bgutil unavailable."

              echo "pot_available=false" >> "$GITHUB_OUTPUT"

              echo "::endgroup::"
              exit 0

            fi

            sleep $((attempt * 3))

          done


          docker rm -f bgutil-provider \
            >/dev/null 2>&1 \
            || true


          # Host networking means the provider is available from the
          # GitHub runner at 127.0.0.1:4416.
          docker run \
            --name bgutil-provider \
            --detach \
            --init \
            --network host \
            "$IMAGE"


          echo "⏳ Waiting for bgutil on 127.0.0.1:${POT_SERVER_PORT}..."


          ready="false"


          for i in $(seq 1 40); do

            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 3 \
              "http://127.0.0.1:${POT_SERVER_PORT}/ping" \
              >/tmp/bgutil-ping.txt \
              2>/dev/null; then

              ready="true"
              break

            fi

            sleep 2

          done


          if [ "$ready" = "true" ]; then

            echo "✅ bgutil provider is ready."

            echo "pot_available=true" >> "$GITHUB_OUTPUT"

          else

            echo "⚠️ bgutil provider did not become ready."

            docker logs bgutil-provider \
              > work/logs/bgutil-provider.log \
              2>&1 \
              || true

            echo "pot_available=false" >> "$GITHUB_OUTPUT"

          fi


          echo "::endgroup::"


      # ============================================================
      # TEST BGUTIL / YT-DLP
      # ============================================================

      - name: "🧪 Verify bgutil + yt-dlp"
        if: steps.pot.outputs.pot_available == 'true'
        continue-on-error: true
        run: |
          set -Eeuo pipefail

          echo "::group::🧪 PO-token integration test"


          TEST_URL="https://www.youtube.com/watch?v=BaW_jenozKc"


          # No manual --po-token is supplied.
          # bgutil is on its default 127.0.0.1:4416 endpoint.
          yt-dlp \
            --verbose \
            --simulate \
            --skip-download \
            --extractor-args "youtube:player-client=mweb" \
            "$TEST_URL" \
            > work/logs/pot-verification.log \
            2>&1 \
            || true


          echo "Relevant diagnostics:"

          grep -iE \
            'PO Token|bgutil|player-client|challenge' \
            work/logs/pot-verification.log \
            | tail -n 80 \
            || true


          if grep -qi 'bgutil' work/logs/pot-verification.log; then

            echo "✅ bgutil appears in yt-dlp diagnostics."

          else

            echo "⚠️ Could not positively confirm bgutil from verbose output."

          fi


          echo "::endgroup::"


      # ============================================================
      # DOWNLOAD ENGINE
      # ============================================================

      - name: "⬇️ Download media"
        id: download
        env:
          RAW_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          RAW_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_MUSIC_COOKIES: ${{ secrets.YOUTUBE_MUSIC_COOKIES }}

          USE_CUSTOM_CREDENTIALS: ${{ inputs.use_custom_credentials }}

          PARALLEL_INPUT: ${{ inputs.concurrent_downloads }}
          RETRIES_INPUT: ${{ inputs.retry_count }}

          VPN_AVAILABLE: ${{ steps.vpn.outputs.vpn_available }}
          POT_AVAILABLE: ${{ steps.pot.outputs.pot_available }}

        run: |
          set -Eeuo pipefail


          # ==========================================================
          # INPUTS
          # ==========================================================

          PARALLEL="$PARALLEL_INPUT"
          MAX_RETRIES="$RETRIES_INPUT"


          if ! [[ "$PARALLEL" =~ ^[1-8]$ ]]; then
            echo "⚠️ Invalid concurrency; using ${DEFAULT_PARALLEL}."
            PARALLEL="$DEFAULT_PARALLEL"
          fi


          if ! [[ "$MAX_RETRIES" =~ ^[1-6]$ ]]; then
            echo "⚠️ Invalid retry count; using ${DEFAULT_RETRIES}."
            MAX_RETRIES="$DEFAULT_RETRIES"
          fi


          FORMAT="${{ inputs.output_format }}"
          QUALITY="${{ inputs.audio_quality }}"


          # ==========================================================
          # BITRATE
          # ==========================================================

          case "$QUALITY" in

            320k|256k|192k|128k)
              BITRATE="$QUALITY"
              ;;

            HIGH)
              BITRATE="320k"
              ;;

            LOW)
              BITRATE="128k"
              ;;

            LOSSLESS|HI_RES_LOSSLESS)

              case "$FORMAT" in
                flac|m4a|opus|wav)
                  BITRATE="disable"
                  ;;
                *)
                  BITRATE="320k"
                  ;;
              esac

              ;;

            *)
              BITRATE="320k"
              ;;

          esac


          # ==========================================================
          # COOKIE FILES
          # ==========================================================

          COOKIE_YT=""
          COOKIE_YTM=""


          if [ -n "$YOUTUBE_COOKIES" ]; then

            printf '%s\n' "$YOUTUBE_COOKIES" \
              > /tmp/youtube-cookies.txt

            chmod 600 /tmp/youtube-cookies.txt

            COOKIE_YT="/tmp/youtube-cookies.txt"

          fi


          if [ -n "$YOUTUBE_MUSIC_COOKIES" ]; then

            printf '%s\n' "$YOUTUBE_MUSIC_COOKIES" \
              > /tmp/youtube-music-cookies.txt

            chmod 600 /tmp/youtube-music-cookies.txt

            COOKIE_YTM="/tmp/youtube-music-cookies.txt"

          fi


          # ==========================================================
          # LOGGING
          # ==========================================================

          timestamp() {
            date '+%H:%M:%S'
          }


          log() {

            local level="$1"
            local index="$2"
            local message="$3"

            printf \
              '[%s] %-9s #%04d | %s\n' \
              "$(timestamp)" \
              "$level" \
              "$index" \
              "$message"
          }


          # ==========================================================
          # ERROR CLASSIFICATION
          # ==========================================================

          classify_error() {

            local log_file="$1"


            if grep -qiE \
              'HTTP Error 429|HTTP 429|Too Many Requests|rate.?limit' \
              "$log_file"; then

              echo "RATE_LIMIT"
              return

            fi


            if grep -qiE \
              'Sign in to confirm|not a bot|bot detection|confirm you.re not a bot' \
              "$log_file"; then

              echo "BOT_DETECTION"
              return

            fi


            if grep -qiE \
              'No results found|returned no usable results|No video results' \
              "$log_file"; then

              echo "NO_MATCH"
              return

            fi


            if grep -qiE \
              'HTTP Error 403|HTTP 403|Forbidden' \
              "$log_file"; then

              echo "FORBIDDEN"
              return

            fi


            if grep -qiE \
              'timed out|timeout|Connection reset|Connection aborted|Temporary failure in name resolution|Could not resolve' \
              "$log_file"; then

              echo "NETWORK"
              return

            fi


            if grep -qiE \
              'Requested format is not available|No video formats found|No formats found' \
              "$log_file"; then

              echo "FORMAT"
              return

            fi


            echo "UNKNOWN"
          }


          # ==========================================================
          # DOWNLOAD WITH SPOTDL
          # ==========================================================

          download_spotdl() {

            local index="$1"
            local type="$2"
            local url="$3"


            local dir="work/downloads/${index}"
            local log_file="work/logs/${index}-spotdl.log"


            mkdir -p "$dir"


            # Keep provider configuration native to spotDL.
            # spotDL documents multiple providers for --audio fallback.
            local -a cmd


            cmd=(
              spotdl
              download
              "$url"

              --audio
              youtube-music
              youtube
              soundcloud
              bandcamp
              piped
              slider-kz

              --format "$FORMAT"
              --bitrate "$BITRATE"

              --output
              "${dir}/{artists} - {title}.{output-ext}"

              --threads "$SPOTDL_THREADS"

              --max-retries 3

              --restrict none

              --max-filename-length 180

              --print-errors

              --log-level INFO
            )


            # --------------------------------------------------------
            # Cache
            # --------------------------------------------------------

            mkdir -p "${dir}/cache"

            cmd+=(
              --cache-path
              "${dir}/cache"
            )


            # --------------------------------------------------------
            # Spotify custom credentials
            # --------------------------------------------------------

            if [ "$USE_CUSTOM_CREDENTIALS" = "true" ] &&
               [ -n "$RAW_CLIENT_ID" ] &&
               [ -n "$RAW_CLIENT_SECRET" ]; then

              cmd+=(
                --client-id
                "$RAW_CLIENT_ID"

                --client-secret
                "$RAW_CLIENT_SECRET"

                --use-official-api
              )

              log \
                "AUTH" \
                "$index" \
                "Custom Spotify credentials enabled."

            else

              log \
                "AUTH" \
                "$index" \
                "Using spotDL default Spotify client."

            fi


            # --------------------------------------------------------
            # Cookies
            # --------------------------------------------------------

            if [ -n "$COOKIE_YTM" ]; then

              cmd+=(
                --cookie-file
                "$COOKIE_YTM"
              )

              log \
                "AUTH" \
                "$index" \
                "YouTube Music cookies enabled."

            elif [ -n "$COOKIE_YT" ]; then

              cmd+=(
                --cookie-file
                "$COOKIE_YT"
              )

              log \
                "AUTH" \
                "$index" \
                "YouTube cookies enabled."

            fi


            # --------------------------------------------------------
            # yt-dlp arguments
            #
            # IMPORTANT:
            # Do not construct this using nested command substitutions
            # or shell-escaped strings. This avoids the EOF quoting
            # problem from the previous version.
            # --------------------------------------------------------

            local ytdlp_args

            ytdlp_args=$(
              cat <<EOF
          --retries ${YTDLP_RETRIES}
          --fragment-retries ${YTDLP_FRAGMENT_RETRIES}
          --extractor-retries ${YTDLP_EXTRACTOR_RETRIES}
          --file-access-retries ${YTDLP_FILE_ACCESS_RETRIES}
          --socket-timeout ${YTDLP_SOCKET_TIMEOUT}
          --concurrent-fragments ${YTDLP_CONCURRENT_FRAGMENTS}
          --throttled-rate 100K
          --sleep-requests 1
          --extractor-args youtube:player-client=mweb
          EOF
            )


            # Note:
            # The bgutil server is running at its documented default
            # localhost endpoint, so no explicit base_url is required.


            cmd+=(
              --yt-dlp-args
              "$ytdlp_args"
            )


            # --------------------------------------------------------
            # Execution
            # --------------------------------------------------------

            log \
              "DOWNLOAD" \
              "$index" \
              "Starting spotDL provider engine."


            local attempt=1


            while [ "$attempt" -le "$MAX_RETRIES" ]; do

              local attempt_log
              attempt_log="work/logs/${index}-spotdl-attempt-${attempt}.log"


              log \
                "TRY" \
                "$index" \
                "spotDL attempt ${attempt}/${MAX_RETRIES}"


              local exit_code=0


              timeout 900 \
                "${cmd[@]}" \
                > "$attempt_log" \
                2>&1 \
                || exit_code=$?


              cat "$attempt_log" \
                >> "$log_file" \
                2>/dev/null \
                || true


              if [ "$exit_code" -eq 0 ] &&
                 find "$dir" \
                   -type f \
                   \( \
                     -iname '*.mp3' \
                     -o -iname '*.flac' \
                     -o -iname '*.m4a' \
                     -o -iname '*.ogg' \
                     -o -iname '*.opus' \
                     -o -iname '*.wav' \
                   \) |
                 grep -q .; then

                log \
                  "SUCCESS" \
                  "$index" \
                  "spotDL completed successfully."

                return 0

              fi


              local error_class
              error_class="$(classify_error "$attempt_log")"


              case "$error_class" in

                NO_MATCH)

                  log \
                    "SKIP" \
                    "$index" \
                    "No provider match."

                  return 1

                  ;;


                BOT_DETECTION)

                  log \
                    "WARN" \
                    "$index" \
                    "Bot/authentication restriction detected."

                  return 1

                  ;;


                RATE_LIMIT|NETWORK)

                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then

                    local delay=$((2 ** attempt))

                    [ "$delay" -gt 30 ] && delay=30

                    log \
                      "RETRY" \
                      "$index" \
                      "${error_class}; waiting ${delay}s."

                    sleep "$delay"

                  fi

                  ;;


                FORMAT)

                  log \
                    "SKIP" \
                    "$index" \
                    "Requested format unavailable."

                  return 1

                  ;;


                FORBIDDEN)

                  log \
                    "WARN" \
                    "$index" \
                    "HTTP 403."

                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                    sleep $((attempt * 2))
                  fi

                  ;;


                UNKNOWN)

                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then

                    local delay=$((2 ** attempt))

                    [ "$delay" -gt 30 ] && delay=30

                    log \
                      "RETRY" \
                      "$index" \
                      "Unknown failure; waiting ${delay}s."

                    sleep "$delay"

                  fi

                  ;;

              esac


              attempt=$((attempt + 1))

            done


            log \
              "FAILED" \
              "$index" \
              "spotDL exhausted all attempts."

            return 1
          }


          # ==========================================================
          # DIRECT YT-DLP
          # ==========================================================

          download_direct() {

            local index="$1"
            local type="$2"
            local url="$3"


            local dir="work/downloads/${index}"
            local log_file="work/logs/${index}-direct.log"


            mkdir -p "$dir"


            local -a cmd

            cmd=(
              yt-dlp

              --ignore-config

              --newline

              --continue

              --no-overwrites

              --retries "$YTDLP_RETRIES"
              --fragment-retries "$YTDLP_FRAGMENT_RETRIES"
              --extractor-retries "$YTDLP_EXTRACTOR_RETRIES"
              --file-access-retries "$YTDLP_FILE_ACCESS_RETRIES"

              --socket-timeout "$YTDLP_SOCKET_TIMEOUT"

              --concurrent-fragments "$YTDLP_CONCURRENT_FRAGMENTS"

              --throttled-rate 100K

              --sleep-requests 1

              --extractor-args
              "youtube:player-client=mweb"

              --format
              "bestaudio/best"

              --output
              "${dir}/%(title)s [%(id)s].%(ext)s"
            )


            # bgutil is automatic on its default localhost endpoint.


            if [[ "$url" == *music.youtube.com* ]] &&
               [ -n "$COOKIE_YTM" ]; then

              cmd+=(
                --cookies
                "$COOKIE_YTM"
              )

            elif [[ "$url" == *youtube.com* ||
                    "$url" == *youtu.be* ]] &&
                 [ -n "$COOKIE_YT" ]; then

              cmd+=(
                --cookies
                "$COOKIE_YT"
              )

            fi


            if [[ "$type" == "youtube" ]]; then
              cmd+=(--no-playlist)
            fi


            log \
              "DIRECT" \
              "$index" \
              "Starting direct yt-dlp."


            local exit_code=0


            timeout 900 \
              "${cmd[@]}" \
              > "$log_file" \
              2>&1 \
              || exit_code=$?


            if [ "$exit_code" -eq 0 ] &&
               find "$dir" \
                 -type f \
                 \( \
                   -iname '*.webm' \
                   -o -iname '*.m4a' \
                   -o -iname '*.opus' \
                   -o -iname '*.aac' \
                 \) |
               grep -q .; then

              log \
                "SUCCESS" \
                "$index" \
                "Direct yt-dlp succeeded."

              return 0

            fi


            local error_class
            error_class="$(classify_error "$log_file")"


            log \
              "WARN" \
              "$index" \
              "Direct yt-dlp failed: ${error_class}."


            return 1
          }


          # ==========================================================
          # RESULT
          # ==========================================================

          write_result() {

            local index="$1"
            local type="$2"
            local url="$3"
            local status="$4"
            local provider="$5"
            local attempts="$6"
            local reason="$7"
            local started="$8"
            local finished="$9"


            local dir="work/downloads/${index}"


            mapfile -t files < <(
              find "$dir" \
                -type f \
                \( \
                  -iname '*.mp3' \
                  -o -iname '*.flac' \
                  -o -iname '*.m4a' \
                  -o -iname '*.ogg' \
                  -o -iname '*.opus' \
                  -o -iname '*.wav' \
                \) \
                -printf '%f\n' \
                2>/dev/null |
              sort
            )


            printf '%s\n' "${files[@]}" |
              jq -R -s \
                'split("\n") | map(select(length > 0))' \
              > "${dir}/files.json"


            jq -n \
              --arg index "$index" \
              --arg type "$type" \
              --arg url "$url" \
              --arg status "$status" \
              --arg provider "$provider" \
              --arg attempts "$attempts" \
              --arg reason "$reason" \
              --arg started "$started" \
              --arg finished "$finished" \
              --slurpfile files "${dir}/files.json" \
              '{
                index: ($index | tonumber),
                input_type: $type,
                url: $url,
                status: $status,
                provider: $provider,
                attempts: ($attempts | tonumber),
                reason: $reason,
                started_at: $started,
                finished_at: $finished,
                output_files: $files[0]
              }' \
              > "work/results/${index}.json"


            rm -f "${dir}/files.json"
          }


          # ==========================================================
          # ONE URL
          # ==========================================================

          download_one() {

            local index="$1"
            local type="$2"
            local url="$3"


            local started
            started="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"


            local status="failed"
            local provider="none"
            local reason="all strategies failed"
            local attempts=0


            log \
              "START" \
              "$index" \
              "${type} → ${url}"


            # --------------------------------------------------------
            # Direct sources
            # --------------------------------------------------------

            if [[ "$type" == "youtube" ]] ||
               [[ "$type" == "soundcloud" ]]; then

              attempts=$((attempts + 1))


              if download_direct \
                "$index" \
                "$type" \
                "$url"; then

                status="success"
                provider="yt-dlp-direct"
                reason="direct source succeeded"

              fi

            fi


            # --------------------------------------------------------
            # spotDL fallback
            # --------------------------------------------------------

            if [ "$status" != "success" ]; then

              attempts=$((attempts + 1))


              if download_spotdl \
                "$index" \
                "$type" \
                "$url"; then

                status="success"
                provider="spotdl"
                reason="spotDL provider engine succeeded"

              fi

            fi


            # --------------------------------------------------------
            # Failure files
            # --------------------------------------------------------

            if [ "$status" != "success" ]; then

              printf \
                '%s\t%s\t%s\n' \
                "$index" \
                "$type" \
                "$url" \
                > "work/failed/${index}.tsv"


              printf '%s\n' "$url" \
                > "work/failed/${index}.url"


              log \
                "FAILED" \
                "$index" \
                "$reason"


              # Show most useful errors without flooding the log.
              for lf in \
                "work/logs/${index}-direct.log" \
                "work/logs/${index}-spotdl.log"; do

                if [ -f "$lf" ]; then

                  echo
                  echo "──── $(basename "$lf") ────"

                  tail -n 30 "$lf" || true

                fi

              done

            else

              log \
                "DONE" \
                "$index" \
                "SUCCESS via ${provider}"

            fi


            local finished
            finished="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"


            write_result \
              "$index" \
              "$type" \
              "$url" \
              "$status" \
              "$provider" \
              "$attempts" \
              "$reason" \
              "$started" \
              "$finished"
          }


          export -f \
            timestamp \
            log \
            classify_error \
            write_result \
            download_spotdl \
            download_direct \
            download_one


          export \
            FORMAT \
            QUALITY \
            BITRATE \
            RAW_CLIENT_ID \
            RAW_CLIENT_SECRET \
            USE_CUSTOM_CREDENTIALS \
            COOKIE_YT \
            COOKIE_YTM \
            PARALLEL \
            MAX_RETRIES \
            POT_SERVER_PORT \
            YTDLP_RETRIES \
            YTDLP_FRAGMENT_RETRIES \
            YTDLP_EXTRACTOR_RETRIES \
            YTDLP_FILE_ACCESS_RETRIES \
            YTDLP_SOCKET_TIMEOUT \
            YTDLP_CONCURRENT_FRAGMENTS \
            SPOTDL_THREADS


          # ==========================================================
          # CONTROLLED CONCURRENCY
          # ==========================================================

          active=0


          while IFS=$'\t' read -r index type url; do

            (
              download_one \
                "$index" \
                "$type" \
                "$url"
            ) &


            active=$((active + 1))


            if [ "$active" -ge "$PARALLEL" ]; then

              wait -n || true

              active=$((active - 1))

            fi


          done < work/jobs.tsv


          wait


          echo
          echo "✅ All downloader workers have finished."


      # ============================================================
      # CONVERT / VALIDATE
      # ============================================================

      - name: "🔄 Convert and validate audio"
        run: |
          set -Eeuo pipefail


          TARGET_FMT="${{ inputs.output_format }}"
          QUALITY="${{ inputs.audio_quality }}"


          case "$QUALITY" in
            320k|256k|192k|128k)
              FFMPEG_BITRATE="$QUALITY"
              ;;
            HIGH)
              FFMPEG_BITRATE="320k"
              ;;
            LOW)
              FFMPEG_BITRATE="128k"
              ;;
            LOSSLESS|HI_RES_LOSSLESS)
              FFMPEG_BITRATE="320k"
              ;;
            *)
              FFMPEG_BITRATE="320k"
              ;;
          esac


          echo "::group::🔄 Audio conversion"


          converted=0
          validated=0
          failed=0


          mapfile -d '' FILES < <(
            find work/downloads \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
                -o -iname '*.webm' \
                -o -iname '*.aac' \
              \) \
              -print0
          )


          for source in "${FILES[@]}"; do

            ext="${source##*.}"
            ext="${ext,,}"


            if [ "$ext" = "${TARGET_FMT,,}" ]; then

              output="$source"

            else

              output="${source%.*}.${TARGET_FMT}"


              case "$TARGET_FMT" in

                mp3)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a libmp3lame \
                    -b:a "$FFMPEG_BITRATE" \
                    -id3v2_version 3 \
                    -y \
                    "$output"

                  ;;


                flac)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a flac \
                    -y \
                    "$output"

                  ;;


                m4a)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a aac \
                    -b:a "$FFMPEG_BITRATE" \
                    -movflags +faststart \
                    -y \
                    "$output"

                  ;;


                ogg)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a libvorbis \
                    -b:a "$FFMPEG_BITRATE" \
                    -y \
                    "$output"

                  ;;


                opus)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a libopus \
                    -b:a "$FFMPEG_BITRATE" \
                    -y \
                    "$output"

                  ;;


                wav)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a pcm_s16le \
                    -y \
                    "$output"

                  ;;

              esac


              if [ ! -s "$output" ]; then

                echo "❌ Conversion failed:"
                echo "   $source"

                failed=$((failed + 1))

                rm -f "$output"

                continue

              fi


              converted=$((converted + 1))

              rm -f "$source"

            fi


            # --------------------------------------------------------
            # ffprobe validation
            # --------------------------------------------------------

            if [ ! -s "$output" ]; then

              failed=$((failed + 1))
              continue

            fi


            if ffprobe \
              -v error \
              -show_entries format=duration,size \
              -show_entries stream=codec_name,sample_rate,channels \
              -of json \
              "$output" \
              > /tmp/audio-validation.json; then

              validated=$((validated + 1))


              duration="$(
                jq -r \
                  '.format.duration // "unknown"' \
                  /tmp/audio-validation.json
              )"


              codec="$(
                jq -r \
                  '.streams[0].codec_name // "unknown"' \
                  /tmp/audio-validation.json
              )"


              echo \
                "✓ $(basename "$output") | ${codec} | ${duration}s"

            else

              echo \
                "❌ ffprobe rejected: $(basename "$output")"

              failed=$((failed + 1))

            fi

          done


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    🔍 AUDIO VALIDATION                     ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf '║ Converted : %-46s ║\n' "$converted"
          printf '║ Validated : %-46s ║\n' "$validated"
          printf '║ Failed    : %-46s ║\n' "$failed"
          echo "╚══════════════════════════════════════════════════════════════╝"


          echo "::endgroup::"


      # ============================================================
      # FINAL MUSIC DIRECTORY
      # ============================================================

      - name: "📚 Build final music directory"
        id: collect
        run: |
          set -Eeuo pipefail


          rm -rf music
          mkdir -p music


          count=0


          while IFS= read -r -d '' file; do

            count=$((count + 1))


            name="$(basename "$file")"


            printf -v numbered_name \
              '%04d-%s' \
              "$count" \
              "$name"


            cp \
              --reflink=auto \
              -p \
              "$file" \
              "music/${numbered_name}"


          done < <(
            find work/downloads \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) \
              -print0 |
            sort -z
          )


          echo "FINAL_AUDIO_COUNT=$count" >> "$GITHUB_OUTPUT"


          echo
          echo "🎵 Final audio files: $count"


          if [ "$count" -gt 0 ]; then
            ls -lh music/
          fi


      # ============================================================
      # MANIFEST + GITHUB SUMMARY
      # ============================================================

      - name: "📝 Generate manifest and summary"
        id: summary
        run: |
          set -Eeuo pipefail


          TOTAL="$(
            jq -s 'length' work/results/*.json 2>/dev/null ||
            echo 0
          )


          SUCCESS="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json 2>/dev/null ||
            echo 0
          )


          FAILED="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json 2>/dev/null ||
            echo 0
          )


          AUDIO_COUNT="$(
            find music \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) \
              | wc -l
          )


          AUDIO_BYTES="$(
            find music \
              -type f \
              -printf '%s\n' |
            awk '{s += $1} END {print s + 0}'
          )


          jq -n \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg sha "$GITHUB_SHA" \
            --arg created "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg format "${{ inputs.output_format }}" \
            --arg quality "${{ inputs.audio_quality }}" \
            --arg upload "${{ inputs.upload_method }}" \
            --argjson vpn "${{ inputs.vpn_enabled }}" \
            --argjson bundle "${{ inputs.bundle_all }}" \
            --argjson pot true \
            --argjson total "$TOTAL" \
            --argjson success "$SUCCESS" \
            --argjson failed "$FAILED" \
            --argjson audio_count "$AUDIO_COUNT" \
            --argjson audio_bytes "$AUDIO_BYTES" \
            '{
              workflow: $workflow,
              repository: $repo,
              run_id: $run_id,
              run_number: $run_number,
              commit: $sha,
              created_at: $created,
              format: $format,
              quality: $quality,
              upload_method: $upload,
              vpn_enabled: $vpn,
              bgutil_enabled: $pot,
              bundle_all: $bundle,
              urls_requested: $total,
              urls_successful: $success,
              urls_failed: $failed,
              final_audio_files: $audio_count,
              final_audio_bytes: $audio_bytes
            }' \
            > work/manifest.json


          cp \
            work/manifest.json \
            music/manifest.json


          echo
          jq . work/manifest.json


          # ----------------------------------------------------------
          # GitHub summary
          # ----------------------------------------------------------

          {
            echo "# 🎵 Music Downloader"
            echo
            echo "## Configuration"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Output | \`${{ inputs.output_format }}\` |"
            echo "| Quality | \`${{ inputs.audio_quality }}\` |"
            echo "| Upload | \`${{ inputs.upload_method }}\` |"
            echo "| Bundle | \`${{ inputs.bundle_all }}\` |"
            echo "| VPN | \`${{ inputs.vpn_enabled }}\` |"
            echo "| bgutil PO Token | \`latest\` |"
            echo
            echo "## Result"
            echo
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| Requested | ${TOTAL} |"
            echo "| Successful | ${SUCCESS} |"
            echo "| Failed | ${FAILED} |"
            echo "| Final audio files | ${AUDIO_COUNT} |"
            echo

            if [ "$FAILED" -gt 0 ]; then

              echo "## ❌ Failed URLs"
              echo
              echo '```text'

              for file in work/failed/*.tsv; do
                [ -f "$file" ] || continue
                cat "$file"
              done

              echo '```'

            else

              echo "## ✅ All requested URLs succeeded."

            fi

          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # PACKAGE
      # ============================================================

      - name: "📦 Package output"
        id: archive
        env:
          BUNDLE_ALL: ${{ inputs.bundle_all }}
          UPLOAD_METHOD: ${{ inputs.upload_method }}
        run: |
          set -Eeuo pipefail


          rm -rf \
            work/archive \
            work/package


          mkdir -p \
            work/archive \
            work/package


          mapfile -d '' AUDIO_FILES < <(
            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) \
              -print0 |
            sort -z
          )


          if [ "${#AUDIO_FILES[@]}" -eq 0 ]; then

            echo "⚠️ No audio files to package."

            echo "HAS_ASSETS=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          for file in "${AUDIO_FILES[@]}"; do

            cp \
              --reflink=auto \
              -p \
              "$file" \
              work/package/

          done


          # ----------------------------------------------------------
          # Bundled ZIP
          # ----------------------------------------------------------

          if [ "$BUNDLE_ALL" = "true" ]; then

            suffix="$(
              tr -dc 'a-z0-9' </dev/urandom |
              head -c5
            )"


            zip_name="music-${suffix}.zip"


            case "$UPLOAD_METHOD" in

              repo)

                (
                  cd work/package

                  zip \
                    -0 \
                    -s 90m \
                    -r \
                    "../archive/${zip_name}" \
                    .
                )

                ;;


              release)

                (
                  cd work/package

                  zip \
                    -0 \
                    -r \
                    "../archive/${zip_name}" \
                    .
                )


                size="$(
                  stat \
                    -c%s \
                    "work/archive/${zip_name}"
                )"


                if [ "$size" -gt 1900000000 ]; then

                  echo \
                    "⚠️ Large archive; using split release ZIP."

                  rm -f \
                    work/archive/"${zip_name}"*


                  (
                    cd work/package

                    zip \
                      -0 \
                      -s 1900m \
                      -r \
                      "../archive/${zip_name}" \
                      .
                  )

                fi

                ;;


              drive)

                (
                  cd work/package

                  zip \
                    -0 \
                    -r \
                    "../archive/${zip_name}" \
                    .
                )

                ;;

            esac


          # ----------------------------------------------------------
          # Individual ZIPs
          # ----------------------------------------------------------

          else

            index=0


            for file in "${AUDIO_FILES[@]}"; do

              index=$((index + 1))


              base="$(basename "$file")"


              safe="$(
                printf '%s' "$base" |
                tr ' ' '_' |
                tr -cd '[:alnum:]_.-'
              )"


              suffix="$(
                tr -dc 'a-z0-9' </dev/urandom |
                head -c5
              )"


              zip_name="single-${index}-${safe}-${suffix}.zip"


              (
                cd "$(dirname "$file")"

                zip \
                  -0 \
                  "../../work/archive/${zip_name}" \
                  "$(basename "$file")"
              )

            done

          fi


          # ----------------------------------------------------------
          # Checksums
          # ----------------------------------------------------------

          (
            cd work/archive

            find . \
              -maxdepth 1 \
              -type f \
              -print0 |
            sort -z |
            xargs -0 sha256sum
          ) > work/archive/SHA256SUMS.txt


          cp \
            work/archive/SHA256SUMS.txt \
            music/SHA256SUMS.txt


          cp \
            work/manifest.json \
            work/archive/manifest.json


          find work/archive \
            -maxdepth 1 \
            -type f \
            ! -name 'SHA256SUMS.txt' \
            ! -name 'manifest.json' \
            -exec cp -p {} music/ \;


          echo "HAS_ASSETS=true" >> "$GITHUB_OUTPUT"


          echo
          echo "📦 Packaged output:"
          ls -lh music/


      # ============================================================
      # DIAGNOSTIC ARTIFACT
      # ============================================================

      - name: "📊 Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downloader-diagnostics-${{ github.run_number }}
          path: |
            work/logs/
            work/results/
            work/failed/
            work/jobs.tsv
            work/input_urls.txt
            work/manifest.json
            music/manifest.json
            music/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6


      # ============================================================
      # DISCONNECT VPN
      # ============================================================

      - name: "🔌 Disconnect VPN before upload"
        if: steps.vpn.outputs.vpn_available == 'true'
        run: |
          set +e

          echo "🔌 Disconnecting WireGuard."

          sudo wg-quick down wg0 \
            >/dev/null 2>&1 \
            || true

          echo "✅ VPN disconnected."


      # ============================================================
      # GOOGLE DRIVE
      # ============================================================

      - name: "☁️ Upload to Google Drive"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'drive'
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_NAME: "github-actions"
        run: |
          set -Eeuo pipefail


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  ☁️ GOOGLE DRIVE UPLOAD                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo


          if [ -z "$CLIENT_ID" ] ||
             [ -z "$CLIENT_SECRET" ] ||
             [ -z "$REFRESH_TOKEN" ]; then

            echo "❌ Google Drive credentials are incomplete."
            exit 1

          fi


          TOKEN_JSON="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --request POST \
              https://oauth2.googleapis.com/token \
              --data-urlencode "client_id=${CLIENT_ID}" \
              --data-urlencode "client_secret=${CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${REFRESH_TOKEN}" \
              --data-urlencode "grant_type=refresh_token"
          )"


          ACCESS_TOKEN="$(
            jq -r \
              '.access_token // empty' \
              <<< "$TOKEN_JSON"
          )"


          if [ -z "$ACCESS_TOKEN" ]; then

            echo "❌ Failed to acquire Drive access token."
            exit 1

          fi


          QUERY="mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false"


          FOLDER_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --get \
              https://www.googleapis.com/drive/v3/files \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              --data-urlencode "q=${QUERY}" \
              --data-urlencode "fields=files(id,name)"
          )"


          FOLDER_ID="$(
            jq -r \
              '.files[0].id // empty' \
              <<< "$FOLDER_RESPONSE"
          )"


          if [ -z "$FOLDER_ID" ]; then

            BODY="$(
              jq -n \
                --arg name "$DRIVE_FOLDER_NAME" \
                '{
                  name: $name,
                  mimeType: "application/vnd.google-apps.folder"
                }'
            )"


            FOLDER_ID="$(
              curl \
                --silent \
                --show-error \
                --fail \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                --request POST \
                https://www.googleapis.com/drive/v3/files \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$BODY" |
              jq -r '.id // empty'
            )"

          fi


          if [ -z "$FOLDER_ID" ]; then
            echo "❌ Failed to create/find Drive folder."
            exit 1
          fi


          upload_file() {

            local file="$1"

            local name
            name="$(basename "$file")"


            local size
            size="$(stat -c%s "$file")"


            echo
            echo "⬆️ $name"
            echo "   Size: $size bytes"


            local headers
            headers="$(mktemp)"


            local metadata
            metadata="$(
              jq -n \
                --arg name "$name" \
                --arg folder "$FOLDER_ID" \
                '{
                  name: $name,
                  parents: [$folder]
                }'
            )"


            if ! curl \
              --silent \
              --show-error \
              --request POST \
              -D "$headers" \
              -o /dev/null \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: application/zip" \
              -H "X-Upload-Content-Length: ${size}" \
              --data "$metadata" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable"; then

              rm -f "$headers"
              return 1

            fi


            local session_uri


            session_uri="$(
              awk '
                BEGIN { IGNORECASE=1 }
                /^location:/ {
                  sub(/\r$/, "")
                  sub(/^[^:]*:[[:space:]]*/, "")
                  print
                  exit
                }
              ' "$headers"
            )"


            rm -f "$headers"


            if [ -z "$session_uri" ]; then
              echo "❌ Failed to create upload session."
              return 1
            fi


            local offset=0


            while [ "$offset" -lt "$size" ]; do

              local remaining=$((size - offset))
              local length="$DRIVE_CHUNK_SIZE"


              if [ "$remaining" -lt "$length" ]; then
                length="$remaining"
              fi


              local end=$((offset + length - 1))


              local chunk
              chunk="$(mktemp --suffix=.drivechunk)"


              dd \
                if="$file" \
                of="$chunk" \
                iflag=skip_bytes,count_bytes \
                skip="$offset" \
                count="$length" \
                status=none


              local chunk_uploaded="false"


              for attempt in 1 2 3 4 5; do

                local response
                response="$(mktemp)"


                local code


                code="$(
                  curl \
                    --silent \
                    --show-error \
                    --output "$response" \
                    --write-out '%{http_code}' \
                    --request PUT \
                    -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                    -H "Content-Type: application/octet-stream" \
                    -H "Content-Length: ${length}" \
                    -H "Content-Range: bytes ${offset}-${end}/${size}" \
                    --data-binary "@${chunk}" \
                    "$session_uri"
                )"


                case "$code" in

                  200|201)

                    offset="$size"
                    chunk_uploaded="true"

                    ;;


                  308)

                    range="$(
                      grep -i '^Range:' "$response" \
                        2>/dev/null |
                      tail -n1 |
                      sed -E \
                        's/.*bytes=0-([0-9]+).*/\1/I'
                    )"


                    if [[ "$range" =~ ^[0-9]+$ ]]; then
                      offset=$((range + 1))
                    else
                      offset=$((end + 1))
                    fi


                    chunk_uploaded="true"

                    ;;


                  429|500|502|503|504)

                    delay=$((2 ** attempt))

                    [ "$delay" -gt 30 ] && delay=30

                    echo \
                      "   ⚠️ HTTP $code; retrying in ${delay}s."

                    sleep "$delay"

                    ;;


                  *)

                    echo "   ❌ Drive upload failed: HTTP $code"

                    cat "$response" || true

                    rm -f "$response" "$chunk"

                    return 1

                    ;;

                esac


                rm -f "$response"


                if [ "$offset" -ge "$size" ]; then
                  break
                fi


                if [ "$chunk_uploaded" = "true" ]; then
                  break
                fi

              done


              rm -f "$chunk"


              if [ "$offset" -lt "$size" ] &&
                 [ "$chunk_uploaded" != "true" ]; then

                echo "❌ Drive chunk failed permanently."
                return 1

              fi


              percent=$((offset * 100 / size))

              printf \
                '   Progress: %3d%%\n' \
                "$percent"

            done


            echo "✅ Uploaded: $name"

            return 0
          }


          # Upload ZIPs/split archives first.
          for file in music/*; do

            [ -f "$file" ] || continue


            case "$(basename "$file")" in

              *.zip|*.z01|*.z02|*.z03|*.z04|*.z05|*.z06|*.z07|*.z08|*.z09)

                upload_file "$file"

                ;;

            esac

          done


          # Metadata files.
          [ -f music/manifest.json ] &&
            upload_file music/manifest.json


          [ -f music/SHA256SUMS.txt ] &&
            upload_file music/SHA256SUMS.txt


          echo
          echo "✅ Google Drive upload completed."


      # ============================================================
      # REPOSITORY
      # ============================================================

      - name: "📤 Upload to repository"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'repo'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add music/


          if git diff --cached --quiet; then

            echo "ℹ️ Nothing to commit."
            exit 0

          fi


          git commit \
            -m "Add music downloader output [skip ci]"


          for attempt in 1 2 3 4 5; do

            echo "🚀 Push attempt ${attempt}/5"


            if git pull \
              --rebase \
              --autostash \
              origin "$BRANCH" &&
               git push origin "$BRANCH"; then

              echo "✅ Repository upload complete."
              exit 0

            fi


            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 3))
            fi

          done


          echo "❌ Repository upload failed."
          exit 1


      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: "🏷️ Create GitHub Release"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail


          suffix="$(
            tr -dc 'a-z0-9' </dev/urandom |
            head -c5
          )"


          tag="music-${suffix}"


          TOTAL="$(
            jq -s 'length' work/results/*.json 2>/dev/null ||
            echo 0
          )


          SUCCESS="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json 2>/dev/null ||
            echo 0
          )


          FAILED="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json 2>/dev/null ||
            echo 0
          )


          cat > work/release-notes.md <<EOF
          # 🎵 Music Downloader

          ## Result

          - Requested: ${TOTAL}
          - Successful: ${SUCCESS}
          - Failed: ${FAILED}
          - Format: ${{ inputs.output_format }}
          - Quality: ${{ inputs.audio_quality }}
          - VPN: ${{ inputs.vpn_enabled }}
          - PO-token provider: bgutil latest

          Generated automatically by GitHub Actions.
          EOF


          mapfile -t ASSETS < <(
            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -name '*.zip' \
                -o -name '*.z01' \
                -o -name '*.z02' \
                -o -name '*.z03' \
                -o -name '*.z04' \
                -o -name '*.z05' \
                -o -name '*.z06' \
                -o -name '*.z07' \
                -o -name '*.z08' \
                -o -name '*.z09' \
                -o -name 'manifest.json' \
                -o -name 'SHA256SUMS.txt' \
              \) \
              -print |
            sort
          )


          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "❌ No release assets."
            exit 1
          fi


          gh release create \
            "$tag" \
            "${ASSETS[@]}" \
            --title "Music Downloader ${suffix}" \
            --notes-file work/release-notes.md \
            --target "${GITHUB_SHA}"


          echo "✅ Release created."


      # ============================================================
      # FINAL STATUS
      # ============================================================

      - name: "✅ Final status"
        if: always()
        env:
          FAIL_ON_PARTIAL: ${{ inputs.fail_on_partial }}
        run: |
          set -Eeuo pipefail


          TOTAL="$(
            jq -s 'length' work/results/*.json 2>/dev/null ||
            echo 0
          )


          SUCCESS="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json 2>/dev/null ||
            echo 0
          )


          FAILED="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json 2>/dev/null ||
            echo 0
          )


          AUDIO="$(
            find music \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) |
            wc -l
          )


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                     🎵 FINAL RESULT                        ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf '║ Requested      : %-41s ║\n' "$TOTAL"
          printf '║ Successful     : %-41s ║\n' "$SUCCESS"
          printf '║ Failed         : %-41s ║\n' "$FAILED"
          printf '║ Audio files    : %-41s ║\n' "$AUDIO"
          printf '║ Format         : %-41s ║\n' "${{ inputs.output_format }}"
          printf '║ Quality        : %-41s ║\n' "${{ inputs.audio_quality }}"
          printf '║ VPN            : %-41s ║\n' "${{ inputs.vpn_enabled }}"
          printf '║ PO-token       : %-41s ║\n' "bgutil latest"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo


          if [ "$FAILED" -eq 0 ]; then

            echo "✅ All URLs completed successfully."
            exit 0

          fi


          if [ "$SUCCESS" -eq 0 ]; then

            echo "❌ No URLs completed successfully."
            exit 1

          fi


          if [ "$FAIL_ON_PARTIAL" = "true" ]; then

            echo "❌ Partial completion detected."
            exit 1

          fi


          echo "⚠️ Partial completion accepted."


      # ============================================================
      # CLEANUP
      # ============================================================

      - name: "🧹 Cleanup"
        if: always()
        run: |
          set +e


          echo "🧹 Cleaning temporary resources..."


          docker rm -f bgutil-provider \
            >/dev/null 2>&1 \
            || true


          sudo wg-quick down wg0 \
            >/dev/null 2>&1 \
            || true


          rm -f \
            /tmp/wg0.conf \
            /tmp/youtube-cookies.txt \
            /tmp/youtube-music-cookies.txt \
            /tmp/bgutil-ping.txt \
            /tmp/audio-validation.json


          find /tmp \
            -maxdepth 1 \
            -name '*.drivechunk' \
            -delete \
            2>/dev/null \
            || true


          echo "✅ Cleanup complete."
