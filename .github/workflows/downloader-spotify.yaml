name: downloader-spotify

on:
  workflow_dispatch:
    inputs:
      urls:
        description: >
          Enter one or more Spotify / Tidal / Apple Music / SoundCloud / YouTube / Pandora URLs
          (track, album, playlist, artist). Separate by commas, spaces, or newlines.
        required: true
        type: string
      output_format:
        description: "Output Format"
        required: true
        type: choice
        options:
          - mp3
          - flac
          - m4a
          - ogg
          - opus
          - wav
        default: mp3
      audio_quality:
        description: >
          Audio Quality / Bitrate.
          For MP3/M4A/OGG/Opus: 320k, 256k, 192k, 128k.
          For FLAC: LOSSLESS, HI_RES_LOSSLESS, HIGH, LOW.
        required: true
        type: choice
        options:
          - 320k
          - 256k
          - 192k
          - 128k
          - LOSSLESS
          - HI_RES_LOSSLESS
          - HIGH
          - LOW
        default: 320k
      upload_method:
        description: 'Upload destination'
        required: true
        type: choice
        options:
          - drive
          - repo
          - release
        default: drive
      bundle_all:
        description: 'Bundle all downloaded tracks into a single ZIP (true) or create a ZIP for each track (false)'
        type: boolean
        default: true
      vpn_enabled:
        description: 'Route downloads through WireGuard VPN (requires secret WG_CONFIG)'
        type: boolean
        default: true
      concurrent_downloads:
        description: 'Number of Albums/Playlists to download at the same time (Keep at 2 for stability)'
        type: number
        default: 2
        required: false
      retry_count:
        description: 'How many times to retry a failed URL'
        type: number
        default: 5
        required: false

permissions:
  contents: write

jobs:
  music-download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System Dependencies
        shell: bash
        run: |
          set -e
          echo "::group::System packages"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl jq zip python3 python3-pip python3-venv
          echo "::endgroup::"

          echo "::group::Python virtual environment & tools"
          python3 -m venv /opt/venv
          echo "/opt/venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=/opt/venv" >> $GITHUB_ENV
          source /opt/venv/bin/activate
          pip install --quiet --upgrade pip
          
          # Pinned to 4.2.10 for maximum stability against API/NoneType crashes
          pip install --quiet "spotdl==4.2.10"
          pip install --quiet --upgrade pyOpenSSL cryptography
          echo "::endgroup::"

          echo "📥 Installing Deno..."
          if ! command -v deno &> /dev/null; then
            curl -fsSL https://deno.land/install.sh | sh -s -- -y
            echo "$HOME/.deno/bin" >> $GITHUB_PATH
          fi
          echo "✅ Deno ready."

          echo "::group::Versions"
          ffmpeg -version 2>&1 | head -n1
          python3 --version
          spotdl --version 2>/dev/null || echo "spotDL version check failed (continuing)"
          echo "::endgroup::"

      - name: "Set up WireGuard VPN (Deep CI Fix)"
        id: vpn
        shell: bash
        run: |
          VPN_ENABLED="${{ inputs.vpn_enabled }}"
          echo "VPN_ENABLED=$VPN_ENABLED"

          if [ "$VPN_ENABLED" = "true" ]; then
            if [ -z "${{ secrets.WG_CONFIG }}" ]; then
              echo "::warning::VPN enabled but WG_CONFIG secret is empty – VPN Disabled."
              echo "vpn_available=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "→ Installing WireGuard tools..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq wireguard-tools openresolv 2>/dev/null || sudo apt-get install -y -qq wireguard-tools

            echo "→ Writing WireGuard config..."
            cat <<'EOF' > /tmp/wg0.conf
          ${{ secrets.WG_CONFIG }}
          EOF

            # 🧠 DEEP FIX 1: Enforce safe MTU to prevent silent TCP hangs in CI environments
            sed -i '/^MTU\s*=/d' /tmp/wg0.conf
            sed -i '/^\[Interface\]/a MTU = 1360' /tmp/wg0.conf
            
            # 🧠 DEEP FIX 2: Remove WireGuard DNS to prevent breaking GitHub Actions runner DNS resolution
            sed -i '/^DNS\s*=/d' /tmp/wg0.conf

            sudo cp /tmp/wg0.conf /etc/wireguard/wg0.conf
            sudo chmod 600 /etc/wireguard/wg0.conf

            # 🧠 DEEP FIX 3: Bypass VPN for GitHub backend IPs so the runner agent doesn't lose connection
            echo "→ Fetching GitHub IP ranges to bypass VPN..."
            DEFAULT_IF=$(ip route show default 2>/dev/null | awk '/default/ {print $5}' | head -n1)
            if [ -z "$DEFAULT_IF" ]; then DEFAULT_IF="eth0"; fi
            
            GITHUB_IPS=$(curl -s https://api.github.com/meta | jq -r '.actions[]?, .hooks[]?, .web[]?, .api[]?, .git[]?' 2>/dev/null | sort -u)
            for ip in $GITHUB_IPS; do
                sudo ip route add "$ip" dev "$DEFAULT_IF" 2>/dev/null || true
            done

            echo "→ Bringing up wg0..."
            if sudo wg-quick up wg0; then
              echo "✅ WireGuard VPN connected securely without breaking agent."
              echo "vpn_available=true" >> $GITHUB_OUTPUT
            else
              echo "::warning::Failed to bring up WireGuard – VPN disabled."
              sudo wg-quick down wg0 2>/dev/null || true
              echo "vpn_available=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "vpn_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Music Folder
        run: mkdir -p music

      - name: Parse and Filter URLs
        id: parse
        shell: bash
        run: |
          RAW="${{ github.event.inputs.urls }}"
          URLS=$(echo "$RAW" | tr ',' ' ' | tr '\n' ' ' | tr -s ' ' | sed 's/^ *//;s/ *$//')

          if [ -z "$URLS" ]; then
            echo "::error::No URLs provided."
            exit 1
          fi

          rm -f spotify_urls.txt

          for url in $URLS; do
            if [[ "$url" =~ ^https?://(open\.spotify\.com|listen\.tidal\.com|music\.apple\.com|soundcloud\.com|youtube\.com|youtu\.be|music\.youtube\.com|pandora\.com|pandora\.app\.link) ]]; then
              echo "$url" >> spotify_urls.txt
            else
              echo "::warning::Skipping unsupported URL: $url"
            fi
          done

          if [ -s spotify_urls.txt ]; then
            echo "HAS_URLS=true" >> $GITHUB_OUTPUT
          else
            echo "::error::No valid URLs found."
            echo "HAS_URLS=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Download with spotdl (Robust Parallel)
        if: steps.parse.outputs.HAS_URLS == 'true'
        id: spotdl_download
        continue-on-error: true
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        shell: bash
        run: |
          set -x
          FORMAT="${{ github.event.inputs.output_format }}"
          BITRATE="${{ github.event.inputs.audio_quality }}"
          PARALLEL="${{ inputs.concurrent_downloads }}"
          MAX_RETRIES="${{ inputs.retry_count }}"
          VPN_AVAILABLE="${{ steps.vpn.outputs.vpn_available }}"
          FAILED="failed_urls_spotdl.txt"
          rm -f "$FAILED"

          case "$BITRATE" in
            LOSSLESS|HI_RES_LOSSLESS|HIGH|LOW) BITRATE_ARG="disable" ;;
            320k|256k|192k|128k) BITRATE_ARG="$BITRATE" ;;
            *) BITRATE_ARG="320k" ;;
          esac

          OUTPUT_TEMPLATE="music/{title} - {artists}.{output-ext}"

          echo "::group::Download configuration"
          echo "Format: $FORMAT | Bitrate: $BITRATE_ARG | Parallel Albums: $PARALLEL | Retries: $MAX_RETRIES"
          echo "::endgroup::"

          download_with_retry() {
            local url="$1"
            local attempt=1
            local output
            local down_exit=0

            while [ $attempt -le $MAX_RETRIES ]; do
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "▶ spotdl attempt $attempt/$MAX_RETRIES for: $url"
              
              BEFORE=$(find music -type f ! -name 'failed_downloads.txt' | wc -l)

              # 🧠 ROBUSTNESS FIX: Unique cache dir per thread prevents SQLite "database is locked" crashes
              CACHE_DIR="/tmp/spotdl-cache-$$-${RANDOM}"
              mkdir -p "$CACHE_DIR"

              if [ "$VPN_AVAILABLE" = "true" ]; then
                echo "→ [VPN] Downloading..."
                # FIXED: Changed --cache-dir to --cache-path for spotdl v4.x compatibility
                output=$(spotdl download "$url" \
                  --format "$FORMAT" \
                  --bitrate "$BITRATE_ARG" \
                  --output "$OUTPUT_TEMPLATE" \
                  --cache-path "$CACHE_DIR" \
                  --threads 4 2>&1) && down_exit=0 || down_exit=1
              else
                echo "⚠️ [Direct] Downloading..."
                # FIXED: Changed --cache-dir to --cache-path for spotdl v4.x compatibility
                output=$(spotdl download "$url" \
                  --format "$FORMAT" \
                  --bitrate "$BITRATE_ARG" \
                  --output "$OUTPUT_TEMPLATE" \
                  --cache-path "$CACHE_DIR" \
                  --threads 4 2>&1) && down_exit=0 || down_exit=1
              fi

              rm -rf "$CACHE_DIR"
              echo "$output"

              AFTER=$(find music -type f ! -name 'failed_downloads.txt' | wc -l)

              if [ $down_exit -eq 0 ]; then
                if echo "$output" | grep -qiE '(file already exists|duplicate)'; then
                  echo "✅ spotdl skipped duplicate – treating as success."
                  return 0
                elif [ $AFTER -gt $BEFORE ]; then
                  echo "✅ spotdl succeeded on attempt $attempt (new files: $((AFTER - BEFORE)))"
                  return 0
                fi
              fi

              echo "❌ Attempt $attempt failed (exit code: $down_exit)"
              attempt=$((attempt + 1))
              if [ $attempt -le $MAX_RETRIES ]; then sleep 3; fi
            done

            echo "::warning::spotdl failed after $MAX_RETRIES attempts for: $url"
            echo "$url" >> "$FAILED"
            return 1
          }

          export -f download_with_retry
          export FORMAT BITRATE_ARG OUTPUT_TEMPLATE VPN_AVAILABLE MAX_RETRIES FAILED

          echo "→ Starting parallel downloads (max $PARALLEL concurrent albums/playlists)"
          cat spotify_urls.txt | xargs -P "$PARALLEL" -I '{}' bash -c 'download_with_retry "{}"'

          if [ -f "$FAILED" ]; then
            echo "::warning::URLs that failed:"
            cat "$FAILED"
          fi
          set +x

      - name: Convert Audio Format (if needed)
        if: steps.parse.outputs.HAS_URLS == 'true'
        shell: bash
        run: |
          TARGET_FMT="${{ github.event.inputs.output_format }}"
          BITRATE="${{ github.event.inputs.audio_quality }}"

          if [ "$TARGET_FMT" = "flac" ]; then
            echo "Output format is FLAC – skipping conversion."
            exit 0
          fi

          echo "::group::Converting to $TARGET_FMT ($BITRATE)"
          find music -type f \( -iname "*.flac" -o -iname "*.m4a" -o -iname "*.mp3" -o -iname "*.ogg" -o -iname "*.opus" -o -iname "*.wav" \) | while read -r f; do
            ext="${f##*.}"
            if [ "${ext,,}" = "${TARGET_FMT,,}" ]; then continue; fi

            base="${f%.*}"
            out="${base}.${TARGET_FMT}"
            echo "Converting: $f → $out"

            case "$TARGET_FMT" in
              mp3) ffmpeg -i "$f" -c:a libmp3lame -b:a "$BITRATE" -map_metadata 0 -y "$out" 2>/dev/null ;;
              m4a) ffmpeg -i "$f" -c:a aac -b:a "$BITRATE" -map_metadata 0 -y "$out" 2>/dev/null ;;
              ogg) ffmpeg -i "$f" -c:a libvorbis -b:a "$BITRATE" -map_metadata 0 -y "$out" 2>/dev/null ;;
              opus) ffmpeg -i "$f" -c:a libopus -b:a "$BITRATE" -map_metadata 0 -y "$out" 2>/dev/null ;;
              wav) ffmpeg -i "$f" -c:a pcm_s16le -map_metadata 0 -y "$out" 2>/dev/null ;;
            esac

            if [ -f "$out" ] && [ "$f" != "$out" ]; then rm "$f"; fi
          done
          echo "::endgroup::"

      - name: Collect Failed URLs
        if: always()
        shell: bash
        run: |
          if [ -f failed_urls_spotdl.txt ] && [ -s failed_urls_spotdl.txt ]; then
            cp failed_urls_spotdl.txt music/failed_downloads.txt
          fi

      - name: Validate Download
        shell: bash
        run: |
          SONG_COUNT=$(find music -type f ! -name 'failed_downloads.txt' | wc -l)
          if [ "$SONG_COUNT" -eq 0 ]; then
            echo "::warning::No audio files were downloaded."
          else
            echo "Total songs downloaded: $SONG_COUNT"
            ls -lhR music/
          fi

      - name: Disconnect VPN for uploads
        if: steps.vpn.outputs.vpn_available == 'true'
        run: |
          echo "→ Bringing down WireGuard to use runner's native internet for uploads"
          sudo wg-quick down wg0

      - name: Archive Music Folder
        id: archive
        shell: bash
        run: |
          BUNDLE_ALL="${{ inputs.bundle_all }}"
          UPLOAD_METHOD="${{ inputs.upload_method }}"

          if [ "$UPLOAD_METHOD" = "repo" ]; then METHOD="split_push"; else METHOD="release"; fi

          rm -rf music_archive
          mkdir -p music_archive

          FILE_COUNT=$(find music -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then touch music/NO_DOWNLOADS.txt; fi

          if [ "$BUNDLE_ALL" = "true" ]; then
            RANDOM_STR=$(python3 -c "import random, string; print(''.join(random.choices(string.ascii_lowercase + string.digits, k=5)))")
            BASE_NAME="music-${RANDOM_STR}"
            ZIP_NAME="${BASE_NAME}.zip"

            cd music || exit 1
            if [ "$METHOD" = "release" ]; then
              zip -0 -r "../music_archive/${ZIP_NAME}" .
              FULLZIP="../music_archive/${ZIP_NAME}"
              SIZE=$(stat -c%s "$FULLZIP" 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 2044723200 ]; then
                rm "$FULLZIP"
                zip -0 -r -s 1950m "../music_archive/${ZIP_NAME}" .
              fi
            else
              zip -0 -r -s 99m "../music_archive/${ZIP_NAME}" .
            fi
            cd ..
          else
            cd music || exit 1
            find . -type f ! -name 'failed_downloads.txt' | while IFS= read -r track; do
              track_name="${track#./}"
              safe_name=$(echo "$track_name" | tr ' ' '_' | tr -cd '[:alnum:]._-')
              [ -z "$safe_name" ] && safe_name="track_$(tr -dc 'a-z0-9' </dev/urandom | head -c8)"
              RAND5=$(tr -dc 'a-z' </dev/urandom | head -c5)
              ZIP_NAME="single_${safe_name%.*}_${RAND5}.zip"

              TMP_DIR="../music_archive/tmp_single"
              mkdir -p "$TMP_DIR"
              cp "$track" "$TMP_DIR/"

              if [ "$METHOD" = "release" ]; then
                (cd "$TMP_DIR" && zip -0 "../../music_archive/${ZIP_NAME}" ./*)
                FULLZIP="../../music_archive/${ZIP_NAME}"
                SIZE=$(stat -c%s "$FULLZIP" 2>/dev/null || echo 0)
                if [ "$SIZE" -gt 2044723200 ]; then
                  rm "$FULLZIP"
                  (cd "$TMP_DIR" && zip -0 -s 1950m "../../music_archive/${ZIP_NAME}" ./*)
                fi
              else
                (cd "$TMP_DIR" && zip -0 -s 99m "../../music_archive/${ZIP_NAME}" ./*)
              fi
              rm -rf "$TMP_DIR"
            done
            cd ..
          fi

          rm -rf music/*
          mv music_archive/* music/
          rmdir music_archive 2>/dev/null || true
          ls -1 music > music_assets.txt

      - name: "Upload to Google Drive"
        if: inputs.upload_method == 'drive'
        env:
          CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r '.access_token')
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "❌ Failed to obtain access token"
            exit 1
          fi

          FOLDER_NAME="github-actions"
          QUERY="mimeType='application/vnd.google-apps.folder' and name='$FOLDER_NAME' and trashed=false"
          FOLDER_ID=$(curl -s -G \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "q=$QUERY" \
            --data-urlencode "fields=files(id)" \
            "https://www.googleapis.com/drive/v3/files" | jq -r '.files[0].id // ""')
          if [ -z "$FOLDER_ID" ]; then
            FOLDER_ID=$(curl -s -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$FOLDER_NAME\", \"mimeType\":\"application/vnd.google-apps.folder\"}" \
              "https://www.googleapis.com/drive/v3/files?fields=id" | jq -r '.id')
          fi
          echo "✅ Folder ID: $FOLDER_ID"

          for file in music/*; do
            [ -f "$file" ] || continue
            fname=$(basename "$file")
            size=$(stat -c%s "$file")
            echo "→ Uploading $fname ($size bytes)..."

            SESSION_URI=$(curl -s -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: application/zip" \
              -d "{\"name\":\"$fname\", \"parents\":[\"$FOLDER_ID\"]}" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable" \
              -D - | tr -d '\r' | grep -i '^location:' | sed 's/^location: //i' | tr -d ' ')
            
            if [ -z "$SESSION_URI" ]; then continue; fi

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Length: $size" \
              -H "Content-Range: bytes 0-$((size-1))/$size" \
              --data-binary "@$file" \
              "$SESSION_URI")
            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
              echo "✅ Uploaded $fname"
            fi
          done

      - name: Upload to repository (split_push method)
        if: ${{ inputs.upload_method == 'repo' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add music/
          COMMIT_MSG="Add: $(ls -1 music/ | tr '\n' ' ' | sed 's/ *$//') [skip ci]"
          git commit -m "$COMMIT_MSG" || echo "Nothing to commit"
          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then break; else [ $i -lt $RETRIES ] && sleep 3 || exit 1; fi
          done

      - name: Create Release and upload assets (release method)
        if: ${{ inputs.upload_method == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s music_assets.txt ]; then exit 0; fi
          RAND5=$(tr -dc 'a-z' </dev/urandom | head -c5)
          TAG="music-downloader-${RAND5}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag "$TAG" -m "Music download release"
          git push origin "$TAG"
          ASSET_ARGS=""
          while IFS= read -r file; do ASSET_ARGS="$ASSET_ARGS music/$file"; done < music_assets.txt
          gh release create "$TAG" $ASSET_ARGS \
            --title "music-downloader-${RAND5}" \
            --notes "Automated release from Spotify Download workflow." \
            --target "${{ github.ref_name }}"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf music release_files spotify_urls.txt failed_urls_spotdl.txt music_assets.txt *.zip 2>/dev/null || true
          sudo wg-quick down wg0 2>/dev/null || true
