name: downloader-spotify

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "🎵 Spotify/Tidal/Apple Music/SoundCloud/YouTube/Pandora URLs"
        required: true
        type: string

      output_format:
        description: "🎧 Output format"
        required: true
        type: choice
        options:
          - mp3
          - flac
          - m4a
          - ogg
          - opus
          - wav
        default: mp3

      audio_quality:
        description: "🎚️ Audio quality / bitrate"
        required: true
        type: choice
        options:
          - 320k
          - 256k
          - 192k
          - 128k
          - LOSSLESS
          - HI_RES_LOSSLESS
          - HIGH
          - LOW
        default: 320k

      upload_method:
        description: "☁️ Upload destination"
        required: true
        type: choice
        options:
          - drive
          - repo
          - release
        default: drive

      bundle_all:
        description: "📦 Bundle all tracks into one ZIP?"
        required: true
        type: boolean
        default: true

      vpn_enabled:
        description: "🔒 Enable WireGuard VPN?"
        required: true
        type: boolean
        default: false

      use_custom_credentials:
        description: "🔑 Use custom Spotify credentials?"
        required: true
        type: boolean
        default: false

      concurrent_downloads:
        description: "⚡ Concurrent URL workers"
        required: true
        type: number
        default: 2

      retry_count:
        description: "🔄 Transient retries per provider"
        required: true
        type: number
        default: 3

      raw_logs:
        description: "🧪 Show raw spotDL/yt-dlp logs?"
        required: true
        type: boolean
        default: false

      fail_on_partial:
        description: "❌ Fail workflow if any URL fails?"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: music-downloader-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  POT_SERVER_PORT: "4416"
  DEFAULT_PARALLEL: "2"
  DEFAULT_RETRIES: "3"
  SPOTDL_THREADS: "3"

  YTDLP_RETRIES: "8"
  YTDLP_FRAGMENT_RETRIES: "8"
  YTDLP_EXTRACTOR_RETRIES: "5"
  YTDLP_FILE_ACCESS_RETRIES: "5"
  YTDLP_SOCKET_TIMEOUT: "30"
  YTDLP_CONCURRENT_FRAGMENTS: "3"

  DRIVE_CHUNK_SIZE: "16777216"
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  music-download:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    steps:
      # ============================================================
      # 01. CHECKOUT
      # ============================================================

      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      # ============================================================
      # 02. SYSTEM DEPENDENCIES
      # ============================================================

      - name: "🛠️ Install system dependencies"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            ffmpeg \
            curl \
            jq \
            zip \
            unzip \
            aria2 \
            wireguard-tools \
            openssl \
            python3 \
            python3-pip \
            python-is-python3

          echo "✅ System dependencies installed."

      # ============================================================
      # 03. DENO
      # ============================================================

      - name: "🦕 Install latest Deno"
        run: |
          set -Eeuo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            https://deno.land/install.sh \
            | sh -s -- -y

          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.deno/bin:$PATH"

          deno --version

      # ============================================================
      # 04. PYTHON PACKAGES
      # ============================================================

      - name: "📦 Install latest downloader packages"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          set -Eeuo pipefail

          python3 -m pip install \
            --upgrade \
            --break-system-packages \
            --retries 5 \
            --timeout 60 \
            pip \
            setuptools \
            wheel

          python3 -m pip install \
            --upgrade \
            --break-system-packages \
            --retries 5 \
            --timeout 60 \
            spotdl \
            "yt-dlp[default]" \
            yt-dlp-ejs \
            bgutil-ytdlp-pot-provider

      # ============================================================
      # 05. TOOLCHAIN
      # ============================================================

      - name: "🔎 Show installed versions"
        run: |
          set -Eeuo pipefail

          echo "Python : $(python3 --version 2>&1)"
          echo "spotDL : $(spotdl --version 2>&1 || true)"
          echo "yt-dlp : $(yt-dlp --version)"
          echo "Deno   : $(deno --version | sed -n '1p')"
          echo "FFmpeg : $(ffmpeg -version | sed -n '1p')"
          echo "FFprobe: $(ffprobe -version | sed -n '1p')"

          echo
          python3 -m pip list |
            grep -Ei \
              'spotdl|yt-dlp|bgutil|ejs|spotipy|mutagen|rapidfuzz' \
            || true

      # ============================================================
      # 06. WORKSPACE & IDENTIFIER
      # ============================================================

      - name: "📁 Initialize workspace"
        run: |
          set -Eeuo pipefail

          # Generate unique 5-character alphanumeric/hex string shared across steps
          RUN_SUFFIX="$(openssl rand -hex 4 | cut -c1-5)"
          echo "RUN_SUFFIX=${RUN_SUFFIX}" >> "$GITHUB_ENV"
          echo "🆔 Generated identifier: ${RUN_SUFFIX}"

          rm -rf work music

          mkdir -p \
            work/downloads \
            work/logs \
            work/results \
            work/failed \
            work/archive \
            work/package \
            music

          echo "✅ Workspace initialized."

      # ============================================================
      # 07. PARSE URLs
      # ============================================================

      - name: "🔗 Parse and classify URLs"
        env:
          RAW_URLS: ${{ inputs.urls }}
        run: |
          set -Eeuo pipefail

          : > work/input_urls.txt
          : > work/jobs.tsv

          printf '%s\n' "$RAW_URLS" |
            tr ',' '\n' |
            sed 's/\r//g' |
            awk '{
              for (i = 1; i <= NF; i++) {
                print $i
              }
            }' |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
            awk 'NF' |
            sort -u \
            > work/input_urls.txt

          if [ ! -s work/input_urls.txt ]; then
            echo "❌ No URLs supplied."
            exit 1
          fi

          index=0

          while IFS= read -r url; do
            index=$((index + 1))
            type=""

            if [[ "$url" =~ ^https?://(open\.)?spotify\.com/ ]]; then
              type="spotify"
            elif [[ "$url" =~ ^https?://(www\.)?youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://music\.youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://youtu\.be/ ]]; then
              type="youtube"
            elif [[ "$url" =~ ^https?://(www\.)?soundcloud\.com/ ]]; then
              type="soundcloud"
            elif [[ "$url" =~ ^https?://(www\.)?tidal\.com/ ]] ||
                 [[ "$url" =~ ^https?://listen\.tidal\.com/ ]]; then
              type="tidal"
            elif [[ "$url" =~ ^https?://(www\.)?music\.apple\.com/ ]]; then
              type="apple"
            elif [[ "$url" =~ ^https?://(www\.)?pandora\.com/ ]] ||
                 [[ "$url" =~ ^https?://pandora\.app\.link/ ]]; then
              type="pandora"
            fi

            if [ -z "$type" ]; then
              echo "⚠️ Unsupported URL skipped: $url"
              continue
            fi

            printf '%04d\t%s\t%s\n' \
              "$index" \
              "$type" \
              "$url" \
              >> work/jobs.tsv
          done < work/input_urls.txt

          if [ ! -s work/jobs.tsv ]; then
            echo "❌ No supported URLs found."
            exit 1
          fi

          echo
          echo "Accepted URLs: $(wc -l < work/jobs.tsv)"
          cat work/jobs.tsv

      # ============================================================
      # 08. OPTIONAL WIREGUARD
      # ============================================================

      - name: "🔒 Configure WireGuard"
        id: vpn
        env:
          VPN_ENABLED: ${{ inputs.vpn_enabled }}
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          set -Eeuo pipefail

          if [ "$VPN_ENABLED" != "true" ]; then
            echo "🚫 VPN disabled."
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$WG_CONFIG" ]; then
            echo "⚠️ VPN requested but WG_CONFIG is empty."
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          umask 077
          printf '%s\n' "$WG_CONFIG" > /tmp/wg0.conf

          sudo install \
            -m 600 \
            /tmp/wg0.conf \
            /etc/wireguard/wg0.conf

          if sudo wg-quick up wg0; then
            echo "✅ WireGuard connected."

            public_ip="$(
              curl \
                -4 \
                --silent \
                --show-error \
                --max-time 15 \
                https://api.ipify.org \
              || echo "unavailable"
            )"

            echo "🌐 Public IPv4: $public_ip"
            echo "vpn_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ WireGuard failed."
            sudo wg-quick down wg0 >/dev/null 2>&1 || true
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # 09. BGUTIL PO TOKEN
      # ============================================================

      - name: "🛡️ Start bgutil PO-token provider"
        id: pot
        run: |
          set -Eeuo pipefail

          image="brainicism/bgutil-ytdlp-pot-provider:latest"

          docker rm -f bgutil-provider >/dev/null 2>&1 || true

          echo "🐳 Pulling $image"

          if ! docker pull "$image"; then
            echo "⚠️ Failed to pull bgutil."
            echo "pot_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker run \
            --name bgutil-provider \
            --detach \
            --init \
            --network host \
            "$image"

          ready="false"
          echo "⏳ Waiting for bgutil..."

          for attempt in $(seq 1 40); do
            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 3 \
              "http://127.0.0.1:${POT_SERVER_PORT}/ping" \
              >/tmp/bgutil-ping.json \
              2>/dev/null; then

              ready="true"
              break
            fi
            sleep 2
          done

          if [ "$ready" = "true" ]; then
            echo "✅ bgutil ready."
            echo "pot_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ bgutil failed health check."
            docker logs bgutil-provider > work/logs/bgutil-provider.log 2>&1 || true
            echo "pot_available=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # 10. DOWNLOAD ENGINE
      # ============================================================

      - name: "⬇️ Download media"
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_MUSIC_COOKIES: ${{ secrets.YOUTUBE_MUSIC_COOKIES }}
          USE_CUSTOM_CREDENTIALS: ${{ inputs.use_custom_credentials }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
          AUDIO_QUALITY: ${{ inputs.audio_quality }}
          CONCURRENT_WORKERS: ${{ inputs.concurrent_downloads }}
          RETRY_COUNT: ${{ inputs.retry_count }}
          RAW_LOGS: ${{ inputs.raw_logs }}
          POT_AVAILABLE: ${{ steps.pot.outputs.pot_available }}
          VPN_AVAILABLE: ${{ steps.vpn.outputs.vpn_available }}
        run: |
          set -Eeuo pipefail

          FORMAT="$OUTPUT_FORMAT"
          QUALITY="$AUDIO_QUALITY"
          WORKERS="$CONCURRENT_WORKERS"
          RETRIES="$RETRY_COUNT"

          if ! [[ "$WORKERS" =~ ^[1-8]$ ]]; then
            WORKERS="$DEFAULT_PARALLEL"
          fi

          if ! [[ "$RETRIES" =~ ^[1-6]$ ]]; then
            RETRIES="$DEFAULT_RETRIES"
          fi

          case "$QUALITY" in
            320k|256k|192k|128k)
              BITRATE="$QUALITY"
              ;;
            HIGH)
              BITRATE="320k"
              ;;
            LOW)
              BITRATE="128k"
              ;;
            LOSSLESS|HI_RES_LOSSLESS)
              if [ "$FORMAT" = "flac" ] || [ "$FORMAT" = "wav" ]; then
                BITRATE="disable"
              else
                BITRATE="320k"
              fi
              ;;
            *)
              BITRATE="320k"
              ;;
          esac

          COOKIE_YT=""
          COOKIE_YTM=""

          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/youtube-cookies.txt
            chmod 600 /tmp/youtube-cookies.txt
            COOKIE_YT="/tmp/youtube-cookies.txt"
          fi

          if [ -n "$YOUTUBE_MUSIC_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_MUSIC_COOKIES" > /tmp/youtube-music-cookies.txt
            chmod 600 /tmp/youtube-music-cookies.txt
            COOKIE_YTM="/tmp/youtube-music-cookies.txt"
          fi

          now() {
            date '+%H:%M:%S'
          }

          log() {
            local level="$1"
            local id="$2"
            local message="$3"
            local icon="•"

            case "$level" in
              START) icon="▶" ;;
              SEARCH) icon="🔎" ;;
              AUTH) icon="🔐" ;;
              PROVIDER) icon="🔌" ;;
              RETRY) icon="↻" ;;
              FALLBACK) icon="↪" ;;
              DOWNLOAD) icon="⬇" ;;
              VERIFY) icon="✓" ;;
              SUCCESS) icon="✅" ;;
              WARN) icon="⚠" ;;
              ERROR) icon="✖" ;;
              FAILED) icon="❌" ;;
              DONE) icon="◆" ;;
            esac

            printf '[%s] %-9s #%04d │ %s %s\n' "$(now)" "$level" "$id" "$icon" "$message"
          }

          has_audio() {
            local dir="$1"
            find "$dir" -type f \( \
              -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' \
              -o -iname '*.ogg' -o -iname '*.opus' -o -iname '*.wav' \
              -o -iname '*.webm' -o -iname '*.aac' \
            \) -print -quit | grep -q .
          }

          classify_error() {
            local logfile="$1"

            if grep -qiE 'invalid choice:|unrecognized arguments|no such option|usage: spotdl|argument .* error' "$logfile"; then
              echo "CONFIGURATION"
              return
            fi

            if grep -qiE 'No results found for song:|no usable provider result|no provider result|no results found|returned no usable results|could not find|unable to find|no matches|no match' "$logfile"; then
              echo "NO_RESULT"
              return
            fi

            if grep -qiE '429|Too Many Requests|rate.?limit' "$logfile"; then
              echo "RATE_LIMIT"
              return
            fi

            if grep -qiE 'not a bot|confirm you.re not a bot|captcha|bot detection' "$logfile"; then
              echo "BLOCKED"
              return
            fi

            if grep -qiE 'HTTP Error 403|HTTP 403|Forbidden' "$logfile"; then
              echo "FORBIDDEN"
              return
            fi

            if grep -qiE 'timed out|timeout|Connection reset|Connection aborted|Temporary failure|Could not resolve|network error|Network is unreachable' "$logfile"; then
              echo "NETWORK"
              return
            fi

            if grep -qiE 'Requested format is not available|No video formats found|No formats found' "$logfile"; then
              echo "FORMAT"
              return
            fi

            echo "UNKNOWN"
          }

          detect_providers() {
            local probe choices help_text
            probe="$(spotdl download --audio __invalid_provider__ https://example.invalid 2>&1 || true)"
            choices="$(printf '%s\n' "$probe" | grep -F 'choose from' | tail -n 1 || true)"
            help_text="$(spotdl --help 2>&1 || true)"

            SUPPORTED_PROVIDERS=()
            local candidates=(youtube-music youtube soundcloud bandcamp piped)
            local provider

            for provider in "${candidates[@]}"; do
              if [ -n "$choices" ]; then
                if [[ "$choices" == *"'${provider}'"* ]]; then
                  SUPPORTED_PROVIDERS+=("$provider")
                fi
              elif grep -Fq "$provider" <<< "$help_text"; then
                SUPPORTED_PROVIDERS+=("$provider")
              fi
            done

            if [ "${#SUPPORTED_PROVIDERS[@]}" -eq 0 ]; then
              echo "❌ No supported spotDL providers detected."
              echo "$probe"
              return 1
            fi
          }

          provider_supported() {
            local wanted="$1"
            local provider
            for provider in "${SUPPORTED_PROVIDERS[@]}"; do
              if [ "$provider" = "$wanted" ]; then
                return 0
              fi
            done
            return 1
          }

          provider_cookie() {
            local provider="$1"
            case "$provider" in
              youtube-music)
                if [ -n "$COOKIE_YTM" ]; then
                  printf '%s' "$COOKIE_YTM"
                elif [ -n "$COOKIE_YT" ]; then
                  printf '%s' "$COOKIE_YT"
                fi
                ;;
              youtube)
                if [ -n "$COOKIE_YT" ]; then
                  printf '%s' "$COOKIE_YT"
                elif [ -n "$COOKIE_YTM" ]; then
                  printf '%s' "$COOKIE_YTM"
                fi
                ;;
            esac
          }

          run_spotdl_provider() {
            local id="$1"
            local url="$2"
            local provider="$3"
            local attempt="$4"

            local dir="work/downloads/${id}"
            local logfile="work/logs/${id}-${provider}-attempt-${attempt}.log"

            mkdir -p "$dir/cache"

            # Output formatted strictly as: {title} - {artists}.{output-ext}
            local -a cmd=(
              spotdl
              download
              "$url"
              --audio
              "$provider"
              --format
              "$FORMAT"
              --bitrate
              "$BITRATE"
              --output
              "${dir}/{title} - {artists}.{output-ext}"
              --threads
              "$SPOTDL_THREADS"
              --max-retries
              3
              --overwrite
              skip
              --restrict
              none
              --max-filename-length
              180
              --print-errors
              --log-level
              INFO
              --cache-path
              "${dir}/cache"
              --archive
              "${dir}/archive.txt"
            )

            if [ "$RAW_LOGS" = "true" ]; then
              cmd+=(--log-level DEBUG)
            fi

            if [ "$USE_CUSTOM_CREDENTIALS" = "true" ] &&
               [ -n "$SPOTIFY_CLIENT_ID" ] &&
               [ -n "$SPOTIFY_CLIENT_SECRET" ]; then
              export SPOTIPY_CLIENT_ID="$SPOTIFY_CLIENT_ID"
              export SPOTIPY_CLIENT_SECRET="$SPOTIFY_CLIENT_SECRET"
              log AUTH "$id" "Custom Spotify credentials enabled."
            else
              unset SPOTIPY_CLIENT_ID || true
              unset SPOTIPY_CLIENT_SECRET || true
              log AUTH "$id" "Using spotDL default Spotify client."
            fi

            local cookie
            cookie="$(provider_cookie "$provider")"

            if [ -n "$cookie" ]; then
              cmd+=(--cookie-file "$cookie")
              log AUTH "$id" "${provider} cookies enabled."
            fi

            local ytdlp_args
            if [ "$provider" = "youtube-music" ]; then
              ytdlp_args="
              --retries ${YTDLP_RETRIES}
              --fragment-retries ${YTDLP_FRAGMENT_RETRIES}
              --extractor-retries ${YTDLP_EXTRACTOR_RETRIES}
              --file-access-retries ${YTDLP_FILE_ACCESS_RETRIES}
              --socket-timeout ${YTDLP_SOCKET_TIMEOUT}
              --concurrent-fragments ${YTDLP_CONCURRENT_FRAGMENTS}
              --throttled-rate 100K
              --sleep-requests 1
              --extractor-args youtube:player-client=web_music,default
              --extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}
              "
            elif [ "$provider" = "youtube" ]; then
              ytdlp_args="
              --retries ${YTDLP_RETRIES}
              --fragment-retries ${YTDLP_FRAGMENT_RETRIES}
              --extractor-retries ${YTDLP_EXTRACTOR_RETRIES}
              --file-access-retries ${YTDLP_FILE_ACCESS_RETRIES}
              --socket-timeout ${YTDLP_SOCKET_TIMEOUT}
              --concurrent-fragments ${YTDLP_CONCURRENT_FRAGMENTS}
              --throttled-rate 100K
              --sleep-requests 1
              --extractor-args youtube:player-client=default,web_embedded
              --extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}
              "
            else
              ytdlp_args="
              --retries ${YTDLP_RETRIES}
              --fragment-retries ${YTDLP_FRAGMENT_RETRIES}
              --extractor-retries ${YTDLP_EXTRACTOR_RETRIES}
              --file-access-retries ${YTDLP_FILE_ACCESS_RETRIES}
              --socket-timeout ${YTDLP_SOCKET_TIMEOUT}
              --concurrent-fragments ${YTDLP_CONCURRENT_FRAGMENTS}
              --throttled-rate 100K
              --sleep-requests 1
              --extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}
              "
            fi

            if [ "$RAW_LOGS" = "true" ]; then
              ytdlp_args="${ytdlp_args} --verbose"
            fi

            cmd+=(--yt-dlp-args "$ytdlp_args")
            log PROVIDER "$id" "${provider} | attempt ${attempt}/${RETRIES}"

            local exit_code=0
            if [ "$RAW_LOGS" = "true" ]; then
              set +e
              stdbuf -oL -eL timeout 900 "${cmd[@]}" 2>&1 |
              tee "$logfile" |
              while IFS= read -r line; do
                printf '[%s] RAW       #%04d │ %s\n' "$(now)" "$id" "$line"
              done
              exit_code="${PIPESTATUS[0]}"
              set -e
            else
              timeout 900 "${cmd[@]}" > "$logfile" 2>&1 || exit_code=$?
            fi

            if [ "$exit_code" -eq 0 ] && has_audio "$dir"; then
              log VERIFY "$id" "${provider} produced usable audio."
              return 0
            fi

            return 1
          }

          run_direct_ytdlp() {
            local id="$1"
            local type="$2"
            local url="$3"

            local dir="work/downloads/${id}"
            local logfile="work/logs/${id}-direct.log"

            mkdir -p "$dir"

            local -a cmd=(
              yt-dlp
              --ignore-config
              --newline
              --continue
              --no-overwrites
              --retries "$YTDLP_RETRIES"
              --fragment-retries "$YTDLP_FRAGMENT_RETRIES"
              --extractor-retries "$YTDLP_EXTRACTOR_RETRIES"
              --file-access-retries "$YTDLP_FILE_ACCESS_RETRIES"
              --socket-timeout "$YTDLP_SOCKET_TIMEOUT"
              --concurrent-fragments "$YTDLP_CONCURRENT_FRAGMENTS"
              --throttled-rate 100K
              --sleep-requests 1
              --format "bestaudio/best"
              --output "${dir}/%(title)s - %(artist,creator,uploader)s.%(ext)s"
            )

            if [ "$type" = "youtube" ]; then
              cmd+=(--extractor-args "youtube:player-client=default,web_embedded")
            else
              cmd+=(--extractor-args "youtube:player-client=default")
            fi

            cmd+=(--extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}")

            if [ "$RAW_LOGS" = "true" ]; then
              cmd+=(--verbose)
            fi

            if [ "$type" = "youtube" ]; then
              if [ -n "$COOKIE_YT" ]; then
                cmd+=(--cookies "$COOKIE_YT")
              elif [ -n "$COOKIE_YTM" ]; then
                cmd+=(--cookies "$COOKIE_YTM")
              fi
              cmd+=(--no-playlist)
            fi

            log DOWNLOAD "$id" "Direct yt-dlp strategy."

            local exit_code=0
            if [ "$RAW_LOGS" = "true" ]; then
              set +e
              stdbuf -oL -eL timeout 900 "${cmd[@]}" 2>&1 |
              tee "$logfile" |
              while IFS= read -r line; do
                printf '[%s] RAW       #%04d │ %s\n' "$(now)" "$id" "$line"
              done
              exit_code="${PIPESTATUS[0]}"
              set -e
            else
              timeout 900 "${cmd[@]}" > "$logfile" 2>&1 || exit_code=$?
            fi

            if [ "$exit_code" -eq 0 ] && has_audio "$dir"; then
              log VERIFY "$id" "Direct yt-dlp produced audio."
              return 0
            fi

            return 1
          }

          write_result() {
            local id="$1"
            local type="$2"
            local url="$3"
            local status="$4"
            local provider="$5"
            local reason="$6"
            local started="$7"
            local finished="$8"

            local dir="work/downloads/${id}"

            mapfile -t output_files < <(
              find "$dir" \
                -type f \
                \( \
                  -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' \
                  -o -iname '*.ogg' -o -iname '*.opus' -o -iname '*.wav' \
                \) \
                -printf '%f\n' 2>/dev/null | sort
            )

            printf '%s\n' "${output_files[@]}" |
              jq -R -s 'split("\n") | map(select(length > 0))' > "${dir}/files.json"

            jq -n \
              --arg id "$id" \
              --arg type "$type" \
              --arg url "$url" \
              --arg status "$status" \
              --arg provider "$provider" \
              --arg reason "$reason" \
              --arg started "$started" \
              --arg finished "$finished" \
              --slurpfile files "${dir}/files.json" \
              '{
                index: ($id | tonumber),
                input_type: $type,
                url: $url,
                status: $status,
                provider: $provider,
                reason: $reason,
                started_at: $started,
                finished_at: $finished,
                output_files: $files[0]
              }' > "work/results/${id}.json"

            rm -f "${dir}/files.json"
          }

          process_one() {
            local id="$1"
            local type="$2"
            local url="$3"

            local dir="work/downloads/${id}"
            mkdir -p "$dir"

            local started_at
            started_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            local status="failed"
            local winner="none"
            local reason="all strategies failed"

            echo
            echo "╭──────────────────────────────────────────────────────────────╮"
            printf '│ 🎵 INPUT #%04d                                             │\n' "$id"
            echo "├──────────────────────────────────────────────────────────────┤"
            printf '│ Type: %-55s │\n' "$type"
            printf '│ URL : %-55s │\n' "$url"
            echo "╰──────────────────────────────────────────────────────────────╯"

            log START "$id" "Processing ${type} input."
            log SEARCH "$id" "Starting download resolution."

            if [ "$type" = "youtube" ] || [ "$type" = "soundcloud" ]; then
              log SEARCH "$id" "Trying direct yt-dlp."

              if run_direct_ytdlp "$id" "$type" "$url"; then
                status="success"
                winner="yt-dlp"
                reason="direct yt-dlp succeeded"
              else
                log FALLBACK "$id" "Direct yt-dlp failed → spotDL."
              fi
            fi

            if [ "$status" != "success" ]; then
              provider_order=(youtube-music youtube soundcloud bandcamp piped)

              for provider in "${provider_order[@]}"; do
                if ! provider_supported "$provider"; then
                  continue
                fi

                log PROVIDER "$id" "Trying ${provider}."
                provider_success="false"

                for attempt in $(seq 1 "$RETRIES"); do
                  current_log="work/logs/${id}-${provider}-attempt-${attempt}.log"

                  if run_spotdl_provider "$id" "$url" "$provider" "$attempt"; then
                    provider_success="true"
                    status="success"
                    winner="$provider"
                    reason="spotDL ${provider} succeeded"
                    break
                  fi

                  failure_type="$(classify_error "$current_log")"

                  case "$failure_type" in
                    CONFIGURATION)
                      log ERROR "$id" "${provider}: configuration error."
                      break
                      ;;
                    NO_RESULT)
                      log WARN "$id" "${provider}: no result → next provider."
                      break
                      ;;
                    FORMAT)
                      log WARN "$id" "${provider}: requested format unavailable."
                      break
                      ;;
                    RATE_LIMIT)
                      log WARN "$id" "${provider}: rate limited."
                      ;;
                    BLOCKED)
                      log WARN "$id" "${provider}: blocked/bot protection."
                      ;;
                    FORBIDDEN)
                      log WARN "$id" "${provider}: HTTP 403."
                      ;;
                    NETWORK)
                      log WARN "$id" "${provider}: network error."
                      ;;
                    *)
                      log WARN "$id" "${provider}: ${failure_type}."
                      ;;
                  esac

                  if [ "$failure_type" = "NO_RESULT" ] ||
                     [ "$failure_type" = "CONFIGURATION" ] ||
                     [ "$failure_type" = "FORMAT" ]; then
                    break
                  fi

                  if [ "$attempt" -lt "$RETRIES" ]; then
                    case "$failure_type" in
                      RATE_LIMIT) delay=$((attempt * 10)) ;;
                      BLOCKED|FORBIDDEN) delay=$((attempt * 6)) ;;
                      NETWORK) delay=$((attempt * 4)) ;;
                      *) delay=$((attempt * 3)) ;;
                    esac

                    [ "$delay" -gt 30 ] && delay=30
                    log RETRY "$id" "${provider}: retry ${attempt}/${RETRIES} in ${delay}s."
                    sleep "$delay"
                  fi
                done

                if [ "$provider_success" = "true" ]; then
                  break
                fi

                log FALLBACK "$id" "${provider} failed → next provider."
              done
            fi

            finished_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            if [ "$status" = "success" ]; then
              log SUCCESS "$id" "Downloaded successfully via ${winner}."
              log DONE "$id" "SUCCESS"
            else
              log FAILED "$id" "All download strategies failed."
              reason="All providers exhausted."

              printf '%s\t%s\t%s\n' "$id" "$type" "$url" > "work/failed/${id}.tsv"
              printf '%s\n' "$reason" > "work/failed/${id}.reason"

              log DONE "$id" "FAILED"
            fi

            write_result "$id" "$type" "$url" "$status" "$winner" "$reason" "$started_at" "$finished_at"
          }

          detect_providers

          echo
          echo "Detected spotDL providers:"
          printf '  ✓ %s\n' "${SUPPORTED_PROVIDERS[@]}"
          echo

          export -f \
            now \
            log \
            has_audio \
            classify_error \
            provider_supported \
            provider_cookie \
            run_spotdl_provider \
            run_direct_ytdlp \
            write_result \
            process_one

          export \
            FORMAT \
            QUALITY \
            BITRATE \
            WORKERS \
            RETRIES \
            RAW_LOGS \
            SPOTDL_THREADS \
            SPOTIFY_CLIENT_ID \
            SPOTIFY_CLIENT_SECRET \
            YOUTUBE_COOKIES \
            YOUTUBE_MUSIC_COOKIES \
            COOKIE_YT \
            COOKIE_YTM \
            USE_CUSTOM_CREDENTIALS \
            POT_SERVER_PORT \
            POT_AVAILABLE \
            VPN_AVAILABLE \
            YTDLP_RETRIES \
            YTDLP_FRAGMENT_RETRIES \
            YTDLP_EXTRACTOR_RETRIES \
            YTDLP_FILE_ACCESS_RETRIES \
