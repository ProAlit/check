name: downloader-spotify

on:
  workflow_dispatch:
    inputs:

      urls:
        description: >
          🎵 Enter Spotify/Tidal/Apple Music/SoundCloud/YouTube/Pandora URLs
          (comma, space, or newline separated)
        required: true
        type: string

      output_format:
        description: "🎧 Output format"
        required: true
        type: choice
        options:
          - mp3
          - flac
          - m4a
          - ogg
          - opus
          - wav
        default: mp3

      audio_quality:
        description: "🎚️ Audio quality / bitrate"
        required: true
        type: choice
        options:
          - 320k
          - 256k
          - 192k
          - 128k
          - LOSSLESS
          - HI_RES_LOSSLESS
          - HIGH
          - LOW
        default: 320k

      upload_method:
        description: "☁️ Upload destination"
        required: true
        type: choice
        options:
          - drive
          - repo
          - release
        default: drive

      bundle_all:
        description: "📦 Bundle all downloaded tracks into ZIP?"
        required: true
        type: boolean
        default: true

      vpn_enabled:
        description: "🔒 Enable WireGuard VPN?"
        required: true
        type: boolean
        default: false

      use_custom_credentials:
        description: >
          🔑 Use custom Spotify API credentials?
          Requires SPOTIFY_CLIENT_ID + SPOTIFY_CLIENT_SECRET
        required: true
        type: boolean
        default: false

      concurrent_downloads:
        description: "⚡ Number of URLs processed concurrently"
        required: true
        type: number
        default: 2

      retry_count:
        description: "🔄 Attempts per provider"
        required: true
        type: number
        default: 3

      raw_logs:
        description: "🧪 Show full raw downloader logs?"
        required: true
        type: boolean
        default: false

      fail_on_partial:
        description: "❌ Fail workflow when any URL fails?"
        required: true
        type: boolean
        default: true


permissions:
  contents: write


concurrency:
  group: music-downloader-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false


env:

  # ---------------------------------------------------------------
  # Core configuration
  # ---------------------------------------------------------------

  POT_SERVER_PORT: "4416"

  DEFAULT_PARALLEL: "2"
  DEFAULT_RETRIES: "3"

  SPOTDL_THREADS: "3"

  # ---------------------------------------------------------------
  # yt-dlp reliability
  # ---------------------------------------------------------------

  YTDLP_RETRIES: "8"
  YTDLP_FRAGMENT_RETRIES: "8"
  YTDLP_EXTRACTOR_RETRIES: "5"
  YTDLP_FILE_ACCESS_RETRIES: "5"

  YTDLP_SOCKET_TIMEOUT: "30"
  YTDLP_CONCURRENT_FRAGMENTS: "3"

  # ---------------------------------------------------------------
  # Google Drive
  # ---------------------------------------------------------------

  DRIVE_CHUNK_SIZE: "16777216"


jobs:

  music-download:

    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash


    steps:

      # =============================================================
      # 01. CHECKOUT
      # =============================================================

      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true


      # =============================================================
      # 02. PYTHON
      # =============================================================

      - name: "🐍 Setup latest Python 3.x"
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true


      # =============================================================
      # 03. SYSTEM PACKAGES
      # =============================================================

      - name: "🛠️ Install system dependencies"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail

          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  🛠️ SYSTEM DEPENDENCIES                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            ffmpeg \
            curl \
            jq \
            zip \
            unzip \
            aria2 \
            wireguard-tools

          echo
          echo "✅ System dependencies installed."
          echo


      # =============================================================
      # 04. DNS COMPATIBILITY
      # =============================================================

      - name: "🌐 Configure DNS compatibility"
        run: |
          set -Eeuo pipefail

          echo "::group::🌐 DNS compatibility"

          if command -v resolvconf >/dev/null 2>&1; then

            echo "✅ resolvconf available."

          elif command -v resolvectl >/dev/null 2>&1; then

            echo "ℹ️ resolvconf unavailable."
            echo "✅ systemd-resolved detected."

          else

            echo "⚠️ No DNS management utility detected."

          fi

          echo "::endgroup::"


      # =============================================================
      # 05. DENO
      # =============================================================

      - name: "🦕 Install latest Deno"
        run: |
          set -Eeuo pipefail

          echo "::group::🦕 Deno"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            https://deno.land/install.sh \
            | sh -s -- -y

          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.deno/bin:$PATH"

          deno --version

          echo "::endgroup::"


      # =============================================================
      # 06. PYTHON PACKAGES
      # =============================================================

      - name: "📦 Install latest downloader packages"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -Eeuo pipefail

          echo "::group::⬆️ pip"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            pip \
            setuptools \
            wheel

          echo "::endgroup::"


          echo "::group::🎵 spotDL"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            spotdl

          echo "::endgroup::"


          echo "::group::📺 yt-dlp"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            "yt-dlp[default]"

          echo "::endgroup::"


          echo "::group::🧩 yt-dlp EJS"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            yt-dlp-ejs

          echo "::endgroup::"


          echo "::group::🛡️ bgutil PO-token provider"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            bgutil-ytdlp-pot-provider

          echo "::endgroup::"


      # =============================================================
      # 07. TOOLCHAIN INFORMATION
      # =============================================================

      - name: "🔎 Show installed versions"
        run: |
          set -Eeuo pipefail

          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                     🔎 TOOLCHAIN                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo

          printf 'Python : '
          python --version

          printf 'spotDL : '
          spotdl --version || true

          printf 'yt-dlp : '
          yt-dlp --version

          printf 'Deno   : '
          deno --version | head -n1

          printf 'FFmpeg : '
          ffmpeg -version | head -n1

          printf 'FFprobe: '
          ffprobe -version | head -n1

          printf 'aria2  : '
          aria2c --version | head -n1

          echo
          echo "Installed Python packages:"
          python -m pip list |
            grep -Ei \
              'spotdl|yt-dlp|bgutil|ejs|spotipy|mutagen|rapidfuzz' \
            || true


      # =============================================================
      # 08. WORKSPACE
      # =============================================================

      - name: "📁 Initialize workspace"
        run: |
          set -Eeuo pipefail

          rm -rf \
            work \
            music

          mkdir -p \
            work/downloads \
            work/logs \
            work/results \
            work/failed \
            work/archive \
            work/package \
            music

          echo "✅ Workspace ready."


      # =============================================================
      # 09. PARSE INPUT URLS
      # =============================================================

      - name: "🔗 Parse and classify URLs"
        id: parse
        env:
          RAW_URLS: ${{ inputs.urls }}
        run: |
          set -Eeuo pipefail

          echo "::group::🔗 URL parsing"

          : > work/input_urls.txt
          : > work/jobs.tsv

          printf '%s\n' "$RAW_URLS" |
            tr ',' '\n' |
            sed 's/\r//g' |
            awk '
              {
                for (i = 1; i <= NF; i++) {
                  print $i
                }
              }
            ' |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
            awk 'NF' |
            sort -u \
            > work/input_urls.txt

          if [ ! -s work/input_urls.txt ]; then
            echo "❌ No URLs supplied."
            exit 1
          fi

          index=0

          while IFS= read -r url; do

            index=$((index + 1))

            type=""

            if [[ "$url" =~ ^https?://(open\.)?spotify\.com/ ]]; then

              type="spotify"

            elif [[ "$url" =~ ^https?://(www\.)?youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://music\.youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://youtu\.be/ ]]; then

              type="youtube"

            elif [[ "$url" =~ ^https?://(www\.)?soundcloud\.com/ ]]; then

              type="soundcloud"

            elif [[ "$url" =~ ^https?://(www\.)?tidal\.com/ ]] ||
                 [[ "$url" =~ ^https?://listen\.tidal\.com/ ]]; then

              type="tidal"

            elif [[ "$url" =~ ^https?://(www\.)?music\.apple\.com/ ]]; then

              type="apple"

            elif [[ "$url" =~ ^https?://(www\.)?pandora\.com/ ]] ||
                 [[ "$url" =~ ^https?://pandora\.app\.link/ ]]; then

              type="pandora"

            fi

            if [ -z "$type" ]; then

              echo "⚠️ Unsupported URL skipped:"
              echo "   $url"

              continue

            fi

            printf \
              '%04d\t%s\t%s\n' \
              "$index" \
              "$type" \
              "$url" \
              >> work/jobs.tsv

          done < work/input_urls.txt

          if [ ! -s work/jobs.tsv ]; then
            echo "❌ No supported URLs."
            exit 1
          fi

          count="$(wc -l < work/jobs.tsv)"

          echo "INPUT_COUNT=$count" >> "$GITHUB_OUTPUT"

          echo
          echo "Accepted URLs: $count"
          echo

          while IFS=$'\t' read -r id type url; do

            printf \
              '#%s | %-10s | %s\n' \
              "$id" \
              "$type" \
              "$url"

          done < work/jobs.tsv

          echo "::endgroup::"


      # =============================================================
      # 10. WIREGUARD
      # =============================================================

      - name: "🔒 Configure WireGuard VPN"
        id: vpn
        env:
          VPN_ENABLED_INPUT: ${{ inputs.vpn_enabled }}
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          set -Eeuo pipefail

          echo "::group::🔒 WireGuard"

          if [ "$VPN_ENABLED_INPUT" != "true" ]; then

            echo "🚫 VPN disabled."

            echo "vpn_available=false" >> "$GITHUB_OUTPUT"

            echo "::endgroup::"

            exit 0

          fi

          if [ -z "$WG_CONFIG" ]; then

            echo "⚠️ VPN enabled but WG_CONFIG is empty."

            echo "vpn_available=false" >> "$GITHUB_OUTPUT"

            echo "::endgroup::"

            exit 0

          fi

          umask 077

          printf '%s\n' "$WG_CONFIG" > /tmp/wg0.conf

          sudo install \
            -m 600 \
            /tmp/wg0.conf \
            /etc/wireguard/wg0.conf

          echo "🚀 Starting WireGuard..."

          if sudo wg-quick up wg0; then

            echo "✅ WireGuard connected."

            current_ip="$(
              curl \
                -4 \
                --silent \
                --show-error \
                --max-time 15 \
                https://api.ipify.org \
              || echo "unavailable"
            )"

            echo "🌐 Public IPv4: $current_ip"

            echo "vpn_available=true" >> "$GITHUB_OUTPUT"

          else

            echo "❌ WireGuard failed."

            sudo wg-quick down wg0 \
              >/dev/null 2>&1 \
              || true

            echo "vpn_available=false" >> "$GITHUB_OUTPUT"

          fi

          echo "::endgroup::"


      # =============================================================
      # 11. BGUTIL PO TOKEN SERVER
      # =============================================================

      - name: "🛡️ Start bgutil PO-token provider"
        id: pot
        run: |
          set -Eeuo pipefail

          echo "::group::🛡️ bgutil PO-token provider"

          image="brainicism/bgutil-ytdlp-pot-provider:latest"

          docker rm -f bgutil-provider \
            >/dev/null 2>&1 \
            || true

          echo "🐳 Pulling: $image"

          if ! docker pull "$image"; then

            echo "⚠️ Could not pull bgutil image."

            echo "pot_available=false" >> "$GITHUB_OUTPUT"

            echo "::endgroup::"

            exit 0

          fi

          echo "🚀 Starting bgutil..."

          docker run \
            --name bgutil-provider \
            --detach \
            --init \
            --network host \
            "$image"

          ready="false"

          echo "⏳ Waiting for HTTP server..."

          for attempt in $(seq 1 40); do

            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 3 \
              "http://127.0.0.1:${POT_SERVER_PORT}/ping" \
              >/tmp/bgutil-ping.json \
              2>/dev/null; then

              ready="true"
              break

            fi

            sleep 2

          done

          if [ "$ready" = "true" ]; then

            echo "✅ bgutil is ready."

            echo "pot_available=true" >> "$GITHUB_OUTPUT"

          else

            echo "⚠️ bgutil did not become ready."

            docker logs bgutil-provider \
              > work/logs/bgutil-provider.log \
              2>&1 \
              || true

            echo "pot_available=false" >> "$GITHUB_OUTPUT"

          fi

          echo "::endgroup::"


      # =============================================================
      # 12. MEDIA DOWNLOAD ENGINE
      # =============================================================

      - name: "⬇️ Download media"
        id: download
        env:

          # ---------------------------------------------------------
          # Secrets
          # ---------------------------------------------------------

          SPOTIFY_CLIENT_ID_INPUT: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET_INPUT: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

          YOUTUBE_COOKIES_INPUT: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_MUSIC_COOKIES_INPUT: ${{ secrets.YOUTUBE_MUSIC_COOKIES }}

          # ---------------------------------------------------------
          # Inputs
          # ---------------------------------------------------------

          USE_CUSTOM_CREDENTIALS_INPUT: ${{ inputs.use_custom_credentials }}

          OUTPUT_FORMAT_INPUT: ${{ inputs.output_format }}
          AUDIO_QUALITY_INPUT: ${{ inputs.audio_quality }}

          PARALLEL_INPUT: ${{ inputs.concurrent_downloads }}
          RETRIES_INPUT: ${{ inputs.retry_count }}

          RAW_LOGS_INPUT: ${{ inputs.raw_logs }}

          POT_AVAILABLE: ${{ steps.pot.outputs.pot_available }}
          VPN_AVAILABLE: ${{ steps.vpn.outputs.vpn_available }}

        run: |
          set -Eeuo pipefail


          # ==========================================================
          # NORMALIZE INPUTS
          # ==========================================================

          FORMAT="$OUTPUT_FORMAT_INPUT"
          QUALITY="$AUDIO_QUALITY_INPUT"

          PARALLEL="$PARALLEL_INPUT"
          MAX_RETRIES="$RETRIES_INPUT"

          RAW_LOGS="$RAW_LOGS_INPUT"


          if ! [[ "$PARALLEL" =~ ^[1-8]$ ]]; then
            PARALLEL="$DEFAULT_PARALLEL"
          fi


          if ! [[ "$MAX_RETRIES" =~ ^[1-6]$ ]]; then
            MAX_RETRIES="$DEFAULT_RETRIES"
          fi


          # ==========================================================
          # BITRATE
          # ==========================================================

          case "$QUALITY" in

            320k|256k|192k|128k)

              BITRATE="$QUALITY"

              ;;


            HIGH)

              BITRATE="320k"

              ;;


            LOW)

              BITRATE="128k"

              ;;


            LOSSLESS|HI_RES_LOSSLESS)

              if [ "$FORMAT" = "flac" ] ||
                 [ "$FORMAT" = "wav" ]; then

                BITRATE="disable"

              else

                BITRATE="320k"

              fi

              ;;


            *)

              BITRATE="320k"

              ;;

          esac


          # ==========================================================
          # COOKIES
          # ==========================================================

          COOKIE_YT=""
          COOKIE_YTM=""


          if [ -n "$YOUTUBE_COOKIES_INPUT" ]; then

            printf '%s\n' \
              "$YOUTUBE_COOKIES_INPUT" \
              > /tmp/youtube-cookies.txt

            chmod 600 /tmp/youtube-cookies.txt

            COOKIE_YT="/tmp/youtube-cookies.txt"

          fi


          if [ -n "$YOUTUBE_MUSIC_COOKIES_INPUT" ]; then

            printf '%s\n' \
              "$YOUTUBE_MUSIC_COOKIES_INPUT" \
              > /tmp/youtube-music-cookies.txt

            chmod 600 /tmp/youtube-music-cookies.txt

            COOKIE_YTM="/tmp/youtube-music-cookies.txt"

          fi


          # ==========================================================
          # LOGGING
          # ==========================================================

          now() {
            date '+%H:%M:%S'
          }


          log() {

            local level="$1"
            local id="$2"
            local message="$3"

            local icon="•"


            case "$level" in

              START)
                icon="▶"
                ;;

              SEARCH)
                icon="🔎"
                ;;

              AUTH)
                icon="🔐"
                ;;

              PROVIDER)
                icon="🔌"
                ;;

              FALLBACK)
                icon="↪"
                ;;

              RETRY)
                icon="↻"
                ;;

              DOWNLOAD)
                icon="⬇"
                ;;

              VERIFY)
                icon="✓"
                ;;

              SUCCESS)
                icon="✅"
                ;;

              WARN)
                icon="⚠"
                ;;

              ERROR)
                icon="✖"
                ;;

              FAILED)
                icon="❌"
                ;;

              DONE)
                icon="◆"
                ;;

            esac


            printf \
              '[%s] %-9s #%04d │ %s %s\n' \
              "$(now)" \
              "$level" \
              "$id" \
              "$icon" \
              "$message"

          }


          # ==========================================================
          # AUDIO EXISTENCE
          # ==========================================================

          has_audio() {

            local directory="$1"


            find "$directory" \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
                -o -iname '*.webm' \
                -o -iname '*.aac' \
              \) \
              -print -quit |
              grep -q .

          }


          # ==========================================================
          # ERROR CLASSIFIER
          # ==========================================================

          classify_error() {

            local logfile="$1"


            if grep -qiE \
              'invalid choice:|unrecognized arguments|no such option|usage: spotdl|argument .* error' \
              "$logfile"; then

              echo "CONFIGURATION"

              return

            fi


            if grep -qiE \
              'Your application has reached a rate/request limit|rate.?limit|Too Many Requests|HTTP Error 429|HTTP 429' \
              "$logfile"; then

              echo "RATE_LIMIT"

              return

            fi


            if grep -qiE \
              'No results found for song:|no usable provider result|no provider result|no results found|returned no usable results|could not find|unable to find|no matches|no match' \
              "$logfile"; then

              echo "NO_RESULT"

              return

            fi


            if grep -qiE \
              'You are blocked by YouTube|You are blocked by YouTube Music|not a bot|confirm you.re not a bot|captcha|bot detection' \
              "$logfile"; then

              echo "BLOCKED"

              return

            fi


            if grep -qiE \
              'HTTP Error 403|HTTP 403|Forbidden' \
              "$logfile"; then

              echo "FORBIDDEN"

              return

            fi


            if grep -qiE \
              'timed out|timeout|Connection reset|Connection aborted|Temporary failure|Could not resolve|network error|Network is unreachable' \
              "$logfile"; then

              echo "NETWORK"

              return

            fi


            if grep -qiE \
              'Requested format is not available|No video formats found|No formats found' \
              "$logfile"; then

              echo "FORMAT"

              return

            fi


            echo "UNKNOWN"

          }


          # ==========================================================
          # FAILURE LOG
          # ==========================================================

          show_last_log() {

            local logfile="$1"
            local id="$2"
            local title="$3"


            if [ ! -f "$logfile" ]; then
              return 0
            fi


            echo
            echo "┌─ ${title} | #$(printf '%04d' "$id") ────────────────"

            tail -n 50 "$logfile" || true

            echo "└──────────────────────────────────────────────────────────────"
            echo

          }


          # ==========================================================
          # EXACT PROVIDER DETECTION
          #
          # Probe argparse itself instead of blindly assuming a
          # provider exists.
          # ==========================================================

          detect_supported_providers() {

            local probe
            local help_text
            local choices


            probe="$(
              spotdl download \
                --audio __invalid_provider__ \
                https://example.invalid \
                2>&1 \
              || true
            )"


            choices="$(
              printf '%s\n' "$probe" |
              grep -F 'choose from' |
              tail -n 1 \
              || true
            )"


            help_text="$(
              spotdl --help \
                2>&1 \
              || true
            )"


            SUPPORTED_PROVIDERS=()


            local candidates=(
              youtube-music
              youtube
              soundcloud
              bandcamp
              piped
            )


            local provider


            for provider in "${candidates[@]}"; do

              if [ -n "$choices" ]; then

                if [[ "$choices" == *"'${provider}'"* ]]; then

                  SUPPORTED_PROVIDERS+=("$provider")

                fi

              else

                if grep -Fq "$provider" <<< "$help_text"; then

                  SUPPORTED_PROVIDERS+=("$provider")

                fi

              fi

            done


            if [ "${#SUPPORTED_PROVIDERS[@]}" -eq 0 ]; then

              echo "❌ No usable spotDL providers detected."

              echo
              echo "$probe"

              return 1

            fi


            echo
            echo "🎵 Supported spotDL providers:"


            for provider in "${SUPPORTED_PROVIDERS[@]}"; do

              echo "   ✓ $provider"

            done

          }


          detect_supported_providers


          # ==========================================================
          # PROVIDER PREFERENCE
          #
          # IMPORTANT:
          # These are intentionally SEPARATE invocations.
          #
          # 1. YouTube Music
          # 2. YouTube
          # 3. SoundCloud
          # 4. Bandcamp
          # 5. Piped
          #
          # We do NOT pass the whole list to one spotDL command.
          # ==========================================================

          provider_supported() {

            local wanted="$1"


            local provider


            for provider in "${SUPPORTED_PROVIDERS[@]}"; do

              if [ "$provider" = "$wanted" ]; then

                return 0

              fi

            done


            return 1

          }


          # ==========================================================
          # PROVIDER-SPECIFIC COOKIE
          # ==========================================================

          provider_cookie() {

            local provider="$1"


            case "$provider" in

              youtube-music)

                if [ -n "$COOKIE_YTM" ]; then
                  printf '%s' "$COOKIE_YTM"
                elif [ -n "$COOKIE_YT" ]; then
                  printf '%s' "$COOKIE_YT"
                fi

                ;;


              youtube)

                if [ -n "$COOKIE_YT" ]; then
                  printf '%s' "$COOKIE_YT"
                elif [ -n "$COOKIE_YTM" ]; then
                  printf '%s' "$COOKIE_YTM"
                fi

                ;;


              *)

                ;;

            esac

          }


          # ==========================================================
          # SPOTDL: ONE PROVIDER ONLY
          # ==========================================================

          run_spotdl_provider() {

            local id="$1"
            local url="$2"
            local provider="$3"
            local attempt="$4"


            local dir="work/downloads/${id}"

            local log_file="work/logs/${id}-${provider}-attempt-${attempt}.log"


            mkdir -p \
              "$dir/cache"


            local -a cmd


            cmd=(

              spotdl

              download

              "$url"

              --audio
              "$provider"

              --format
              "$FORMAT"

              --bitrate
              "$BITRATE"

              --output
              "${dir}/{track-number} - {artists} - {title}.{output-ext}"

              --threads
              "$SPOTDL_THREADS"

              --max-retries
              3

              --overwrite
              skip

              --restrict
              none

              --max-filename-length
              180

              --print-errors

              --cache-path
              "${dir}/cache"

              --archive
              "${dir}/archive.txt"

              --log-level
              INFO
            )


            if [ "$RAW_LOGS" = "true" ]; then

              cmd+=(--log-level DEBUG)

            fi


            # ---------------------------------------------------------
            # Spotify credentials
            # ---------------------------------------------------------

            if [ "$USE_CUSTOM_CREDENTIALS_INPUT" = "true" ] &&
               [ -n "$SPOTIFY_CLIENT_ID_INPUT" ] &&
               [ -n "$SPOTIFY_CLIENT_SECRET_INPUT" ]; then

              export SPOTIPY_CLIENT_ID="$SPOTIFY_CLIENT_ID_INPUT"
              export SPOTIPY_CLIENT_SECRET="$SPOTIFY_CLIENT_SECRET_INPUT"


              log \
                "AUTH" \
                "$id" \
                "Custom Spotify credentials enabled."

            else

              unset SPOTIPY_CLIENT_ID || true
              unset SPOTIPY_CLIENT_SECRET || true


              log \
                "AUTH" \
                "$id" \
                "Using spotDL default Spotify client."

            fi


            # ---------------------------------------------------------
            # Provider cookie
            # ---------------------------------------------------------

            local cookie


            cookie="$(
              provider_cookie "$provider"
            )"


            if [ -n "$cookie" ]; then

              cmd+=(
                --cookie-file
                "$cookie"
              )


              log \
                "AUTH" \
                "$id" \
                "${provider} cookies enabled."

            fi


            # ---------------------------------------------------------
            # yt-dlp integration
            # ---------------------------------------------------------

            local ytdlp_args


            ytdlp_args="
            --retries ${YTDLP_RETRIES}
            --fragment-retries ${YTDLP_FRAGMENT_RETRIES}
            --extractor-retries ${YTDLP_EXTRACTOR_RETRIES}
            --file-access-retries ${YTDLP_FILE_ACCESS_RETRIES}
            --socket-timeout ${YTDLP_SOCKET_TIMEOUT}
            --concurrent-fragments ${YTDLP_CONCURRENT_FRAGMENTS}
            --throttled-rate 100K
            --sleep-requests 1
            --extractor-args youtube:player-client=mweb
            --extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}
            "


            if [ "$RAW_LOGS" = "true" ]; then

              ytdlp_args="${ytdlp_args} --verbose"

            fi


            cmd+=(
              --yt-dlp-args
              "$ytdlp_args"
            )


            log \
              "PROVIDER" \
              "$id" \
              "${provider} | attempt ${attempt}/${MAX_RETRIES}"


            local exit_code=0


            # ---------------------------------------------------------
            # Execute
            # ---------------------------------------------------------

            if [ "$RAW_LOGS" = "true" ]; then

              set +e


              stdbuf \
                -oL \
                -eL \
                timeout 900 \
                "${cmd[@]}" \
                2>&1 |
              tee "$log_file" |
              while IFS= read -r line; do

                printf \
                  '[%s] RAW       #%04d │ %s\n' \
                  "$(now)" \
                  "$id" \
                  "$line"

              done


              exit_code="${PIPESTATUS[0]}"


              set -e

            else

              timeout 900 \
                "${cmd[@]}" \
                > "$log_file" \
                2>&1 \
                || exit_code=$?

            fi


            if [ "$exit_code" -eq 0 ] &&
               has_audio "$dir"; then

              log \
                "VERIFY" \
                "$id" \
                "${provider} produced usable audio."


              return 0

            fi


            return 1

          }


          # ==========================================================
          # DIRECT YT-DLP
          # ==========================================================

          run_direct_ytdlp() {

            local id="$1"
            local type="$2"
            local url="$3"


            local dir="work/downloads/${id}"

            local logfile="work/logs/${id}-direct.log"


            mkdir -p "$dir"


            local -a cmd=(

              yt-dlp

              --ignore-config

              --newline

              --continue

              --no-overwrites

              --retries
              "$YTDLP_RETRIES"

              --fragment-retries
              "$YTDLP_FRAGMENT_RETRIES"

              --extractor-retries
              "$YTDLP_EXTRACTOR_RETRIES"

              --file-access-retries
              "$YTDLP_FILE_ACCESS_RETRIES"

              --socket-timeout
              "$YTDLP_SOCKET_TIMEOUT"

              --concurrent-fragments
              "$YTDLP_CONCURRENT_FRAGMENTS"

              --throttled-rate
              100K

              --sleep-requests
              1

              --extractor-args
              "youtube:player-client=mweb"

              --extractor-args
              "youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}"

              --format
              "bestaudio/best"

              --output
              "${dir}/%(title)s [%(id)s].%(ext)s"
            )


            if [ "$RAW_LOGS" = "true" ]; then
              cmd+=(--verbose)
            fi


            if [[ "$type" == "youtube" ]] &&
               [ -n "$COOKIE_YT" ]; then

              cmd+=(
                --cookies
                "$COOKIE_YT"
              )

            elif [[ "$type" == "youtube" ]] &&
                 [ -n "$COOKIE_YTM" ]; then

              cmd+=(
                --cookies
                "$COOKIE_YTM"
              )

            fi


            if [[ "$url" != *playlist* ]]; then
              cmd+=(--no-playlist)
            fi


            log \
              "DOWNLOAD" \
              "$id" \
              "Direct yt-dlp strategy."


            local exit_code=0


            if [ "$RAW_LOGS" = "true" ]; then

              set +e


              stdbuf \
                -oL \
                -eL \
                timeout 900 \
                "${cmd[@]}" \
                2>&1 |
              tee "$logfile" |
              while IFS= read -r line; do

                printf \
                  '[%s] RAW       #%04d │ %s\n' \
                  "$(now)" \
                  "$id" \
                  "$line"

              done


              exit_code="${PIPESTATUS[0]}"


              set -e

            else

              timeout 900 \
                "${cmd[@]}" \
                > "$logfile" \
                2>&1 \
                || exit_code=$?

            fi


            if [ "$exit_code" -eq 0 ] &&
               has_audio "$dir"; then

              log \
                "VERIFY" \
                "$id" \
                "Direct yt-dlp produced audio."


              return 0

            fi


            return 1

          }


          # ==========================================================
          # DOWNLOAD ONE INPUT
          # ==========================================================

          process_one() {

            local id="$1"
            local type="$2"
            local url="$3"


            local dir="work/downloads/${id}"


            mkdir -p "$dir"


            local started_at


            started_at="$(
              date -u '+%Y-%m-%dT%H:%M:%SZ'
            )"


            local final_status="failed"
            local winning_provider="none"
            local reason="all download strategies failed"


            echo
            echo "╭──────────────────────────────────────────────────────────────╮"
            printf '│ 🎵 INPUT #%04d                                               │\n' "$id"
            echo "├──────────────────────────────────────────────────────────────┤"
            printf '│ Type: %-55s │\n' "$type"
            printf '│ URL : %-55s │\n' "$url"
            echo "╰──────────────────────────────────────────────────────────────╯"


            log \
              "START" \
              "$id" \
              "Processing ${type} input."


            # ========================================================
            # DIRECT SOURCES
            # ========================================================

            if [[ "$type" == "youtube" ]] ||
               [[ "$type" == "soundcloud" ]]; then

              log \
                "SEARCH" \
                "$id" \
                "Direct source detected; trying yt-dlp first."


              if run_direct_ytdlp \
                "$id" \
                "$type" \
                "$url"; then

                final_status="success"
                winning_provider="yt-dlp"
                reason="direct yt-dlp succeeded"

              else

                log \
                  "FALLBACK" \
                  "$id" \
                  "Direct yt-dlp failed; moving to spotDL."

              fi

            fi


            # ========================================================
            # SPOTDL PROVIDER ORDER
            #
            # THIS IS THE IMPORTANT CHANGE.
            #
            # Each provider is a separate spotDL execution.
            # ========================================================

            if [ "$final_status" != "success" ]; then

              log \
                "SEARCH" \
                "$id" \
                "Starting explicit spotDL provider fallback."


              provider_order=(
                youtube-music
                youtube
                soundcloud
                bandcamp
                piped
              )


              for provider in "${provider_order[@]}"; do

                if ! provider_supported "$provider"; then

                  continue

                fi


                log \
                  "PROVIDER" \
                  "$id" \
                  "▶ Trying provider: ${provider}"


                provider_succeeded="false"


                for attempt in $(seq 1 "$MAX_RETRIES"); do

                  current_log="work/logs/${id}-${provider}-attempt-${attempt}.log"


                  if run_spotdl_provider \
                    "$id" \
                    "$url" \
                    "$provider" \
                    "$attempt"; then

                    provider_succeeded="true"

                    final_status="success"
                    winning_provider="$provider"
                    reason="spotDL ${provider} succeeded"

                    break

                  fi


                  failure_type="$(
                    classify_error "$current_log" \
                    2>/dev/null ||
                    echo "UNKNOWN"
                  )"


                  case "$failure_type" in


                    CONFIGURATION)

                      log \
                        "ERROR" \
                        "$id" \
                        "${provider}: configuration error."


                      provider_succeeded="false"

                      break

                      ;;


                    NO_RESULT)

                      log \
                        "WARN" \
                        "$id" \
                        "${provider}: no usable search result."

                      ;;


                    RATE_LIMIT)

                      log \
                        "WARN" \
                        "$id" \
                        "${provider}: rate limited."

                      ;;


                    BLOCKED)

                      log \
                        "WARN" \
                        "$id" \
                        "${provider}: blocked."

                      ;;


                    FORBIDDEN)

                      log \
                        "WARN" \
                        "$id" \
                        "${provider}: HTTP 403."

                      ;;


                    NETWORK)

                      log \
                        "WARN" \
                        "$id" \
                        "${provider}: network failure."

                      ;;


                    FORMAT)

                      log \
                        "WARN" \
                        "$id" \
                        "${provider}: format failure."

                      ;;


                    *)

                      log \
                        "WARN" \
                        "$id" \
                        "${provider}: ${failure_type}."

                      ;;

                  esac


                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then

                    case "$failure_type" in

                      RATE_LIMIT)
                        delay=$((attempt * 10))
                        ;;

                      NO_RESULT)
                        delay=$((attempt * 5))
                        ;;

                      BLOCKED|FORBIDDEN)
                        delay=$((attempt * 6))
                        ;;

                      *)
                        delay=$((attempt * 4))
                        ;;

                    esac


                    [ "$delay" -gt 30 ] &&
                      delay=30


                    log \
                      "RETRY" \
                      "$id" \
                      "${provider}: retry ${attempt}/${MAX_RETRIES}; waiting ${delay}s."


                    sleep "$delay"

                  fi

                done


                if [ "$provider_succeeded" = "true" ]; then

                  break

                fi


                # ----------------------------------------------------
                # EXPLICIT FALLBACK TO NEXT PROVIDER
                # ----------------------------------------------------

                log \
                  "FALLBACK" \
                  "$id" \
                  "❌ ${provider} failed → trying next provider."


              done

            fi


            # ========================================================
            # FINAL
            # ========================================================

            finished_at="$(
              date -u '+%Y-%m-%dT%H:%M:%SZ'
            )"


            if [ "$final_status" = "success" ]; then

              log \
                "SUCCESS" \
                "$id" \
                "Downloaded successfully via ${winning_provider}."


              log \
                "DONE" \
                "$id" \
                "◆ SUCCESS"

            else

              log \
                "FAILED" \
                "$id" \
                "No download strategy succeeded."


              printf \
                '%s\t%s\t%s\n' \
                "$id" \
                "$type" \
                "$url" \
                > "work/failed/${id}.tsv"


              printf \
                '%s\n' \
                "$url" \
                > "work/failed/${id}.url"


              printf \
                '%s\n' \
                "$reason" \
                > "work/failed/${id}.reason"


              log \
                "DONE" \
                "$id" \
                "◆ FAILED"

            fi


            # ========================================================
            # RESULT JSON
            # ========================================================

            mapfile -t output_files < <(
              find "$dir" \
                -type f \
                \( \
                  -iname '*.mp3' \
                  -o -iname '*.flac' \
                  -o -iname '*.m4a' \
                  -o -iname '*.ogg' \
                  -o -iname '*.opus' \
                  -o -iname '*.wav' \
                \) \
                -printf '%f\n' \
                2>/dev/null |
              sort
            )


            printf '%s\n' "${output_files[@]}" |
              jq -R -s \
                'split("\n") | map(select(length > 0))' \
                > "${dir}/files.json"


            jq -n \
              --arg id "$id" \
              --arg type "$type" \
              --arg url "$url" \
              --arg status "$final_status" \
              --arg provider "$winning_provider" \
              --arg reason "$reason" \
              --arg started "$started_at" \
              --arg finished "$finished_at" \
              --slurpfile files "${dir}/files.json" \
              '{
                index: ($id | tonumber),
                input_type: $type,
                url: $url,
                status: $status,
                provider: $provider,
                reason: $reason,
                started_at: $started,
                finished_at: $finished,
                output_files: $files[0]
              }' \
              > "work/results/${id}.json"


            rm -f "${dir}/files.json"

          }


          # ==========================================================
          # EXPORT FUNCTIONS
          # ==========================================================

          export -f \
            now \
            log \
            has_audio \
            classify_error \
            show_last_log \
            provider_supported \
            provider_cookie \
            run_spotdl_provider \
            run_direct_ytdlp \
            process_one


          export \
            FORMAT \
            QUALITY \
            BITRATE \
            PARALLEL \
            MAX_RETRIES \
            RAW_LOGS \
            SPOTDL_THREADS \
            SPOTIFY_CLIENT_ID_INPUT \
            SPOTIFY_CLIENT_SECRET_INPUT \
            YOUTUBE_COOKIES_INPUT \
            YOUTUBE_MUSIC_COOKIES_INPUT \
            COOKIE_YT \
            COOKIE_YTM \
            USE_CUSTOM_CREDENTIALS_INPUT \
            POT_SERVER_PORT \
            POT_AVAILABLE \
            VPN_AVAILABLE \
            YTDLP_RETRIES \
            YTDLP_FRAGMENT_RETRIES \
            YTDLP_EXTRACTOR_RETRIES \
            YTDLP_FILE_ACCESS_RETRIES \
            YTDLP_SOCKET_TIMEOUT \
            YTDLP_CONCURRENT_FRAGMENTS


          declare -p SUPPORTED_PROVIDERS > work/supported-providers.sh


          # ==========================================================
          # CONCURRENT WORKERS
          # ==========================================================

          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                   🚀 DOWNLOAD QUEUE                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo
          echo "Concurrency: $PARALLEL"
          echo "Retries/provider: $MAX_RETRIES"
          echo


          active=0


          while IFS=$'\t' read -r id type url; do

            (
              process_one \
                "$id" \
                "$type" \
                "$url"
            ) &


            active=$((active + 1))


            if [ "$active" -ge "$PARALLEL" ]; then

              wait -n || true

              active=$((active - 1))

            fi

          done < work/jobs.tsv


          wait || true


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    📊 DOWNLOAD SUMMARY                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo


          total="$(
            jq -s \
              'length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          success="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          failed="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          echo "Requested : $total"
          echo "Successful: $success"
          echo "Failed    : $failed"


      # =============================================================
      # 13. CONVERT AUDIO
      # =============================================================

      - name: "🔄 Convert and validate audio"
        env:
          TARGET_FORMAT: ${{ inputs.output_format }}
          TARGET_QUALITY: ${{ inputs.audio_quality }}
        run: |
          set -Eeuo pipefail


          FORMAT="$TARGET_FORMAT"
          QUALITY="$TARGET_QUALITY"


          case "$QUALITY" in

            320k|256k|192k|128k)
              BITRATE="$QUALITY"
              ;;

            HIGH)
              BITRATE="320k"
              ;;

            LOW)
              BITRATE="128k"
              ;;

            LOSSLESS|HI_RES_LOSSLESS)
              BITRATE="320k"
              ;;

            *)
              BITRATE="320k"
              ;;

          esac


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  🔄 AUDIO PROCESSING                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo


          converted=0
          validated=0
          conversion_failed=0


          mapfile -d '' files < <(
            find work/downloads \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
                -o -iname '*.webm' \
                -o -iname '*.aac' \
              \) \
              -print0
          )


          for source in "${files[@]}"; do

            extension="${source##*.}"
            extension="${extension,,}"


            if [ "$extension" = "${FORMAT,,}" ]; then

              output="$source"

            else

              output="${source%.*}.${FORMAT}"


              case "$FORMAT" in


                mp3)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a libmp3lame \
                    -b:a "$BITRATE" \
                    -id3v2_version 3 \
                    -y \
                    "$output"

                  ;;


                flac)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a flac \
                    -y \
                    "$output"

                  ;;


                m4a)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a aac \
                    -b:a "$BITRATE" \
                    -movflags +faststart \
                    -y \
                    "$output"

                  ;;


                ogg)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a libvorbis \
                    -b:a "$BITRATE" \
                    -y \
                    "$output"

                  ;;


                opus)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a libopus \
                    -b:a "$BITRATE" \
                    -y \
                    "$output"

                  ;;


                wav)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a pcm_s16le \
                    -y \
                    "$output"

                  ;;

              esac


              if [ ! -s "$output" ]; then

                echo "❌ Conversion failed:"
                echo "   $source"

                conversion_failed=$((conversion_failed + 1))

                rm -f "$output"

                continue

              fi


              converted=$((converted + 1))

              rm -f "$source"

            fi


            if [ ! -s "$output" ]; then

              conversion_failed=$((conversion_failed + 1))

              continue

            fi


            if ffprobe \
              -v error \
              -show_entries \
                format=duration,size \
              -show_entries \
                stream=codec_name,sample_rate,channels \
              -of json \
              "$output" \
              > /tmp/audio-validation.json; then

              validated=$((validated + 1))


              codec="$(
                jq -r \
                  '.streams[0].codec_name // "unknown"' \
                  /tmp/audio-validation.json
              )"


              duration="$(
                jq -r \
                  '.format.duration // "unknown"' \
                  /tmp/audio-validation.json
              )"


              printf \
                '✓ %s | %s | %ss\n' \
                "$(basename "$output")" \
                "$codec" \
                "$duration"

            else

              echo \
                "❌ ffprobe rejected $(basename "$output")"

              conversion_failed=$((conversion_failed + 1))

            fi

          done


          echo
          echo "Converted : $converted"
          echo "Validated : $validated"
          echo "Failed    : $conversion_failed"


      # =============================================================
      # 14. CONSOLIDATE FINAL FILES + FAILED LINKS
      # =============================================================

      - name: "📚 Build final output and failed-download list"
        id: collect
        run: |
          set -Eeuo pipefail


          rm -rf music

          mkdir -p music


          count=0


          while IFS= read -r -d '' file; do

            count=$((count + 1))


            filename="$(basename "$file")"


            printf -v final_name \
              '%04d-%s' \
              "$count" \
              "$filename"


            cp \
              --reflink=auto \
              -p \
              "$file" \
              "music/$final_name"


          done < <(
            find work/downloads \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) \
              -print0 |
            sort -z
          )


          # ==========================================================
          # FAILED URL REPORT
          #
          # This is intentionally included in the ZIP later.
          # ==========================================================

          failed_file="music/FAILED_DOWNLOADS.txt"


          : > "$failed_file"


          {
            echo "FAILED DOWNLOADS"
            echo "================"
            echo
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
          } >> "$failed_file"


          failed_count=0


          while IFS=$'\t' read -r id type url; do

            failed_count=$((failed_count + 1))


            reason="Unknown failure"


            if [ -f "work/failed/${id}.reason" ]; then

              reason="$(
                cat "work/failed/${id}.reason"
              )"

            fi


            {
              echo
              echo "------------------------------------------------------------"
              echo "Input #${id}"
              echo "Type   : ${type}"
              echo "URL    : ${url}"
              echo "Reason : ${reason}"
              echo "------------------------------------------------------------"

            } >> "$failed_file"


          done < <(
            for result in work/results/*.json; do

              [ -f "$result" ] || continue

              jq -r '
                select(.status != "success") |
                [
                  (.index | tostring),
                  .input_type,
                  .url
                ] |
                @tsv
              ' "$result"

            done |
            sort -n
          )


          if [ "$failed_count" -eq 0 ]; then

            {
              echo
              echo "No failed downloads."
              echo

            } >> "$failed_file"

          fi


          echo "FINAL_AUDIO_COUNT=$count" \
            >> "$GITHUB_OUTPUT"


          echo "FAILED_COUNT=$failed_count" \
            >> "$GITHUB_OUTPUT"


          echo
          echo "🎵 Final audio files: $count"
          echo "❌ Failed URLs      : $failed_count"
          echo


          if [ "$count" -gt 0 ]; then

            ls -lh music/

          fi


      # =============================================================
      # 15. MANIFEST
      # =============================================================

      - name: "📝 Generate manifest"
        env:
          FORMAT_INPUT: ${{ inputs.output_format }}
          QUALITY_INPUT: ${{ inputs.audio_quality }}
          UPLOAD_INPUT: ${{ inputs.upload_method }}
          BUNDLE_INPUT: ${{ inputs.bundle_all }}
          VPN_INPUT: ${{ inputs.vpn_enabled }}
          RAW_INPUT: ${{ inputs.raw_logs }}
          PARALLEL_INPUT: ${{ inputs.concurrent_downloads }}
          RETRIES_INPUT: ${{ inputs.retry_count }}
          POT_AVAILABLE_INPUT: ${{ steps.pot.outputs.pot_available }}
        run: |
          set -Eeuo pipefail


          total="$(
            jq -s \
              'length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          success="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          failed="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )


          audio_count="$(
            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) |
            wc -l
          )


          audio_bytes="$(
            find music \
              -maxdepth 1 \
              -type f \
              -printf '%s\n' |
            awk '{sum += $1} END {print sum + 0}'
          )"


          spotdl_version="$(
            spotdl --version 2>/dev/null ||
            echo unknown
          )"


          ytdlp_version="$(
            yt-dlp --version 2>/dev/null ||
            echo unknown
          )"


          deno_version="$(
            deno --version 2>/dev/null |
            head -n1 ||
            echo unknown
          )"


          bgutil_version="$(
            python -m pip show bgutil-ytdlp-pot-provider 2>/dev/null |
            awk '/^Version:/ {print $2}' |
            head -n1 ||
            echo unknown
          )"


          jq -n \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg sha "$GITHUB_SHA" \
            --arg created "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg format "$FORMAT_INPUT" \
            --arg quality "$QUALITY_INPUT" \
            --arg upload "$UPLOAD_INPUT" \
            --arg spotdl "$spotdl_version" \
            --arg ytdlp "$ytdlp_version" \
            --arg deno "$deno_version" \
            --arg bgutil "$bgutil_version" \
            --arg pot "$POT_AVAILABLE_INPUT" \
            --argjson bundle "$BUNDLE_INPUT" \
            --argjson vpn "$VPN_INPUT" \
            --argjson raw "$RAW_INPUT" \
            --argjson parallel "$PARALLEL_INPUT" \
            --argjson retries "$RETRIES_INPUT" \
            --argjson total "$total" \
            --argjson success "$success" \
            --argjson failed "$failed" \
            --argjson audio "$audio_count" \
            --argjson bytes "$audio_bytes" \
            '{
              workflow: $workflow,
              repository: $repository,
              run_id: $run_id,
              commit: $sha,
              created_at: $created,

              configuration: {
                output_format: $format,
                quality: $quality,
                upload_method: $upload,
                bundle_all: $bundle,
                vpn_enabled: $vpn,
                raw_logs_enabled: $raw,
                concurrency: $parallel,
                retries_per_provider: $retries
              },

              providers: {
                youtube_music: true,
                youtube: true,
                explicit_provider_fallback: true,
                bgutil_available: ($pot == "true")
              },

              versions: {
                spotdl: $spotdl,
                yt_dlp: $ytdlp,
                deno: $deno,
                bgutil_plugin: $bgutil
              },

              results: {
                urls_requested: $total,
                urls_successful: $success,
                urls_failed: $failed,
                final_audio_files: $audio,
                final_audio_bytes: $bytes
              }
            }' \
            > work/manifest.json


          cp \
            work/manifest.json \
            music/manifest.json


      # =============================================================
      # 16. GITHUB SUMMARY
      # =============================================================

      - name: "📊 Write GitHub summary"
        env:
          FORMAT_INPUT: ${{ inputs.output_format }}
          QUALITY_INPUT: ${{ inputs.audio_quality }}
          UPLOAD_INPUT: ${{ inputs.upload_method }}
          BUNDLE_INPUT: ${{ inputs.bundle_all }}
          VPN_INPUT: ${{ inputs.vpn_enabled }}
          RAW_INPUT: ${{ inputs.raw_logs }}
        run: |
          set -Eeuo pipefail


          total="$(
            jq -s \
              'length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          success="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          failed="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          audio_count="$(
            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) |
            wc -l
          )"


          {
            echo "# 🎵 Music Downloader"
            echo

            echo "## Configuration"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Format | \`$FORMAT_INPUT\` |"
            echo "| Quality | \`$QUALITY_INPUT\` |"
            echo "| Upload | \`$UPLOAD_INPUT\` |"
            echo "| Bundle | \`$BUNDLE_INPUT\` |"
            echo "| VPN | \`$VPN_INPUT\` |"
            echo "| Raw logs | \`$RAW_INPUT\` |"
            echo "| Provider order | YouTube Music → YouTube → SoundCloud → Bandcamp → Piped |"
            echo

            echo "## Result"
            echo
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| Requested URLs | $total |"
            echo "| Successful | $success |"
            echo "| Failed | $failed |"
            echo "| Final audio files | $audio_count |"
            echo


            if [ "$failed" -gt 0 ]; then

              echo "## ❌ Failed downloads"
              echo
              echo '```text'

              cat music/FAILED_DOWNLOADS.txt

              echo '```'

            else

              echo "## ✅ All requested URLs succeeded."

            fi

          } >> "$GITHUB_STEP_SUMMARY"


      # =============================================================
      # 17. PACKAGE
      # =============================================================

      - name: "📦 Package output"
        id: archive
        env:
          BUNDLE_ALL_INPUT: ${{ inputs.bundle_all }}
          UPLOAD_METHOD_INPUT: ${{ inputs.upload_method }}
        run: |
          set -Eeuo pipefail


          rm -rf \
            work/archive \
            work/package


          mkdir -p \
            work/archive \
            work/package


          # ----------------------------------------------------------
          # Copy final audio + reports into package staging area.
          # ----------------------------------------------------------

          find music \
            -maxdepth 1 \
            -type f \
            -print0 |
          while IFS= read -r -d '' file; do

            cp \
              --reflink=auto \
              -p \
              "$file" \
              work/package/

          done


          package_files=()


          while IFS= read -r -d '' file; do

            package_files+=("$file")

          done < <(
            find work/package \
              -maxdepth 1 \
              -type f \
              -print0 |
            sort -z
          )


          if [ "${#package_files[@]}" -eq 0 ]; then

            echo "⚠️ Nothing to package."

            echo "HAS_ASSETS=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          # ----------------------------------------------------------
          # Safe random suffix.
          #
          # IMPORTANT:
          # Do NOT use `tr | head` with pipefail.
          # ----------------------------------------------------------

          random_suffix() {

            python -c '
import secrets
import string

alphabet = string.ascii_lowercase + string.digits
print("".join(secrets.choice(alphabet) for _ in range(6)), end="")
'

          }


          # ==========================================================
          # BUNDLE ALL
          # ==========================================================

          if [ "$BUNDLE_ALL_INPUT" = "true" ]; then

            suffix="$(
              random_suffix
            )"


            zip_name="music-${suffix}.zip"


            case "$UPLOAD_METHOD_INPUT" in


              repo)

                (
                  cd work/package

                  zip \
                    -0 \
                    -s 90m \
                    -r \
                    "../archive/${zip_name}" \
                    .
                )

                ;;


              release)

                (
                  cd work/package

                  zip \
                    -0 \
                    -r \
                    "../archive/${zip_name}" \
                    .
                )


                size="$(
                  stat \
                    -c%s \
                    "work/archive/${zip_name}"
                )"


                if [ "$size" -gt 1900000000 ]; then

                  echo "⚠️ ZIP exceeds safe release asset size."
                  echo "🔪 Rebuilding as split ZIP."


                  rm -f \
                    work/archive/"${zip_name}"*


                  (
                    cd work/package

                    zip \
                      -0 \
                      -s 1900m \
                      -r \
                      "../archive/${zip_name}" \
                      .
                  )

                fi

                ;;


              drive)

                (
                  cd work/package

                  zip \
                    -0 \
                    -r \
                    "../archive/${zip_name}" \
                    .
                )

                ;;


            esac


          # ==========================================================
          # INDIVIDUAL FILES
          # ==========================================================

          else

            index=0


            while IFS= read -r -d '' file; do

              index=$((index + 1))


              base="$(
                basename "$file"
              )"


              safe="$(
                printf '%s' "$base" |
                tr ' ' '_' |
                tr -cd '[:alnum:]_.-'
              )"


              suffix="$(
                random_suffix
              )"


              zip_name="single-${index}-${safe}-${suffix}.zip"


              (
                cd "$(dirname "$file")"

                zip \
                  -0 \
                  "../../work/archive/${zip_name}" \
                  "$(basename "$file")"
              )


            done < <(
              find work/package \
                -maxdepth 1 \
                -type f \
                \( \
                  -iname '*.mp3' \
                  -o -iname '*.flac' \
                  -o -iname '*.m4a' \
                  -o -iname '*.ogg' \
                  -o -iname '*.opus' \
                  -o -iname '*.wav' \
                \) \
                -print0 |
              sort -z
            )

          fi


          # ==========================================================
          # CHECKSUMS
          # ==========================================================

          : > work/archive/SHA256SUMS.txt


          while IFS= read -r -d '' file; do

            (
              cd "$(dirname "$file")"

              sha256sum "$(basename "$file")"

            ) >> work/archive/SHA256SUMS.txt

          done < <(
            find work/archive \
              -maxdepth 1 \
              -type f \
              -name '*.zip' \
              -o \
              -name '*.z[0-9][0-9]' \
              -print0
          )


          # ----------------------------------------------------------
          # Always publish manifest + failed URL list.
          # ----------------------------------------------------------

          cp \
            work/manifest.json \
            work/archive/manifest.json


          cp \
            music/FAILED_DOWNLOADS.txt \
            work/archive/FAILED_DOWNLOADS.txt


          # ----------------------------------------------------------
          # Copy final published assets to music/.
          # ----------------------------------------------------------

          rm -f \
            music/*.zip \
            music/*.z[0-9][0-9] \
            music/manifest.json \
            music/FAILED_DOWNLOADS.txt \
            music/SHA256SUMS.txt \
            2>/dev/null \
            || true


          find work/archive \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.zip' \
              -o -name '*.z[0-9][0-9]' \
              -o -name 'manifest.json' \
              -o -name 'FAILED_DOWNLOADS.txt' \
              -o -name 'SHA256SUMS.txt' \
            \) \
            -exec cp -p {} music/ \;


          echo "HAS_ASSETS=true" >> "$GITHUB_OUTPUT"


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                       📦 PACKAGE                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo

          ls -lh music/


      # =============================================================
      # 18. UPLOAD DIAGNOSTIC ARTIFACT
      # =============================================================

      - name: "📊 Upload diagnostic artifact"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downloader-diagnostics-${{ github.run_number }}
          path: |
            work/logs/
            work/results/
            work/failed/
            work/jobs.tsv
            work/input_urls.txt
            work/manifest.json
            music/manifest.json
            music/FAILED_DOWNLOADS.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6


      # =============================================================
      # 19. DISCONNECT VPN
      # =============================================================

      - name: "🔌 Disconnect VPN"
        if: steps.vpn.outputs.vpn_available == 'true'
        run: |
          set +e

          sudo wg-quick down wg0 \
            >/dev/null 2>&1 \
            || true

          echo "✅ VPN disconnected."


      # =============================================================
      # 20. GOOGLE DRIVE UPLOAD
      # =============================================================

      - name: "☁️ Upload to Google Drive"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'drive'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

          DRIVE_FOLDER_NAME: "github-actions"
        run: |
          set -Eeuo pipefail


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    ☁️ GOOGLE DRIVE                         ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo


          if [ -z "$GOOGLE_CLIENT_ID" ] ||
             [ -z "$GOOGLE_CLIENT_SECRET" ] ||
             [ -z "$GOOGLE_REFRESH_TOKEN" ]; then

            echo "❌ Google Drive OAuth secrets missing."

            exit 1

          fi


          token_json="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --request POST \
              https://oauth2.googleapis.com/token \
              --data-urlencode \
                "client_id=${GOOGLE_CLIENT_ID}" \
              --data-urlencode \
                "client_secret=${GOOGLE_CLIENT_SECRET}" \
              --data-urlencode \
                "refresh_token=${GOOGLE_REFRESH_TOKEN}" \
              --data-urlencode \
                "grant_type=refresh_token"
          )"


          access_token="$(
            jq -r \
              '.access_token // empty' \
              <<< "$token_json"
          )"


          if [ -z "$access_token" ]; then

            echo "❌ Failed to obtain Drive access token."

            exit 1

          fi


          query="mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false"


          folder_response="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --get \
              https://www.googleapis.com/drive/v3/files \
              -H "Authorization: Bearer ${access_token}" \
              --data-urlencode "q=${query}" \
              --data-urlencode "fields=files(id,name)"
          )"


          folder_id="$(
            jq -r \
              '.files[0].id // empty' \
              <<< "$folder_response"
          )"


          if [ -z "$folder_id" ]; then

            body="$(
              jq -n \
                --arg name "$DRIVE_FOLDER_NAME" \
                '{
                  name: $name,
                  mimeType: "application/vnd.google-apps.folder"
                }'
            )"


            folder_id="$(
              curl \
                --silent \
                --show-error \
                --fail \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                --request POST \
                https://www.googleapis.com/drive/v3/files \
                -H "Authorization: Bearer ${access_token}" \
                -H "Content-Type: application/json" \
                --data "$body" |
              jq -r \
                '.id // empty'
            )"

          fi


          if [ -z "$folder_id" ]; then

            echo "❌ Failed to determine Drive folder."

            exit 1

          fi


          upload_file() {

            local file="$1"

            local name
            name="$(
              basename "$file"
            )"


            local size
            size="$(
              stat -c%s "$file"
            )"


            echo
            echo "⬆️ $name"
            echo "   Size: $size bytes"


            local headers
            headers="$(
              mktemp
            )"


            local metadata
            metadata="$(
              jq -n \
                --arg name "$name" \
                --arg folder "$folder_id" \
                '{
                  name: $name,
                  parents: [$folder]
                }'
            )"


            if ! curl \
              --silent \
              --show-error \
              --request POST \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              -D "$headers" \
              -o /dev/null \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: application/octet-stream" \
              -H "X-Upload-Content-Length: ${size}" \
              --data "$metadata" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable"; then

              rm -f "$headers"

              return 1

            fi


            local session_uri


            session_uri="$(
              awk '
                BEGIN { IGNORECASE=1 }
                /^location:/ {
                  sub(/\r$/, "")
                  sub(/^[^:]*:[[:space:]]*/, "")
                  print
                  exit
                }
              ' "$headers"
            )"


            rm -f "$headers"


            if [ -z "$session_uri" ]; then

              echo "❌ Could not initialize Drive upload."

              return 1

            fi


            local offset=0


            while [ "$offset" -lt "$size" ]; do

              local remaining=$((size - offset))
              local chunk_length="$DRIVE_CHUNK_SIZE"


              if [ "$remaining" -lt "$chunk_length" ]; then
                chunk_length="$remaining"
              fi


              local end=$((offset + chunk_length - 1))


              local chunk
              chunk="$(
                mktemp
              )"


              dd \
                if="$file" \
                of="$chunk" \
                iflag=skip_bytes,count_bytes \
                skip="$offset" \
                count="$chunk_length" \
                status=none


              uploaded_chunk="false"


              for attempt in 1 2 3 4 5; do

                response="$(
                  mktemp
                )"


                response_headers="$(
                  mktemp
                )"


                code="$(
                  curl \
                    --silent \
                    --show-error \
                    --request PUT \
                    -D "$response_headers" \
                    -o "$response" \
                    --write-out '%{http_code}' \
                    -H "Authorization: Bearer ${access_token}" \
                    -H "Content-Type: application/octet-stream" \
                    -H "Content-Length: ${chunk_length}" \
                    -H "Content-Range: bytes ${offset}-${end}/${size}" \
                    --data-binary "@${chunk}" \
                    "$session_uri"
                )"


                case "$code" in

                  200|201)

                    offset="$size"
                    uploaded_chunk="true"

                    ;;


                  308)

                    range="$(
                      awk '
                        BEGIN { IGNORECASE=1 }
                        /^Range:/ {
                          sub(/\r$/, "")
                          print
                        }
                      ' "$response_headers"
                    )"


                    if [[ "$range" =~ bytes=0-([0-9]+) ]]; then

                      offset=$((BASH_REMATCH[1] + 1))

                    else

                      offset=$((end + 1))

                    fi


                    uploaded_chunk="true"

                    ;;


                  429|500|502|503|504)

                    delay=$((2 ** attempt))


                    [ "$delay" -gt 30 ] &&
                      delay=30


                    echo \
                      "⚠️ Drive HTTP ${code}; retry in ${delay}s."


                    sleep "$delay"

                    ;;


                  *)

                    echo \
                      "❌ Drive upload failed: HTTP ${code}"

                    cat "$response" \
                      2>/dev/null \
                      || true

                    rm -f \
                      "$response" \
                      "$response_headers" \
                      "$chunk"

                    return 1

                    ;;

                esac


                rm -f \
                  "$response" \
                  "$response_headers"


                if [ "$offset" -ge "$size" ]; then
                  break
                fi


                if [ "$uploaded_chunk" = "true" ]; then
                  break
                fi

              done


              rm -f "$chunk"


              if [ "$offset" -lt "$size" ] &&
                 [ "$uploaded_chunk" != "true" ]; then

                echo "❌ Drive chunk upload failed."

                return 1

              fi


              percent=$((offset * 100 / size))


              printf \
                '   Progress: %3d%%\n' \
                "$percent"

            done


            echo "✅ Uploaded: $name"

          }


          # ----------------------------------------------------------
          # Upload ZIPs + reports.
          # ----------------------------------------------------------

          for file in music/*; do

            [ -f "$file" ] || continue


            case "$(basename "$file")" in

              *.zip|*.z[0-9][0-9]|manifest.json|FAILED_DOWNLOADS.txt)

                upload_file "$file"

                ;;

              *)

                ;;

            esac

          done


          echo
          echo "✅ Google Drive upload complete."


      # =============================================================
      # 21. REPOSITORY UPLOAD
      # =============================================================

      - name: "📤 Upload to repository"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'repo'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add music/


          if git diff --cached --quiet; then

            echo "ℹ️ Nothing new to commit."

            exit 0

          fi


          git commit \
            -m "Add music downloader output [skip ci]"


          for attempt in 1 2 3 4 5; do

            echo "🚀 Push attempt ${attempt}/5"


            if git pull \
              --rebase \
              --autostash \
              origin "$BRANCH_NAME" &&
              git push origin "$BRANCH_NAME"; then

              echo "✅ Repository upload complete."

              exit 0

            fi


            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 3))
            fi

          done


          echo "❌ Repository push failed."

          exit 1


      # =============================================================
      # 22. GITHUB RELEASE
      # =============================================================

      - name: "🏷️ Create GitHub Release"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          FORMAT_INPUT: ${{ inputs.output_format }}
          QUALITY_INPUT: ${{ inputs.audio_quality }}
          VPN_INPUT: ${{ inputs.vpn_enabled }}
        run: |
          set -Eeuo pipefail


          suffix="$(
            python -c '
import secrets
import string

alphabet = string.ascii_lowercase + string.digits
print("".join(secrets.choice(alphabet) for _ in range(6)), end="")
'
          )"


          tag="music-${suffix}"


          total="$(
            jq -s \
              'length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          success="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          failed="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )


          cat > work/release-notes.md <<EOF
          # 🎵 Music Downloader

          ## Result

          - Requested URLs: ${total}
          - Successful: ${success}
          - Failed: ${failed}
          - Format: ${FORMAT_INPUT}
          - Quality: ${QUALITY_INPUT}
          - VPN: ${VPN_INPUT}
          - Provider order: YouTube Music → YouTube → SoundCloud → Bandcamp → Piped
          - PO-token provider: bgutil
          - Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ## Failed downloads

          The release includes \`FAILED_DOWNLOADS.txt\` containing the original URLs that failed.
          EOF


          mapfile -t assets < <(
            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -name '*.zip' \
                -o -name '*.z[0-9][0-9]' \
                -o -name 'manifest.json' \
                -o -name 'FAILED_DOWNLOADS.txt' \
              \) \
              -print |
            sort
          )


          if [ "${#assets[@]}" -eq 0 ]; then

            echo "❌ No release assets."

            exit 1

          fi


          gh release create \
            "$tag" \
            "${assets[@]}" \
            --title "Music Downloader ${suffix}" \
            --notes-file work/release-notes.md \
            --target "$GITHUB_SHA"


          echo "✅ Release created."


      # =============================================================
      # 23. FINAL STATUS
      # =============================================================

      - name: "✅ Final status"
        if: always()
        env:
          FAIL_ON_PARTIAL_INPUT: ${{ inputs.fail_on_partial }}
        run: |
          set -Eeuo pipefail


          total="$(
            jq -s \
              'length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          success="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          failed="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )


          audio_count="$(
            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) |
            wc -l
          )"


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                     🎵 FINAL RESULT                        ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf '║ Requested   : %-43s ║\n' "$total"
          printf '║ Successful  : %-43s ║\n' "$success"
          printf '║ Failed      : %-43s ║\n' "$failed"
          printf '║ Audio files : %-43s ║\n' "$audio_count"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo


          if [ "$success" -eq 0 ]; then

            echo "❌ No URL completed successfully."

            exit 1

          fi


          if [ "$failed" -gt 0 ] &&
             [ "$FAIL_ON_PARTIAL_INPUT" = "true" ]; then

            echo "❌ Partial failure detected."

            exit 1

          fi


          if [ "$failed" -gt 0 ]; then

            echo "⚠️ Partial completion accepted."

          else

            echo "✅ All URLs completed successfully."

          fi


      # =============================================================
      # 24. CLEANUP
      # =============================================================

      - name: "🧹 Cleanup"
        if: always()
        run: |
          set +e


          echo "🧹 Cleanup..."


          docker rm -f bgutil-provider \
            >/dev/null 2>&1 \
            || true


          sudo wg-quick down wg0 \
            >/dev/null 2>&1 \
            || true


          rm -f \
            /tmp/wg0.conf \
            /tmp/youtube-cookies.txt \
            /tmp/youtube-music-cookies.txt \
            /tmp/bgutil-ping.json \
            /tmp/audio-validation.json


          find /tmp \
            -maxdepth 1 \
            -type f \
            -name '*.drivechunk' \
            -delete \
            2>/dev/null \
            || true


          echo "✅ Cleanup complete."
