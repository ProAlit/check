name: downloader-spotify

on:
  workflow_dispatch:
    inputs:
      urls:
        description: >
          🎵 Enter Spotify/Tidal/Apple/SoundCloud/YouTube URLs (comma, space, or newline separated)
        required: true
        type: string
      output_format:
        description: "🎧 Output Format"
        required: true
        type: choice
        options: [mp3, flac, m4a, ogg, opus, wav]
        default: mp3
      audio_quality:
        description: >
          🎚️ Audio Quality / Bitrate
        required: true
        type: choice
        options: [320k, 256k, 192k, 128k, LOSSLESS, HI_RES_LOSSLESS, HIGH, LOW]
        default: 320k
      upload_method:
        description: '☁️ Upload destination'
        required: true
        type: choice
        options: [drive, repo, release]
        default: drive
      bundle_all:
        description: '📦 Bundle all tracks into a single ZIP?'
        type: boolean
        default: true
      vpn_enabled:
        description: '🔒 Route downloads through WireGuard VPN?'
        type: boolean
        default: true
      use_custom_credentials:
        description: '🔑 Use custom Spotify App? (Requires Premium. Turn OFF for Free accounts)'
        type: boolean
        default: false
      concurrent_downloads:
        description: '⚡ Concurrent Albums/Playlists (Keep at 2 for stability)'
        type: number
        default: 2
        required: false
      retry_count:
        description: '🔄 Retry count for failed URLs'
        type: number
        default: 5
        required: false

permissions:
  contents: write

jobs:
  music-download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Install System Dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          PYTHONUNBUFFERED: 1
        run: |
          set -e
          echo "::group::📦 System packages (Forced IPv4)"
          echo "🔄 Updating apt repositories (IPv4 only to prevent Azure hangs)..."
          sudo apt-get -o Acquire::ForceIPv4=true update -qq
          
          echo "⬇️ Installing ffmpeg and required utilities..."
          sudo apt-get -o Acquire::ForceIPv4=true install -y -qq ffmpeg curl jq zip
          echo "::endgroup::"

          echo "::group::🐍 Python virtual environment & tools"
          echo "⚙️ Setting up Python virtual environment..."
          python3 -m venv /opt/venv
          echo "/opt/venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=/opt/venv" >> $GITHUB_ENV
          source /opt/venv/bin/activate
          
          echo "⬆️ Upgrading pip and setuptools..."
          pip install --upgrade pip setuptools
          
          echo "⬇️ Installing spotdl v4.5.2 (Hotfix)..."
          pip install spotdl==4.5.2
          
          echo "🚀 FORCE upgrading yt-dlp to absolute latest (Bypassing spotdl dependency locks)..."
          # 🧠 BULLETPROOF FIX: Pulls directly from the master branch/PyPI to guarantee the newest release (e.g., 2026.08.19)
          pip install --upgrade --force-reinstall "yt-dlp[default]"
          
          echo "⬇️ Installing pyOpenSSL and cryptography..."
          pip install --upgrade pyOpenSSL cryptography
          echo "::endgroup::"

          echo "::group::🦕 Deno runtime"
          echo "📥 Installing Deno..."
          if ! command -v deno &> /dev/null; then
            curl -fSL https://deno.land/install.sh | sh -s -- -y
            echo "$HOME/.deno/bin" >> $GITHUB_PATH
          fi
          echo "✅ Deno ready."
          echo "::endgroup::"

          echo "::group::🏷️ Versions"
          ffmpeg -version 2>&1 | head -n1
          python3 --version
          echo "🎵 spotdl version:"
          spotdl --version 2>/dev/null || echo "spotDL version check failed"
          echo "📺 yt-dlp version:"
          yt-dlp --version
          echo "::endgroup::"

      - name: 🔒 Set up WireGuard VPN (Original Method)
        id: vpn
        shell: bash
        run: |
          VPN_ENABLED="${{ inputs.vpn_enabled }}"
          echo "🔍 VPN_ENABLED=$VPN_ENABLED"

          if [ "$VPN_ENABLED" = "true" ]; then
            if [ -z "${{ secrets.WG_CONFIG }}" ]; then
              echo "⚠️ VPN enabled but WG_CONFIG secret is empty – VPN Disabled."
              echo "vpn_available=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "📦 Installing WireGuard tools..."
            sudo apt-get -o Acquire::ForceIPv4=true update -qq
            sudo apt-get -o Acquire::ForceIPv4=true install -y -qq wireguard-tools openresolv 2>/dev/null || sudo apt-get -o Acquire::ForceIPv4=true install -y -qq wireguard-tools

            echo "📝 Writing WireGuard config..."
            cat <<'EOF' > /tmp/wg0.conf
          ${{ secrets.WG_CONFIG }}
          EOF

            sudo cp /tmp/wg0.conf /etc/wireguard/wg0.conf
            sudo chmod 600 /etc/wireguard/wg0.conf

            echo "🚀 Bringing up wg0..."
            if sudo wg-quick up wg0; then
              echo "✅ WireGuard VPN connected securely!"
              echo "vpn_available=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Failed to bring up WireGuard – VPN disabled."
              sudo wg-quick down wg0 2>/dev/null || true
              echo "vpn_available=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "🚫 VPN disabled by user input."
            echo "vpn_available=false" >> $GITHUB_OUTPUT
          fi

      - name: 📁 Create Music Folder
        run: mkdir -p music

      - name: 🔗 Parse and Filter URLs
        id: parse
        shell: bash
        run: |
          RAW="${{ github.event.inputs.urls }}"
          URLS=$(echo "$RAW" | tr ',' ' ' | tr '\n' ' ' | tr -s ' ' | sed 's/^ *//;s/ *$//')

          if [ -z "$URLS" ]; then
            echo "❌ No URLs provided."
            exit 1
          fi

          rm -f spotify_urls.txt

          for url in $URLS; do
            if [[ "$url" =~ ^https?://(open\.spotify\.com|listen\.tidal\.com|music\.apple\.com|soundcloud\.com|youtube\.com|youtu\.be|music\.youtube\.com|pandora\.com|pandora\.app\.link) ]]; then
              echo "$url" >> spotify_urls.txt
            else
              echo "⚠️ Skipping unsupported URL: $url"
            fi
          done

          if [ -s spotify_urls.txt ]; then
            echo "✅ Found $(wc -l < spotify_urls.txt) valid URLs."
            echo "HAS_URLS=true" >> $GITHUB_OUTPUT
          else
            echo "❌ No valid URLs found."
            echo "HAS_URLS=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: ⬇️ Download with spotdl (Smart Provider Fallback)
        if: steps.parse.outputs.HAS_URLS == 'true'
        id: spotdl_download
        continue-on-error: true
        env:
          RAW_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          RAW_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          DEEZER_TOKEN: ${{ secrets.DEEZER_TOKEN }}
        shell: bash
        run: |
          set -x
          FORMAT="${{ github.event.inputs.output_format }}"
          BITRATE="${{ github.event.inputs.audio_quality }}"
          PARALLEL="${{ inputs.concurrent_downloads }}"
          MAX_RETRIES="${{ inputs.retry_count }}"
          VPN_AVAILABLE="${{ steps.vpn.outputs.vpn_available }}"
          USE_CUSTOM="${{ inputs.use_custom_credentials }}"
          FAILED="failed_urls_spotdl.txt"
          rm -f "$FAILED"

          # -------------------------------
          # 🔑 Credential Handling
          # -------------------------------
          if [ "$USE_CUSTOM" = "true" ] && [ -n "$RAW_CLIENT_ID" ] && [ -n "$RAW_CLIENT_SECRET" ]; then
            echo "✅ Using your custom Spotify Developer credentials."
            export SPOTIPY_CLIENT_ID="$RAW_CLIENT_ID"
            export SPOTIPY_CLIENT_SECRET="$RAW_CLIENT_SECRET"
          else
            echo "⚠️ Using spotdl's built-in default credentials (Mobile Scraper)."
            unset SPOTIPY_CLIENT_ID
            unset SPOTIPY_CLIENT_SECRET
          fi

          # -------------------------------
          # 🎚️ Bitrate Mapping
          # -------------------------------
          case "$BITRATE" in
            LOSSLESS|HI_RES_LOSSLESS|HIGH|LOW) BITRATE_ARG="disable" ;;
            320k|256k|192k|128k) BITRATE_ARG="$BITRATE" ;;
            *) BITRATE_ARG="320k" ;;
          esac

          OUTPUT_TEMPLATE="music/{title} - {artists}.{output-ext}"

          # -------------------------------
          # 🧠 PROVIDER PRIORITY LIST (dynamic)
          # -------------------------------
          PROVIDERS=("youtube-music" "youtube" "soundcloud")
          if [ -n "$DEEZER_TOKEN" ]; then
            echo "✅ Deezer token detected – adding Deezer provider."
            PROVIDERS+=("deezer")
          else
            echo "ℹ️ Deezer token not set – skipping Deezer provider."
          fi

          # Convert array to space-separated string for export
          PROVIDERS_STR="${PROVIDERS[*]}"

          echo "::group::⚙️ Download configuration"
          echo "🎧 Format: $FORMAT | 🎚️ Bitrate: $BITRATE_ARG | ⚡ Parallel: $PARALLEL | 🔄 Retries per provider (only for transient errors): $MAX_RETRIES"
          echo "🔑 Custom Credentials: $USE_CUSTOM"
          echo "📻 Provider priority: $PROVIDERS_STR"
          echo "::endgroup::"

          # -------------------------------
          # 🔁 Download function with smart fallback
          # -------------------------------
          download_with_fallback() {
            local url="$1"
            local attempt
            local provider
            local down_exit
            local log_file="/tmp/spotdl-log-$$-${RANDOM}.txt"

            # Convert provider string back to array inside subshell
            IFS=' ' read -ra PROVIDERS <<< "$PROVIDERS_STR"

            for provider in "${PROVIDERS[@]}"; do
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "▶️ Trying provider: $provider for $url"

              attempt=1
              while [ $attempt -le $MAX_RETRIES ]; do
                echo "   🔁 Attempt $attempt/$MAX_RETRIES with $provider"

                BEFORE=$(find music -type f ! -name 'failed_downloads.txt' | wc -l)

                CACHE_FILE="/tmp/spotdl-cache-$$-${RANDOM}.json"
                touch "$CACHE_FILE"

                if [ "$VPN_AVAILABLE" = "true" ]; then
                  echo "   🔒 [VPN] Downloading..."
                else
                  echo "   ⚠️ [Direct] Downloading..."
                fi

                export PYTHONUNBUFFERED=1
                timeout 900 spotdl download "$url" \
                  --format "$FORMAT" \
                  --bitrate "$BITRATE_ARG" \
                  --audio "$provider" \
                  --output "$OUTPUT_TEMPLATE" \
                  --cache-path "$CACHE_FILE" \
                  --threads 4 2>&1 | tee "$log_file"

                down_exit=${PIPESTATUS[0]}
                if [ $down_exit -eq 124 ]; then
                  echo "   ⏱️ Timeout after 15 minutes (network hang)."
                fi

                rm -f "$CACHE_FILE"
                local output=$(cat "$log_file")

                AFTER=$(find music -type f ! -name 'failed_downloads.txt' | wc -l)

                # Success checks
                if [ $down_exit -eq 0 ]; then
                  if echo "$output" | grep -qiE '(file already exists|duplicate|Downloaded)'; then
                    echo "   ✅ Success (duplicate or downloaded) with $provider on attempt $attempt."
                    rm -f "$log_file"
                    return 0
                  elif [ $AFTER -gt $BEFORE ]; then
                    echo "   ✅ Success with $provider on attempt $attempt (new files: $((AFTER - BEFORE)))"
                    rm -f "$log_file"
                    return 0
                  fi
                fi

                # If we get here, attempt failed.
                # Check if failure is due to "no results" → don't retry this provider
                if echo "$output" | grep -qiE '(LookupError|No results found|returned no usable results)'; then
                  echo "   🚫 Provider $provider reported 'no results'. Skipping remaining retries for this provider."
                  rm -f "$log_file"
                  break  # exit the while loop, go to next provider
                fi

                # Otherwise, print last lines and retry
                echo "   ❌ Attempt $attempt with $provider failed (exit $down_exit). Last log lines:"
                tail -n 20 "$log_file" || true
                rm -f "$log_file"

                attempt=$((attempt + 1))
                [ $attempt -le $MAX_RETRIES ] && sleep 3
              done
            done

            # All providers exhausted
            echo "🚫 All providers failed for $url"
            echo "$url" >> "$FAILED"
            return 1
          }

          export -f download_with_fallback
          export FORMAT BITRATE_ARG OUTPUT_TEMPLATE VPN_AVAILABLE MAX_RETRIES FAILED PROVIDERS_STR
          if [ -n "$DEEZER_TOKEN" ]; then
            export DEEZER_TOKEN
          fi

          echo "🚀 Starting parallel downloads (max $PARALLEL concurrent)"
          cat spotify_urls.txt | xargs -P "$PARALLEL" -I '{}' bash -c 'download_with_fallback "{}"'

          if [ -f "$FAILED" ]; then
            echo "⚠️ URLs that failed after all providers:"
            cat "$FAILED"
          fi
          set +x

      - name: 🔄 Convert Audio Format (if needed)
        if: steps.parse.outputs.HAS_URLS == 'true'
        shell: bash
        run: |
          TARGET_FMT="${{ github.event.inputs.output_format }}"
          BITRATE="${{ github.event.inputs.audio_quality }}"

          if [ "$TARGET_FMT" = "flac" ]; then
            echo "✅ Output format is FLAC – skipping conversion."
            exit 0
          fi

          echo "::group::🔄 Converting to $TARGET_FMT ($BITRATE)"
          find music -type f \( -iname "*.flac" -o -iname "*.m4a" -o -iname "*.mp3" -o -iname "*.ogg" -o -iname "*.opus" -o -iname "*.wav" \) | while read -r f; do
            ext="${f##*.}"
            if [ "${ext,,}" = "${TARGET_FMT,,}" ]; then continue; fi

            base="${f%.*}"
            out="${base}.${TARGET_FMT}"
            echo "🎵 Converting: $f → $out"

            case "$TARGET_FMT" in
              mp3) ffmpeg -i "$f" -c:a libmp3lame -b:a "$BITRATE" -map_metadata 0 -y "$out" 2>/dev/null ;;
              m4a) ffmpeg -i "$f" -c:a aac -b:a "$BITRATE" -map_metadata 0 -y "$out" 2>/dev/null ;;
              ogg) ffmpeg -i "$f" -c:a libvorbis -b:a "$BITRATE" -map_metadata 0 -y "$out" 2>/dev/null ;;
              opus) ffmpeg -i "$f" -c:a libopus -b:a "$BITRATE" -map_metadata 0 -y "$out" 2>/dev/null ;;
              wav) ffmpeg -i "$f" -c:a pcm_s16le -map_metadata 0 -y "$out" 2>/dev/null ;;
            esac

            if [ -f "$out" ] && [ "$f" != "$out" ]; then rm "$f"; fi
          done
          echo "::endgroup::"

      - name: 📝 Collect Failed URLs
        if: always()
        shell: bash
        run: |
          if [ -f failed_urls_spotdl.txt ] && [ -s failed_urls_spotdl.txt ]; then
            cp failed_urls_spotdl.txt music/failed_downloads.txt
          fi

      - name: ✅ Validate Download
        shell: bash
        run: |
          SONG_COUNT=$(find music -type f ! -name 'failed_downloads.txt' | wc -l)
          if [ "$SONG_COUNT" -eq 0 ]; then
            echo "⚠️ No audio files were downloaded."
          else
            echo "🎉 Total songs downloaded: $SONG_COUNT"
            ls -lhR music/
          fi

      - name: 🔌 Disconnect VPN for uploads
        if: steps.vpn.outputs.vpn_available == 'true'
        run: |
          echo "🔌 Bringing down WireGuard to use runner's native internet for uploads"
          sudo wg-quick down wg0

      - name: 📦 Archive Music Folder
        id: archive
        shell: bash
        run: |
          BUNDLE_ALL="${{ inputs.bundle_all }}"
          UPLOAD_METHOD="${{ inputs.upload_method }}"

          if [ "$UPLOAD_METHOD" = "repo" ]; then METHOD="split_push"; else METHOD="release"; fi

          rm -rf music_archive
          mkdir -p music_archive

          FILE_COUNT=$(find music -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then touch music/NO_DOWNLOADS.txt; fi

          if [ "$BUNDLE_ALL" = "true" ]; then
            RANDOM_STR=$(python3 -c "import random, string; print(''.join(random.choices(string.ascii_lowercase + string.digits, k=5)))")
            BASE_NAME="music-${RANDOM_STR}"
            ZIP_NAME="${BASE_NAME}.zip"

            cd music || exit 1
            if [ "$METHOD" = "release" ]; then
              zip -0 -r "../music_archive/${ZIP_NAME}" .
              FULLZIP="../music_archive/${ZIP_NAME}"
              SIZE=$(stat -c%s "$FULLZIP" 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 2044723200 ]; then
                rm "$FULLZIP"
                zip -0 -r -s 1950m "../music_archive/${ZIP_NAME}" .
              fi
            else
              zip -0 -r -s 99m "../music_archive/${ZIP_NAME}" .
            fi
            cd ..
          else
            cd music || exit 1
            find . -type f ! -name 'failed_downloads.txt' | while IFS= read -r track; do
              track_name="${track#./}"
              safe_name=$(echo "$track_name" | tr ' ' '_' | tr -cd '[:alnum:]._-')
              [ -z "$safe_name" ] && safe_name="track_$(tr -dc 'a-z0-9' </dev/urandom | head -c8)"
              RAND5=$(tr -dc 'a-z' </dev/urandom | head -c5)
              ZIP_NAME="single_${safe_name%.*}_${RAND5}.zip"

              TMP_DIR="../music_archive/tmp_single"
              mkdir -p "$TMP_DIR"
              cp "$track" "$TMP_DIR/"

              if [ "$METHOD" = "release" ]; then
                (cd "$TMP_DIR" && zip -0 "../../music_archive/${ZIP_NAME}" ./*)
                FULLZIP="../../music_archive/${ZIP_NAME}"
                SIZE=$(stat -c%s "$FULLZIP" 2>/dev/null || echo 0)
                if [ "$SIZE" -gt 2044723200 ]; then
                  rm "$FULLZIP"
                  (cd "$TMP_DIR" && zip -0 -s 1950m "../../music_archive/${ZIP_NAME}" ./*)
                fi
              else
                (cd "$TMP_DIR" && zip -0 -s 99m "../../music_archive/${ZIP_NAME}" ./*)
              fi
              rm -rf "$TMP_DIR"
            done
            cd ..
          fi

          rm -rf music/*
          mv music_archive/* music/
          rmdir music_archive 2>/dev/null || true
          ls -1 music > music_assets.txt

      - name: ☁️ Upload to Google Drive
        if: inputs.upload_method == 'drive'
        env:
          CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r '.access_token')
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "❌ Failed to obtain access token"
            exit 1
          fi

          FOLDER_NAME="github-actions"
          QUERY="mimeType='application/vnd.google-apps.folder' and name='$FOLDER_NAME' and trashed=false"
          FOLDER_ID=$(curl -s -G \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "q=$QUERY" \
            --data-urlencode "fields=files(id)" \
            "https://www.googleapis.com/drive/v3/files" | jq -r '.files[0].id // ""')
          if [ -z "$FOLDER_ID" ]; then
            FOLDER_ID=$(curl -s -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$FOLDER_NAME\", \"mimeType\":\"application/vnd.google-apps.folder\"}" \
              "https://www.googleapis.com/drive/v3/files?fields=id" | jq -r '.id')
          fi
          echo "✅ Folder ID: $FOLDER_ID"

          for file in music/*; do
            [ -f "$file" ] || continue
            fname=$(basename "$file")
            size=$(stat -c%s "$file")
            echo "⬆️ Uploading $fname ($size bytes)..."

            SESSION_URI=$(curl -s -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: application/zip" \
              -d "{\"name\":\"$fname\", \"parents\":[\"$FOLDER_ID\"]}" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable" \
              -D - | tr -d '\r' | grep -i '^location:' | sed 's/^location: //i' | tr -d ' ')
            
            if [ -z "$SESSION_URI" ]; then continue; fi

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Length: $size" \
              -H "Content-Range: bytes 0-$((size-1))/$size" \
              --data-binary "@$file" \
              "$SESSION_URI")
            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
              echo "✅ Uploaded $fname"
            fi
          done

      - name: 📤 Upload to repository (split_push method)
        if: ${{ inputs.upload_method == 'repo' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add music/
          COMMIT_MSG="Add: $(ls -1 music/ | tr '\n' ' ' | sed 's/ *$//') [skip ci]"
          git commit -m "$COMMIT_MSG" || echo "Nothing to commit"
          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then break; else [ $i -lt $RETRIES ] && sleep 3 || exit 1; fi
          done

      - name: 🏷️ Create Release and upload assets (release method)
        if: ${{ inputs.upload_method == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s music_assets.txt ]; then exit 0; fi
          RAND5=$(tr -dc 'a-z' </dev/urandom | head -c5)
          TAG="music-downloader-${RAND5}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag "$TAG" -m "Music download release"
          git push origin "$TAG"
          ASSET_ARGS=""
          while IFS= read -r file; do ASSET_ARGS="$ASSET_ARGS music/$file"; done < music_assets.txt
          gh release create "$TAG" $ASSET_ARGS \
            --title "music-downloader-${RAND5}" \
            --notes "Automated release from Spotify Download workflow." \
            --target "${{ github.ref_name }}"

      - name: 🧹 Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf music release_files spotify_urls.txt failed_urls_spotdl.txt music_assets.txt *.zip 2>/dev/null || true
          sudo wg-quick down wg0 2>/dev/null || true
