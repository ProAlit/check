name: downloader-spotify

on:
  workflow_dispatch:
    inputs:
      urls:
        description: >
          🎵 Enter Spotify/Tidal/Apple/SoundCloud/YouTube URLs
          (comma, space, or newline separated)
        required: true
        type: string

      output_format:
        description: "🎧 Output Format"
        required: true
        type: choice
        options:
          - mp3
          - flac
          - m4a
          - ogg
          - opus
          - wav
        default: mp3

      audio_quality:
        description: "🎚️ Audio Quality / Bitrate"
        required: true
        type: choice
        options:
          - 320k
          - 256k
          - 192k
          - 128k
          - LOSSLESS
          - HI_RES_LOSSLESS
          - HIGH
          - LOW
        default: 320k

      upload_method:
        description: "☁️ Upload destination"
        required: true
        type: choice
        options:
          - drive
          - repo
          - release
        default: drive

      bundle_all:
        description: "📦 Bundle all tracks into a single ZIP?"
        required: true
        type: boolean
        default: true

      vpn_enabled:
        description: "🔒 Route downloads through WireGuard VPN?"
        required: true
        type: boolean
        default: false

      use_custom_credentials:
        description: >
          🔑 Use custom Spotify Developer App credentials?
          (Requires SPOTIFY_CLIENT_ID + SPOTIFY_CLIENT_SECRET)
        required: true
        type: boolean
        default: false

      concurrent_downloads:
        description: "⚡ Concurrent URL jobs"
        required: true
        type: number
        default: 2

      retry_count:
        description: "🔄 Provider attempts per URL"
        required: true
        type: number
        default: 3

      fail_on_partial:
        description: "❌ Mark workflow failed if some URLs fail?"
        required: true
        type: boolean
        default: False


permissions:
  contents: write


concurrency:
  group: music-downloader-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false


env:
  # Versions verified against current upstream releases.
  SPOTDL_VERSION: "4.5.2"
  YTDLP_VERSION: "2026.08.19"
  BGUTIL_VERSION: "1.3.1"
  DENO_VERSION: "2.9.5"

  # Downloader tuning.
  DEFAULT_PARALLEL: "2"
  DEFAULT_PROVIDER_RETRIES: "3"
  SPOTDL_THREADS: "3"
  YTDLP_CONCURRENT_FRAGMENTS: "3"

  # Network tuning.
  YTDLP_RETRIES: "8"
  YTDLP_FRAGMENT_RETRIES: "8"
  YTDLP_EXTRACTOR_RETRIES: "5"
  YTDLP_FILE_ACCESS_RETRIES: "5"
  YTDLP_SOCKET_TIMEOUT: "30"

  # Drive upload.
  DRIVE_CHUNK_SIZE: "16777216"


jobs:

  music-download:

    runs-on: ubuntu-latest

    timeout-minutes: 120

    defaults:
      run:
        shell: bash


    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: "📥 Checkout repository"
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true


      # ============================================================
      # PYTHON
      # ============================================================

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip


      # ============================================================
      # INPUT ENVIRONMENT
      # ============================================================

      - name: "🧰 Install system dependencies"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail

          echo "::group::📦 Updating apt repositories"

          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::ForceIPv4=true update -qq; then
              break
            fi

            echo "⚠️ apt update failed (attempt $attempt/3)"
            sleep $((attempt * 3))

            if [ "$attempt" -eq 3 ]; then
              echo "❌ apt update failed permanently"
              exit 1
            fi
          done

          echo "::endgroup::"


          echo "::group::📦 Installing packages"

          sudo apt-get \
            -o Acquire::ForceIPv4=true \
            install \
            -y \
            -qq \
            ffmpeg \
            curl \
            jq \
            zip \
            unzip \
            aria2 \
            wireguard-tools \
            openresolv

          echo "::endgroup::"


      # ============================================================
      # DENO
      # ============================================================

      - name: "🦕 Install Deno"
        run: |
          set -Eeuo pipefail

          DENO_ARCHIVE="deno-x86_64-unknown-linux-gnu.zip"
          DENO_URL="https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/${DENO_ARCHIVE}"

          echo "::group::🦕 Installing Deno ${DENO_VERSION}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --output "/tmp/${DENO_ARCHIVE}" \
            "$DENO_URL"

          sudo unzip -o "/tmp/${DENO_ARCHIVE}" -d /usr/local/bin

          sudo chmod 755 /usr/local/bin/deno

          deno --version

          rm -f "/tmp/${DENO_ARCHIVE}"

          echo "::endgroup::"


      # ============================================================
      # PYTHON TOOLS
      # ============================================================

      - name: "🛠️ Install Python tools"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -Eeuo pipefail

          echo "::group::🐍 pip environment"

          python --version
          python -m pip --version

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            pip setuptools wheel

          echo "::endgroup::"


          echo "::group::🎵 Install spotDL ${SPOTDL_VERSION}"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            "spotdl==${SPOTDL_VERSION}"

          echo "::endgroup::"


          echo "::group::📺 Install yt-dlp ${YTDLP_VERSION}"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            "yt-dlp[default]==${YTDLP_VERSION}"

          echo "::endgroup::"


          echo "::group::🛡️ Install bgutil yt-dlp PO-token plugin"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            "bgutil-ytdlp-pot-provider==${BGUTIL_VERSION}"

          echo "Installed bgutil package:"
          python -m pip show bgutil-ytdlp-pot-provider || true

          echo "::endgroup::"


      # ============================================================
      # VERSION / TOOL DIAGNOSTICS
      # ============================================================

      - name: "🔎 Toolchain diagnostics"
        run: |
          set -Eeuo pipefail

          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  🎵 DOWNLOADER TOOLCHAIN                    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo

          printf 'Python     : '
          python --version

          printf 'FFmpeg     : '
          ffmpeg -version | head -n1

          printf 'FFprobe    : '
          ffprobe -version | head -n1

          printf 'Deno       : '
          deno --version | head -n1

          printf 'spotDL     : '
          spotdl --version

          printf 'yt-dlp     : '
          yt-dlp --version

          printf 'aria2c     : '
          aria2c --version | head -n1

          printf 'curl       : '
          curl --version | head -n1

          printf 'jq         : '
          jq --version

          echo
          echo "Configured versions:"
          echo "  spotDL  = ${SPOTDL_VERSION}"
          echo "  yt-dlp  = ${YTDLP_VERSION}"
          echo "  bgutil   = ${BGUTIL_VERSION}"
          echo "  Deno     = ${DENO_VERSION}"
          echo


      # ============================================================
      # DIRECTORY STRUCTURE
      # ============================================================

      - name: "📁 Create working directories"
        run: |
          set -Eeuo pipefail

          rm -rf work music

          mkdir -p \
            work/downloads \
            work/logs \
            work/results \
            work/failed \
            work/archive \
            work/final \
            music

          echo "✅ Workspace created."


      # ============================================================
      # INPUT NORMALIZATION
      # ============================================================

      - name: "🔗 Parse and validate URLs"
        id: parse
        env:
          RAW_URLS: ${{ inputs.urls }}
        run: |
          set -Eeuo pipefail

          echo "::group::🔗 Input processing"

          : > work/input_urls.txt
          : > work/jobs.tsv

          printf '%s\n' "$RAW_URLS" |
            tr ',' '\n' |
            sed 's/\r//g' |
            awk '
              {
                for (i = 1; i <= NF; i++) {
                  print $i
                }
              }
            ' |
            sed 's/^[[:space:]]*//; s/[[:space:]]*$//' |
            awk 'NF' |
            sort -u > work/input_urls.txt


          if [ ! -s work/input_urls.txt ]; then
            echo "❌ No URLs were provided."
            exit 1
          fi


          index=0

          while IFS= read -r url; do

            index=$((index + 1))

            if [[ "$url" =~ ^https?://(open\.)?spotify\.com/ ]]; then
              type="spotify"

            elif [[ "$url" =~ ^https?://(www\.)?youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://music\.youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://youtu\.be/ ]]; then
              type="youtube"

            elif [[ "$url" =~ ^https?://(www\.)?soundcloud\.com/ ]]; then
              type="soundcloud"

            elif [[ "$url" =~ ^https?://(www\.)?listen\.tidal\.com/ ]] ||
                 [[ "$url" =~ ^https?://(www\.)?tidal\.com/ ]]; then
              type="tidal"

            elif [[ "$url" =~ ^https?://(www\.)?music\.apple\.com/ ]]; then
              type="apple"

            elif [[ "$url" =~ ^https?://(www\.)?pandora\.com/ ]] ||
                 [[ "$url" =~ ^https?://pandora\.app\.link/ ]]; then
              type="pandora"

            else
              echo "⚠️ Unsupported URL skipped: $url"
              continue
            fi

            printf '%04d\t%s\t%s\n' "$index" "$type" "$url" >> work/jobs.tsv

          done < work/input_urls.txt


          if [ ! -s work/jobs.tsv ]; then
            echo "❌ No supported URLs found."
            exit 1
          fi


          TOTAL_URLS="$(wc -l < work/jobs.tsv)"

          echo "INPUT_COUNT=$TOTAL_URLS" >> "$GITHUB_OUTPUT"

          echo
          echo "✅ Accepted URLs: $TOTAL_URLS"
          echo

          column -t -s $'\t' work/jobs.tsv || cat work/jobs.tsv

          echo "::endgroup::"


      # ============================================================
      # WIREGUARD
      # ============================================================

      - name: "🔒 Configure WireGuard VPN"
        id: vpn
        env:
          VPN_ENABLED: ${{ inputs.vpn_enabled }}
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          set -Eeuo pipefail

          echo "::group::🔒 VPN configuration"

          vpn_available="false"

          if [ "$VPN_ENABLED" != "true" ]; then
            echo "🚫 VPN disabled by workflow input."
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi


          if [ -z "$WG_CONFIG" ]; then
            echo "⚠️ VPN requested but WG_CONFIG secret is empty."
            echo "vpn_available=false" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi


          echo "📦 Installing/refreshing WireGuard packages if necessary..."

          sudo apt-get \
            -o Acquire::ForceIPv4=true \
            install \
            -y \
            -qq \
            wireguard-tools \
            openresolv


          echo "📝 Writing WireGuard configuration."

          umask 077

          printf '%s\n' "$WG_CONFIG" > /tmp/wg0.conf

          sudo install \
            -m 600 \
            /tmp/wg0.conf \
            /etc/wireguard/wg0.conf


          echo "🚀 Starting wg0..."

          if sudo wg-quick up wg0; then
            vpn_available="true"
            echo "✅ WireGuard connected."
          else
            echo "❌ WireGuard failed to start."
            sudo wg-quick down wg0 2>/dev/null || true
          fi


          if [ "$vpn_available" = "true" ]; then

            echo
            echo "🌐 VPN network diagnostics:"

            PUBLIC_IP="$(
              curl \
                -4 \
                --silent \
                --show-error \
                --max-time 15 \
                https://api.ipify.org \
              || echo "unavailable"
            )"

            echo "   Public IPv4: $PUBLIC_IP"

            if sudo wg show wg0 >/dev/null 2>&1; then
              echo "   WireGuard interface: UP"
            else
              echo "   WireGuard interface: UNKNOWN"
            fi

          fi


          echo "vpn_available=$vpn_available" >> "$GITHUB_OUTPUT"

          echo "::endgroup::"


      # ============================================================
      # BGUTIL PO TOKEN SERVER
      # ============================================================

      - name: "🛡️ Start bgutil PO-token provider"
        id: pot
        run: |
          set -Eeuo pipefail

          echo "::group::🛡️ bgutil PO-token provider"

          POT_IMAGE="brainicism/bgutil-ytdlp-pot-provider:${BGUTIL_VERSION}"

          rm -f work/logs/bgutil-provider.log

          echo "📦 Pulling: $POT_IMAGE"

          pulled="false"

          for attempt in 1 2 3; do

            if docker pull "$POT_IMAGE"; then
              pulled="true"
              break
            fi

            echo "⚠️ Docker pull failed (attempt $attempt/3)"
            sleep $((attempt * 3))

          done


          if [ "$pulled" != "true" ]; then
            echo "❌ Could not pull bgutil provider image."
            echo "pot_available=false" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi


          docker rm -f bgutil-provider >/dev/null 2>&1 || true


          echo "🚀 Starting provider on host network..."

          docker run \
            --name bgutil-provider \
            --detach \
            --init \
            --network host \
            "$POT_IMAGE" \
            > work/logs/bgutil-container-id.txt


          echo "⏳ Waiting for provider health endpoint..."

          ready="false"

          for i in $(seq 1 30); do

            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 3 \
              http://127.0.0.1:4416/ping \
              > work/logs/bgutil-ping.json 2>/dev/null; then

              ready="true"
              break
            fi

            sleep 2

          done


          if [ "$ready" = "true" ]; then

            echo "✅ bgutil HTTP provider is ready."

            cat work/logs/bgutil-ping.json || true

            echo "pot_available=true" >> "$GITHUB_OUTPUT"

          else

            echo "⚠️ bgutil provider failed health check."

            docker logs bgutil-provider \
              > work/logs/bgutil-provider.log 2>&1 \
              || true

            echo "pot_available=false" >> "$GITHUB_OUTPUT"

          fi


          echo "::endgroup::"


      # ============================================================
      # PO TOKEN / YT-DLP VERIFICATION
      # ============================================================

      - name: "🧪 Verify yt-dlp + bgutil integration"
        if: steps.pot.outputs.pot_available == 'true'
        continue-on-error: true
        run: |
          set -Eeuo pipefail

          echo "::group::🧪 yt-dlp PO-token verification"

          TEST_URL="https://www.youtube.com/watch?v=BaW_jenozKc"

          echo "Testing yt-dlp PO-token plugin registration..."

          yt-dlp \
            --verbose \
            --simulate \
            --skip-download \
            --extractor-args "youtube:player-client=mweb" \
            "$TEST_URL" \
            > work/logs/pot-verification.log 2>&1 \
            || true


          if grep -qiE 'PO Token Providers:.*bgutil' work/logs/pot-verification.log; then
            echo "✅ bgutil PO-token provider detected by yt-dlp."
          else
            echo "⚠️ bgutil was not confirmed in verbose output."
            echo "The downloader will still continue."
          fi


          echo
          echo "Relevant yt-dlp PO-token diagnostics:"
          grep -iE \
            'PO Token|bgutil|player-client|youtube' \
            work/logs/pot-verification.log \
            | tail -n 40 \
            || true


          echo "::endgroup::"


      # ============================================================
      # DOWNLOAD
      # ============================================================

      - name: "⬇️ Download media"
        id: download
        env:
          RAW_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          RAW_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_MUSIC_COOKIES: ${{ secrets.YOUTUBE_MUSIC_COOKIES }}

          USE_CUSTOM_CREDENTIALS: ${{ inputs.use_custom_credentials }}
          PARALLEL_INPUT: ${{ inputs.concurrent_downloads }}
          RETRIES_INPUT: ${{ inputs.retry_count }}

          VPN_AVAILABLE: ${{ steps.vpn.outputs.vpn_available }}
          POT_AVAILABLE: ${{ steps.pot.outputs.pot_available }}

        run: |
          set -Eeuo pipefail


          # ==========================================================
          # INPUT VALIDATION
          # ==========================================================

          PARALLEL="$PARALLEL_INPUT"
          PROVIDER_RETRIES="$RETRIES_INPUT"

          if ! [[ "$PARALLEL" =~ ^[1-8]$ ]]; then
            echo "⚠️ Invalid concurrency '$PARALLEL'. Using 2."
            PARALLEL="$DEFAULT_PARALLEL"
          fi

          if ! [[ "$PROVIDER_RETRIES" =~ ^[1-6]$ ]]; then
            echo "⚠️ Invalid retry count '$PROVIDER_RETRIES'. Using 3."
            PROVIDER_RETRIES="$DEFAULT_PROVIDER_RETRIES"
          fi


          FORMAT="${{ inputs.output_format }}"
          QUALITY="${{ inputs.audio_quality }}"


          # ==========================================================
          # QUALITY MAPPING
          # ==========================================================

          case "$QUALITY" in

            320k|256k|192k|128k)
              EFFECTIVE_BITRATE="$QUALITY"
              SPOTDL_BITRATE="$QUALITY"
              ;;

            HIGH)
              EFFECTIVE_BITRATE="320k"
              SPOTDL_BITRATE="320k"
              ;;

            LOW)
              EFFECTIVE_BITRATE="128k"
              SPOTDL_BITRATE="128k"
              ;;

            LOSSLESS|HI_RES_LOSSLESS)
              EFFECTIVE_BITRATE="320k"

              case "$FORMAT" in
                flac|wav|m4a|opus)
                  SPOTDL_BITRATE="disable"
                  ;;
                *)
                  SPOTDL_BITRATE="320k"
                  ;;
              esac
              ;;

            *)
              EFFECTIVE_BITRATE="320k"
              SPOTDL_BITRATE="320k"
              ;;

          esac


          # ==========================================================
          # COOKIE FILES
          # ==========================================================

          COOKIE_YT=""
          COOKIE_YTM=""

          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/youtube-cookies.txt
            chmod 600 /tmp/youtube-cookies.txt
            COOKIE_YT="/tmp/youtube-cookies.txt"
          fi

          if [ -n "$YOUTUBE_MUSIC_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_MUSIC_COOKIES" > /tmp/youtube-music-cookies.txt
            chmod 600 /tmp/youtube-music-cookies.txt
            COOKIE_YTM="/tmp/youtube-music-cookies.txt"
          fi


          # ==========================================================
          # SPOTDL YT-DLP ARGUMENTS
          #
          # Current yt-dlp PO-token guidance recommends mweb with a
          # PO-token provider. bgutil supplies the token dynamically.
          # ==========================================================

          SPOTDL_YTDLP_ARGS='
            --extractor-args "youtube:player-client=mweb"
            --retries 8
            --fragment-retries 8
            --extractor-retries 5
            --file-access-retries 5
            --socket-timeout 30
            --concurrent-fragments 3
            --throttled-rate 100K
            --sleep-requests 1
            --retry-sleep "exp=1:30"
          '


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    🎵 DOWNLOAD ENGINE                       ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf '║ Format       : %-45s ║\n' "$FORMAT"
          printf '║ Quality      : %-45s ║\n' "$QUALITY"
          printf '║ Bitrate      : %-45s ║\n' "$EFFECTIVE_BITRATE"
          printf '║ Concurrency  : %-45s ║\n' "$PARALLEL"
          printf '║ Retries      : %-45s ║\n' "$PROVIDER_RETRIES"
          printf '║ VPN          : %-45s ║\n' "$VPN_AVAILABLE"
          printf '║ PO Token     : %-45s ║\n' "$POT_AVAILABLE"
          printf '║ Cookies YT   : %-45s ║\n' "$([ -n "$COOKIE_YT" ] && echo yes || echo no)"
          printf '║ Cookies YTM  : %-45s ║\n' "$([ -n "$COOKIE_YTM" ] && echo yes || echo no)"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo


          # ==========================================================
          # LOG FUNCTIONS
          # ==========================================================

          timestamp() {
            date '+%H:%M:%S'
          }


          job_log() {
            local level="$1"
            local message="$2"

            printf '[%s] %-8s %s\n' \
              "$(timestamp)" \
              "$level" \
              "$message"
          }


          # ==========================================================
          # ERROR CLASSIFICATION
          # ==========================================================

          classify_error() {

            local log_file="$1"

            if grep -qiE \
              'HTTP Error 429|HTTP 429|Too Many Requests|rate.?limit' \
              "$log_file"; then
              echo "RATE_LIMIT"
              return
            fi


            if grep -qiE \
              'Sign in to confirm|not a bot|bot detection|confirm you.re not a bot' \
              "$log_file"; then
              echo "BOT_DETECTION"
              return
            fi


            if grep -qiE \
              'No results found|returned no usable results|No video results' \
              "$log_file"; then
              echo "NO_MATCH"
              return
            fi


            if grep -qiE \
              'HTTP Error 403|HTTP 403|Forbidden' \
              "$log_file"; then
              echo "FORBIDDEN"
              return
            fi


            if grep -qiE \
              'timed out|timeout|Connection reset|Connection aborted|Temporary failure in name resolution|Could not resolve' \
              "$log_file"; then
              echo "NETWORK"
              return
            fi


            if grep -qiE \
              'Requested format is not available|No video formats found|No formats found' \
              "$log_file"; then
              echo "FORMAT"
              return
            fi


            echo "UNKNOWN"
          }


          # ==========================================================
          # RESULT WRITER
          # ==========================================================

          write_result() {

            local index="$1"
            local input_type="$2"
            local url="$3"
            local status="$4"
            local provider="$5"
            local attempts="$6"
            local reason="$7"
            local started_at="$8"
            local finished_at="$9"

            local track_dir="work/downloads/${index}"
            local result_file="work/results/${index}.json"

            mkdir -p "$track_dir"

            local file_count
            file_count="$(
              find "$track_dir" \
                -type f \
                \( \
                  -iname '*.mp3' \
                  -o -iname '*.flac' \
                  -o -iname '*.m4a' \
                  -o -iname '*.ogg' \
                  -o -iname '*.opus' \
                  -o -iname '*.wav' \
                  -o -iname '*.webm' \
                  -o -iname '*.aac' \
                \) \
                | wc -l
            )"


            local output_json

            output_json="$(
              find "$track_dir" \
                -type f \
                \( \
                  -iname '*.mp3' \
                  -o -iname '*.flac' \
                  -o -iname '*.m4a' \
                  -o -iname '*.ogg' \
                  -o -iname '*.opus' \
                  -o -iname '*.wav' \
                  -o -iname '*.webm' \
                  -o -iname '*.aac' \
                \) \
                -printf '%f\n' \
                | jq -R -s 'split("\n") | map(select(length > 0))'
            )"


            jq -n \
              --arg index "$index" \
              --arg type "$input_type" \
              --arg url "$url" \
              --arg status "$status" \
              --arg provider "$provider" \
              --arg attempts "$attempts" \
              --arg reason "$reason" \
              --arg started_at "$started_at" \
              --arg finished_at "$finished_at" \
              --argjson files "$output_json" \
              --arg file_count "$file_count" \
              '{
                index: $index,
                input_type: $type,
                url: $url,
                status: $status,
                provider: $provider,
                attempts: ($attempts | tonumber),
                reason: $reason,
                started_at: $started_at,
                finished_at: $finished_at,
                output_file_count: ($file_count | tonumber),
                output_files: $files
              }' > "$result_file"
          }


          # ==========================================================
          # DIRECT YT-DLP DOWNLOAD
          # ==========================================================

          direct_ytdlp_download() {

            local index="$1"
            local input_type="$2"
            local url="$3"

            local track_dir="work/downloads/${index}"
            local log_file="work/logs/${index}-direct-ytdlp.log"

            mkdir -p "$track_dir"

            local -a args

            args=(
              --ignore-config
              --no-warnings
              --newline
              --continue
              --no-overwrites

              --retries "$YTDLP_RETRIES"
              --fragment-retries "$YTDLP_FRAGMENT_RETRIES"
              --extractor-retries "$YTDLP_EXTRACTOR_RETRIES"
              --file-access-retries "$YTDLP_FILE_ACCESS_RETRIES"

              --socket-timeout "$YTDLP_SOCKET_TIMEOUT"

              --concurrent-fragments "$YTDLP_CONCURRENT_FRAGMENTS"

              --throttled-rate 100K
              --sleep-requests 1
              --retry-sleep "exp=1:30"

              --extractor-args "youtube:player-client=mweb"

              --format "bestaudio/best"

              --output "${track_dir}/%(title)s [%(id)s].%(ext)s"

              --write-info-json
              --no-write-thumbnail
            )


            case "$input_type" in

              youtube)

                if [ -n "$COOKIE_YTM" ] &&
                   [[ "$url" == *music.youtube.com* ]]; then

                  args+=(--cookies "$COOKIE_YTM")

                elif [ -n "$COOKIE_YT" ]; then

                  args+=(--cookies "$COOKIE_YT")

                fi

                ;;


              soundcloud)

                # No YouTube cookie file is passed to SoundCloud.
                ;;

            esac


            # Preserve a direct video as a single media item.
            if [[ "$input_type" == "youtube" ]]; then
              args+=(--no-playlist)
            fi


            job_log "DIRECT" "#${index} direct yt-dlp → ${input_type}"


            if timeout 900 yt-dlp \
              "${args[@]}" \
              "$url" \
              > "$log_file" 2>&1; then

              if find "$track_dir" \
                -type f \
                \( \
                  -iname '*.webm' \
                  -o -iname '*.m4a' \
                  -o -iname '*.opus' \
                  -o -iname '*.mp4' \
                  -o -iname '*.aac' \
                \) \
                | grep -q .; then

                job_log "SUCCESS" "#${index} direct yt-dlp succeeded."

                return 0

              fi

            fi


            local err_class
            err_class="$(classify_error "$log_file")"

            job_log \
              "WARN" \
              "#${index} direct yt-dlp failed: ${err_class}"

            return 1
          }


          # ==========================================================
          # SPOTDL PROVIDER DOWNLOAD
          # ==========================================================

          spotdl_provider_download() {

            local index="$1"
            local input_type="$2"
            local url="$3"
            local provider="$4"
            local cookie_file="$5"

            local track_dir="work/downloads/${index}"
            local track_log="work/logs/${index}-${provider}.log"

            mkdir -p "$track_dir"

            local attempt=1

            while [ "$attempt" -le "$PROVIDER_RETRIES" ]; do

              local attempt_log
              attempt_log="work/logs/${index}-${provider}-attempt-${attempt}.log"


              job_log \
                "TRY" \
                "#${index} ${provider} attempt ${attempt}/${PROVIDER_RETRIES}"


              local -a cmd

              cmd=(
                spotdl
                download
                "$url"

                --audio "$provider"

                --format "$FORMAT"
                --bitrate "$SPOTDL_BITRATE"

                --output "${track_dir}/{artists} - {title}.{output-ext}"

                --threads "$SPOTDL_THREADS"

                --max-retries 3

                --overwrite skip

                --restrict none

                --max-filename-length 180

                --print-errors

                --save-errors "$track_log"

                --yt-dlp-args "$SPOTDL_YTDLP_ARGS"

                --log-level INFO
              )


              # Use a separate local cache/archive for each job.
              mkdir -p "${track_dir}/.spotdl-cache"

              cmd+=(
                --cache-path "${track_dir}/.spotdl-cache"
                --archive "${track_dir}/.spotdl.archive"
              )


              # Custom Spotify API.
              if [ "$USE_CUSTOM_CREDENTIALS" = "true" ] &&
                 [ -n "$RAW_CLIENT_ID" ] &&
                 [ -n "$RAW_CLIENT_SECRET" ]; then

                cmd+=(
                  --client-id "$RAW_CLIENT_ID"
                  --client-secret "$RAW_CLIENT_SECRET"
                  --use-official-api
                )

              fi


              # Only pass relevant YouTube cookies.
              case "$provider" in

                youtube-music)

                  if [ -n "$COOKIE_YTM" ]; then
                    cmd+=(--cookie-file "$COOKIE_YTM")

                  elif [ -n "$COOKIE_YT" ]; then
                    cmd+=(--cookie-file "$COOKIE_YT")
                  fi

                  ;;


                youtube)

                  if [ -n "$COOKIE_YT" ]; then
                    cmd+=(--cookie-file "$COOKIE_YT")
                  fi

                  ;;


                *)

                  ;;

              esac


              local before_count
              before_count="$(
                find "$track_dir" \
                  -type f \
                  \( \
                    -iname '*.mp3' \
                    -o -iname '*.flac' \
                    -o -iname '*.m4a' \
                    -o -iname '*.ogg' \
                    -o -iname '*.opus' \
                    -o -iname '*.wav' \
                  \) \
                  | wc -l
              )"


              local exit_code=0

              timeout 900 \
                "${cmd[@]}" \
                > "$attempt_log" 2>&1 \
                || exit_code=$?


              cat "$attempt_log" >> "$track_log" 2>/dev/null || true

              local after_count
              after_count="$(
                find "$track_dir" \
                  -type f \
                  \( \
                    -iname '*.mp3' \
                    -o -iname '*.flac' \
                    -o -iname '*.m4a' \
                    -o -iname '*.ogg' \
                    -o -iname '*.opus' \
                    -o -iname '*.wav' \
                  \) \
                  | wc -l
              )"


              if [ "$exit_code" -eq 0 ] && [ "$after_count" -gt 0 ]; then

                job_log \
                  "SUCCESS" \
                  "#${index} ${provider} downloaded ${after_count} file(s)."

                return 0

              fi


              local error_class
              error_class="$(classify_error "$attempt_log")"


              case "$error_class" in

                NO_MATCH)

                  job_log \
                    "SKIP" \
                    "#${index} ${provider}: no match; moving to next provider."

                  return 1
                  ;;


                BOT_DETECTION)

                  job_log \
                    "SKIP" \
                    "#${index} ${provider}: bot/auth check; moving to next provider."

                  return 1
                  ;;


                RATE_LIMIT)

                  if [ "$attempt" -lt "$PROVIDER_RETRIES" ]; then

                    local delay=$((2 ** attempt))

                    if [ "$delay" -gt 30 ]; then
                      delay=30
                    fi

                    job_log \
                      "RETRY" \
                      "#${index} ${provider}: rate limited; sleeping ${delay}s."

                    sleep "$delay"

                  fi

                  ;;


                FORBIDDEN)

                  job_log \
                    "WARN" \
                    "#${index} ${provider}: HTTP 403 / forbidden."

                  ;;


                FORMAT)

                  job_log \
                    "SKIP" \
                    "#${index} ${provider}: requested format unavailable."

                  return 1
                  ;;


                NETWORK)

                  if [ "$attempt" -lt "$PROVIDER_RETRIES" ]; then

                    local delay=$((2 ** attempt))

                    if [ "$delay" -gt 30 ]; then
                      delay=30
                    fi

                    job_log \
                      "RETRY" \
                      "#${index} ${provider}: network failure; retrying in ${delay}s."

                    sleep "$delay"

                  fi

                  ;;


                UNKNOWN)

                  if [ "$attempt" -lt "$PROVIDER_RETRIES" ]; then

                    local delay=$((2 ** attempt))

                    if [ "$delay" -gt 30 ]; then
                      delay=30
                    fi

                    job_log \
                      "RETRY" \
                      "#${index} ${provider}: unknown failure; retrying in ${delay}s."

                    sleep "$delay"

                  fi

                  ;;

              esac


              attempt=$((attempt + 1))

            done


            job_log \
              "FAILED" \
              "#${index} provider ${provider} exhausted."

            return 1
          }


          # ==========================================================
          # PROVIDER ENGINE
          # ==========================================================

          download_one() {

            local index="$1"
            local input_type="$2"
            local url="$3"

            local started_at
            started_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"


            local final_provider="none"
            local final_status="failed"
            local final_reason="all providers failed"

            local attempt_counter=0


            job_log \
              "START" \
              "#${index} ${input_type} → ${url}"


            # --------------------------------------------------------
            # Direct sources
            # --------------------------------------------------------

            if [[ "$input_type" == "youtube" ]] ||
               [[ "$input_type" == "soundcloud" ]]; then

              attempt_counter=$((attempt_counter + 1))

              if direct_ytdlp_download \
                "$index" \
                "$input_type" \
                "$url"; then

                final_provider="yt-dlp-direct"
                final_status="success"
                final_reason="direct source download succeeded"

              fi

            fi


            # --------------------------------------------------------
            # spotDL provider fallback
            # --------------------------------------------------------

            if [ "$final_status" != "success" ]; then

              local providers=(
                youtube-music
                youtube
                soundcloud
                bandcamp
                piped
                slider-kz
              )


              for provider in "${providers[@]}"; do

                if [ "$final_status" = "success" ]; then
                  break
                fi


                local cookie=""

                case "$provider" in

                  youtube-music)
                    cookie="$COOKIE_YTM"
                    ;;

                  youtube)
                    cookie="$COOKIE_YT"
                    ;;

                  *)
                    cookie=""
                    ;;

                esac


                attempt_counter=$((attempt_counter + 1))


                if spotdl_provider_download \
                  "$index" \
                  "$input_type" \
                  "$url" \
                  "$provider" \
                  "$cookie"; then

                  final_provider="$provider"
                  final_status="success"
                  final_reason="provider download succeeded"

                  break

                fi

              done

            fi


            local track_dir="work/downloads/${index}"


            # --------------------------------------------------------
            # Output existence check
            # --------------------------------------------------------

            if [ "$final_status" = "success" ]; then

              local output_count

              output_count="$(
                find "$track_dir" \
                  -type f \
                  \( \
                    -iname '*.mp3' \
                    -o -iname '*.flac' \
                    -o -iname '*.m4a' \
                    -o -iname '*.ogg' \
                    -o -iname '*.opus' \
                    -o -iname '*.wav' \
                    -o -iname '*.webm' \
                    -o -iname '*.aac' \
                  \) \
                  | wc -l
              )"


              if [ "$output_count" -eq 0 ]; then

                final_status="failed"
                final_provider="none"
                final_reason="provider reported success but produced no audio files"

              fi

            fi


            # --------------------------------------------------------
            # Failure capture
            # --------------------------------------------------------

            if [ "$final_status" != "success" ]; then

              printf '%s\t%s\t%s\n' \
                "$index" \
                "$input_type" \
                "$url" \
                > "work/failed/${index}.tsv"

              echo "$url" > "work/failed/${index}.url"

              job_log \
                "ERROR" \
                "#${index} all download strategies failed."

            fi


            local finished_at
            finished_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"


            write_result \
              "$index" \
              "$input_type" \
              "$url" \
              "$final_status" \
              "$final_provider" \
              "$attempt_counter" \
              "$final_reason" \
              "$started_at" \
              "$finished_at"


            if [ "$final_status" = "success" ]; then

              job_log \
                "DONE" \
                "#${index} SUCCESS via ${final_provider}"

            else

              job_log \
                "DONE" \
                "#${index} FAILED"

            fi

          }


          # Export functions for xargs workers.
          export -f \
            timestamp \
            job_log \
            classify_error \
            write_result \
            direct_ytdlp_download \
            spotdl_provider_download \
            download_one


          export \
            FORMAT \
            QUALITY \
            EFFECTIVE_BITRATE \
            SPOTDL_BITRATE \
            SPOTDL_YTDLP_ARGS \
            COOKIE_YT \
            COOKIE_YTM \
            RAW_CLIENT_ID \
            RAW_CLIENT_SECRET \
            USE_CUSTOM_CREDENTIALS \
            PROVIDER_RETRIES \
            SPOTDL_THREADS \
            YTDLP_RETRIES \
            YTDLP_FRAGMENT_RETRIES \
            YTDLP_EXTRACTOR_RETRIES \
            YTDLP_FILE_ACCESS_RETRIES \
            YTDLP_SOCKET_TIMEOUT \
            YTDLP_CONCURRENT_FRAGMENTS


          # ==========================================================
          # PARALLEL EXECUTION
          # ==========================================================

          echo
          echo "🚀 Starting ${PARALLEL} concurrent downloader workers."
          echo


          awk -F '\t' '
            {
              print $1 "\t" $2 "\t" $3
            }
          ' work/jobs.tsv |
          xargs \
            -P "$PARALLEL" \
            -n 3 \
            bash -c '
              download_one "$1" "$2" "$3"
            ' _


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    📊 DOWNLOAD SUMMARY                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo


          SUCCESS_COUNT="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json 2>/dev/null \
              || echo 0
          )"


          FAILED_COUNT="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json 2>/dev/null \
              || echo 0
          )"


          TOTAL_COUNT="$(
            jq -s 'length' work/results/*.json 2>/dev/null \
            || echo 0
          )"


          echo "Total     : $TOTAL_COUNT"
          echo "Successful: $SUCCESS_COUNT"
          echo "Failed    : $FAILED_COUNT"


          if [ "$FAILED_COUNT" -gt 0 ]; then

            echo
            echo "❌ Failed inputs:"

            for failed_file in work/failed/*.tsv; do

              [ -f "$failed_file" ] || continue

              cut -f1-3 "$failed_file"

            done

          fi


      # ============================================================
      # CONVERT
      # ============================================================

      - name: "🔄 Convert and validate audio"
        id: convert
        run: |
          set -Eeuo pipefail


          TARGET_FMT="${{ inputs.output_format }}"
          QUALITY="${{ inputs.audio_quality }}"


          case "$QUALITY" in

            320k|256k|192k|128k)
              FFMPEG_BITRATE="$QUALITY"
              ;;

            HIGH)
              FFMPEG_BITRATE="320k"
              ;;

            LOW)
              FFMPEG_BITRATE="128k"
              ;;

            LOSSLESS|HI_RES_LOSSLESS)
              FFMPEG_BITRATE="320k"
              ;;

            *)
              FFMPEG_BITRATE="320k"
              ;;

          esac


          echo "::group::🔄 Audio conversion"

          mapfile -d '' audio_files < <(
            find work/downloads \
              -type f \
              \( \
                -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.mp3' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
                -o -iname '*.webm' \
                -o -iname '*.aac' \
              \) \
              -print0
          )


          if [ "${#audio_files[@]}" -eq 0 ]; then
            echo "⚠️ No audio files found."
            echo "::endgroup::"
            exit 0
          fi


          converted=0
          validated=0
          failed=0


          for source in "${audio_files[@]}"; do

            extension="${source##*.}"
            extension="${extension,,}"


            case "$TARGET_FMT" in

              mp3)
                codec="libmp3lame"
                audio_args=(
                  -c:a libmp3lame
                  -b:a "$FFMPEG_BITRATE"
                  -id3v2_version 3
                )
                ;;


              flac)
                audio_args=(
                  -c:a flac
                )
                ;;


              m4a)
                audio_args=(
                  -c:a aac
                  -b:a "$FFMPEG_BITRATE"
                  -movflags +faststart
                )
                ;;


              ogg)
                audio_args=(
                  -c:a libvorbis
                  -b:a "$FFMPEG_BITRATE"
                )
                ;;


              opus)
                audio_args=(
                  -c:a libopus
                  -b:a "$FFMPEG_BITRATE"
                )
                ;;


              wav)
                audio_args=(
                  -c:a pcm_s16le
                )
                ;;

            esac


            if [ "$extension" = "${TARGET_FMT,,}" ]; then
              target="$source"
              echo "✓ Already target format: $(basename "$source")"

            else

              target="${source%.*}.${TARGET_FMT}"

              echo "→ $(basename "$source") → $(basename "$target")"

              ffmpeg \
                -hide_banner \
                -loglevel error \
                -nostdin \
                -i "$source" \
                -vn \
                -map_metadata 0 \
                "${audio_args[@]}" \
                -y \
                "$target"

              if [ ! -s "$target" ]; then
                echo "❌ Conversion produced an empty file."
                failed=$((failed + 1))
                rm -f "$target"
                continue
              fi


              # Validate converted output before removing source.
              if ffprobe \
                -v error \
                -show_entries format=duration,size \
                -show_entries stream=codec_name,sample_rate,channels \
                -of json \
                "$target" \
                > /tmp/ffprobe.json; then

                converted=$((converted + 1))
                rm -f "$source"

              else

                echo "❌ ffprobe rejected converted output."
                failed=$((failed + 1))
                rm -f "$target"

                continue

              fi

            fi


            # Validate final source/converted file.
            if ffprobe \
              -v error \
              -show_entries format=duration,size \
              -show_entries stream=codec_name,sample_rate,channels \
              -of json \
              "$target" \
              > /tmp/ffprobe-final.json; then

              validated=$((validated + 1))

            else

              echo "❌ Invalid audio file: $target"
              failed=$((failed + 1))

            fi

          done


          echo
          echo "Conversion summary:"
          echo "  Converted : $converted"
          echo "  Validated : $validated"
          echo "  Failed    : $failed"

          echo "::endgroup::"


      # ============================================================
      # REMOVE TEMP SPOTDL STATE
      # ============================================================

      - name: "🧹 Remove temporary downloader state"
        run: |
          set -Eeuo pipefail

          find work/downloads \
            -type f \
            \( \
              -name '.spotdl.archive' \
              -o -name '*.json' \
            \) \
            -delete \
            2>/dev/null || true

          find work/downloads \
            -type d \
            -name '.spotdl-cache' \
            -prune \
            -exec rm -rf {} + \
            2>/dev/null || true


      # ============================================================
      # COLLECT FINAL AUDIO
      # ============================================================

      - name: "📚 Build final music directory"
        id: collect
        run: |
          set -Eeuo pipefail

          rm -rf music
          mkdir -p music


          count=0


          while IFS= read -r -d '' file; do

            count=$((count + 1))

            original_name="$(basename "$file")"

            # Keep deterministic ordering and prevent collisions.
            output_name="$(
              printf '%04d-%s' \
                "$count" \
                "$original_name"
            )"


            cp \
              --reflink=auto \
              -p \
              "$file" \
              "music/$output_name"

          done < <(
            find work/downloads \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) \
              -print0 |
            sort -z
          )


          echo "FINAL_AUDIO_COUNT=$count" >> "$GITHUB_OUTPUT"

          echo
          echo "🎵 Final audio files: $count"

          if [ "$count" -eq 0 ]; then
            echo "⚠️ No final audio files available."
          else
            ls -lh music/
          fi


      # ============================================================
      # CREATE MANIFEST / SUMMARY
      # ============================================================

      - name: "📝 Generate manifest and GitHub summary"
        id: manifest
        env:
          FAIL_ON_PARTIAL: ${{ inputs.fail_on_partial }}
        run: |
          set -Eeuo pipefail


          mkdir -p work/archive


          TOTAL="$(
            jq -s 'length' work/results/*.json 2>/dev/null ||
            echo 0
          )"


          SUCCESS="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json 2>/dev/null ||
            echo 0
          )"


          FAILED="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json 2>/dev/null ||
            echo 0
          )"


          AUDIO_COUNT="$(
            find music \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) \
              | wc -l
          )"


          TOTAL_BYTES="$(
            find music \
              -type f \
              -printf '%s\n' \
              | awk '{s += $1} END {print s+0}'
          )"


          cat > work/manifest.json <<EOF
          {
            "workflow": "${GITHUB_WORKFLOW}",
            "repository": "${GITHUB_REPOSITORY}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "sha": "${GITHUB_SHA}",
            "created_at": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "format": "${{ inputs.output_format }}",
            "quality": "${{ inputs.audio_quality }}",
            "upload_method": "${{ inputs.upload_method }}",
            "bundle_all": ${{ inputs.bundle_all }},
            "vpn_enabled": ${{ inputs.vpn_enabled }},
            "pot_provider": true,
            "spotdl_version": "${SPOTDL_VERSION}",
            "ytdlp_version": "${YTDLP_VERSION}",
            "bgutil_version": "${BGUTIL_VERSION}",
            "deno_version": "${DENO_VERSION}",
            "total_urls": ${TOTAL},
            "successful_urls": ${SUCCESS},
            "failed_urls": ${FAILED},
            "final_audio_files": ${AUDIO_COUNT},
            "final_audio_bytes": ${TOTAL_BYTES}
          }
          EOF


          jq . work/manifest.json


          echo "::group::📊 GitHub Actions summary"

          {
            echo "# 🎵 Music Downloader"
            echo
            echo "## Run configuration"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Format | \`${{ inputs.output_format }}\` |"
            echo "| Quality | \`${{ inputs.audio_quality }}\` |"
            echo "| Upload | \`${{ inputs.upload_method }}\` |"
            echo "| Bundle | \`${{ inputs.bundle_all }}\` |"
            echo "| VPN | \`${{ inputs.vpn_enabled }}\` |"
            echo "| PO Token Provider | \`bgutil ${BGUTIL_VERSION}\` |"
            echo
            echo "## Result"
            echo
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| Requested URLs | ${TOTAL} |"
            echo "| Successful URLs | ${SUCCESS} |"
            echo "| Failed URLs | ${FAILED} |"
            echo "| Final audio files | ${AUDIO_COUNT} |"
            echo
            echo "## Toolchain"
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| spotDL | ${SPOTDL_VERSION} |"
            echo "| yt-dlp | ${YTDLP_VERSION} |"
            echo "| bgutil | ${BGUTIL_VERSION} |"
            echo "| Deno | ${DENO_VERSION} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"


          if [ "$FAILED" -gt 0 ]; then

            echo "### ❌ Failed URLs" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"

            echo '```text' >> "$GITHUB_STEP_SUMMARY"

            for failed_file in work/failed/*.tsv; do
              [ -f "$failed_file" ] || continue
              cat "$failed_file" >> "$GITHUB_STEP_SUMMARY"
            done

            echo '```' >> "$GITHUB_STEP_SUMMARY"

          else

            echo "### ✅ All requested URLs completed successfully." \
              >> "$GITHUB_STEP_SUMMARY"

          fi


          echo "::endgroup::"


          cp work/manifest.json music/manifest.json


      # ============================================================
      # PACKAGE
      # ============================================================

      - name: "📦 Package final files"
        id: archive
        env:
          BUNDLE_ALL: ${{ inputs.bundle_all }}
          UPLOAD_METHOD: ${{ inputs.upload_method }}
        run: |
          set -Eeuo pipefail

          rm -rf work/archive
          mkdir -p work/archive


          file_count="$(
            find music \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) \
              | wc -l
          )"


          if [ "$file_count" -eq 0 ]; then

            echo "⚠️ Nothing to package."

            echo "HAS_ASSETS=false" >> "$GITHUB_OUTPUT"
            exit 0

          fi


          mkdir -p work/package


          # Copy only audio files into package staging.
          find music \
            -maxdepth 1 \
            -type f \
            \( \
              -iname '*.mp3' \
              -o -iname '*.flac' \
              -o -iname '*.m4a' \
              -o -iname '*.ogg' \
              -o -iname '*.opus' \
              -o -iname '*.wav' \
            \) \
            -print0 |
          while IFS= read -r -d '' file; do
            cp --reflink=auto -p "$file" work/package/
          done


          if [ "$BUNDLE_ALL" = "true" ]; then

            RAND5="$(
              tr -dc 'a-z0-9' </dev/urandom |
              head -c 5
            )"

            ZIP_NAME="music-${RAND5}.zip"


            case "$UPLOAD_METHOD" in

              repo)

                echo "📦 Repository-safe split ZIP: 90 MiB"

                (
                  cd work/package
                  zip \
                    -0 \
                    -s 90m \
                    -r \
                    "../archive/${ZIP_NAME}" \
                    .
                )

                ;;


              release)

                echo "📦 Creating initial release ZIP."

                (
                  cd work/package
                  zip \
                    -0 \
                    -r \
                    "../archive/${ZIP_NAME}" \
                    .
                )


                ZIP_BYTES="$(
                  stat \
                    -c%s \
                    "work/archive/${ZIP_NAME}"
                )"


                # Keep release assets below GitHub's 2 GiB class limit
                # with some safety margin.
                if [ "$ZIP_BYTES" -gt 1900000000 ]; then

                  echo "⚠️ ZIP is too large for a single release asset."
                  echo "🔀 Recreating as 1900 MiB split archive."

                  rm -f "work/archive/${ZIP_NAME}"*

                  (
                    cd work/package
                    zip \
                      -0 \
                      -s 1900m \
                      -r \
                      "../archive/${ZIP_NAME}" \
                      .
                  )

                fi

                ;;


              drive)

                echo "📦 Creating unsplit Drive ZIP."

                (
                  cd work/package
                  zip \
                    -0 \
                    -r \
                    "../archive/${ZIP_NAME}" \
                    .
                )

                ;;

            esac


          else

            index=0

            while IFS= read -r -d '' file; do

              index=$((index + 1))

              base="$(basename "$file")"
              safe="$(
                printf '%s' "$base" |
                tr ' ' '_' |
                tr -cd '[:alnum:]_.-'
              )"


              RAND5="$(
                tr -dc 'a-z0-9' </dev/urandom |
                head -c 5
              )"


              ZIP_NAME="single-${index}-${safe}-${RAND5}.zip"


              case "$UPLOAD_METHOD" in

                repo)

                  (
                    cd "$(dirname "$file")"

                    zip \
                      -0 \
                      -s 90m \
                      "../../work/archive/${ZIP_NAME}" \
                      "$(basename "$file")"
                  )

                  ;;


                release)

                  (
                    cd "$(dirname "$file")"

                    zip \
                      -0 \
                      "../../work/archive/${ZIP_NAME}" \
                      "$(basename "$file")"
                  )


                  size="$(
                    stat \
                      -c%s \
                      "work/archive/${ZIP_NAME}"
                  )"


                  if [ "$size" -gt 1900000000 ]; then

                    rm -f "work/archive/${ZIP_NAME}"*

                    (
                      cd "$(dirname "$file")"

                      zip \
                        -0 \
                        -s 1900m \
                        "../../work/archive/${ZIP_NAME}" \
                        "$(basename "$file")"
                    )

                  fi

                  ;;


                drive)

                  (
                    cd "$(dirname "$file")"

                    zip \
                      -0 \
                      "../../work/archive/${ZIP_NAME}" \
                      "$(basename "$file")"
                  )

                  ;;

              esac

            done < <(
              find work/package \
                -maxdepth 1 \
                -type f \
                -print0 |
              sort -z
            )

          fi


          # Move packaged assets into music/.
          rm -f music/*.zip music/*.z01 music/*.z02 music/*.z03 \
                music/*.z04 music/*.z05 2>/dev/null || true


          find work/archive \
            -maxdepth 1 \
            -type f \
            -exec cp -p {} music/ \;


          # Checksums for all published assets.
          rm -f music/SHA256SUMS.txt

          (
            cd music

            find . \
              -maxdepth 1 \
              -type f \
              \( \
                -name '*.zip' \
                -o -name '*.z01' \
                -o -name '*.z02' \
                -o -name '*.z03' \
                -o -name '*.z04' \
                -o -name '*.z05' \
              \) \
              -print0 |
            sort -z |
            xargs -0 sha256sum
          ) > music/SHA256SUMS.txt


          cp music/SHA256SUMS.txt work/archive/SHA256SUMS.txt


          cp music/manifest.json work/archive/manifest.json


          ls -lh music/


          echo "HAS_ASSETS=true" >> "$GITHUB_OUTPUT"


      # ============================================================
      # UPLOAD DIAGNOSTICS AS GITHUB ARTIFACT
      # ============================================================

      - name: "📊 Upload diagnostics artifact"
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: "downloader-diagnostics-${{ github.run_number }}"
          path: |
            work/logs/
            work/results/
            work/failed/
            work/jobs.tsv
            work/input_urls.txt
            work/manifest.json
            music/manifest.json
            music/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6


      # ============================================================
      # DISCONNECT VPN BEFORE UPLOAD
      # ============================================================

      - name: "🔌 Disconnect VPN before uploads"
        if: steps.vpn.outputs.vpn_available == 'true'
        run: |
          set -Eeuo pipefail

          echo "🔌 Disconnecting WireGuard."

          sudo wg-quick down wg0 2>/dev/null || true


      # ============================================================
      # GOOGLE DRIVE
      # ============================================================

      - name: "☁️ Upload to Google Drive"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'drive'
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_NAME: github-actions
        run: |
          set -Eeuo pipefail


          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    ☁️ GOOGLE DRIVE UPLOAD                  ║"
          echo "╚══════════════════════════════════════════════════════════════╝"


          if [ -z "$CLIENT_ID" ] ||
             [ -z "$CLIENT_SECRET" ] ||
             [ -z "$REFRESH_TOKEN" ]; then

            echo "❌ Google Drive OAuth secrets are incomplete."
            exit 1

          fi


          # ==========================================================
          # ACCESS TOKEN
          # ==========================================================

          TOKEN_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --request POST \
              https://oauth2.googleapis.com/token \
              --data-urlencode "client_id=${CLIENT_ID}" \
              --data-urlencode "client_secret=${CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${REFRESH_TOKEN}" \
              --data-urlencode "grant_type=refresh_token"
          )"


          ACCESS_TOKEN="$(
            jq -r '.access_token // empty' <<< "$TOKEN_RESPONSE"
          )"


          if [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ Failed to obtain Google Drive access token."
            jq . <<< "$TOKEN_RESPONSE" || true
            exit 1
          fi


          echo "✅ Google Drive OAuth token acquired."


          # ==========================================================
          # FIND / CREATE FOLDER
          # ==========================================================

          FOLDER_QUERY="mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false"


          FOLDER_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --get \
              https://www.googleapis.com/drive/v3/files \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              --data-urlencode "q=${FOLDER_QUERY}" \
              --data-urlencode "fields=files(id,name)"
          )"


          FOLDER_ID="$(
            jq -r '.files[0].id // empty' <<< "$FOLDER_RESPONSE"
          )"


          if [ -z "$FOLDER_ID" ]; then

            echo "📁 Creating Drive folder: ${DRIVE_FOLDER_NAME}"


            BODY="$(
              jq -n \
                --arg name "$DRIVE_FOLDER_NAME" \
                '{
                  name: $name,
                  mimeType: "application/vnd.google-apps.folder"
                }'
            )"


            FOLDER_ID="$(
              curl \
                --silent \
                --show-error \
                --fail \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                --request POST \
                https://www.googleapis.com/drive/v3/files \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$BODY" \
                --data-urlencode "fields=id" |
              jq -r '.id // empty'
            )"

          fi


          if [ -z "$FOLDER_ID" ]; then
            echo "❌ Could not resolve/create Drive folder."
            exit 1
          fi


          echo "✅ Drive folder ready."


          # ==========================================================
          # RESUMABLE CHUNKED UPLOADER
          # ==========================================================

          drive_upload_file() {

            local file="$1"

            local fname
            fname="$(basename "$file")"

            local filesize
            filesize="$(stat -c%s "$file")"

            local session_uri=""
            local offset=0

            local chunk_size="$DRIVE_CHUNK_SIZE"

            local init_headers
            init_headers="$(mktemp)"


            initialize_session() {

              local metadata

              metadata="$(
                jq -n \
                  --arg name "$fname" \
                  --arg folder "$FOLDER_ID" \
                  '{
                    name: $name,
                    parents: [$folder]
                  }'
              )"


              rm -f "$init_headers"


              curl \
                --silent \
                --show-error \
                --request POST \
                -D "$init_headers" \
                -o /dev/null \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json; charset=UTF-8" \
                -H "X-Upload-Content-Type: application/zip" \
                -H "X-Upload-Content-Length: ${filesize}" \
                --data "$metadata" \
                "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id"


              session_uri="$(
                awk '
                  BEGIN { IGNORECASE=1 }
                  /^location:/ {
                    sub(/\r$/, "")
                    sub(/^[^:]*:[[:space:]]*/, "")
                    print
                    exit
                  }
                ' "$init_headers"
              )"


              if [ -z "$session_uri" ]; then
                echo "❌ Failed to initialize Drive resumable session."
                return 1
              fi

              return 0
            }


            if ! initialize_session; then
              return 1
            fi


            while [ "$offset" -lt "$filesize" ]; do

              local remaining
              remaining=$((filesize - offset))

              local chunk_length
              chunk_length="$chunk_size"

              if [ "$remaining" -lt "$chunk_length" ]; then
                chunk_length="$remaining"
              fi


              local chunk_end
              chunk_end=$((offset + chunk_length - 1))


              local chunk_file
              chunk_file="$(mktemp --suffix=.drivechunk)"


              dd \
                if="$file" \
                of="$chunk_file" \
                iflag=skip_bytes,count_bytes \
                skip="$offset" \
                count="$chunk_length" \
                status=none


              local uploaded="false"


              for attempt in 1 2 3 4 5; do

                local http_code

                http_code="$(
                  curl \
                    --silent \
                    --show-error \
                    --output /tmp/drive-chunk-response.txt \
                    --write-out '%{http_code}' \
                    --request PUT \
                    -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                    -H "Content-Type: application/octet-stream" \
                    -H "Content-Length: ${chunk_length}" \
                    -H "Content-Range: bytes ${offset}-${chunk_end}/${filesize}" \
                    --data-binary "@${chunk_file}" \
                    "$session_uri"
                )"


                case "$http_code" in

                  200|201)

                    offset=$filesize
                    uploaded="true"
                    ;;


                  308)

                    next_range="$(
                      grep -i '^Range:' \
                        /tmp/drive-chunk-response.txt \
                        2>/dev/null \
                        | tail -n1 \
                        | sed -E 's/.*bytes=0-([0-9]+).*/\1/I'
                    )"


                    if [[ "$next_range" =~ ^[0-9]+$ ]]; then
                      offset=$((next_range + 1))
                    else
                      offset=$((chunk_end + 1))
                    fi

                    uploaded="true"
                    ;;


                  429|500|502|503|504)

                    delay=$((2 ** attempt))

                    if [ "$delay" -gt 30 ]; then
                      delay=30
                    fi

                    echo \
                      "⚠️ Drive HTTP ${http_code}; retrying chunk in ${delay}s."

                    sleep "$delay"
                    ;;


                  404|410)

                    echo "⚠️ Drive upload session expired. Reinitializing."

                    if ! initialize_session; then
                      rm -f "$chunk_file"
                      return 1
                    fi

                    ;;


                  *)

                    echo \
                      "❌ Drive upload failed: HTTP ${http_code}"

                    cat /tmp/drive-chunk-response.txt 2>/dev/null || true

                    rm -f "$chunk_file"
                    return 1
                    ;;

                esac


                if [ "$offset" -ge "$filesize" ]; then
                  break
                fi

                if [ "$uploaded" = "true" ]; then
                  break
                fi

              done


              rm -f "$chunk_file"


              if [ "$offset" -lt "$filesize" ] &&
                 [ "$uploaded" != "true" ]; then

                echo "❌ Failed to upload chunk permanently."
                return 1

              fi


              percent=$((offset * 100 / filesize))

              printf \
                '   %s: %3d%% (%s / %s)\n' \
                "$fname" \
                "$percent" \
                "$offset" \
                "$filesize"

            done


            rm -f "$init_headers"

            echo "✅ Uploaded: $fname"

            return 0
          }


          # ==========================================================
          # UPLOAD FILES
          # ==========================================================

          for file in music/*; do

            [ -f "$file" ] || continue

            case "$(basename "$file")" in
              manifest.json|SHA256SUMS.txt)
                ;;
              *)
                drive_upload_file "$file"
                ;;
            esac

          done


          # Upload manifest/checksum files separately.
          for file in music/manifest.json music/SHA256SUMS.txt; do

            [ -f "$file" ] || continue

            drive_upload_file "$file"

          done


          echo
          echo "✅ Google Drive upload completed."


      # ============================================================
      # REPOSITORY UPLOAD
      # ============================================================

      - name: "📤 Commit packaged files to repository"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'repo'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail


          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add music/


          if git diff --cached --quiet; then
            echo "ℹ️ Nothing new to commit."
            exit 0
          fi


          git commit \
            -m "Add music downloader output [skip ci]"


          for attempt in 1 2 3 4 5; do

            echo "🚀 Repository push attempt ${attempt}/5"

            if git pull \
              --rebase \
              --autostash \
              origin "$BRANCH"; then

              if git push origin "$BRANCH"; then
                echo "✅ Repository upload complete."
                exit 0
              fi

            fi


            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 3))
            fi

          done


          echo "❌ Repository push failed."
          exit 1


      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: "🏷️ Create GitHub Release"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail


          RAND5="$(
            tr -dc 'a-z0-9' </dev/urandom |
            head -c 5
          )"


          TAG="music-${RAND5}"


          echo "🏷️ Creating release: $TAG"


          TOTAL="$(
            jq -s 'length' work/results/*.json 2>/dev/null ||
            echo 0
          )"


          SUCCESS="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json 2>/dev/null ||
            echo 0
          )"


          FAILED="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json 2>/dev/null ||
            echo 0
          )


          cat > work/release-notes.md <<EOF
          # 🎵 Music Downloader

          ## Download

          - Requested URLs: ${TOTAL}
          - Successful URLs: ${SUCCESS}
          - Failed URLs: ${FAILED}
          - Format: ${{ inputs.output_format }}
          - Quality: ${{ inputs.audio_quality }}
          - VPN: ${{ inputs.vpn_enabled }}
          - PO-token provider: bgutil ${BGUTIL_VERSION}

          ## Toolchain

          - spotDL: ${SPOTDL_VERSION}
          - yt-dlp: ${YTDLP_VERSION}
          - bgutil: ${BGUTIL_VERSION}
          - Deno: ${DENO_VERSION}

          Generated automatically by GitHub Actions.
          EOF


          mapfile -t assets < <(
            find music \
              -maxdepth 1 \
              -type f \
              -print0 |
            xargs -0 -n1 printf '%s\n' |
            sort
          )


          if [ "${#assets[@]}" -eq 0 ]; then
            echo "❌ No release assets found."
            exit 1
          fi


          gh release create \
            "$TAG" \
            "${assets[@]}" \
            --title "Music Downloader ${RAND5}" \
            --notes-file work/release-notes.md \
            --target "${GITHUB_SHA}"


          echo "✅ Release created successfully."


      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: "✅ Final status"
        if: always()
        env:
          FAIL_ON_PARTIAL: ${{ inputs.fail_on_partial }}
        run: |
          set -Eeuo pipefail


          TOTAL="$(
            jq -s 'length' work/results/*.json 2>/dev/null ||
            echo 0
          )"


          SUCCESS="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json 2>/dev/null ||
            echo 0
          )


          FAILED="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json 2>/dev/null ||
            echo 0
          )


          AUDIO_COUNT="$(
            find music \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) \
              | wc -l
          )"


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                       🎵 FINAL RESULT                       ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf '║ Requested URLs : %-40s ║\n' "$TOTAL"
          printf '║ Successful     : %-40s ║\n' "$SUCCESS"
          printf '║ Failed         : %-40s ║\n' "$FAILED"
          printf '║ Audio files    : %-40s ║\n' "$AUDIO_COUNT"
          printf '║ Format         : %-40s ║\n' "${{ inputs.output_format }}"
          printf '║ Quality        : %-40s ║\n' "${{ inputs.audio_quality }}"
          printf '║ VPN            : %-40s ║\n' "${{ inputs.vpn_enabled }}"
          printf '║ PO Provider    : %-40s ║\n' "bgutil ${BGUTIL_VERSION}"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo


          if [ "$FAILED" -eq 0 ]; then

            echo "✅ All requested URLs completed successfully."
            exit 0

          fi


          if [ "$SUCCESS" -eq 0 ]; then

            echo "❌ No requested URL completed successfully."
            exit 1

          fi


          if [ "$FAIL_ON_PARTIAL" = "true" ]; then

            echo "⚠️ Partial completion detected."
            echo "❌ fail_on_partial=true → workflow will fail."

            exit 1

          fi


          echo "⚠️ Partial completion detected."
          echo "✅ fail_on_partial=false → workflow remains successful."


      # ============================================================
      # CLEANUP
      # ============================================================

      - name: "🧹 Cleanup"
        if: always()
        run: |
          set +e


          echo "🧹 Cleaning temporary resources..."


          docker rm -f bgutil-provider >/dev/null 2>&1 || true


          sudo wg-quick down wg0 >/dev/null 2>&1 || true


          rm -f \
            /tmp/wg0.conf \
            /tmp/youtube-cookies.txt \
            /tmp/youtube-music-cookies.txt \
            /tmp/drive-chunk-response.txt \
            /tmp/ffprobe.json \
            /tmp/ffprobe-final.json


          find /tmp \
            -maxdepth 1 \
            -name '*.drivechunk' \
            -delete \
            2>/dev/null || true


          echo "✅ Cleanup finished."
