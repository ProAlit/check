name: downloader-spotify

on:
  workflow_dispatch:
    inputs:
      urls:
        description: >
          🎵 Enter Spotify/Tidal/Apple/SoundCloud/YouTube URLs
          (comma, space, or newline separated)
        required: true
        type: string

      output_format:
        description: "🎧 Output Format"
        required: true
        type: choice
        options:
          - mp3
          - flac
          - m4a
          - ogg
          - opus
          - wav
        default: mp3

      audio_quality:
        description: "🎚️ Audio Quality / Bitrate"
        required: true
        type: choice
        options:
          - 320k
          - 256k
          - 192k
          - 128k
          - LOSSLESS
          - HI_RES_LOSSLESS
          - HIGH
          - LOW
        default: 320k

      upload_method:
        description: "☁️ Upload destination"
        required: true
        type: choice
        options:
          - drive
          - repo
          - release
        default: drive

      bundle_all:
        description: "📦 Bundle all tracks into one ZIP?"
        required: true
        type: boolean
        default: true

      vpn_enabled:
        description: "🔒 Route downloads through WireGuard VPN?"
        required: true
        type: boolean
        default: false

      use_custom_credentials:
        description: >
          🔑 Use custom Spotify Developer credentials?
          Requires SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET
        required: true
        type: boolean
        default: false

      concurrent_downloads:
        description: "⚡ Concurrent URL workers"
        required: true
        type: number
        default: 2

      retry_count:
        description: "🔄 Download attempts per URL"
        required: true
        type: number
        default: 3

      raw_logs:
        description: >
          🧪 Show raw spotDL/yt-dlp output live?
          OFF = clean visual logs
          ON = verbose raw logs
        required: true
        type: boolean
        default: false

      fail_on_partial:
        description: "❌ Fail workflow if any URL fails?"
        required: true
        type: boolean
        default: true


permissions:
  contents: write


concurrency:
  group: music-downloader-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false


env:
  POT_SERVER_PORT: "4416"

  DEFAULT_PARALLEL: "2"
  DEFAULT_RETRIES: "3"

  SPOTDL_THREADS: "3"

  YTDLP_RETRIES: "8"
  YTDLP_FRAGMENT_RETRIES: "8"
  YTDLP_EXTRACTOR_RETRIES: "5"
  YTDLP_FILE_ACCESS_RETRIES: "5"
  YTDLP_SOCKET_TIMEOUT: "30"
  YTDLP_CONCURRENT_FRAGMENTS: "3"

  DRIVE_CHUNK_SIZE: "16777216"


jobs:

  music-download:

    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: bash


    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: "🐍 Setup latest Python 3.x"
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true


      # ============================================================
      # 3. SYSTEM DEPENDENCIES
      # ============================================================

      - name: "🛠️ Install system dependencies"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail

          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  🛠️ SYSTEM SETUP                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo

          echo "📦 Updating apt repositories..."

          for attempt in 1 2 3; do
            if sudo apt-get \
              -o Acquire::ForceIPv4=true \
              update \
              -qq; then
              break
            fi

            echo "⚠️ apt update failed (${attempt}/3)"

            if [ "$attempt" -eq 3 ]; then
              echo "❌ apt update failed permanently."
              exit 1
            fi

            sleep $((attempt * 3))
          done


          echo "📦 Installing dependencies..."

          sudo apt-get \
            -o Acquire::ForceIPv4=true \
            install \
            -y \
            -qq \
            ffmpeg \
            curl \
            jq \
            zip \
            unzip \
            aria2 \
            wireguard-tools


          echo "✅ System dependencies installed."


      # ============================================================
      # 4. DNS / RESOLVCONF COMPATIBILITY
      # ============================================================

      - name: "🌐 Configure DNS compatibility"
        run: |
          set -Eeuo pipefail

          echo "::group::🌐 DNS compatibility"


          if command -v resolvconf >/dev/null 2>&1; then

            echo "✅ resolvconf already available:"
            command -v resolvconf

          elif command -v resolvectl >/dev/null 2>&1; then

            echo "ℹ️ resolvconf not available."
            echo "✅ resolvectl detected."
            echo "🛠️ Installing compatibility wrapper."


            sudo tee /usr/local/bin/resolvconf >/dev/null <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          action="${1:-}"

          case "$action" in

            -a)

              interface="${2:-}"

              shift 2 || true

              nameservers=()

              while IFS= read -r line; do

                case "$line" in

                  nameserver\ *)
                    nameservers+=("${line#nameserver }")
                    ;;

                esac

              done


              if [ -n "$interface" ] &&
                 [ "${#nameservers[@]}" -gt 0 ]; then

                resolvectl \
                  dns \
                  "$interface" \
                  "${nameservers[@]}" \
                  >/dev/null 2>&1 \
                  || true


                resolvectl \
                  domain \
                  "$interface" \
                  "~." \
                  >/dev/null 2>&1 \
                  || true

              fi

              ;;


            -d)

              interface="${2:-}"

              if [ -n "$interface" ]; then

                resolvectl \
                  revert \
                  "$interface" \
                  >/dev/null 2>&1 \
                  || true

              fi

              ;;


            *)

              exit 0

              ;;

          esac
          EOF


            sudo chmod 755 /usr/local/bin/resolvconf

            echo "✅ Compatibility wrapper installed."

          else

            echo "⚠️ Neither resolvconf nor resolvectl available."

          fi


          echo "::endgroup::"


      # ============================================================
      # 5. DENO
      # ============================================================

      - name: "🦕 Install latest Deno"
        run: |
          set -Eeuo pipefail

          echo "::group::🦕 Deno"


          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            https://deno.land/install.sh \
            | sh -s -- -y


          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.deno/bin:$PATH"


          echo "✅ Deno:"
          deno --version


          echo "::endgroup::"


      # ============================================================
      # 6. LATEST PYTHON PACKAGES
      # ============================================================

      - name: "📦 Install latest Python packages"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -Eeuo pipefail

          echo "::group::⬆️ pip"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            pip \
            setuptools \
            wheel

          echo "::endgroup::"


          echo "::group::🎵 spotDL"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            spotdl

          echo "::endgroup::"


          echo "::group::📺 yt-dlp"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            "yt-dlp[default]"

          echo "::endgroup::"


          echo "::group::🧩 yt-dlp EJS"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            yt-dlp-ejs

          echo "::endgroup::"


          echo "::group::🛡️ bgutil PO-token plugin"

          python -m pip install \
            --upgrade \
            --retries 5 \
            --timeout 60 \
            bgutil-ytdlp-pot-provider

          echo "::endgroup::"


      # ============================================================
      # 7. TOOLCHAIN DIAGNOSTICS
      # ============================================================

      - name: "🔎 Toolchain diagnostics"
        run: |
          set -Eeuo pipefail

          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                    🔎 TOOLCHAIN                            ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo

          echo "🐍 Python"
          python --version

          echo
          echo "🎵 spotDL"
          spotdl --version || true

          echo
          echo "📺 yt-dlp"
          yt-dlp --version

          echo
          echo "🦕 Deno"
          deno --version | head -n1

          echo
          echo "🎬 FFmpeg"
          ffmpeg -version | head -n1

          echo
          echo "🔬 FFprobe"
          ffprobe -version | head -n1

          echo
          echo "⬇️ aria2"
          aria2c --version | head -n1

          echo
          echo "📦 Relevant Python packages"

          python -m pip list |
            grep -Ei \
              'spotdl|yt-dlp|bgutil|ejs|spotipy|mutagen|rapidfuzz' \
            || true

          echo
          echo "╚══════════════════════════════════════════════════════════════╝"


      # ============================================================
      # 8. WORKSPACE
      # ============================================================

      - name: "📁 Initialize workspace"
        run: |
          set -Eeuo pipefail

          rm -rf \
            work \
            music

          mkdir -p \
            work/downloads \
            work/logs \
            work/results \
            work/failed \
            work/archive \
            work/package \
            music

          echo "✅ Workspace initialized."


      # ============================================================
      # 9. INPUT PARSING
      # ============================================================

      - name: "🔗 Parse and validate URLs"
        id: parse
        env:
          RAW_URLS: ${{ inputs.urls }}
        run: |
          set -Eeuo pipefail


          echo "::group::🔗 Input parsing"


          : > work/input_urls.txt
          : > work/jobs.tsv


          printf '%s\n' "$RAW_URLS" |
            tr ',' '\n' |
            sed 's/\r//g' |
            awk '
              {
                for (i = 1; i <= NF; i++) {
                  print $i
                }
              }
            ' |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
            awk 'NF' |
            sort -u \
            > work/input_urls.txt


          if [ ! -s work/input_urls.txt ]; then
            echo "❌ No URLs provided."
            exit 1
          fi


          index=0


          while IFS= read -r url; do

            index=$((index + 1))


            if [[ "$url" =~ ^https?://(open\.)?spotify\.com/ ]]; then

              type="spotify"


            elif [[ "$url" =~ ^https?://(www\.)?youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://music\.youtube\.com/ ]] ||
                 [[ "$url" =~ ^https?://youtu\.be/ ]]; then

              type="youtube"


            elif [[ "$url" =~ ^https?://(www\.)?soundcloud\.com/ ]]; then

              type="soundcloud"


            elif [[ "$url" =~ ^https?://(www\.)?tidal\.com/ ]] ||
                 [[ "$url" =~ ^https?://listen\.tidal\.com/ ]]; then

              type="tidal"


            elif [[ "$url" =~ ^https?://(www\.)?music\.apple\.com/ ]]; then

              type="apple"


            elif [[ "$url" =~ ^https?://(www\.)?pandora\.com/ ]] ||
                 [[ "$url" =~ ^https?://pandora\.app\.link/ ]]; then

              type="pandora"


            else

              echo "⚠️ Unsupported URL skipped: $url"

              continue

            fi


            printf \
              '%04d\t%s\t%s\n' \
              "$index" \
              "$type" \
              "$url" \
              >> work/jobs.tsv

          done < work/input_urls.txt


          if [ ! -s work/jobs.tsv ]; then
            echo "❌ No supported URLs found."
            exit 1
          fi


          total="$(wc -l < work/jobs.tsv)"


          echo "INPUT_COUNT=$total" >> "$GITHUB_OUTPUT"


          echo
          echo "✅ Accepted URLs: $total"
          echo


          while IFS=$'\t' read -r id type url; do

            printf \
              '  #%s | %-10s | %s\n' \
              "$id" \
              "$type" \
              "$url"

          done < work/jobs.tsv


          echo "::endgroup::"


      # ============================================================
      # 10. WIREGUARD
      # ============================================================

      - name: "🔒 Configure WireGuard"
        id: vpn
        env:
          VPN_ENABLED_INPUT: ${{ inputs.vpn_enabled }}
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          set -Eeuo pipefail


          echo "::group::🔒 WireGuard"


          if [ "$VPN_ENABLED_INPUT" != "true" ]; then

            echo "🚫 VPN disabled by user."

            echo "vpn_available=false" >> "$GITHUB_OUTPUT"

            echo "::endgroup::"

            exit 0

          fi


          if [ -z "$WG_CONFIG" ]; then

            echo "⚠️ VPN requested but WG_CONFIG is empty."

            echo "vpn_available=false" >> "$GITHUB_OUTPUT"

            echo "::endgroup::"

            exit 0

          fi


          umask 077


          printf '%s\n' "$WG_CONFIG" \
            > /tmp/wg0.conf


          sudo install \
            -m 600 \
            /tmp/wg0.conf \
            /etc/wireguard/wg0.conf


          echo "🚀 Starting WireGuard..."


          if sudo wg-quick up wg0; then

            echo "✅ WireGuard connected."


            public_ip="$(
              curl \
                -4 \
                --silent \
                --show-error \
                --max-time 15 \
                https://api.ipify.org \
              || echo "unavailable"
            )"


            echo "🌐 Public IPv4: $public_ip"

            echo "vpn_available=true" >> "$GITHUB_OUTPUT"

          else

            echo "❌ WireGuard failed."

            sudo wg-quick down wg0 \
              >/dev/null 2>&1 \
              || true


            echo "vpn_available=false" >> "$GITHUB_OUTPUT"

          fi


          echo "::endgroup::"


      # ============================================================
      # 11. BGUTIL PO TOKEN SERVER
      # ============================================================

      - name: "🛡️ Start bgutil PO-token provider"
        id: pot
        run: |
          set -Eeuo pipefail


          echo "::group::🛡️ bgutil PO-token provider"


          image="brainicism/bgutil-ytdlp-pot-provider:latest"


          echo "🐳 Image: $image"


          pulled="false"


          for attempt in 1 2 3; do

            if docker pull "$image"; then

              pulled="true"

              break

            fi


            echo "⚠️ Docker pull failed (${attempt}/3)"


            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 3))
            fi

          done


          if [ "$pulled" != "true" ]; then

            echo "⚠️ bgutil image could not be pulled."

            echo "pot_available=false" >> "$GITHUB_OUTPUT"

            echo "::endgroup::"

            exit 0

          fi


          docker rm -f bgutil-provider \
            >/dev/null 2>&1 \
            || true


          echo "🚀 Starting bgutil..."


          docker run \
            --name bgutil-provider \
            --detach \
            --init \
            --network host \
            "$image"


          echo "⏳ Waiting for provider..."


          ready="false"


          for attempt in $(seq 1 40); do

            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 3 \
              "http://127.0.0.1:${POT_SERVER_PORT}/ping" \
              >/tmp/bgutil-ping.json \
              2>/dev/null; then

              ready="true"

              break

            fi


            sleep 2

          done


          if [ "$ready" = "true" ]; then

            echo "✅ bgutil PO-token provider ready."

            echo "pot_available=true" >> "$GITHUB_OUTPUT"

          else

            echo "⚠️ bgutil health check failed."

            docker logs bgutil-provider \
              > work/logs/bgutil-provider.log \
              2>&1 \
              || true

            echo "pot_available=false" >> "$GITHUB_OUTPUT"

          fi


          echo "::endgroup::"


      # ============================================================
      # 12. PO TOKEN VERIFICATION
      # ============================================================

      - name: "🧪 Verify bgutil integration"
        if: steps.pot.outputs.pot_available == 'true'
        continue-on-error: true
        env:
          RAW_LOGS_INPUT: ${{ inputs.raw_logs }}
        run: |
          set -Eeuo pipefail


          echo "::group::🧪 PO-token integration test"


          test_url="https://www.youtube.com/watch?v=BaW_jenozKc"


          yt-dlp \
            --verbose \
            --simulate \
            --skip-download \
            --extractor-args "youtube:player-client=mweb" \
            --extractor-args \
              "youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}" \
            "$test_url" \
            > work/logs/pot-verification.log \
            2>&1 \
            || true


          echo
          echo "🛡️ PO-token diagnostics:"


          grep -iE \
            'PO Token|bgutil|player-client|challenge' \
            work/logs/pot-verification.log \
            | tail -n 100 \
            || true


          echo "::endgroup::"


      # ============================================================
      # 13. MEDIA DOWNLOAD
      # ============================================================

      - name: "⬇️ Download media"
        id: download
        env:
          RAW_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          RAW_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

          YOUTUBE_COOKIES_INPUT: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_MUSIC_COOKIES_INPUT: ${{ secrets.YOUTUBE_MUSIC_COOKIES }}

          USE_CUSTOM_CREDENTIALS_INPUT: ${{ inputs.use_custom_credentials }}

          OUTPUT_FORMAT_INPUT: ${{ inputs.output_format }}
          AUDIO_QUALITY_INPUT: ${{ inputs.audio_quality }}

          PARALLEL_INPUT: ${{ inputs.concurrent_downloads }}
          RETRIES_INPUT: ${{ inputs.retry_count }}

          SHOW_RAW_LOGS_INPUT: ${{ inputs.raw_logs }}

          VPN_AVAILABLE: ${{ steps.vpn.outputs.vpn_available }}
          POT_AVAILABLE: ${{ steps.pot.outputs.pot_available }}

        run: |
          set -Eeuo pipefail


          # ==========================================================
          # INPUT NORMALIZATION
          # ==========================================================

          FORMAT="$OUTPUT_FORMAT_INPUT"
          QUALITY="$AUDIO_QUALITY_INPUT"

          PARALLEL="$PARALLEL_INPUT"
          MAX_RETRIES="$RETRIES_INPUT"

          SHOW_RAW_LOGS="$SHOW_RAW_LOGS_INPUT"


          if ! [[ "$PARALLEL" =~ ^[1-8]$ ]]; then
            PARALLEL="$DEFAULT_PARALLEL"
          fi


          if ! [[ "$MAX_RETRIES" =~ ^[1-6]$ ]]; then
            MAX_RETRIES="$DEFAULT_RETRIES"
          fi


          # ==========================================================
          # BITRATE
          # ==========================================================

          case "$QUALITY" in

            320k|256k|192k|128k)
              BITRATE="$QUALITY"
              ;;

            HIGH)
              BITRATE="320k"
              ;;

            LOW)
              BITRATE="128k"
              ;;

            LOSSLESS|HI_RES_LOSSLESS)

              case "$FORMAT" in
                flac|m4a|opus|wav)
                  BITRATE="disable"
                  ;;

                *)
                  BITRATE="320k"
                  ;;
              esac

              ;;

            *)
              BITRATE="320k"
              ;;

          esac


          # ==========================================================
          # COOKIE FILES
          # ==========================================================

          COOKIE_YT=""
          COOKIE_YTM=""


          if [ -n "$YOUTUBE_COOKIES_INPUT" ]; then

            printf '%s\n' "$YOUTUBE_COOKIES_INPUT" \
              > /tmp/youtube-cookies.txt

            chmod 600 /tmp/youtube-cookies.txt

            COOKIE_YT="/tmp/youtube-cookies.txt"

          fi


          if [ -n "$YOUTUBE_MUSIC_COOKIES_INPUT" ]; then

            printf '%s\n' "$YOUTUBE_MUSIC_COOKIES_INPUT" \
              > /tmp/youtube-music-cookies.txt

            chmod 600 /tmp/youtube-music-cookies.txt

            COOKIE_YTM="/tmp/youtube-music-cookies.txt"

          fi


          # ==========================================================
          # VISUAL LOGGING
          # ==========================================================

          now() {
            date '+%H:%M:%S'
          }


          log() {

            local level="$1"
            local id="$2"
            local message="$3"

            local icon="•"


            case "$level" in

              START)
                icon="▶"
                ;;

              SEARCH)
                icon="🔎"
                ;;

              AUTH)
                icon="🔐"
                ;;

              PROVIDER)
                icon="🔌"
                ;;

              RETRY)
                icon="↻"
                ;;

              DOWNLOAD)
                icon="⬇"
                ;;

              VERIFY)
                icon="✓"
                ;;

              SUCCESS)
                icon="✅"
                ;;

              WARN)
                icon="⚠"
                ;;

              ERROR)
                icon="✖"
                ;;

              FAILED)
                icon="❌"
                ;;

              DONE)
                icon="◆"
                ;;

            esac


            printf \
              '[%s] %-9s #%04d │ %s %s\n' \
              "$(now)" \
              "$level" \
              "$id" \
              "$icon" \
              "$message"
          }


          section() {

            local title="$1"

            echo
            echo "╭──────────────────────────────────────────────────────────────╮"
            printf '│ %-60s │\n' "$title"
            echo "╰──────────────────────────────────────────────────────────────╯"
            echo

          }


          # ==========================================================
          # AUDIO FILE CHECK
          # ==========================================================

          has_audio_file() {

            local dir="$1"


            find "$dir" \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
                -o -iname '*.webm' \
                -o -iname '*.aac' \
              \) |
              grep -q .

          }


          # ==========================================================
          # ERROR CLASSIFIER
          # ==========================================================

          classify_error() {

            local logfile="$1"


            # Configuration errors: NEVER retry.
            if grep -qiE \
              'invalid choice:|unrecognized arguments|no such option|usage: spotdl|argument .* error' \
              "$logfile"; then

              echo "CONFIGURATION"

              return

            fi


            # Explicit no-match/provider result:
            # THIS IS RETRYABLE.
            if grep -qiE \
              'no usable provider result|no provider result|no results found|returned no usable results|could not find|unable to find|no matches|no match|failed to resolve' \
              "$logfile"; then

              echo "PROVIDER"

              return

            fi


            if grep -qiE \
              'HTTP Error 429|HTTP 429|Too Many Requests|rate.?limit' \
              "$logfile"; then

              echo "RATE_LIMIT"

              return

            fi


            if grep -qiE \
              'Sign in to confirm|not a bot|confirm you.re not a bot|bot detection|captcha' \
              "$logfile"; then

              echo "BOT"

              return

            fi


            if grep -qiE \
              'HTTP Error 403|HTTP 403|Forbidden' \
              "$logfile"; then

              echo "FORBIDDEN"

              return

            fi


            if grep -qiE \
              'timed out|timeout|Connection reset|Connection aborted|Temporary failure in name resolution|Could not resolve|network error' \
              "$logfile"; then

              echo "NETWORK"

              return

            fi


            if grep -qiE \
              'Requested format is not available|No video formats found|No formats found' \
              "$logfile"; then

              echo "FORMAT"

              return

            fi


            echo "UNKNOWN"
          }


          # ==========================================================
          # RAW LOG DISPLAY
          # ==========================================================

          show_last_log() {

            local logfile="$1"
            local id="$2"
            local title="$3"


            if [ ! -f "$logfile" ]; then
              return 0
            fi


            echo
            echo "┌─ ${title} | TRACK #$(printf '%04d' "$id") ─────────────────"


            tail -n 40 "$logfile" || true


            echo "└──────────────────────────────────────────────────────────────"
            echo

          }


          # ==========================================================
          # PROVIDER DETECTION
          #
          # We do NOT hard-code slider-kz or any provider as mandatory.
          # We use what the installed spotDL executable actually
          # exposes.
          # ==========================================================

          detect_providers() {

            local help_text


            help_text="$(
              spotdl --help 2>&1
            )"


            SPOTDL_PROVIDERS=""


            local candidates=(
              youtube-music
              youtube
              soundcloud
              bandcamp
              piped
              slider-kz
            )


            local candidate


            for candidate in "${candidates[@]}"; do

              if grep \
                -Fq \
                "$candidate" \
                <<< "$help_text"; then

                if [ -z "$SPOTDL_PROVIDERS" ]; then

                  SPOTDL_PROVIDERS="$candidate"

                else

                  SPOTDL_PROVIDERS="${SPOTDL_PROVIDERS} ${candidate}"

                fi

              fi

            done


            if [ -z "$SPOTDL_PROVIDERS" ]; then

              echo "❌ Could not detect supported spotDL providers."
              echo
              echo "$help_text"

              return 1

            fi


            section "🎵 SPOTDL PROVIDER CAPABILITIES"


            printf \
              '  ✓ %s\n' \
              $SPOTDL_PROVIDERS

          }


          detect_providers


          # ==========================================================
          # PROVIDER ROTATION
          #
          # Attempt 1:
          #   youtube-music → youtube → soundcloud → ...
          #
          # Attempt 2:
          #   youtube → youtube-music → soundcloud → ...
          #
          # Attempt 3:
          #   piped/bandcamp/... → youtube-music → youtube → ...
          #
          # Thus a retry is not merely the exact same request.
          # ==========================================================

          provider_array=()

          read -r -a provider_array <<< "$SPOTDL_PROVIDERS"


          rotate_providers() {

            local rotation="$1"


            local count="${#provider_array[@]}"


            if [ "$count" -eq 0 ]; then
              return 1
            fi


            local -a rotated=()


            local i

            for ((i = 0; i < count; i++)); do

              local position=$(( (rotation + i) % count ))

              rotated+=("${provider_array[$position]}")

            done


            printf '%s\n' "${rotated[*]}"
          }


          # ==========================================================
          # SPOTDL DOWNLOAD
          # ==========================================================

          download_spotdl() {

            local id="$1"
            local type="$2"
            local url="$3"


            local dir="work/downloads/${id}"


            mkdir -p \
              "$dir/cache"


            local main_log="work/logs/${id}-spotdl.log"


            local attempt=1


            while [ "$attempt" -le "$MAX_RETRIES" ]; do


              # ------------------------------------------------------
              # Rotate provider order.
              # ------------------------------------------------------

              local rotation=$((attempt - 1))


              local provider_chain


              provider_chain="$(
                rotate_providers "$rotation"
              )"


              log \
                "PROVIDER" \
                "$id" \
                "Strategy ${attempt}: ${provider_chain}"


              # ------------------------------------------------------
              # Split provider chain into array.
              # ------------------------------------------------------

              local -a selected_providers


              read -r -a selected_providers <<< "$provider_chain"


              # ------------------------------------------------------
              # Build command.
              # ------------------------------------------------------

              local -a cmd


              cmd=(
                spotdl
                download
                "$url"

                --audio
                "${selected_providers[@]}"

                --format
                "$FORMAT"

                --bitrate
                "$BITRATE"

                --output
                "${dir}/{track-number} - {artists} - {title}.{output-ext}"

                --threads
                "$SPOTDL_THREADS"

                --max-retries
                3

                --overwrite
                skip

                --restrict
                none

                --max-filename-length
                180

                --print-errors

                --log-level
                INFO

                --cache-path
                "${dir}/cache"

                --archive
                "${dir}/archive.txt"
              )


              # ------------------------------------------------------
              # Raw mode.
              # ------------------------------------------------------

              if [ "$SHOW_RAW_LOGS" = "true" ]; then

                cmd+=(
                  --log-level
                  DEBUG
                )

              fi


              # ------------------------------------------------------
              # Spotify credentials.
              # ------------------------------------------------------

              if [ "$USE_CUSTOM_CREDENTIALS_INPUT" = "true" ] &&
                 [ -n "$RAW_CLIENT_ID" ] &&
                 [ -n "$RAW_CLIENT_SECRET" ]; then

                export SPOTIPY_CLIENT_ID="$RAW_CLIENT_ID"
                export SPOTIPY_CLIENT_SECRET="$RAW_CLIENT_SECRET"


                log \
                  "AUTH" \
                  "$id" \
                  "Custom Spotify credentials enabled."

              else

                unset SPOTIPY_CLIENT_ID
                unset SPOTIPY_CLIENT_SECRET


                log \
                  "AUTH" \
                  "$id" \
                  "Using spotDL default Spotify client."

              fi


              # ------------------------------------------------------
              # Cookies.
              # ------------------------------------------------------

              if [ -n "$COOKIE_YTM" ]; then

                cmd+=(
                  --cookie-file
                  "$COOKIE_YTM"
                )


                log \
                  "AUTH" \
                  "$id" \
                  "YouTube Music cookies enabled."

              elif [ -n "$COOKIE_YT" ]; then

                cmd+=(
                  --cookie-file
                  "$COOKIE_YT"
                )


                log \
                  "AUTH" \
                  "$id" \
                  "YouTube cookies enabled."

              fi


              # ------------------------------------------------------
              # yt-dlp arguments.
              #
              # bgutil uses its default localhost:4416 endpoint.
              # ------------------------------------------------------

              local ytdlp_args


              ytdlp_args="
              --retries ${YTDLP_RETRIES}
              --fragment-retries ${YTDLP_FRAGMENT_RETRIES}
              --extractor-retries ${YTDLP_EXTRACTOR_RETRIES}
              --file-access-retries ${YTDLP_FILE_ACCESS_RETRIES}
              --socket-timeout ${YTDLP_SOCKET_TIMEOUT}
              --concurrent-fragments ${YTDLP_CONCURRENT_FRAGMENTS}
              --throttled-rate 100K
              --sleep-requests 1
              --extractor-args youtube:player-client=mweb
              --extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}
              "


              if [ "$SHOW_RAW_LOGS" = "true" ]; then

                ytdlp_args="${ytdlp_args} --verbose"

              fi


              cmd+=(
                --yt-dlp-args
                "$ytdlp_args"
              )


              # ------------------------------------------------------
              # Run.
              # ------------------------------------------------------

              local attempt_log

              attempt_log="work/logs/${id}-spotdl-attempt-${attempt}.log"


              log \
                "START" \
                "$id" \
                "Attempt ${attempt}/${MAX_RETRIES}"


              local exit_code=0


              if [ "$SHOW_RAW_LOGS" = "true" ]; then

                set +e


                stdbuf \
                  -oL \
                  -eL \
                  timeout 900 \
                  "${cmd[@]}" \
                  2>&1 |
                tee "$attempt_log" |
                while IFS= read -r line; do

                  printf \
                    '[%s] RAW       #%04d │ %s\n' \
                    "$(now)" \
                    "$id" \
                    "$line"

                done


                exit_code="${PIPESTATUS[0]}"


                set -e

              else

                timeout 900 \
                  "${cmd[@]}" \
                  > "$attempt_log" \
                  2>&1 \
                  || exit_code=$?

              fi


              cat "$attempt_log" \
                >> "$main_log" \
                2>/dev/null \
                || true


              # ------------------------------------------------------
              # Success.
              # ------------------------------------------------------

              if [ "$exit_code" -eq 0 ] &&
                 has_audio_file "$dir"; then

                log \
                  "VERIFY" \
                  "$id" \
                  "Audio output detected."


                log \
                  "SUCCESS" \
                  "$id" \
                  "spotDL succeeded on attempt ${attempt}."


                return 0

              fi


              # ------------------------------------------------------
              # Failure classification.
              # ------------------------------------------------------

              local failure_type


              failure_type="$(
                classify_error "$attempt_log"
              )"


              case "$failure_type" in


                CONFIGURATION)

                  log \
                    "ERROR" \
                    "$id" \
                    "spotDL CLI/configuration error. No retry."


                  if [ "$SHOW_RAW_LOGS" != "true" ]; then
                    show_last_log \
                      "$attempt_log" \
                      "$id" \
                      "CONFIGURATION ERROR"
                  fi


                  return 1

                  ;;


                PROVIDER)

                  log \
                    "WARN" \
                    "$id" \
                    "No usable provider result."


                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then

                    delay=$((attempt * 5))


                    log \
                      "RETRY" \
                      "$id" \
                      "Retrying with rotated provider order in ${delay}s."


                    sleep "$delay"

                  fi

                  ;;


                RATE_LIMIT)

                  log \
                    "WARN" \
                    "$id" \
                    "Provider rate limited."


                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then

                    delay=$((attempt * 8))


                    [ "$delay" -gt 30 ] &&
                      delay=30


                    log \
                      "RETRY" \
                      "$id" \
                      "Rate-limit backoff: ${delay}s."


                    sleep "$delay"

                  fi

                  ;;


                BOT)

                  log \
                    "WARN" \
                    "$id" \
                    "Bot/authentication restriction detected."


                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then

                    delay=$((attempt * 5))


                    log \
                      "RETRY" \
                      "$id" \
                      "Trying alternate provider order in ${delay}s."


                    sleep "$delay"

                  fi

                  ;;


                FORBIDDEN)

                  log \
                    "WARN" \
                    "$id" \
                    "HTTP 403 / forbidden."


                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then

                    delay=$((attempt * 5))


                    log \
                      "RETRY" \
                      "$id" \
                      "Retrying in ${delay}s."


                    sleep "$delay"

                  fi

                  ;;


                NETWORK)

                  log \
                    "WARN" \
                    "$id" \
                    "Network failure."


                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then

                    delay=$((attempt * 4))


                    [ "$delay" -gt 30 ] &&
                      delay=30


                    log \
                      "RETRY" \
                      "$id" \
                      "Network backoff: ${delay}s."


                    sleep "$delay"

                  fi

                  ;;


                FORMAT)

                  log \
                    "WARN" \
                    "$id" \
                    "Requested format unavailable."


                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then

                    delay=3


                    log \
                      "RETRY" \
                      "$id" \
                      "Retrying with alternate provider order."

                    sleep "$delay"

                  fi

                  ;;


                UNKNOWN)

                  log \
                    "WARN" \
                    "$id" \
                    "Unclassified downloader failure."


                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then

                    delay=$((attempt * 4))


                    [ "$delay" -gt 30 ] &&
                      delay=30


                    log \
                      "RETRY" \
                      "$id" \
                      "Retrying in ${delay}s."


                    sleep "$delay"

                  fi

                  ;;

              esac


              attempt=$((attempt + 1))

            done


            if [ "$SHOW_RAW_LOGS" != "true" ]; then

              show_last_log \
                "$main_log" \
                "$id" \
                "LAST SPOTDL LOG"

            fi


            log \
              "FAILED" \
              "$id" \
              "All spotDL attempts exhausted."


            return 1
          }


          # ==========================================================
          # DIRECT YT-DLP
          # ==========================================================

          download_direct() {

            local id="$1"
            local type="$2"
            local url="$3"


            local dir="work/downloads/${id}"
            local logfile="work/logs/${id}-direct.log"


            mkdir -p "$dir"


            local -a cmd


            cmd=(
              yt-dlp

              --ignore-config

              --newline

              --continue

              --no-overwrites

              --retries
              "$YTDLP_RETRIES"

              --fragment-retries
              "$YTDLP_FRAGMENT_RETRIES"

              --extractor-retries
              "$YTDLP_EXTRACTOR_RETRIES"

              --file-access-retries
              "$YTDLP_FILE_ACCESS_RETRIES"

              --socket-timeout
              "$YTDLP_SOCKET_TIMEOUT"

              --concurrent-fragments
              "$YTDLP_CONCURRENT_FRAGMENTS"

              --throttled-rate
              100K

              --sleep-requests
              1

              --extractor-args
              "youtube:player-client=mweb"

              --extractor-args
              "youtubepot-bgutilhttp:base_url=http://127.0.0.1:${POT_SERVER_PORT}"

              --format
              "bestaudio/best"

              --output
              "${dir}/%(title)s [%(id)s].%(ext)s"
            )


            if [ "$SHOW_RAW_LOGS" = "true" ]; then
              cmd+=(--verbose)
            fi


            if [[ "$url" == *music.youtube.com* ]] &&
               [ -n "$COOKIE_YTM" ]; then

              cmd+=(
                --cookies
                "$COOKIE_YTM"
              )

            elif [[ "$url" == *youtube.com* ||
                    "$url" == *youtu.be* ]] &&
                 [ -n "$COOKIE_YT" ]; then

              cmd+=(
                --cookies
                "$COOKIE_YT"
              )

            fi


            if [[ "$type" == "youtube" ]]; then
              cmd+=(--no-playlist)
            fi


            log \
              "DOWNLOAD" \
              "$id" \
              "Direct yt-dlp download started."


            local exit_code=0


            if [ "$SHOW_RAW_LOGS" = "true" ]; then

              set +e


              stdbuf \
                -oL \
                -eL \
                timeout 900 \
                "${cmd[@]}" \
                2>&1 |
              tee "$logfile" |
              while IFS= read -r line; do

                printf \
                  '[%s] RAW       #%04d │ %s\n' \
                  "$(now)" \
                  "$id" \
                  "$line"

              done


              exit_code="${PIPESTATUS[0]}"


              set -e

            else

              timeout 900 \
                "${cmd[@]}" \
                > "$logfile" \
                2>&1 \
                || exit_code=$?

            fi


            if [ "$exit_code" -eq 0 ] &&
               has_audio_file "$dir"; then

              log \
                "VERIFY" \
                "$id" \
                "Direct audio output detected."


              log \
                "SUCCESS" \
                "$id" \
                "Direct yt-dlp succeeded."


              return 0

            fi


            local failure_type


            failure_type="$(
              classify_error "$logfile"
            )"


            log \
              "WARN" \
              "$id" \
              "Direct yt-dlp failed: ${failure_type}."


            if [ "$SHOW_RAW_LOGS" != "true" ]; then

              show_last_log \
                "$logfile" \
                "$id" \
                "LAST YT-DLP LOG"

            fi


            return 1
          }


          # ==========================================================
          # RESULT WRITER
          # ==========================================================

          write_result() {

            local id="$1"
            local type="$2"
            local url="$3"
            local status="$4"
            local provider="$5"
            local reason="$6"
            local started="$7"
            local finished="$8"


            local dir="work/downloads/${id}"


            mapfile -t files < <(
              find "$dir" \
                -type f \
                \( \
                  -iname '*.mp3' \
                  -o -iname '*.flac' \
                  -o -iname '*.m4a' \
                  -o -iname '*.ogg' \
                  -o -iname '*.opus' \
                  -o -iname '*.wav' \
                \) \
                -printf '%f\n' \
                2>/dev/null |
              sort
            )


            printf '%s\n' "${files[@]}" |
              jq -R -s \
                'split("\n") | map(select(length > 0))' \
              > "${dir}/files.json"


            jq -n \
              --arg id "$id" \
              --arg type "$type" \
              --arg url "$url" \
              --arg status "$status" \
              --arg provider "$provider" \
              --arg reason "$reason" \
              --arg started "$started" \
              --arg finished "$finished" \
              --slurpfile files "${dir}/files.json" \
              '{
                index: ($id | tonumber),
                input_type: $type,
                url: $url,
                status: $status,
                provider: $provider,
                reason: $reason,
                started_at: $started,
                finished_at: $finished,
                output_files: $files[0]
              }' \
              > "work/results/${id}.json"


            rm -f "${dir}/files.json"
          }


          # ==========================================================
          # PROCESS ONE URL
          # ==========================================================

          process_one() {

            local id="$1"
            local type="$2"
            local url="$3"


            local started

            started="$(
              date -u '+%Y-%m-%dT%H:%M:%SZ'
            )"


            local status="failed"
            local provider="none"
            local reason="all strategies failed"


            echo
            echo "╭──────────────────────────────────────────────────────────────╮"
            printf '│ 🎵 TRACK #%04d                                               │\n' "$id"
            echo "├──────────────────────────────────────────────────────────────┤"
            printf '│ Type : %-54s │\n' "$type"
            printf '│ URL  : %-54s │\n' "$url"
            echo "╰──────────────────────────────────────────────────────────────╯"


            log \
              "START" \
              "$id" \
              "Processing ${type} input."


            # --------------------------------------------------------
            # Direct source.
            # --------------------------------------------------------

            if [[ "$type" == "youtube" ]] ||
               [[ "$type" == "soundcloud" ]]; then

              log \
                "SEARCH" \
                "$id" \
                "Direct source detected; using yt-dlp first."


              if download_direct \
                "$id" \
                "$type" \
                "$url"; then

                status="success"
                provider="yt-dlp-direct"
                reason="direct source succeeded"

              fi

            fi


            # --------------------------------------------------------
            # spotDL fallback.
            # --------------------------------------------------------

            if [ "$status" != "success" ]; then

              log \
                "SEARCH" \
                "$id" \
                "Starting spotDL metadata/provider resolution."


              if download_spotdl \
                "$id" \
                "$type" \
                "$url"; then

                status="success"
                provider="spotDL"
                reason="spotDL provider engine succeeded"

              fi

            fi


            # --------------------------------------------------------
            # Final result.
            # --------------------------------------------------------

            if [ "$status" = "success" ]; then

              log \
                "DONE" \
                "$id" \
                "✅ SUCCESS via ${provider}"


            else

              log \
                "FAILED" \
                "$id" \
                "❌ No download strategy succeeded."


              printf \
                '%s\t%s\t%s\n' \
                "$id" \
                "$type" \
                "$url" \
                > "work/failed/${id}.tsv"


              printf '%s\n' "$url" \
                > "work/failed/${id}.url"

            fi


            local finished

            finished="$(
              date -u '+%Y-%m-%dT%H:%M:%SZ'
            )"


            write_result \
              "$id" \
              "$type" \
              "$url" \
              "$status" \
              "$provider" \
              "$reason" \
              "$started" \
              "$finished"

          }


          # ==========================================================
          # EXPORT
          # ==========================================================

          export -f \
            now \
            log \
            section \
            has_audio_file \
            classify_error \
            show_last_log \
            detect_providers \
            rotate_providers \
            download_spotdl \
            download_direct \
            write_result \
            process_one


          export \
            FORMAT \
            QUALITY \
            BITRATE \
            SPOTDL_PROVIDERS \
            SPOTDL_THREADS \
            RAW_CLIENT_ID \
            RAW_CLIENT_SECRET \
            USE_CUSTOM_CREDENTIALS_INPUT \
            COOKIE_YT \
            COOKIE_YTM \
            PARALLEL \
            MAX_RETRIES \
            SHOW_RAW_LOGS \
            POT_SERVER_PORT \
            POT_AVAILABLE \
            VPN_AVAILABLE \
            YTDLP_RETRIES \
            YTDLP_FRAGMENT_RETRIES \
            YTDLP_EXTRACTOR_RETRIES \
            YTDLP_FILE_ACCESS_RETRIES \
            YTDLP_SOCKET_TIMEOUT \
            YTDLP_CONCURRENT_FRAGMENTS


          # ==========================================================
          # CONTROLLED CONCURRENCY
          # ==========================================================

          section "🚀 STARTING DOWNLOAD WORKERS"


          active=0


          while IFS=$'\t' read -r id type url; do

            (
              process_one \
                "$id" \
                "$type" \
                "$url"
            ) &


            active=$((active + 1))


            if [ "$active" -ge "$PARALLEL" ]; then

              wait -n || true

              active=$((active - 1))

            fi


          done < work/jobs.tsv


          wait


          section "📊 DOWNLOAD RESULTS"


          total="$(
            jq -s \
              'length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          success="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          failed="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          printf '%-16s %s\n' "Requested:" "$total"
          printf '%-16s %s\n' "Successful:" "$success"
          printf '%-16s %s\n' "Failed:" "$failed"


      # ============================================================
      # 14. CONVERT + VALIDATE
      # ============================================================

      - name: "🔄 Convert and validate audio"
        env:
          TARGET_FORMAT: ${{ inputs.output_format }}
          QUALITY_INPUT: ${{ inputs.audio_quality }}
        run: |
          set -Eeuo pipefail


          FORMAT="$TARGET_FORMAT"
          QUALITY="$QUALITY_INPUT"


          case "$QUALITY" in

            320k|256k|192k|128k)
              BITRATE="$QUALITY"
              ;;

            HIGH)
              BITRATE="320k"
              ;;

            LOW)
              BITRATE="128k"
              ;;

            LOSSLESS|HI_RES_LOSSLESS)
              BITRATE="320k"
              ;;

            *)
              BITRATE="320k"
              ;;

          esac


          echo
          echo "╭──────────────────────────────────────────────────────────────╮"
          echo "│ 🔄 AUDIO CONVERSION + VALIDATION                           │"
          echo "╰──────────────────────────────────────────────────────────────╯"
          echo


          converted=0
          validated=0
          failed=0


          mapfile -d '' files < <(
            find work/downloads \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
                -o -iname '*.webm' \
                -o -iname '*.aac' \
              \) \
              -print0
          )


          for source in "${files[@]}"; do

            ext="${source##*.}"
            ext="${ext,,}"


            if [ "$ext" = "${FORMAT,,}" ]; then

              output="$source"

            else

              output="${source%.*}.${FORMAT}"


              case "$FORMAT" in

                mp3)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a libmp3lame \
                    -b:a "$BITRATE" \
                    -id3v2_version 3 \
                    -y \
                    "$output"

                  ;;


                flac)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a flac \
                    -y \
                    "$output"

                  ;;


                m4a)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a aac \
                    -b:a "$BITRATE" \
                    -movflags +faststart \
                    -y \
                    "$output"

                  ;;


                ogg)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a libvorbis \
                    -b:a "$BITRATE" \
                    -y \
                    "$output"

                  ;;


                opus)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a libopus \
                    -b:a "$BITRATE" \
                    -y \
                    "$output"

                  ;;


                wav)

                  ffmpeg \
                    -hide_banner \
                    -loglevel error \
                    -nostdin \
                    -i "$source" \
                    -vn \
                    -map_metadata 0 \
                    -c:a pcm_s16le \
                    -y \
                    "$output"

                  ;;

              esac


              if [ ! -s "$output" ]; then

                echo "❌ Conversion failed:"
                echo "   $source"

                failed=$((failed + 1))

                rm -f "$output"

                continue

              fi


              converted=$((converted + 1))

              rm -f "$source"

            fi


            if [ ! -s "$output" ]; then

              failed=$((failed + 1))

              continue

            fi


            if ffprobe \
              -v error \
              -show_entries format=duration,size \
              -show_entries stream=codec_name,sample_rate,channels \
              -of json \
              "$output" \
              > /tmp/audio-validation.json; then

              validated=$((validated + 1))


              codec="$(
                jq -r \
                  '.streams[0].codec_name // "unknown"' \
                  /tmp/audio-validation.json
              )"


              duration="$(
                jq -r \
                  '.format.duration // "unknown"' \
                  /tmp/audio-validation.json
              )"


              echo \
                "✓ $(basename "$output") | ${codec} | ${duration}s"

            else

              echo \
                "❌ ffprobe rejected $(basename "$output")"

              failed=$((failed + 1))

            fi

          done


          echo
          echo "Converted : $converted"
          echo "Validated : $validated"
          echo "Failed    : $failed"


      # ============================================================
      # 15. COLLECT FINAL FILES
      # ============================================================

      - name: "📚 Build final audio directory"
        id: collect
        run: |
          set -Eeuo pipefail


          rm -rf music

          mkdir -p music


          count=0


          while IFS= read -r -d '' file; do

            count=$((count + 1))


            filename="$(basename "$file")"


            printf -v final_name \
              '%04d-%s' \
              "$count" \
              "$filename"


            cp \
              --reflink=auto \
              -p \
              "$file" \
              "music/$final_name"


          done < <(
            find work/downloads \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) \
              -print0 |
            sort -z
          )


          echo "FINAL_AUDIO_COUNT=$count" \
            >> "$GITHUB_OUTPUT"


          echo
          echo "🎵 Final files: $count"


          if [ "$count" -gt 0 ]; then
            ls -lh music/
          fi


      # ============================================================
      # 16. MANIFEST + SUMMARY
      # ============================================================

      - name: "📝 Generate manifest and GitHub summary"
        env:
          FORMAT_INPUT: ${{ inputs.output_format }}
          QUALITY_INPUT: ${{ inputs.audio_quality }}
          UPLOAD_INPUT: ${{ inputs.upload_method }}
          BUNDLE_INPUT: ${{ inputs.bundle_all }}
          VPN_INPUT: ${{ inputs.vpn_enabled }}
          RAW_INPUT: ${{ inputs.raw_logs }}
        run: |
          set -Eeuo pipefail


          total="$(
            jq -s \
              'length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          success="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          failed="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          audio_count="$(
            find music \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) |
            wc -l
          )"


          audio_bytes="$(
            find music \
              -type f \
              -printf '%s\n' |
            awk '{s += $1} END {print s + 0}'
          )"


          jq -n \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg sha "$GITHUB_SHA" \
            --arg created "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg format "$FORMAT_INPUT" \
            --arg quality "$QUALITY_INPUT" \
            --arg upload "$UPLOAD_INPUT" \
            --argjson bundle "$BUNDLE_INPUT" \
            --argjson vpn "$VPN_INPUT" \
            --argjson raw "$RAW_INPUT" \
            --argjson total "$total" \
            --argjson success "$success" \
            --argjson failed "$failed" \
            --argjson audio "$audio_count" \
            --argjson bytes "$audio_bytes" \
            '{
              workflow: $workflow,
              repository: $repository,
              run_id: $run_id,
              commit: $sha,
              created_at: $created,
              output_format: $format,
              quality: $quality,
              upload_method: $upload,
              bundle_all: $bundle,
              vpn_enabled: $vpn,
              raw_logs_enabled: $raw,
              po_token_provider: "bgutil",
              urls_requested: $total,
              urls_successful: $success,
              urls_failed: $failed,
              final_audio_files: $audio,
              final_audio_bytes: $bytes
            }' \
            > work/manifest.json


          cp \
            work/manifest.json \
            music/manifest.json


          echo
          echo "╭──────────────────────────────────────────────────────────────╮"
          echo "│ 📊 FINAL DOWNLOAD REPORT                                   │"
          echo "╰──────────────────────────────────────────────────────────────╯"
          echo


          printf '%-22s %s\n' "Requested URLs:" "$total"
          printf '%-22s %s\n' "Successful:" "$success"
          printf '%-22s %s\n' "Failed:" "$failed"
          printf '%-22s %s\n' "Final audio files:" "$audio_count"
          printf '%-22s %s\n' "Format:" "$FORMAT_INPUT"
          printf '%-22s %s\n' "Quality:" "$QUALITY_INPUT"
          printf '%-22s %s\n' "VPN:" "$VPN_INPUT"
          printf '%-22s %s\n' "Raw logs:" "$RAW_INPUT"
          printf '%-22s %s\n' "PO-token:" "bgutil"


          {
            echo "# 🎵 Music Downloader"
            echo

            echo "## Configuration"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Format | \`$FORMAT_INPUT\` |"
            echo "| Quality | \`$QUALITY_INPUT\` |"
            echo "| Upload | \`$UPLOAD_INPUT\` |"
            echo "| Bundle | \`$BUNDLE_INPUT\` |"
            echo "| VPN | \`$VPN_INPUT\` |"
            echo "| Raw logs | \`$RAW_INPUT\` |"
            echo "| PO-token | \`bgutil\` |"
            echo

            echo "## Result"
            echo
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| Requested URLs | $total |"
            echo "| Successful | $success |"
            echo "| Failed | $failed |"
            echo "| Final audio files | $audio_count |"
            echo


            if [ "$failed" -gt 0 ]; then

              echo "## ❌ Failed URLs"
              echo
              echo '```text'


              for file in work/failed/*.tsv; do

                [ -f "$file" ] || continue

                cat "$file"

              done


              echo '```'

            else

              echo "## ✅ All requested URLs succeeded."

            fi

          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 17. PACKAGE
      # ============================================================

      - name: "📦 Package output"
        id: archive
        env:
          BUNDLE_ALL: ${{ inputs.bundle_all }}
          UPLOAD_METHOD: ${{ inputs.upload_method }}
        run: |
          set -Eeuo pipefail


          rm -rf \
            work/archive \
            work/package


          mkdir -p \
            work/archive \
            work/package


          mapfile -d '' AUDIO_FILES < <(
            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) \
              -print0 |
            sort -z
          )


          if [ "${#AUDIO_FILES[@]}" -eq 0 ]; then

            echo "⚠️ No audio files to package."

            echo "HAS_ASSETS=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          for file in "${AUDIO_FILES[@]}"; do

            cp \
              --reflink=auto \
              -p \
              "$file" \
              work/package/

          done


          # ==========================================================
          # SINGLE BUNDLE
          # ==========================================================

          if [ "$BUNDLE_ALL" = "true" ]; then

            suffix="$(
              tr -dc 'a-z0-9' </dev/urandom |
              head -c5
            )"


            zip_name="music-${suffix}.zip"


            case "$UPLOAD_METHOD" in


              repo)

                (
                  cd work/package

                  zip \
                    -0 \
                    -s 90m \
                    -r \
                    "../archive/${zip_name}" \
                    .
                )

                ;;


              release)

                (
                  cd work/package

                  zip \
                    -0 \
                    -r \
                    "../archive/${zip_name}" \
                    .
                )


                size="$(
                  stat \
                    -c%s \
                    "work/archive/${zip_name}"
                )"


                if [ "$size" -gt 1900000000 ]; then

                  echo "⚠️ Large release asset; splitting."

                  rm -f \
                    work/archive/"${zip_name}"*


                  (
                    cd work/package

                    zip \
                      -0 \
                      -s 1900m \
                      -r \
                      "../archive/${zip_name}" \
                      .
                  )

                fi

                ;;


              drive)

                (
                  cd work/package

                  zip \
                    -0 \
                    -r \
                    "../archive/${zip_name}" \
                    .
                )

                ;;

            esac


          # ==========================================================
          # INDIVIDUAL ARCHIVES
          # ==========================================================

          else

            index=0


            for file in "${AUDIO_FILES[@]}"; do

              index=$((index + 1))


              base="$(basename "$file")"


              safe="$(
                printf '%s' "$base" |
                tr ' ' '_' |
                tr -cd '[:alnum:]_.-'
              )"


              suffix="$(
                tr -dc 'a-z0-9' </dev/urandom |
                head -c5
              )"


              zip_name="single-${index}-${safe}-${suffix}.zip"


              (
                cd "$(dirname "$file")"

                zip \
                  -0 \
                  "../../work/archive/${zip_name}" \
                  "$(basename "$file")"
              )

            done

          fi


          # ==========================================================
          # CHECKSUMS
          # ==========================================================

          (
            cd work/archive

            find . \
              -maxdepth 1 \
              -type f \
              -print0 |
            sort -z |
            xargs -0 sha256sum
          ) > work/archive/SHA256SUMS.txt


          cp \
            work/archive/SHA256SUMS.txt \
            music/SHA256SUMS.txt


          cp \
            work/manifest.json \
            work/archive/manifest.json


          find work/archive \
            -maxdepth 1 \
            -type f \
            ! -name 'SHA256SUMS.txt' \
            ! -name 'manifest.json' \
            -exec cp -p {} music/ \;


          echo "HAS_ASSETS=true" >> "$GITHUB_OUTPUT"


          echo
          echo "📦 Package:"
          ls -lh music/


      # ============================================================
      # 18. DIAGNOSTIC ARTIFACT
      # ============================================================

      - name: "📊 Upload logs and diagnostics"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downloader-diagnostics-${{ github.run_number }}
          path: |
            work/logs/
            work/results/
            work/failed/
            work/jobs.tsv
            work/input_urls.txt
            work/manifest.json
            music/manifest.json
            music/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6


      # ============================================================
      # 19. DISCONNECT VPN
      # ============================================================

      - name: "🔌 Disconnect VPN before uploads"
        if: steps.vpn.outputs.vpn_available == 'true'
        run: |
          set +e

          echo "🔌 Disconnecting WireGuard..."

          sudo wg-quick down wg0 \
            >/dev/null 2>&1 \
            || true

          echo "✅ VPN disconnected."


      # ============================================================
      # 20. GOOGLE DRIVE
      # ============================================================

      - name: "☁️ Upload to Google Drive"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'drive'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_NAME: "github-actions"
        run: |
          set -Eeuo pipefail


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  ☁️ GOOGLE DRIVE                           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo


          if [ -z "$GOOGLE_CLIENT_ID" ] ||
             [ -z "$GOOGLE_CLIENT_SECRET" ] ||
             [ -z "$GOOGLE_REFRESH_TOKEN" ]; then

            echo "❌ Google Drive OAuth secrets are incomplete."
            exit 1

          fi


          echo "🔐 Acquiring access token..."


          token_json="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --request POST \
              https://oauth2.googleapis.com/token \
              --data-urlencode "client_id=${GOOGLE_CLIENT_ID}" \
              --data-urlencode "client_secret=${GOOGLE_CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${GOOGLE_REFRESH_TOKEN}" \
              --data-urlencode "grant_type=refresh_token"
          )"


          access_token="$(
            jq -r \
              '.access_token // empty' \
              <<< "$token_json"
          )"


          if [ -z "$access_token" ]; then

            echo "❌ Could not obtain Drive access token."
            exit 1

          fi


          echo "✅ Access token acquired."


          query="mimeType='application/vnd.google-apps.folder' and name='${DRIVE_FOLDER_NAME}' and trashed=false"


          folder_response="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --get \
              https://www.googleapis.com/drive/v3/files \
              -H "Authorization: Bearer ${access_token}" \
              --data-urlencode "q=${query}" \
              --data-urlencode "fields=files(id,name)"
          )"


          folder_id="$(
            jq -r \
              '.files[0].id // empty' \
              <<< "$folder_response"
          )"


          if [ -z "$folder_id" ]; then

            echo "📁 Creating Drive folder..."


            body="$(
              jq -n \
                --arg name "$DRIVE_FOLDER_NAME" \
                '{
                  name: $name,
                  mimeType: "application/vnd.google-apps.folder"
                }'
            )"


            folder_id="$(
              curl \
                --silent \
                --show-error \
                --fail \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                --request POST \
                https://www.googleapis.com/drive/v3/files \
                -H "Authorization: Bearer ${access_token}" \
                -H "Content-Type: application/json" \
                --data "$body" |
              jq -r \
                '.id // empty'
            )"

          fi


          if [ -z "$folder_id" ]; then

            echo "❌ Could not resolve Drive folder."

            exit 1

          fi


          upload_file() {

            local file="$1"


            local name
            name="$(basename "$file")"


            local size
            size="$(stat -c%s "$file")"


            echo
            echo "⬆️ $name"
            echo "   Size: $size bytes"


            local headers
            headers="$(mktemp)"


            local metadata
            metadata="$(
              jq -n \
                --arg name "$name" \
                --arg folder "$folder_id" \
                '{
                  name: $name,
                  parents: [$folder]
                }'
            )"


            if ! curl \
              --silent \
              --show-error \
              --request POST \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              -D "$headers" \
              -o /dev/null \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: application/octet-stream" \
              -H "X-Upload-Content-Length: ${size}" \
              --data "$metadata" \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable"; then

              rm -f "$headers"

              return 1

            fi


            local session_uri


            session_uri="$(
              awk '
                BEGIN { IGNORECASE=1 }
                /^location:/ {
                  sub(/\r$/, "")
                  sub(/^[^:]*:[[:space:]]*/, "")
                  print
                  exit
                }
              ' "$headers"
            )"


            rm -f "$headers"


            if [ -z "$session_uri" ]; then

              echo "❌ Failed to initialize upload session."

              return 1

            fi


            local offset=0


            while [ "$offset" -lt "$size" ]; do

              local remaining=$((size - offset))
              local length="$DRIVE_CHUNK_SIZE"


              if [ "$remaining" -lt "$length" ]; then
                length="$remaining"
              fi


              local end=$((offset + length - 1))


              local chunk
              chunk="$(mktemp --suffix=.drivechunk)"


              dd \
                if="$file" \
                of="$chunk" \
                iflag=skip_bytes,count_bytes \
                skip="$offset" \
                count="$length" \
                status=none


              local chunk_done="false"


              for attempt in 1 2 3 4 5; do

                local response
                local response_headers
                local code


                response="$(mktemp)"
                response_headers="$(mktemp)"


                code="$(
                  curl \
                    --silent \
                    --show-error \
                    --request PUT \
                    -D "$response_headers" \
                    -o "$response" \
                    --write-out '%{http_code}' \
                    -H "Authorization: Bearer ${access_token}" \
                    -H "Content-Type: application/octet-stream" \
                    -H "Content-Length: ${length}" \
                    -H "Content-Range: bytes ${offset}-${end}/${size}" \
                    --data-binary "@${chunk}" \
                    "$session_uri"
                )"


                case "$code" in

                  200|201)

                    offset="$size"
                    chunk_done="true"

                    ;;


                  308)

                    range="$(
                      awk '
                        BEGIN { IGNORECASE=1 }
                        /^Range:/ {
                          sub(/\r$/, "")
                          print
                        }
                      ' "$response_headers"
                    )"


                    if [[ "$range" =~ bytes=0-([0-9]+) ]]; then

                      offset=$((BASH_REMATCH[1] + 1))

                    else

                      offset=$((end + 1))

                    fi


                    chunk_done="true"

                    ;;


                  429|500|502|503|504)

                    delay=$((2 ** attempt))


                    [ "$delay" -gt 30 ] &&
                      delay=30


                    echo \
                      "⚠️ Drive HTTP ${code}; retry in ${delay}s."


                    sleep "$delay"

                    ;;


                  *)

                    echo \
                      "❌ Drive upload failed: HTTP ${code}"


                    cat "$response" \
                      2>/dev/null \
                      || true


                    rm -f \
                      "$response" \
                      "$response_headers" \
                      "$chunk"


                    return 1

                    ;;

                esac


                rm -f \
                  "$response" \
                  "$response_headers"


                if [ "$offset" -ge "$size" ]; then
                  break
                fi


                if [ "$chunk_done" = "true" ]; then
                  break
                fi

              done


              rm -f "$chunk"


              if [ "$offset" -lt "$size" ] &&
                 [ "$chunk_done" != "true" ]; then

                echo "❌ Drive chunk upload failed."

                return 1

              fi


              percent=$((offset * 100 / size))


              printf \
                '   Progress: %3d%%\n' \
                "$percent"

            done


            echo "✅ Uploaded: $name"

            return 0
          }


          for file in music/*; do

            [ -f "$file" ] || continue


            case "$(basename "$file")" in

              *.zip|*.z01|*.z02|*.z03|*.z04|*.z05|*.z06|*.z07|*.z08|*.z09)

                upload_file "$file"

                ;;

            esac

          done


          if [ -f music/manifest.json ]; then
            upload_file music/manifest.json
          fi


          if [ -f music/SHA256SUMS.txt ]; then
            upload_file music/SHA256SUMS.txt
          fi


          echo
          echo "✅ Google Drive upload completed."


      # ============================================================
      # 21. REPOSITORY UPLOAD
      # ============================================================

      - name: "📤 Upload to repository"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'repo'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add music/


          if git diff --cached --quiet; then

            echo "ℹ️ Nothing to commit."

            exit 0

          fi


          git commit \
            -m "Add music downloader output [skip ci]"


          for attempt in 1 2 3 4 5; do

            echo "🚀 Push attempt ${attempt}/5"


            if git pull \
              --rebase \
              --autostash \
              origin "$BRANCH" &&
              git push origin "$BRANCH"; then

              echo "✅ Repository upload completed."

              exit 0

            fi


            if [ "$attempt" -lt 5 ]; then

              sleep $((attempt * 3))

            fi

          done


          echo "❌ Repository push failed."
          exit 1


      # ============================================================
      # 22. GITHUB RELEASE
      # ============================================================

      - name: "🏷️ Create GitHub Release"
        if: >
          steps.archive.outputs.HAS_ASSETS == 'true' &&
          inputs.upload_method == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          INPUT_FORMAT: ${{ inputs.output_format }}
          INPUT_QUALITY: ${{ inputs.audio_quality }}
          INPUT_VPN: ${{ inputs.vpn_enabled }}
          INPUT_RAW_LOGS: ${{ inputs.raw_logs }}
        run: |
          set -Eeuo pipefail


          suffix="$(
            tr -dc 'a-z0-9' </dev/urandom |
            head -c5
          )"


          tag="music-${suffix}"


          total="$(
            jq -s \
              'length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          success="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          failed="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )


          cat > work/release-notes.md <<EOF
          # 🎵 Music Downloader

          ## Result

          - Requested URLs: ${total}
          - Successful: ${success}
          - Failed: ${failed}
          - Format: ${INPUT_FORMAT}
          - Quality: ${INPUT_QUALITY}
          - VPN: ${INPUT_VPN}
          - Raw logs: ${INPUT_RAW_LOGS}
          - PO-token provider: bgutil
          - Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF


          mapfile -t assets < <(
            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -name '*.zip' \
                -o -name '*.z01' \
                -o -name '*.z02' \
                -o -name '*.z03' \
                -o -name '*.z04' \
                -o -name '*.z05' \
                -o -name '*.z06' \
                -o -name '*.z07' \
                -o -name '*.z08' \
                -o -name '*.z09' \
                -o -name 'manifest.json' \
                -o -name 'SHA256SUMS.txt' \
              \) \
              -print |
            sort
          )


          if [ "${#assets[@]}" -eq 0 ]; then

            echo "❌ No release assets."

            exit 1

          fi


          gh release create \
            "$tag" \
            "${assets[@]}" \
            --title "Music Downloader ${suffix}" \
            --notes-file work/release-notes.md \
            --target "${GITHUB_SHA}"


          echo "✅ Release created: $tag"


      # ============================================================
      # 23. FINAL STATUS
      # ============================================================

      - name: "✅ Final status"
        if: always()
        env:
          FAIL_ON_PARTIAL: ${{ inputs.fail_on_partial }}

          INPUT_FORMAT: ${{ inputs.output_format }}
          INPUT_QUALITY: ${{ inputs.audio_quality }}
          INPUT_VPN: ${{ inputs.vpn_enabled }}
          INPUT_RAW_LOGS: ${{ inputs.raw_logs }}
        run: |
          set -Eeuo pipefail


          total="$(
            jq -s \
              'length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          success="$(
            jq -s \
              '[.[] | select(.status == "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          failed="$(
            jq -s \
              '[.[] | select(.status != "success")] | length' \
              work/results/*.json \
              2>/dev/null \
              || echo 0
          )"


          audio_count="$(
            find music \
              -type f \
              \( \
                -iname '*.mp3' \
                -o -iname '*.flac' \
                -o -iname '*.m4a' \
                -o -iname '*.ogg' \
                -o -iname '*.opus' \
                -o -iname '*.wav' \
              \) |
            wc -l
          )"


          echo
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                     🎵 FINAL RESULT                         ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          printf '║ Requested      : %-41s ║\n' "$total"
          printf '║ Successful     : %-41s ║\n' "$success"
          printf '║ Failed         : %-41s ║\n' "$failed"
          printf '║ Audio files    : %-41s ║\n' "$audio_count"
          printf '║ Format         : %-41s ║\n' "$INPUT_FORMAT"
          printf '║ Quality        : %-41s ║\n' "$INPUT_QUALITY"
          printf '║ VPN            : %-41s ║\n' "$INPUT_VPN"
          printf '║ Raw logs       : %-41s ║\n' "$INPUT_RAW_LOGS"
          printf '║ PO-token       : %-41s ║\n' "bgutil"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo


          if [ "$failed" -eq 0 ]; then

            echo "✅ All requested URLs completed successfully."

            exit 0

          fi


          if [ "$success" -eq 0 ]; then

            echo "❌ No requested URLs completed successfully."

            exit 1

          fi


          if [ "$FAIL_ON_PARTIAL" = "true" ]; then

            echo "⚠️ Partial completion detected."
            echo "❌ fail_on_partial=true."

            exit 1

          fi


          echo "⚠️ Partial completion accepted."


      # ============================================================
      # 24. CLEANUP
      # ============================================================

      - name: "🧹 Cleanup"
        if: always()
        run: |
          set +e


          echo "🧹 Cleaning temporary resources..."


          docker rm -f bgutil-provider \
            >/dev/null 2>&1 \
            || true


          sudo wg-quick down wg0 \
            >/dev/null 2>&1 \
            || true


          rm -f \
            /tmp/wg0.conf \
            /tmp/youtube-cookies.txt \
            /tmp/youtube-music-cookies.txt \
            /tmp/bgutil-ping.json \
            /tmp/audio-validation.json


          find /tmp \
            -maxdepth 1 \
            -name '*.drivechunk' \
            -delete \
            2>/dev/null \
            || true


          echo "✅ Cleanup complete."
